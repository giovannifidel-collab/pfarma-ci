name: RAZZO Shard Worker
on:
  push:
    branches: [main]
    paths:
      - '.razzo/shard.json'
  workflow_dispatch:
    inputs:
      execution_id: {required: false, type: string}
      work_item_id: {required: false, type: string}
      project_id: {required: false, type: string}
      generation_id: {required: false, type: string}
      input_sha: {required: false, type: string}
      collision_domain: {required: false, type: string}
      idempotency_key: {required: false, type: string}
permissions:
  contents: read
jobs:
  health:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify provisioned shard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p=json.load(open('.razzo/shard.json', encoding='utf-8-sig'))
          assert p['schema']=='razzo.shard.v1'
          assert p['state']=='PROVISIONED'
          assert p['exact_sha_required'] is True
          assert p['collision_domain_lease_required'] is True
          assert p['idempotency_required'] is True
          assert p['product_progress'] is False
          assert p['repository']==os.environ['GITHUB_REPOSITORY']
          print('HEALTHY', p['shard_id'], os.environ['GITHUB_SHA'])
          PY
      - name: Emit health receipt
        shell: bash
        run: |
          mkdir -p receipts
          printf '%s\n' '{"status":"HEALTHY","verification_state":"EXACT_SHA","product_progress":false,"sha":"${{ github.sha }}","repository":"${{ github.repository }}"}' > receipts/health.json
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-health-${{ github.sha }}
          path: receipts/health.json
  execute:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dispatch envelope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.execution_id }}"
          test -n "${{ inputs.work_item_id }}"
          test -n "${{ inputs.input_sha }}"
          test -n "${{ inputs.idempotency_key }}"
          echo "RAZZO shard dispatch envelope accepted"
      - name: Emit execution receipt
        shell: bash
        run: |
          mkdir -p receipts
          printf '%s\n' '{"status":"HEALTHY","verification_state":"BOOTSTRAP_ONLY","product_progress":false}' > "receipts/${{ inputs.execution_id }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-receipt-${{ inputs.execution_id }}
          path: receipts/${{ inputs.execution_id }}.json
