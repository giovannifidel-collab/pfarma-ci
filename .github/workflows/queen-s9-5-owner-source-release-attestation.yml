name: Queen S9.5 Owner Exact Private CAS Release Permission
on:
  push:
    branches: [main]
    paths: [.github/workflows/queen-s9-5-owner-source-release-attestation.yml]
  workflow_dispatch:
    inputs:
      hive_main_sha:
        type: string
        required: true
        default: "6d20e61a023748bff36175f1f643c9f5781b3b9f"
      hive_pr96_head_sha:
        type: string
        required: true
        default: "843e2a0dd9abff8a86c426c2d8ba9090c948e80c"
      relay_pr1295_head_sha:
        type: string
        required: true
        default: "17baebc3b3505b13354abe86e82af903146bbd9a"
      approve_s9_5_one_source_release_and_runtime_secret:
        type: boolean
        required: true
        default: false
        description: "One HIVE PR96, one relay PR1295, private CAS, one runtime secret, independent rollback; no provider dispatch or School"
permissions: {contents: read, id-token: write}
concurrency:
  group: queen-s9-5-exact-source-owner-once
  cancel-in-progress: false
jobs:
  verify-exact-owner:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      OWNER_APPROVE: ${{ inputs.approve_s9_5_one_source_release_and_runtime_secret }}
      HIVE_MAIN: ${{ inputs.hive_main_sha }}
      HIVE_HEAD: ${{ inputs.hive_pr96_head_sha }}
      RELAY_HEAD: ${{ inputs.relay_pr1295_head_sha }}
    steps:
      - name: Validate exact source, user and independent checks without modifying production
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_TRIGGERING_ACTOR" = giovannifidel-collab
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$OWNER_APPROVE" = true
          test "$HIVE_MAIN" = 6d20e61a023748bff36175f1f643c9f5781b3b9f
          test "$HIVE_HEAD" = 843e2a0dd9abff8a86c426c2d8ba9090c948e80c
          test "$RELAY_HEAD" = 17baebc3b3505b13354abe86e82af903146bbd9a
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = "$HIVE_MAIN"
          PTR="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\n')"
          test "$PTR" = "$HIVE_MAIN"
          gh api repos/giovannifidel-collab/hive-alveare/pulls/96 | jq -e --arg h "$HIVE_HEAD" --arg b "$HIVE_MAIN" '.state=="open" and .draft==true and .merged==false and .head.sha==$h and .base.sha==$b' >/dev/null
          gh api repos/giovannifidel-collab/pfarma-ci/pulls/1295 | jq -e --arg h "$RELAY_HEAD" '.state=="open" and .draft==true and .merged==false and .head.sha==$h' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/actions/runs/43970691264 | jq -e --arg h "$HIVE_HEAD" '.conclusion=="success" and .run_attempt==1 and .head_sha==$h' >/dev/null
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/43972281347 | jq -e --arg h "$RELAY_HEAD" '.conclusion=="success" and .run_attempt==1 and .head_sha==$h' >/dev/null
          echo S95_OWNER_EXACT_TWO_SOURCE_CI=PASS
      - name: Cryptographically verify independently signed GitHub Owner OIDC for narrow scope
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createHash,createPublicKey,verify,randomUUID} from 'node:crypto';
          const e=process.env;
          const deny=s=>{throw Error('S9_5_DENIED_'+s)};
          const audience='hive-queen-s95-one-private-cas-s1-release-v1';
          if(!e.ACTIONS_ID_TOKEN_REQUEST_URL||!e.ACTIONS_ID_TOKEN_REQUEST_TOKEN)deny('NO_OIDC');
          const url=e.ACTIONS_ID_TOKEN_REQUEST_URL+(e.ACTIONS_ID_TOKEN_REQUEST_URL.includes('?')?'&':'?')+'audience='+encodeURIComponent(audience);
          const resp=await fetch(url,{headers:{Authorization:'Bearer '+e.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!resp.ok)deny('OIDC_HTTP');
          const jwt=(await resp.json()).value;
          const parts=jwt?.split('.')||[];
          if(parts.length!==3)deny('JWT_PARTS');
          const dec=v=>Buffer.from(v.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-v.length%4)%4),'base64');
          const head=JSON.parse(dec(parts[0]).toString()),c=JSON.parse(dec(parts[1]).toString());
          if(head.alg!=='RS256'||!head.kid||head.jwk||head.jku||head.x5u)deny('JWT_HEADER');
          const claims={iss:'https://token.actions.githubusercontent.com',aud:audience,
            repository:'giovannifidel-collab/pfarma-ci',repository_id:'1308677897',
            repository_owner_id:'305755860',actor:'giovannifidel-collab',actor_id:'305755860',
            environment:'pfarma-ci-trusted',event_name:'workflow_dispatch',
            workflow_ref:'giovannifidel-collab/pfarma-ci/.github/workflows/queen-s9-5-owner-source-release-attestation.yml@refs/heads/main',
            ref:'refs/heads/main',runner_environment:'github-hosted'};
          for(const [k,v] of Object.entries(claims))if(String(c[k])!==v)deny('CLAIM_'+k);
          const now=Date.now();
          if(c.sha!==e.GITHUB_SHA||Number(c.run_id)!==Number(e.GITHUB_RUN_ID)||
             Number(c.run_attempt)!==1||!Number.isSafeInteger(c.exp)||
             !Number.isSafeInteger(c.iat)||c.exp-c.iat>900||
             c.exp*1000<now||c.iat*1000>now+30000||now-c.iat*1000>300000)deny('TIME_OR_RUN');
          const jwks=await fetch('https://token.actions.githubusercontent.com/.well-known/jwks');
          if(!jwks.ok)deny('JWKS_HTTP');
          const keys=(await jwks.json()).keys;
          const jwk=keys?.find(k=>k.kid===head.kid&&k.kty==='RSA'&&k.use==='sig');
          if(!jwk)deny('JWKS_KEY');
          if(!verify('RSA-SHA256',Buffer.from(parts[0]+'.'+parts[1]),createPublicKey({key:jwk,format:'jwk'}),dec(parts[2])))deny('OIDC_SIGNATURE');
          if(e.OWNER_APPROVE!=='true'||e.HIVE_MAIN!=='6d20e61a023748bff36175f1f643c9f5781b3b9f'||
             e.HIVE_HEAD!=='843e2a0dd9abff8a86c426c2d8ba9090c948e80c'||
             e.RELAY_HEAD!=='17baebc3b3505b13354abe86e82af903146bbd9a')deny('EXACT_SCOPE');
          const mission={schema:'queen.s9.5.exact-owner-prod-source-oidc.v1',
            scope:'ONE_HIVE_PR96_ONE_RELAY_PR1295_PRIVATE_NEON_CAS_AND_RUNTIME_SECRET',
            mission_id:randomUUID(),owner:'giovannifidel-collab',owner_ci_run_id:Number(e.GITHUB_RUN_ID),
            hive_main_sha:e.HIVE_MAIN,hive_candidate_sha:e.HIVE_HEAD,relay_candidate_sha:e.RELAY_HEAD,
            sql_path:'security/QUEEN_S95_PRIVATE_RECEIPT_CAS.v1.sql',
            db_private_schema:'queen_s95_secure',runtime_secret_name:'HIVE_RUNTIME_BEARER_TOKEN',
            max_hive_merge:1,max_relay_merge:1,max_production_releases:1,
            install_runtime_secret_once:true,emergency_rollback_allowed:true,
            no_new_provider_dispatches:true,no_School_training:true,no_product_writes:true,
            no_unverified_receipt_enrollment:true,no_auto_merge:true,no_auto_deploy:true,
            paid_fallback:false,issued_at:new Date(now).toISOString(),
            expires_at:new Date(now+900000).toISOString()};
          const hash=createHash('sha256').update(JSON.stringify(mission)).digest('hex');
          console.log('S95_OWNER_OIDC_RSA_SIGNATURE_AND_SOURCE_SCOPE=PASS');
          console.log('S95_OWNER_SIGNED_SCOPED_RECEIPT='+JSON.stringify({...mission,evidence_sha256:hash}));
          console.log('S95_NO_MUTATION_BY_SIGNER=TRUE');
          NODE
