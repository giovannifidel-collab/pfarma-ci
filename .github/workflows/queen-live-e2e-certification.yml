name: Queen Live E2E Execution Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/queen-live-e2e-certification.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: queen-live-e2e-execution-certification
  cancel-in-progress: false

jobs:
  certify:
    name: certify-live-queen-to-hive-field
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 20
    env:
      HIVE_BASE_URL: ${{ secrets.HIVE_BASE_URL }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate trusted certification credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SOURCE_TOKEN:-}" ]] || { echo 'PFARMA_SOURCE_TOKEN=MISSING'; exit 2; }
          [[ -n "${HIVE_RUNTIME_BEARER_TOKEN:-}" ]] || { echo 'HIVE_RUNTIME_BEARER_TOKEN=MISSING'; exit 2; }
          [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]] || { echo 'CLOUDFLARE_SERVICE_AUTH=MISSING'; exit 2; }
          echo 'QUEEN_E2E_TRUSTED_CREDENTIALS=READY'

      - name: Check out authoritative Queen source
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: main
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-hive
          fetch-depth: 1
          persist-credentials: false

      - name: Pin Queen source identity and bridge contract
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git -C private-hive rev-parse HEAD)"
          echo "QUEEN_SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "QUEEN_SOURCE_SHA=$SHA"
          node --check private-hive/cloudflare/functions/api/queen-command.js
          grep -q "verified-execution-dispatch" private-hive/cloudflare/functions/api/queen-command.js
          grep -q "post-deploy-execution-gate" private-hive/cloudflare/functions/api/queen-command.js
          grep -q "hive_field_execute" private-hive/cloudflare/functions/api/queen-command.js
          echo 'QUEEN_EXECUTION_BRIDGE_SOURCE=PASS'

      - name: Inspect Cloudflare production deployment identity
        shell: bash
        run: |
          set -euo pipefail
          echo 'QUEEN_DEPLOYMENT_SHA_MATCH=UNAVAILABLE' > /tmp/deploy-proof
          if [[ -z "${CF_TOKEN:-}" ]]; then
            cat /tmp/deploy-proof
            exit 0
          fi
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts -o /tmp/accounts.json || true
          if ! jq -e '.success == true' /tmp/accounts.json >/dev/null 2>&1; then
            cat /tmp/deploy-proof
            exit 0
          fi
          while read -r ACCOUNT_ID; do
            [[ -n "$ACCOUNT_ID" ]] || continue
            CODE="$(curl -sS -o /tmp/project.json -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/hive-alveare" || true)"
            [[ "$CODE" == 200 ]] || continue
            D_CODE="$(curl -sS -o /tmp/deployments.json -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/hive-alveare/deployments?env=production&per_page=20" || true)"
            [[ "$D_CODE" == 200 ]] || continue
            if jq -e --arg sha "$QUEEN_SOURCE_SHA" '.result[]? | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == $sha)' /tmp/deployments.json >/dev/null; then
              echo 'QUEEN_DEPLOYMENT_SHA_MATCH=PASS' > /tmp/deploy-proof
              break
            else
              LATEST="$(jq -r '[.result[]? | select(.environment == "production")][0].deployment_trigger.metadata.commit_hash // "UNKNOWN"' /tmp/deployments.json)"
              echo "QUEEN_CLOUDFLARE_LATEST_PRODUCTION_SHA=$LATEST"
            fi
          done < <(jq -r '.result[]?.id' /tmp/accounts.json)
          cat /tmp/deploy-proof

      - name: Verify live Queen health through Cloudflare Access
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HIVE_BASE_URL:-https://hive-alveare.pages.dev}"
          BASE="${BASE%/}"
          CODE="$(curl -sS --max-time 30 -o /tmp/health.json -w '%{http_code}' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN" \
            "$BASE/api/health")"
          echo "QUEEN_LIVE_HEALTH_HTTP=$CODE"
          [[ "$CODE" == 200 ]]
          jq -e '.ok == true' /tmp/health.json >/dev/null
          echo 'QUEEN_LIVE_HEALTH=PASS'

      - name: Capture HIVE Field pre-head
        shell: bash
        run: |
          set -euo pipefail
          PRE="$(curl -fsS \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/giovannifidel-collab/hive-field/branches/main | jq -r '.commit.sha')"
          [[ -n "$PRE" && "$PRE" != null ]]
          echo "HIVE_FIELD_PRE_HEAD=$PRE" >> "$GITHUB_ENV"
          echo "HIVE_FIELD_PRE_HEAD=$PRE"

      - name: Execute Queen live natural-language proof command
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HIVE_BASE_URL:-https://hive-alveare.pages.dev}"
          BASE="${BASE%/}"
          jq -n '{
            message:"Implementa una modifica di prova controllata per certificare il collegamento Queen verso HIVE Field end-to-end, mantenendo invariati i gate di sicurezza e senza introdurre funzionalita utente.",
            project_slug:"hive-field",
            source:"post-deploy-execution-gate"
          }' > /tmp/queen-request.json
          CODE="$(curl -sS --max-time 420 -o /tmp/queen-response.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN" \
            --data-binary @/tmp/queen-request.json \
            "$BASE/api/queen-command")"
          echo "QUEEN_COMMAND_HTTP=$CODE"
          jq '{ok,task_id,correlation_id,reply,route,verification,execution,cognitive,paid_fallback,error}' /tmp/queen-response.json
          [[ "$CODE" == 200 ]]
          jq -e '.ok == true' /tmp/queen-response.json >/dev/null
          jq -e '.route == "verified-execution-dispatch"' /tmp/queen-response.json >/dev/null
          jq -e '.verification.verified == true and .verification.independence_group_pass == true' /tmp/queen-response.json >/dev/null
          jq -e '.execution.status == "verified" and .execution.dispatcher == "github-actions"' /tmp/queen-response.json >/dev/null
          jq -e '.execution.mode == "proof" and .execution.changed == true' /tmp/queen-response.json >/dev/null
          jq -e '.execution.conclusion == "success" and .execution.baseline_gate == "PASS" and .execution.post_change_gate == "PASS"' /tmp/queen-response.json >/dev/null
          jq -e '.execution.production_http == 200 and .execution.production_smoke == "PASS" and .execution.paid_fallback == false' /tmp/queen-response.json >/dev/null
          jq -e '.paid_fallback == false' /tmp/queen-response.json >/dev/null
          RUN_ID="$(jq -r '.execution.run_id' /tmp/queen-response.json)"
          TASK_ID="$(jq -r '.task_id' /tmp/queen-response.json)"
          TARGET_SHA="$(jq -r '.execution.target_commit_sha' /tmp/queen-response.json)"
          [[ -n "$RUN_ID" && "$RUN_ID" != null ]]
          [[ -n "$TASK_ID" && "$TASK_ID" != null ]]
          [[ -n "$TARGET_SHA" && "$TARGET_SHA" != null ]]
          [[ "$TARGET_SHA" != "$HIVE_FIELD_PRE_HEAD" ]]
          echo "QUEEN_EXECUTION_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "QUEEN_TASK_ID=$TASK_ID" >> "$GITHUB_ENV"
          echo "HIVE_FIELD_TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo 'QUEEN_LIVE_COMMAND=PASS'

      - name: Independently verify repository_dispatch run
        shell: bash
        run: |
          set -euo pipefail
          RUN="$(curl -fsS \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/giovannifidel-collab/pfarma-ci/actions/runs/$QUEEN_EXECUTION_RUN_ID")"
          EVENT="$(jq -r '.event' <<<"$RUN")"
          STATUS="$(jq -r '.status' <<<"$RUN")"
          CONCLUSION="$(jq -r '.conclusion' <<<"$RUN")"
          TITLE="$(jq -r '.display_title' <<<"$RUN")"
          echo "DISPATCH_EVENT=$EVENT"
          echo "DISPATCH_STATUS=$STATUS"
          echo "DISPATCH_CONCLUSION=$CONCLUSION"
          echo "DISPATCH_TITLE=$TITLE"
          [[ "$EVENT" == repository_dispatch ]]
          [[ "$STATUS" == completed ]]
          [[ "$CONCLUSION" == success ]]
          [[ "$TITLE" == *"$QUEEN_TASK_ID"* ]]
          echo 'REPOSITORY_DISPATCH_PROOF=PASS'

      - name: Independently verify HIVE Field commit and production
        shell: bash
        run: |
          set -euo pipefail
          POST="$(curl -fsS \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/giovannifidel-collab/hive-field/branches/main | jq -r '.commit.sha')"
          echo "HIVE_FIELD_POST_HEAD=$POST"
          [[ "$POST" == "$HIVE_FIELD_TARGET_SHA" ]]
          [[ "$POST" != "$HIVE_FIELD_PRE_HEAD" ]]
          HTTP="$(curl -sS --max-time 30 -o /tmp/hive-field-prod -w '%{http_code}' "https://hive-field-v8.vercel.app/?queen_e2e=$QUEEN_TASK_ID")"
          echo "HIVE_FIELD_PRODUCTION_HTTP=$HTTP"
          [[ "$HTTP" == 200 ]]
          echo 'HIVE_FIELD_COMMIT_AND_PRODUCTION=PASS'

      - name: Final E2E certificate
        shell: bash
        run: |
          set -euo pipefail
          echo 'QUEEN_LIVE_E2E_CERTIFICATION=PASS'
          echo "QUEEN_SOURCE_SHA=$QUEEN_SOURCE_SHA"
          echo "QUEEN_TASK_ID=$QUEEN_TASK_ID"
          echo "REPOSITORY_DISPATCH_RUN_ID=$QUEEN_EXECUTION_RUN_ID"
          echo "HIVE_FIELD_PRE_HEAD=$HIVE_FIELD_PRE_HEAD"
          echo "HIVE_FIELD_POST_HEAD=$HIVE_FIELD_TARGET_SHA"
          echo 'PRODUCTION_SMOKE=PASS'
          echo 'PAID_FALLBACK=false'
