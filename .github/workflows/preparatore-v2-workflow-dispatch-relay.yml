name: Preparatore V2 · Workflow Dispatch Relay

run-name: Preparatore relay · ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Preparatore V2 job UUID
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: preparatore-v2-relay-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate job id
        env:
          JOB_ID: ${{ inputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]

      - name: Relay to public Codex worker
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          http_code="$(curl --silent --show-error --output /tmp/dispatch-body.txt --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --data "$(jq -cn --arg id "$JOB_ID" '{event_type:"preparatore-v2-request",client_payload:{job_id:$id}}')")"
          if [ "$http_code" != "204" ]; then
            echo "Repository dispatch failed with HTTP $http_code" >&2
            cat /tmp/dispatch-body.txt >&2 || true
            exit 1
          fi
          echo "Public worker dispatched for $JOB_ID"
