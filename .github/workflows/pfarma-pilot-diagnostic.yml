name: PFarma Pilot Diagnostic

on:
  pull_request:
    paths:
      - 'source-ref.txt'
      - '.github/workflows/pfarma-pilot-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        shard:
          - surface
          - markers
          - product-detail
          - supplier-drilldown
          - reorder
          - staging-handoff
          - goods-receipt
          - reconciliation
          - projection
          - shell-demo
          - health
          - forbidden-mutations
          - unknown-contract
          - non-read-methods
          - pilot-boundary
          - unknown-routes
          - security-headers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout public control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve exact private source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < source-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'source-ref.txt is not a canonical SHA' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require private-source token
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"

      - name: Checkout exact private PFarma commit
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Attest exact SHA
        shell: bash
        run: test "$(git -C private-source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute isolated pilot contract
        shell: bash
        working-directory: private-source
        run: |
          set -euo pipefail
          case '${{ matrix.shard }}' in
            surface)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_read_only_pilot_surface_is_reachable()"
              ;;
            markers)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_contract_only_operations_do_not_claim_real_data_access()"
              ;;
            product-detail)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_product_detail_preserves_vertical_slice_navigation()"
              ;;
            supplier-drilldown)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_supplier_drilldown_stays_on_selected_product()"
              ;;
            reorder)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_reorder_proposal_is_review_only_ranked_and_hands_off_explicitly()"
              ;;
            staging-handoff)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_staging_handoff_is_prefilled_but_preview_remains_get_only()"
              ;;
            goods-receipt)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_goods_receipt_staging_is_visible_but_preview_remains_get_only()"
              ;;
            reconciliation)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_demo_order_reconciliation_prefills_only_remaining_receipt_quantity()"
              ;;
            projection)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_receipt_projection_shows_only_residual_delta_without_inventing_lot_or_expiry()"
              ;;
            shell-demo)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_shell_exposes_reachable_receiving_flow()"
              ;;
            health)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_health_endpoint_is_exact_and_cache_safe()"
              ;;
            forbidden-mutations)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_mutation_routes_remain_unavailable()"
              ;;
            unknown-contract)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_unknown_routes_fail_closed()"
              ;;
            non-read-methods)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_non_read_methods_fail_closed_everywhere()"
              ;;
            pilot-boundary)
              python -c "import sys; sys.path.insert(0,'tools'); import test_pilot_acceptance_contract as t; t.test_pilot_declares_read_only_boundary()"
              ;;
            unknown-routes)
              python tools/test_preview_unknown_routes_fail_closed.py
              ;;
            security-headers)
              python tools/test_pilot_security_headers.py
              ;;
          esac

      - name: Remove private source checkout
        if: always()
        shell: bash
        run: rm -rf private-source
