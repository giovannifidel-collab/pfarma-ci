name: HIVE Queen Dispatch E2E

on:
  push:
    branches: [queen-universal-fabric-vnext]
    paths:
      - '.github/workflows/hive-queen-dispatch-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 10
    env:
      GH_DISPATCH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
      HIVE_BASE_URL: ${{ secrets.HIVE_BASE_URL }}
    steps:
      - name: Trigger Queen execution intent
        id: queen
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_DISPATCH_TOKEN"
          BASE="${HIVE_BASE_URL:-https://hive-alveare.pages.dev}"; BASE="${BASE%/}"
          headers=(-H 'Content-Type: application/json')
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            headers+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          if [[ -n "${HIVE_RUNTIME_BEARER_TOKEN:-}" ]]; then headers+=(-H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN"); fi
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "start=$start" >> "$GITHUB_OUTPUT"
          body="$(jq -nc --arg m 'Completa il collegamento operativo di HIVE Field verificando il dispatcher senza modificare il comportamento applicativo.' '{message:$m,project_slug:"hive-field",source:"post-deploy-execution-gate"}')"
          code="$(curl -sS --max-time 120 -o /tmp/queen-exec -w '%{http_code}' -X POST "${headers[@]}" "$BASE/api/queen-command" -d "$body")"
          echo "QUEEN_EXECUTION_HTTP=$code"
          if [[ "$code" != 200 ]]; then jq '{ok,error,task_id,route,verification,execution}' /tmp/queen-exec 2>/dev/null || cat /tmp/queen-exec; exit 1; fi
          if ! jq -e '.ok == true and .route == "deterministic-execution-preflight" and .verification.verified == true and .execution.dispatched == true and .execution.status == "queued" and .execution.mode == "proof" and .paid_fallback == false' /tmp/queen-exec >/dev/null; then
            jq '{ok,error,task_id,route,verification,execution,paid_fallback}' /tmp/queen-exec
            exit 1
          fi
          task="$(jq -r '.task_id' /tmp/queen-exec)"
          test -n "$task" -a "$task" != null
          echo "task_id=$task" >> "$GITHUB_OUTPUT"
          echo 'QUEEN_DISPATCH_ACCEPTED=PASS'

      - name: Verify repository dispatch reaches executor
        shell: bash
        env:
          START: ${{ steps.queen.outputs.start }}
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/giovannifidel-collab/pfarma-ci/actions/runs?event=repository_dispatch&per_page=20'
          found=''
          for i in $(seq 1 30); do
            curl -fsS \
              -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" > /tmp/runs.json
            found="$(jq -r --arg start "$START" '.workflow_runs[] | select(.name=="HIVE Field Queen Dispatch Bridge" and .created_at >= $start) | .id' /tmp/runs.json | head -n1)"
            [[ -n "$found" ]] && break
            sleep 5
          done
          test -n "$found"
          echo "BRIDGE_RUN_ID=$found"
          for i in $(seq 1 60); do
            curl -fsS \
              -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/giovannifidel-collab/pfarma-ci/actions/runs/$found" > /tmp/run.json
            status="$(jq -r '.status' /tmp/run.json)"
            conclusion="$(jq -r '.conclusion // ""' /tmp/run.json)"
            if [[ "$status" == completed ]]; then
              echo "BRIDGE_CONCLUSION=$conclusion"
              test "$conclusion" = success
              echo 'QUEEN_TO_EXECUTOR_E2E=PASS'
              exit 0
            fi
            sleep 5
          done
          echo 'QUEEN_TO_EXECUTOR_E2E=TIMEOUT'
          exit 1
