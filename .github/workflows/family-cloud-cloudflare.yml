name: Family Cloud Cloudflare Migration

on:
  push:
    branches: [main]
    paths:
      - 'family-cloud-cloudflare-source-ref.txt'
      - '.github/workflows/family-cloud-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-cloud-cloudflare
  cancel-in-progress: false

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pfarma-ci-trusted
    env:
      CLOUDFLARE_ACCOUNT_ID: 6f6de52331e398c395d3de97c83011cd
      ORIGIN: https://family-cloud.project-giovanni.workers.dev
    steps:
      - name: Check out public CI bridge
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact private-source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < family-cloud-cloudflare-source-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve private source token
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.FAMILY_CLOUD_SOURCE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          token="${SOURCE_TOKEN:-${FALLBACK_TOKEN:-}}"
          test -n "$token" || { echo 'Missing private source token' >&2; exit 1; }
          echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Check out exact private source
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and Worker syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
          test -s private-source/cloudflare/worker.js
          test -s private-source/cloudflare/wrangler.jsonc
          node --check private-source/cloudflare/worker.js

      - name: Resolve Cloudflare token
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_FALLBACK: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          token="${CF_TOKEN:-${CF_TOKEN_FALLBACK:-}}"
          test -n "$token" || { echo 'Missing Cloudflare deploy token' >&2; exit 1; }
          echo "CF_DEPLOY_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Ensure private R2 bucket
        working-directory: private-source/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if ! CLOUDFLARE_API_TOKEN="$CF_DEPLOY_TOKEN" npx --yes wrangler@4.123.0 r2 bucket create family-cloud-media 2>&1 | tee /tmp/r2-create.log; then
            grep -Eqi 'already exists|bucket.*exists' /tmp/r2-create.log || exit 1
          fi

      - name: Deploy Family Cloud Worker
        working-directory: private-source/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$CF_DEPLOY_TOKEN" npx --yes wrangler@4.123.0 deploy

      - name: Verify Cloudflare production runtime
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 18); do
            status="$(curl -L -sS -o /tmp/fc.html -w '%{http_code}' "$ORIGIN/")"
            health_status="$(curl -sS -o /tmp/fc-health.json -w '%{http_code}' "$ORIGIN/api/core?action=health")"
            echo "attempt=$attempt root=$status health=$health_status"
            if [ "$status" = 200 ] && [ "$health_status" = 200 ]; then
              node -e "const h=require('/tmp/fc-health.json');if(!h.ok||h.persistent!=='cloudflare-r2'||h.version!==4)process.exit(1)" && ready=1 && break
            fi
            sleep 5
          done
          test "$ready" = 1 || { cat /tmp/fc-health.json >&2 || true; exit 1; }
          grep -Eqi 'Family Cloud' /tmp/fc.html

      - name: Remove private source checkout
        if: always()
        shell: bash
        run: rm -rf private-source
