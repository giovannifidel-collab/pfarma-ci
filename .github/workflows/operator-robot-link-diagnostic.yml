name: PFarma Operator Robot Link Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/operator-robot-link-diagnostic.yml'
      - 'razzo/pfarma-ref.txt'

permissions:
  contents: read

jobs:
  href:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    strategy:
      fail-fast: false
      matrix:
        href:
          - '/inventory/anomalies'
          - '/inventory/expiry-cases'
          - '/inventory/anomalies/reconcile-preview?product_id=AMOXICILLINA-500&location_id=MAG-01&quantity=-1&shortage_quantity=1'
          - '/products/TACHIPIRINA-1000'
          - '/products/ENTEROGERMINA-20'
          - '/products/MAGNESIO-SUPREMO'
          - '/products/VOLTAREN-EMULGEL'
          - '/receiving'
          - '/reservations'
          - '/sales'
          - '/pilot/reference-journey'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < razzo/pfarma-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: pfarma-cloud
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check dashboard href
        working-directory: pfarma-cloud
        env:
          PFARMA_FEEDBACK_GITHUB_SYNC: '0'
          HREF: ${{ matrix.href }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import os
          from tools.preview_pfarma_feedback import build_feedback_preview
          from tools.pfarma_operator_robot import PFarmaOperatorRobot
          app, _ = build_feedback_preview()
          robot = PFarmaOperatorRobot(app)
          href = os.environ['HREF']
          response = robot.request(href)
          print(f'HREF_RESULT href={href} status={response.status}')
          if response.status_code in {404, 500, 502, 503}:
              raise AssertionError(f'BROKEN_VISIBLE_LINK href={href} status={response.status}')
          PY
