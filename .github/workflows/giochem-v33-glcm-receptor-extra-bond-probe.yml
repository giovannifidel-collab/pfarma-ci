name: GIOCHEM V3.3 GLCM Residual Bond Zero-Score Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/giochem-v33-glcm-receptor-extra-bond-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Resolve private source token
        shell: bash
        env:
          GIOCHEM_TOKEN: ${{ secrets.GIOCHEM_SOURCE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          token="${GIOCHEM_TOKEN:-${FALLBACK_TOKEN:-}}"; test -n "$token"
          echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/giochem
          ref: 6355fab345d554bd49cc1829215a02fab62e7018
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install minimal zero-score preparation stack
        working-directory: private-source
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r scientific-api/requirements.txt
      - name: Probe receptor residues only
        working-directory: private-source
        run: python scripts/validation_v33_glcm_receptor_probe.py
