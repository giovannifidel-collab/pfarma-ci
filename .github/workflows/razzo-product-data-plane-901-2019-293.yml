# RAZZO control-plane builder; zero standalone product credit.
name: RAZZO Product Data Plane 901 2019 293

on:
  pull_request:
    paths:
      - '.github/workflows/razzo-product-data-plane-901-2019-293.yml'

permissions:
  contents: read

jobs:
  pfarma-2019-builder:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    steps:
      - name: Require source token
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: agent/razzo-2018-2019-low-stock-link
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Implement PFarma #2019
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/inventory_dashboard_page.py'); s=p.read_text()
          anchor='''def _expiry_actions(item: Mapping[str, Any]) -> str:\n    actions = ['<a class="action" href="/inventory/expiry-cases">Gestisci</a>']\n    if str(item.get("product_id") or "").strip():\n        actions.insert(0, f'<a class="action" href="{escape(_product_href(item), quote=True)}">Prodotto</a>')\n    return " ".join(actions)\n'''
          if 'def _low_stock_action(' not in s:
              if anchor not in s: raise SystemExit('PFarma #2019 helper anchor missing')
              s=s.replace(anchor,anchor+'''\n\ndef _low_stock_action(item: Mapping[str, Any]) -> str:\n    if not str(item.get("product_id") or "").strip():\n        return "<span class='muted'>Prodotto non disponibile</span>"\n    return f"<a class='action' href='{escape(_product_href(item), quote=True)}'>Apri prodotto</a>"\n''',1)
          old='''            "<tr><td>{product}</td><td>{location}</td><td{quantity_description}>{quantity}</td><td><a class='action' href='{href}'>Apri prodotto</a></td></tr>".format(\n                product=escape(str(item.get("product_id") or "")), location=escape(str(item.get("location_id") or "")), quantity=escape(_display_quantity(item.get("quantity"))), quantity_description=secondary_quantity_description, href=escape(_product_href(item), quote=True),\n'''
          new='''            "<tr><td>{product}</td><td>{location}</td><td{quantity_description}>{quantity}</td><td>{action}</td></tr>".format(\n                product=escape(str(item.get("product_id") or "")), location=escape(str(item.get("location_id") or "")), quantity=escape(_display_quantity(item.get("quantity"))), quantity_description=secondary_quantity_description, action=_low_stock_action(item),\n'''
          if old in s: s=s.replace(old,new,1)
          elif 'action=_low_stock_action(item)' not in s: raise SystemExit('PFarma #2019 row anchor missing')
          p.write_text(s)
          Path('tests/test_inventory_dashboard_low_stock_missing_product_link.py').write_text('''from web.inventory_dashboard_page import _low_stock_action\n\ndef test_low_stock_action_suppresses_missing_or_blank_product_id():\n    assert "Apri prodotto" not in _low_stock_action({"product_id": None})\n    assert "Apri prodotto" not in _low_stock_action({"product_id": "   "})\n    assert "Prodotto non disponibile" in _low_stock_action({"product_id": None})\n\ndef test_low_stock_action_keeps_encoded_real_product_link():\n    html = _low_stock_action({"product_id": "ABC 123"})\n    assert "href='/products/ABC%20123'" in html\n    assert "Apri prodotto" in html\n''')
          PY
      - name: Test PFarma #2019
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_inventory_dashboard_low_stock_missing_product_link.py tests/test_inventory_dashboard_missing_product_link.py
      - name: Stage artifact
        run: |
          mkdir -p /tmp/razzo2019/web /tmp/razzo2019/tests
          cp web/inventory_dashboard_page.py /tmp/razzo2019/web/
          cp tests/test_inventory_dashboard_low_stock_missing_product_link.py /tmp/razzo2019/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: pfarma-2019-candidate
          path: /tmp/razzo2019
          if-no-files-found: error
