name: PFarma Pilot Route Diagnostic

on:
  pull_request:
    paths:
      - 'source-ref.txt'
      - '.github/workflows/pfarma-pilot-route-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: root, path: '/'}
          - {name: pilot, path: '/pilot'}
          - {name: dashboard, path: '/inventory/dashboard'}
          - {name: product, path: '/products/ENTEROGERMINA-20'}
          - {name: anomalies, path: '/inventory/anomalies'}
          - {name: movements, path: '/inventory/movements'}
          - {name: movement-audit, path: '/inventory/movements/semantic-audit'}
          - {name: expiry, path: '/inventory/expiry-cases'}
          - {name: reservations, path: '/reservations'}
          - {name: sales, path: '/sales'}
          - {name: suppliers, path: '/suppliers'}
          - {name: supplier-product, path: '/suppliers?product_id=ENTEROGERMINA-20'}
          - {name: reorder, path: '/reorder-proposal?product_id=ENTEROGERMINA-20'}
          - {name: order-prefill, path: '/staging/purchase-orders/apply?supplier_id=fornitore-a&product_id=ENTEROGERMINA-20&quantity=6&currency=EUR&idempotency_key=pilot-reorder-ENTEROGERMINA-20-fornitore-a&external_reference=pilot-review-b5e697270e81&unit_cost=7.10'}
          - {name: receipt-dashboard, path: '/staging/inventory/goods-receipts/apply'}
          - {name: receipt-prefill, path: '/staging/inventory/goods-receipts/apply?purchase_order_id=11111111-1111-4111-8111-111111111111'}
          - {name: receipt-projection, path: '/staging/inventory/goods-receipts/projection?purchase_order_id=11111111-1111-4111-8111-111111111111'}
          - {name: health, path: '/health'}
    name: route (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pfarma-ci-trusted
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < source-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require private-source token
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
      - name: Attest exact SHA
        run: test "$(git -C private-source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert route is reachable
        working-directory: private-source
        env:
          ROUTE: ${{ matrix.path }}
        shell: bash
        run: |
          set -euo pipefail
          python -c "import os,sys; sys.path.insert(0,'tools'); from test_visual_preview_routes import request; p=os.environ['ROUTE']; s,b=request(p); assert s.startswith('200'), (p,s); assert b, p"
      - name: Remove private source checkout
        if: always()
        run: rm -rf private-source
