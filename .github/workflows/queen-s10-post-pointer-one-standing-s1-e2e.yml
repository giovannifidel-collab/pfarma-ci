name: Queen S10 Post-Pointer One Safe S1 Observation E2E - NO DEPLOY
on:
  push:
    branches: [audit/s10-post-pointer-one-standing-s1-e2e-20261119]
    paths: [.github/workflows/queen-s10-post-pointer-one-standing-s1-e2e.yml]
permissions: {contents: write, actions: read}
concurrency:
  group: queen-s10-post-pointer-one-standing-s1-e2e-20261119
  cancel-in-progress: false
jobs:
  one-existing-s1-world-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: pfarma-ci-trusted
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      DISPATCH_TOKEN: ${{ github.token }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      EXPECTED_HIVE_SOURCE: 88000e9ff70ffc044f424d469645573e01738a8b
      EXPECTED_S1_BLOB: a0b75a09ab2ff8e37a49d6c4ebfcd2b3c1322ffe
      POLICY_SHA: 90f4fb35b8610f7738c79af0019cf1cb2582f746
    steps:
      - name: Verify existing canonical source lock, production HIVE standing grant and one-shot scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/audit/s10-post-pointer-one-standing-s1-e2e-20261119
          test -n "$GH_TOKEN" && test -n "$DISPATCH_TOKEN"
          test -n "$HIVE_RUNTIME_BEARER_TOKEN" && test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = "$EXPECTED_HIVE_SOURCE"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\n')" = "$EXPECTED_HIVE_SOURCE"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/queen-s1-event-ingress.yml --jq .sha)" = "$EXPECTED_S1_BLOB"
          status="$(curl -sS --max-time 25 -o "$RUNNER_TEMP/s10-owner-scope.json" -w '%{http_code}' \
            -X POST https://hive-alveare.pages.dev/api/queen-standing-scope \
            -H "Cf-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "Cf-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "{\"policy_blob_sha\":\"$POLICY_SHA\",\"project_id\":\"hive\",\"level\":0,\"action\":\"world.observe\"}")"
          test "$status" = 200
          jq -e '.allowed==true and .decision=="ALLOW_STANDING_HIVE_CERTIFIED_SAFE" and
            .can_deploy==false and .can_write_project==false and .can_auto_merge==false and
            .can_pay==false and .can_train_school==false' "$RUNNER_TEMP/s10-owner-scope.json" >/dev/null
          echo 'S10_POST_POINTER_EXACT_SOURCE_AND_ACTIVE_SIGNED_OWNER_GRANT=PASS'
      - name: Dispatch ONE L0 read-only World observation to existing canonical S1 only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mission="$(python3 -c 'import uuid;print(uuid.uuid4())')"
          echo "S10_MISSION_ID=$mission" >> "$GITHUB_ENV"
          echo "S10_DISPATCH_START_UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          body="$(jq -nc --arg mission "$mission" --arg sha "$EXPECTED_HIVE_SOURCE" --arg policy "$POLICY_SHA" '{
            event_type:"queen-cycle",
            client_payload:{
              schema:"hive.event.v1",correlation_id:$mission,hop:0,max_hops:8,
              data:{
                kind:"queen.s9.standing.safe_observation.v1",
                mission_id:$mission,source_sha:$sha,policy_blob_sha:$policy,
                project_id:"hive",level:0,action:"world.observe",
                paid_fallback:false,project_writes:false,auto_merge:false,auto_deploy:false,
                can_train_school:false,no_new_provider_dispatch:true
              }
            }
          }')"
          status="$(curl -sS --max-time 25 -o "$RUNNER_TEMP/s10-one-dispatch" -w '%{http_code}' \
            -X POST https://api.github.com/repos/giovannifidel-collab/pfarma-ci/dispatches \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' --data-binary "$body")"
          if [ "$status" != 204 ]; then
            echo "S10_S1_DISPATCH_RESULT_UNCERTAIN_HTTP=$status"
            echo 'S10_S1_NEVER_REDISPATCH_SAME_MISSION=TRUE'
            exit 43
          fi
          echo "S10_POST_POINTER_ONE_CANONICAL_S1_DISPATCH_HTTP=204"
          echo "S10_POST_POINTER_MISSION=$mission"
      - name: Independently verify exactly one successful canonical original S1 observation by mission ID
        shell: bash
        run: |
          set -euo pipefail
          test -n "$S10_MISSION_ID"
          for n in $(seq 1 40); do
            runs="$(gh api 'repos/giovannifidel-collab/pfarma-ci/actions/workflows/queen-s1-event-ingress.yml/runs?event=repository_dispatch&per_page=55')"
            candidates="$(echo "$runs" | jq -r --arg start "$S10_DISPATCH_START_UTC" '.workflow_runs[] |
              select(.created_at >= $start and .status=="completed") | .id')"
            matches=0
            verified=''
            for id in $candidates; do
              log="$(gh run view "$id" --repo giovannifidel-collab/pfarma-ci --log 2>/dev/null || true)"
              if grep -Fq "STANDING_MISSION_ID=$S10_MISSION_ID" <<< "$log"; then
                matches=$((matches+1))
                if grep -Fq 'STANDING_CANONICAL_S1_DECISION=STANDING_WORLD_OBSERVED_READ_ONLY' <<< "$log" &&
                   grep -Fq 'STANDING_NO_DURABLE_ACTION_NO_NEXT_DISPATCH_NO_SCHOOL=TRUE' <<< "$log" &&
                   grep -Fq 'STANDING_CANONICAL_WORLD_SHA256=' <<< "$log" &&
                   gh api "repos/giovannifidel-collab/pfarma-ci/actions/runs/$id" |
                    jq -e '.conclusion=="success" and .run_attempt==1 and .event=="repository_dispatch"' >/dev/null; then
                  verified="$id"
                else
                  echo 'S10_MISSION_MATCHED_BUT_FAILED_DENY_NO_RETRY'
                  exit 45
                fi
              fi
            done
            if [ "$matches" -gt 1 ]; then echo 'S10_MISSION_DUPLICATE_S1_DENY'; exit 46; fi
            if [ "$matches" -eq 1 ] && [ -n "$verified" ]; then
              echo "S10_POST_POINTER_SUCCESSFUL_S1_RUN_ID=$verified"
              echo "S10_POST_POINTER_SINGLE_READ_ONLY_S1_LIVE_E2E=PASS"
              echo "S10_POST_POINTER_NO_PAID_PROVIDER_NO_SCHOOL_NO_PROJECT_WRITES=TRUE"
              exit 0
            fi
            sleep 6
          done
          echo 'S10_POST_POINTER_OUTCOME_UNVERIFIED_NO_REPLAY'
          exit 47