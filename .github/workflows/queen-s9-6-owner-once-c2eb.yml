name: Queen S9.6 one genuine Owner-authenticated existing S1 HIVE-only continuation
on:
  push:
    branches: [audit/s9-6-owner-once-c2eb0f6b-20261118]
    paths: [.github/workflows/queen-s9-6-owner-once-c2eb.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: queen-s96-owner-once-c2eb0f6b-9548-4a11-86be-03d43397c6dc
  cancel-in-progress: false
jobs:
  dispatch-exactly-once:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      GH_DISPATCH_TOKEN: ${{ github.token }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      EXPECTED_HIVE_SHA: 493d83892f7a2e37ec297b9309b47a4c83ba2e6b
      MISSION_ID: c2eb0f6b-9548-4a11-86be-03d43397c6dc
      OWNER_RUN: 44258967298
    steps:
      - name: Verify exact signed Owner scope, lease, and that this is the first dispatch workflow run
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/audit/s9-6-owner-once-c2eb0f6b-20261118
          test -n "$GH_TOKEN" && test -n "$GH_DISPATCH_TOKEN"
          test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
          test "$(date -u +%s)" -lt "$(date -u -d '2026-11-18T07:42:16.985Z' +%s)"
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = "$EXPECTED_HIVE_SHA"
          PTR="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\n')"
          test "$PTR" = "$EXPECTED_HIVE_SHA"
          gh api "repos/giovannifidel-collab/pfarma-ci/actions/runs/$OWNER_RUN" | jq -e '.status=="completed" and .conclusion=="success" and .event=="workflow_dispatch" and .run_attempt==1 and .actor.login=="giovannifidel-collab"' >/dev/null
          LIST="$(gh api 'repos/giovannifidel-collab/pfarma-ci/actions/workflows/queen-s9-6-owner-once-c2eb.yml/runs?event=push&per_page=30')"
          jq -e --argjson id "$GITHUB_RUN_ID" '.total_count == 1 and .workflow_runs[0].id == $id and .workflow_runs[0].run_attempt == 1' <<< "$LIST" >/dev/null
          echo 'S96_ONE_OWNER_LEASE_AND_FIRST_DISPATCH_WORKFLOW=PASS'
      - name: Verify protected production health before any S1 action
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --max-time 20 -w '%{http_code}' -o /dev/null -H "Cf-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "Cf-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" 'https://hive-alveare.pages.dev/api/runtime-health')"
          test "$status" = 200
          echo 'S96_EXISTING_HIVE_RUNTIME_HEALTH=PASS'
      - name: Send one bounded cognitive continuation into EXISTING canonical S1 (no model/provider spending)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          payload="$(jq -nc --arg mission "$MISSION_ID" --arg sha "$EXPECTED_HIVE_SHA" --argjson owner "$OWNER_RUN" '{
            event_type:"queen-cycle",
            client_payload:{
              schema:"hive.event.v1",correlation_id:$mission,hop:0,max_hops:8,
              data:{
                mission_id:$mission,source_sha:$sha,source:"owner_oidc_s9_6_one_shot",
                s9_3_owner_attestation_run_id:$owner,
                school_training_eligible:false,paid_fallback:false,
                product_writes:false,auto_merge:false,auto_deploy:false,
                max_additional_cost_usd:0
              }
            }
          }')"
          code="$(curl -sS --max-time 25 -w '%{http_code}' -o "$RUNNER_TEMP/s96-send-response" -X POST -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -H "Authorization: Bearer $GH_DISPATCH_TOKEN" --data-binary "$payload" 'https://api.github.com/repos/giovannifidel-collab/pfarma-ci/dispatches')"
          test "$code" = 204 || { echo "S96_S1_ORIGINAL_DISPATCH_DENIED_HTTP=$code"; exit 38; }
          echo 'S96_ONE_EXISTING_S1_DISPATCH_HTTP=204'
          echo 'S96_NO_SECOND_EVENT_LOOP_NO_MODEL_COST_NO_SCHOOL=TRUE'
      - name: Prove original S1 live outcome without replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,tempfile,json,time
          for i in range(25):
              with tempfile.TemporaryDirectory() as d:
                  p=subprocess.run([
                    'curl','-sS','--max-time','18','-o',d+'/out','-w','%{http_code}',
                    '-H','Cf-Access-Client-Id: '+os.environ['CF_ACCESS_CLIENT_ID'],
                    '-H','Cf-Access-Client-Secret: '+os.environ['CF_ACCESS_CLIENT_SECRET'],
                    'https://hive-alveare.pages.dev/api/queen-state'
                  ],capture_output=True,text=True,timeout=22)
                  try:
                    with open(d+'/out') as f: body=json.load(f)
                  except Exception:body={}
              cog=((((body.get('state') or {}).get('cognitive') or {}).get('value') or {}))
              if p.returncode==0 and p.stdout.strip()=='200' and cog.get('correlation_id')==os.environ['MISSION_ID']:
                  assert cog.get('paid_fallback') is False
                  print('S96_ORIGINAL_CANONICAL_S1_LIVE_COGNITIVE_READBACK=PASS')
                  print('S96_S1_COGNITIVE_EVENT_ID='+str(cog.get('event_id')))
                  break
              time.sleep(4)
          else:
              raise SystemExit('S96_UNKNOWN_S1_OUTCOME_DO_NOT_RETRY_DISPATCH')
          PY
