name: HIVE Universal Project Execution Fabric
run-name: HIVE Execute ${{ github.event.client_payload.project_slug }} ${{ github.event.client_payload.task_id }}

on:
  repository_dispatch:
    types: [hive_project_execute]

permissions:
  contents: read
  actions: write

concurrency:
  group: hive-universal-execution-${{ github.event.client_payload.project_slug }}
  cancel-in-progress: false

jobs:
  route-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    env:
      SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      PROJECT_SLUG: ${{ github.event.client_payload.project_slug }}
      TASK_ID: ${{ github.event.client_payload.task_id }}
      GOAL: ${{ github.event.client_payload.goal }}
      MODE: ${{ github.event.client_payload.mode }}
    steps:
      - name: Resolve certified project adapter
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SOURCE_TOKEN:-}" ]] || { echo 'SOURCE_TOKEN=MISSING'; exit 2; }
          [[ -n "${PROJECT_SLUG:-}" ]] || { echo 'PROJECT_SLUG=MISSING'; exit 2; }
          [[ -n "${TASK_ID:-}" ]] || { echo 'TASK_ID=MISSING'; exit 2; }
          [[ -n "${GOAL:-}" ]] || { echo 'GOAL=MISSING'; exit 2; }
          case "${MODE:-ai}" in ai|proof) ;; *) echo 'INVALID_MODE'; exit 2 ;; esac

      - name: Check out authoritative HIVE execution registry
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: main
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-hive
          fetch-depth: 1

      - name: Load certified execution profile
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_SLUG="$PROJECT_SLUG" node --input-type=module <<'NODE' >/tmp/profile.json
          import { getProjectExecutionProfile } from './private-hive/cloudflare/functions/_lib/project-execution-registry.js';
          const profile=getProjectExecutionProfile(process.env.PROJECT_SLUG);
          if(!profile){ console.error('PROJECT_EXECUTION_PROFILE_NOT_FOUND'); process.exit(10); }
          if(profile.certified!==true){ console.error('PROJECT_EXECUTION_PROFILE_NOT_CERTIFIED'); process.exit(11); }
          if(!profile.adapter?.workflow || !profile.adapter?.ref){ console.error('PROJECT_EXECUTION_ADAPTER_INVALID'); process.exit(12); }
          process.stdout.write(JSON.stringify(profile));
          NODE
          WORKFLOW="$(jq -r '.adapter.workflow' /tmp/profile.json)"
          REF="$(jq -r '.adapter.ref' /tmp/profile.json)"
          jq -c '.adapter.required_steps // []' /tmp/profile.json >/tmp/required-steps.json
          echo "workflow=$WORKFLOW" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "EXECUTION_PROFILE=CERTIFIED"
          echo "EXECUTION_ADAPTER_WORKFLOW=$WORKFLOW"

      - name: Dispatch certified project adapter
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.profile.outputs.workflow }}
          REF: ${{ steps.profile.outputs.ref }}
        run: |
          set -euo pipefail
          STARTED_AT="$(date -u +%s)"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          jq -nc             --arg ref "$REF"             --arg goal "$GOAL"             --arg task "$TASK_ID"             --arg mode "${MODE:-ai}"             '{ref:$ref,inputs:{goal:$goal,task_id:$task,mode:$mode}}' >/tmp/adapter-dispatch.json
          CODE="$(curl -sS -o /tmp/adapter-dispatch-response -w '%{http_code}'             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             -H 'Content-Type: application/json'             --data-binary @/tmp/adapter-dispatch.json             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches")"
          [[ "$CODE" == 204 ]] || { echo "ADAPTER_DISPATCH_HTTP=$CODE"; cat /tmp/adapter-dispatch-response; exit 20; }
          echo 'ADAPTER_DISPATCH=PASS'

      - name: Verify certified project adapter
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.profile.outputs.workflow }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        run: |
          set -euo pipefail
          floor=$((STARTED_AT - 5))
          RUN_ID=''
          for attempt in $(seq 1 30); do
            curl -fsS               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=50"               -o /tmp/adapter-runs.json
            RUN_ID="$(jq -r --arg task "$TASK_ID" --argjson floor "$floor"               '[.workflow_runs[]? | select(((.display_title // "") + " " + (.name // "")) | contains($task)) | select((.created_at|fromdateiso8601) >= $floor)][0].id // empty'               /tmp/adapter-runs.json)"
            [[ -n "$RUN_ID" ]] && break
            sleep 1
          done
          [[ -n "$RUN_ID" ]] || { echo 'ADAPTER_RUN_NOT_FOUND'; exit 21; }
          echo "adapter_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 90); do
            curl -fsS               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"               -o /tmp/adapter-run.json
            STATUS="$(jq -r '.status' /tmp/adapter-run.json)"
            [[ "$STATUS" == completed ]] && break
            sleep 2
          done
          [[ "$(jq -r '.status' /tmp/adapter-run.json)" == completed ]] || { echo 'ADAPTER_RUN_TIMEOUT'; exit 22; }
          [[ "$(jq -r '.conclusion' /tmp/adapter-run.json)" == success ]] || { echo "ADAPTER_RUN_CONCLUSION=$(jq -r '.conclusion' /tmp/adapter-run.json)"; exit 23; }

          curl -fsS             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=50"             -o /tmp/adapter-jobs.json
          jq '[.jobs[]?.steps[]? | {name,conclusion}]' /tmp/adapter-jobs.json >/tmp/adapter-steps.json

          jq -r '.[]' /tmp/required-steps.json | while IFS= read -r STEP; do
            [[ -n "$STEP" ]] || continue
            CONCLUSION="$(jq -r --arg s "$STEP" '[.[] | select(.name==$s)][0].conclusion // "missing"' /tmp/adapter-steps.json)"
            if [[ "$STEP" == 'Post-change quality gate' || "$STEP" == 'Commit and publish only verified change' ]]; then
              [[ "$CONCLUSION" == success || "$CONCLUSION" == skipped ]] || { echo "ADAPTER_STEP_FAIL=$STEP:$CONCLUSION"; exit 24; }
            else
              [[ "$CONCLUSION" == success ]] || { echo "ADAPTER_STEP_FAIL=$STEP:$CONCLUSION"; exit 24; }
            fi
          done
          echo "ADAPTER_RUN_ID=$RUN_ID"
          echo 'CERTIFIED_ADAPTER_EXECUTION=PASS'

      - name: Final universal execution proof
        shell: bash
        env:
          ADAPTER_RUN_ID: ${{ steps.verify.outputs.adapter_run_id }}
        run: |
          set -euo pipefail
          [[ -n "${ADAPTER_RUN_ID:-}" ]]
          echo 'HIVE_UNIVERSAL_EXECUTION=PASS'
          echo "PROJECT_SLUG=$PROJECT_SLUG"
          echo "TASK_ID=$TASK_ID"
          echo "ADAPTER_RUN_ID=$ADAPTER_RUN_ID"
          echo 'PAID_FALLBACK=false'
