name: RAZZO V7 CHIUDI MACROCICLO Trigger

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/razzo-v7-autonomous-product-trigger.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: razzo-v7-chiudi-macrociclo-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch real product execution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run razzo-v7-ten-shard-trial.yml -R "$GH_REPO" --ref main -f mode=execute-trial
          echo 'CHIUDI_MACROCICLO_EXECUTION_DISPATCHED'
