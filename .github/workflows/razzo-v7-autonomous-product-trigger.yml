name: RAZZO V7 CHIUDI MACROCICLO Trigger

on:
  schedule:
    - cron: '29 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/razzo-v7-autonomous-product-trigger.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: razzo-v7-chiudi-macrociclo-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch real product execution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Queen S4: preserve this legacy trigger only as an observable watchdog.
          echo 'QUEEN_S4_LEGACY_CHIUDI_MACROCICLO=WATCHDOG_ONLY_NO_DISPATCH'
          echo 'LEGACY_EXECUTE_TRIAL=DENY'
