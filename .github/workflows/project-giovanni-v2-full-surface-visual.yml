name: Project Giovanni V2 Full Surface Visual Certification

on:
  pull_request:
    paths:
      - 'project-giovanni-source-ref.txt'
      - '.github/workflows/project-giovanni-v2-full-surface-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: pfarma-ci-trusted
    steps:
      - name: Checkout public control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve exact candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n ' < project-giovanni-source-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact private product
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.GITHUB_PRODUCT_SOURCE_TOKEN || secrets.PROJECT_GIOVANNI_SOURCE_TOKEN || secrets.PFARMA_SOURCE_TOKEN }}
          path: product
          persist-credentials: false
      - name: Attest exact SHA
        run: test "$(git -C product rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: product
        run: npm install --no-audit --no-fund
      - name: Run full-surface presentation contract
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node --test factory/pg-p07-final-certification.test.mjs
          if [ -f factory/visual-premium-v2-full-surface.test.mjs ]; then
            node --test factory/visual-premium-v2-full-surface.test.mjs
          fi
      - name: Start exact candidate
        working-directory: product
        shell: bash
        env:
          PG_VISUAL_QA: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'pg-v2-full-surface-public-placeholder'
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/pg-v2-surface.log 2>&1 &
          echo $! > /tmp/pg-v2-surface.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pg-v2-surface.log
          exit 1
      - name: Route render smoke
        shell: bash
        run: |
          set -euo pipefail
          routes=(/ /today /daily-journey /workout-session /progress-intelligence /assessment /weekly-check-in /personalization /active-plan /workout-history /offline-readiness /travel-equipment /adaptation-proposal /latest-ai-result /photo-followup-checkpoint /reset-t0)
          for route in "${routes[@]}"; do
            code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:3000$route")
            test "$code" = 200
            test "$(wc -c </tmp/page.html)" -gt 800
            ! grep -Eqi 'Application error|Internal Server Error|This page could not be found' /tmp/page.html
            echo "render ok: $route"
          done
      - name: Install Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium
      - name: Capture broad desktop and mobile evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-full-surface
          routes=(home:/ today:/today journey:/daily-journey workout:/workout-session progress:/progress-intelligence assessment:/assessment checkin:/weekly-check-in personalization:/personalization plan:/active-plan history:/workout-history offline:/offline-readiness travel:/travel-equipment adaptation:/adaptation-proposal photoai:/latest-ai-result checkpoint:/photo-followup-checkpoint reset:/reset-t0)
          for item in "${routes[@]}"; do
            name="${item%%:*}"
            route="${item#*:}"
            url="http://127.0.0.1:3000${route}"
            npx -y playwright@1.55.0 screenshot --browser=chromium --wait-for-timeout=900 --full-page --viewport-size="1440,1000" "$url" "visual-full-surface/${name}-desktop.png"
            npx -y playwright@1.55.0 screenshot --browser=chromium --wait-for-timeout=900 --full-page --viewport-size="390,844" "$url" "visual-full-surface/${name}-mobile.png"
          done
          test "$(find visual-full-surface -name '*.png' -size +8k | wc -l)" -eq 32
      - name: Upload full-surface visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: project-giovanni-v2-full-surface-${{ steps.source.outputs.sha }}
          path: visual-full-surface/*.png
          if-no-files-found: error
          retention-days: 90
      - name: Stop candidate
        if: always()
        run: test ! -f /tmp/pg-v2-surface.pid || kill "$(cat /tmp/pg-v2-surface.pid)" || true
