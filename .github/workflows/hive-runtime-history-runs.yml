name: HIVE Queen Runtime History

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hive-runtime-history-runs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect prior private Queen runtime runs
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${SOURCE_TOKEN:-}" ]] || { echo 'PFARMA_SOURCE_TOKEN=EMPTY'; exit 2; }
          curl -fsS \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/giovannifidel-collab/hive-alveare/actions/workflows/queen-runtime.yml/runs?per_page=12' \
            -o /tmp/runs.json
          jq -r '.workflow_runs[]? | "RUN_ID=\(.id) EVENT=\(.event) STATUS=\(.status) CONCLUSION=\(.conclusion // "none") SHA=\(.head_sha) START=\(.run_started_at // .created_at)"' /tmp/runs.json
          echo '=== QUEEN RUNTIME HISTORY COMPLETE ==='
