name: Queen S10 Independent Live World Source-versus-Neon Clocks - Read-only
on:
  push:
    branches: [audit/s10-world-dual-clock-readonly-20261119]
    paths: [.github/workflows/queen-s10-world-dual-clock-readonly.yml]
permissions: {contents: read}
jobs:
  compare-source-and-durable-world:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
      CLOUDFLARE_PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_FALLBACK_TOKEN: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify exact authoritative HIVE and live protected read-only access
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -n "$GH_TOKEN" && test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET" && test -n "$HIVE_RUNTIME_BEARER_TOKEN"
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = 1ab0e0c4fc08d1abead1517b64492e217819bdb3
          gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content |
            tr -d '\n' | base64 -d | tr -d '\n' | grep -Fxq 1ab0e0c4fc08d1abead1517b64492e217819bdb3
          echo S10_WORLD_DIAGNOSTIC_SOURCE_EXACT=PASS
      - name: Independently verify Git-connected Pages exact HIVE main deployment and rollback - read only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,re
          token=os.environ.get('CLOUDFLARE_PRIMARY_TOKEN') or os.environ.get('CLOUDFLARE_FALLBACK_TOKEN')
          assert token,'S10_CLOUDFLARE_METADATA_TOKEN_MISSING'
          def cf(path):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,
                 headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=25) as r:return json.load(r)
          accounts=cf('/accounts?per_page=50')
          assert accounts.get('success'),'S10_CF_ACCOUNT_READ_DENIED'
          matches=[]
          for a in accounts.get('result') or []:
            aid=str(a.get('id') or '')
            if not re.fullmatch('[a-f0-9]{32}',aid):continue
            try:
              obj=cf('/accounts/'+aid+'/pages/projects/hive-alveare')
              if obj.get('success') and (obj.get('result') or {}).get('name')=='hive-alveare':
                matches.append(obj['result'])
            except urllib.error.HTTPError:pass
          assert len(matches)==1,'S10_CF_HIVE_PROJECT_NOT_UNIQUE'
          proj=matches[0]; src=proj.get('source') or {}; cfg=src.get('config') or {}
          assert src.get('type')=='github' and cfg.get('repo_name')=='hive-alveare' and cfg.get('production_branch')=='main','S10_CF_SOURCE_DRIFT'
          dep=proj.get('canonical_deployment') or {}
          deployed=(dep.get('deployment_trigger') or {}).get('metadata') or {}
          print('S10_CLOUDFLARE_CURRENT_DEPLOYMENT_SHA='+str(deployed.get('commit_hash')))
          print('S10_CLOUDFLARE_DEPLOYMENT_STATUS='+str((dep.get('latest_stage') or {}).get('status')))
          assert deployed.get('commit_hash')=='1ab0e0c4fc08d1abead1517b64492e217819bdb3' and (dep.get('latest_stage') or {}).get('status')=='success','S10_CF_NEW_HIVE_SOURCE_NOT_READY'
          print('S10_CLOUDFLARE_EXACT_NEW_HIVE_SOURCE_RELEASE=PASS')
          print('S10_CLOUDFLARE_GIT_CONNECTED_NO_CONFIG_WRITE=TRUE')
          PY
      - name: Read original existing World workflow schedule health and last runs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.request,json,datetime
          token=os.environ['GH_TOKEN']
          root='https://api.github.com/repos/giovannifidel-collab/pfarma-ci'
          def get(path):
            req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=25) as r:return json.load(r)
          meta=get('/actions/workflows/hive-world-sync.yml')
          assert meta.get('path')=='.github/workflows/hive-world-sync.yml','S10_WRONG_WORLD_WORKFLOW'
          runs=get('/actions/workflows/'+str(meta['id'])+'/runs?per_page=30')
          ordered=runs.get('workflow_runs') or []
          latest=ordered[0] if ordered else None
          schedule_runs=[x for x in ordered if x.get('event')=='schedule']
          scheduled=schedule_runs[0] if schedule_runs else None
          def elapsed(v):
            if not v:return None
            return round((datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(v.replace('Z','+00:00'))).total_seconds())
          print('S10_WORLD_SYNC_WORKFLOW_STATE='+str(meta.get('state')))
          print('S10_WORLD_SYNC_LAST_RUN_ID='+str(latest.get('id') if latest else None))
          print('S10_WORLD_SYNC_LAST_RUN_EVENT='+str(latest.get('event') if latest else None))
          print('S10_WORLD_SYNC_LAST_RUN_CONCLUSION='+str(latest.get('conclusion') if latest else None))
          print('S10_WORLD_SYNC_LAST_RUN_AGE_SECONDS='+str(elapsed(latest.get('created_at')) if latest else None))
          print('S10_WORLD_SYNC_LAST_SCHEDULE_RUN_ID='+str(scheduled.get('id') if scheduled else None))
          print('S10_WORLD_SYNC_LAST_SCHEDULE_AGE_SECONDS='+str(elapsed(scheduled.get('created_at')) if scheduled else None))
          print('S10_WORLD_SYNC_EXISTING_WORKFLOW_STATE_READ_ONLY=PASS')
          PY
      - name: Compare current relay World with protected Cloudflare World and Neon-backed Queen state - GET only
        shell: bash
        run: |
          set -euo pipefail
          for route in world-state queen-state; do
            status="$(curl -sS --max-time 25 -o "$RUNNER_TEMP/$route.json" -w '%{http_code}' \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN" \
              "https://hive-alveare.pages.dev/api/$route")"
            test "$status" = "200" || { echo "S10_WORLD_HTTP=$status"; exit 23; }
          done
          gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-world-state.json --jq .content |
            tr -d '\n' | base64 -d > "$RUNNER_TEMP/world-source.json"
          python3 - <<'PY'
          import os,json,datetime
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          source=json.loads((root/'world-source.json').read_text())
          live=json.loads((root/'world-state.json').read_text())
          queen=json.loads((root/'queen-state.json').read_text())
          assert live.get('ok') is True and queen.get('ok') is True, 'S10_UNTRUSTED_ENDPOINT'
          assert source.get('state_fingerprint') and isinstance(source.get('projects'),dict), 'S10_UNTRUSTED_GITHUB_WORLD'
          assert isinstance(live.get('data'),dict) and isinstance(queen.get('state'),dict), 'S10_MISSING_STATE'
          now=datetime.datetime.now(datetime.timezone.utc)
          def age(ts):
            if not ts:return None
            d=datetime.datetime.fromisoformat(str(ts).replace('Z','+00:00'))
            return round((now-d).total_seconds())
          source_age=age(source.get('generated_at'))
          relay_age=age(live['data'].get('relay_generated_at'))
          generated_age=age(live['data'].get('generated_at'))
          state=queen['state']
          wm=state.get('world') or {}
          ca=state.get('cognitive') or {}
          sa=state.get('school') or {}
          ma=state.get('memory') or {}
          wm_age=age(wm.get('updated_at'))
          wm_source_age=age((wm.get('value') or {}).get('source_generated_at'))
          assert source_age is not None and relay_age is not None, 'S10_NO_TRUE_RELAY_TIMESTAMP'
          assert abs(source_age-relay_age)<=20, 'S10_CLOUDFLARE_RELAY_MISMATCH'
          # On the newly merged HIVE API, generated_at is the original source,
          # whereas response_generated_at is the current HTTP response clock.
          assert live['data'].get('generated_at')==live['data'].get('relay_generated_at'), 'S10_CLOUDFLARE_OLD_WORLD_API_STILL_ACTIVE'
          resp_age=age(live['data'].get('response_generated_at'))
          assert resp_age is not None and 0<=resp_age<=90, 'S10_CLOUDFLARE_RESPONSE_CLOCK_MISSING_OR_OLD'
          print('S10_WORLD_SOURCE_AND_RESPONSE_CLOCKS_SEPARATED=PASS')
          print('S10_WORLD_CLOUDFLARE_SOURCE_EQUALS_RELAY=PASS')
          print('S10_WORLD_GITHUB_SOURCE_AGE_SECONDS='+str(source_age))
          print('S10_WORLD_CLOUDFLARE_RELAY_AGE_SECONDS='+str(relay_age))
          print('S10_WORLD_API_REGENERATED_RESPONSE_AGE_SECONDS='+str(generated_age))
          print('S10_WORLD_NEON_META_AGE_SECONDS='+str(wm_age))
          print('S10_WORLD_NEON_META_ORIGINAL_SOURCE_AGE_SECONDS='+str(wm_source_age))
          print('S10_COGNITIVE_NEON_META_AGE_SECONDS='+str(age(ca.get('updated_at'))))
          print('S10_SCHOOL_NEON_META_AGE_SECONDS='+str(age(sa.get('updated_at'))))
          print('S10_MEMORY_NEON_META_AGE_SECONDS='+str(age(ma.get('updated_at'))))
          print('S10_WORLD_EXISTING_GOAL_MAX_AGE_SECONDS=1800')
          print('S10_RELAY_FRESH_BY_GOAL='+str(source_age<=1800).lower())
          print('S10_FRESH_API_TIMESTAMP_CANNOT_ATTEST_STALE_RELAY='+str(generated_age is not None and source_age>generated_age+100).lower())
          print('S10_NEON_WORLD_META_STALER_THAN_RELAY='+str(wm_age is not None and wm_age>source_age+1800).lower())
          print('S10_PROTECTED_REAL_WORLD_DUAL_CLOCK_READ_ONLY=PASS')
          print('S10_ZERO_PROVIDER_ZERO_NEON_WRITES_NO_SCHOOL=TRUE')
          PY