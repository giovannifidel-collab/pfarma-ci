name: PFarma Dual Warehouse RAZZO Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/pfarma-warehouse/**'
      - '.github/workflows/pfarma-warehouse-gate.yml'

permissions:
  contents: read

jobs:
  warehouse:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < validation/pfarma-warehouse/ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - env:
          TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: test "$(git -C source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        working-directory: source
        run: python -m compileall -q factory api/warehouse_allocation_service.py tests/test_dual_warehouse_allocation.py
      - name: Factory regressions
        working-directory: source
        run: python -m unittest factory.test_razzo_executor factory.test_continuous_loop factory.test_github_worker_runtime -v
      - name: Dual warehouse regression
        working-directory: source
        run: python tests/test_dual_warehouse_allocation.py
      - name: Planner
        working-directory: source
        run: python -m factory.plan
      - if: always()
        run: rm -rf source
