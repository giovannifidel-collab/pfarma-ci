name: gio-OS Private Source CI

on:
  push:
    branches: [main]
    paths:
      - 'gio-os-source-ref.txt'
      - '.github/workflows/gio-os-private-source-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gio-os-source-ref.txt'
      - '.github/workflows/gio-os-private-source-ci.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gio-os-private-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-only-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pfarma-ci-trusted
    steps:
      - name: Check out public CI control repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fail closed unless gio-OS private-source token is configured
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.GIO_OS_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"

      - name: Check out authoritative private gio-OS main
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/gio-OS
          ref: main
          token: ${{ secrets.GIO_OS_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve and verify exact private commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C private-source rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid canonical gio-OS SHA.' >&2; exit 1; }
          test "$(git -C private-source branch --show-current)" = 'main'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$sha" > gio-os-source-ref.txt

      - name: Publish sanitized authoritative HIVE state
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path('private-source')
          progress = json.loads((root / 'project/progress.json').read_text())
          msg = subprocess.check_output(['git','-C',str(root),'log','-1','--pretty=%s'], text=True).strip()
          state = {
            'schema_version': 1,
            'project_slug': 'gio-os',
            'authoritative_repo': 'giovannifidel-collab/gio-OS',
            'source_sha': os.environ['SOURCE_SHA'],
            'source_commit_message': msg,
            'target': progress.get('target'),
            'phase': progress.get('phase'),
            'overall_percent': progress.get('overall_percent'),
            'software_implementation_percent': progress.get('software_implementation_percent'),
            'release_eligible': progress.get('release_eligible'),
            'remaining_to_stable': progress.get('remaining_to_stable', []),
            'physical_certification': next((w for w in progress.get('workstreams', []) if w.get('id') == 'hardware_certification'), None),
            'provenance': 'PRIVATE_SOURCE_SANITIZED_SNAPSHOT'
          }
          pathlib.Path('gio-os-state.json').write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n')
          PY
          git config user.name 'hive-state-bot'
          git config user.email 'hive-state-bot@users.noreply.github.com'
          git add gio-os-source-ref.txt gio-os-state.json
          if ! git diff --cached --quiet; then
            git commit -m "state(gio-os): sync ${SOURCE_SHA:0:12}"
            git push origin HEAD:main
          fi

      - name: Run complete host-only Prototype 0 gates
        working-directory: private-source
        shell: bash
        run: make test

      - name: Verify private-source hygiene
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIE --exclude-dir=.git '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[0-9A-Za-z]{20,})' .
          test ! -d proprietary
          test ! -d vendor/google

      - name: Verify public relay contains no private source tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -d device
          test ! -d network
          test ! -d private-source-copy

      - name: Remove private source checkout
        if: always()
        shell: bash
        run: rm -rf private-source
