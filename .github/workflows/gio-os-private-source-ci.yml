name: gio-OS Private Source CI

on:
  push:
    branches: [main]
    paths:
      - 'gio-os-source-ref.txt'
      - '.github/workflows/gio-os-private-source-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gio-os-source-ref.txt'
      - '.github/workflows/gio-os-private-source-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gio-os-private-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-only-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pfarma-ci-trusted
    steps:
      - name: Check out public CI control repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate requested gio-OS SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -f gio-os-source-ref.txt
          sha="$(tr -d '\r\n' < gio-os-source-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'gio-os-source-ref.txt is not a canonical commit SHA.' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Fail closed unless gio-OS private-source token is configured
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.GIO_OS_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"

      - name: Check out exact private gio-OS commit
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/gio-OS
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.GIO_OS_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact private commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C private-source rev-parse HEAD)"
          test "$actual" = '${{ steps.source.outputs.sha }}'

      - name: Run complete host-only Prototype 0 gates
        working-directory: private-source
        shell: bash
        run: make test

      - name: Verify private-source hygiene
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIE --exclude-dir=.git '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[0-9A-Za-z]{20,})' .
          test ! -d proprietary
          test ! -d vendor/google

      - name: Verify public relay contains no private source tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -d device
          test ! -d network
          test ! -d private-source-copy

      - name: Remove private source checkout
        if: always()
        shell: bash
        run: rm -rf private-source
