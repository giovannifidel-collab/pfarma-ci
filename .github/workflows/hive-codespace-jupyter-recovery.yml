name: HIVE Codespace Non-Destructive Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/hive-codespace-jupyter-recovery.yml'

permissions:
  contents: read

concurrency:
  group: hive-codespace-nondestructive-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Recover bridge without rebuilding browser profiles
    runs-on: ubuntu-latest
    timeout-minutes: 85
    environment: pfarma-ci-trusted
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CODESPACE_NAME: glorious-fishstick-vpp99jqr55xvh967
      PUBLIC_REPO: giovannifidel-collab/pfarma-ci
      PRIVATE_REPO: giovannifidel-collab/hive-alveare
      ADAPTER_BRANCH: hive-cloud-computer-v0
      BRIDGE_PORT: '9240'
    steps:
      - name: Validate authorization and terminal proof state
        id: pre
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'PFARMA_SOURCE_TOKEN missing'; exit 2; }
          gh api "repos/$PRIVATE_REPO" --jq '.full_name' >/dev/null
          proof="$(gh api "repos/$PRIVATE_REPO/contents/ops/queen/agents/PROOF_LOCK.json?ref=main" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)"
          registry="$(gh api "repos/$PRIVATE_REPO/contents/ops/queen/runtime/AGENT_REGISTRY.json?ref=main" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)"
          ready=false
          if [[ -n "$proof" && -n "$registry" ]] && \
             jq -e '.status=="HIVE_INTEGRATED_DEGRADED" and .managed_agent_count==9 and .slot_count==10 and .deferred_agent_count==1 and .deferred_agent_ids==["meta"]' <<<"$proof" >/dev/null 2>&1 && \
             jq -e '(.agents|length)==10 and ([.agents[]|select(.enrollment=="managed" and .certified==true and .enabled==true)]|length)==9 and ([.agents[]|select(.enrollment=="deferred" and .id=="meta" and .enabled==false)]|length)==1' <<<"$registry" >/dev/null 2>&1; then ready=true; fi
          echo "static_ready=$ready" >> "$GITHUB_OUTPUT"
          echo "STATIC_QUEEN_READY=$ready"

      - name: Start existing Codespace without rebuild
        id: wake
        if: steps.pre.outputs.static_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "/user/codespaces/$CODESPACE_NAME" --jq '.state')"
          echo "CODESPACE_INITIAL_STATE=$CURRENT"
          if [[ "$CURRENT" == 'Available' ]]; then
            echo 'started=false' >> "$GITHUB_OUTPUT"
          else
            echo 'started=true' >> "$GITHUB_OUTPUT"
            set +e
            gh api -X POST "/user/codespaces/$CODESPACE_NAME/start" >/dev/null 2>&1
            rc=$?
            set -e
            [[ "$rc" -eq 0 ]] || [[ "$(gh api "/user/codespaces/$CODESPACE_NAME" --jq '.state' 2>/dev/null || true)" =~ ^(Available|Starting)$ ]] || exit "$rc"
          fi
          for _ in {1..72}; do
            STATE="$(gh api "/user/codespaces/$CODESPACE_NAME" --jq '.state' 2>/dev/null || true)"
            [[ "$STATE" == 'Available' ]] && break
            sleep 5
          done
          STATE="$(gh api "/user/codespaces/$CODESPACE_NAME" --jq '.state')"
          echo "CODESPACE_FINAL_STATE=$STATE"
          [[ "$STATE" == 'Available' ]] || { echo 'CODESPACE_NOT_AVAILABLE'; exit 3; }

      - name: Expose stable bearer-protected bridge port
        if: steps.pre.outputs.static_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gh api -X PATCH "/user/codespaces/$CODESPACE_NAME/ports/$BRIDGE_PORT" -f visibility=public >/tmp/port-patch.json 2>/tmp/port-patch.err
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            echo 'PORT_VISIBILITY_PATCH=DEFERRED_TO_CODESPACE_LIFECYCLE'
          else
            echo 'PORT_VISIBILITY_PATCH=PASS'
          fi
          rm -f /tmp/port-patch.json /tmp/port-patch.err

      - name: Wait for lifecycle auto-heal bridge
        id: bridge
        if: steps.pre.outputs.static_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="$(gh api "/user/codespaces/$CODESPACE_NAME" --jq '.web_url' | sed -E 's#https://github.com/codespaces/([^/?]+).*#\1#' || true)"
          # Codespaces forwarded ports use the stable app.github.dev hostname.
          CANDIDATE="https://${CODESPACE_NAME}-${BRIDGE_PORT}.app.github.dev"
          URL=''
          for _ in {1..120}; do
            if curl -fsS --max-time 10 "$CANDIDATE/health" >/dev/null 2>&1; then
              URL="$CANDIDATE"
              break
            fi
            sleep 5
          done
          [[ -n "$URL" ]] || { echo 'LIFECYCLE_BRIDGE_RECOVERY_TIMEOUT'; exit 4; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo 'PUBLIC_BRIDGE_HEALTH=PASS'

      - name: Resolve exact current source commits
        id: refs
        if: steps.pre.outputs.static_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER_SHA="$(gh api "repos/$PUBLIC_REPO/branches/$ADAPTER_BRANCH" --jq '.commit.sha')"
          PRIVATE_SHA="$(gh api "repos/$PRIVATE_REPO/branches/main" --jq '.commit.sha')"
          [[ "$ADAPTER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "adapter_sha=$ADAPTER_SHA" >> "$GITHUB_OUTPUT"
          echo "private_sha=$PRIVATE_SHA" >> "$GITHUB_OUTPUT"
          echo "ADAPTER_SHA=$ADAPTER_SHA"
          echo "HIVE_PRIVATE_SHA=$PRIVATE_SHA"

      - name: Dispatch Queen public runner
        id: dispatch
        if: steps.pre.outputs.static_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE="$(gh run list -R "$PUBLIC_REPO" --workflow hive-queen-public-runner.yml --limit 20 --json databaseId,status --jq '[.[]|select(.status=="queued" or .status=="in_progress" or .status=="waiting")][0].databaseId // empty')"
          if [[ -n "$ACTIVE" ]]; then
            RUN_ID="$ACTIVE"
            echo "QUEEN_PUBLIC_RUNNER_REUSED=$RUN_ID"
          else
            PREV="$(gh run list -R "$PUBLIC_REPO" --workflow hive-queen-public-runner.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            gh workflow run hive-queen-public-runner.yml -R "$PUBLIC_REPO" --ref main \
              -f "adapter_sha=${{ steps.refs.outputs.adapter_sha }}" \
              -f "hive_private_sha=${{ steps.refs.outputs.private_sha }}" \
              -f "bridge_url=${{ steps.bridge.outputs.url }}"
            RUN_ID=''
            for _ in {1..30}; do
              CANDIDATE="$(gh run list -R "$PUBLIC_REPO" --workflow hive-queen-public-runner.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
              if [[ "$CANDIDATE" != "$PREV" && "$CANDIDATE" != '0' ]]; then RUN_ID="$CANDIDATE"; break; fi
              sleep 2
            done
            [[ -n "$RUN_ID" ]] || { echo 'QUEEN_RUN_IDENTIFICATION_FAILED'; exit 5; }
            echo "QUEEN_PUBLIC_RUNNER_DISPATCHED=$RUN_ID"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Queen terminal result
        if: steps.pre.outputs.static_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "${{ steps.dispatch.outputs.run_id }}" -R "$PUBLIC_REPO" --exit-status

      - name: Verify authoritative degraded proof
        if: steps.pre.outputs.static_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          read_json(){ gh api "repos/$PRIVATE_REPO/contents/$1?ref=main" --jq '.content' | tr -d '\n' | base64 -d; }
          PROOF="$(read_json ops/queen/agents/PROOF_LOCK.json)"
          REGISTRY="$(read_json ops/queen/runtime/AGENT_REGISTRY.json)"
          jq -e '.status=="HIVE_INTEGRATED_DEGRADED" and .managed_agent_count==9 and .slot_count==10 and .deferred_agent_count==1 and .deferred_agent_ids==["meta"]' <<<"$PROOF" >/dev/null
          jq -e '(.agents|length)==10 and ([.agents[]|select(.enrollment=="managed" and .certified==true and .enabled==true)]|length)==9 and ([.agents[]|select(.enrollment=="deferred" and .id=="meta" and .enabled==false)]|length)==1' <<<"$REGISTRY" >/dev/null
          echo 'ENTRYPOINT_RESULT=HIVE_INTEGRATED_DEGRADED'
          echo 'MANAGED_AGENTS=9/10'
          echo 'DEFERRED_AGENT=meta'

      - name: Already complete
        if: steps.pre.outputs.static_ready == 'true'
        run: |
          echo 'ENTRYPOINT_RESULT=HIVE_INTEGRATED_DEGRADED'
          echo 'MANAGED_AGENTS=9/10'
          echo 'DEFERRED_AGENT=meta'
          echo 'AUTONOMOUS_RECOVERY=NO_ACTION_REQUIRED'

      - name: Stop automation-started Codespace after successful proof
        if: success() && steps.wake.outputs.started == 'true'
        shell: bash
        run: |
          gh api -X POST "/user/codespaces/$CODESPACE_NAME/stop" >/dev/null 2>&1 || true
          echo 'CODESPACE_RECOVERY_STOP_REQUESTED=true'
