name: Queen S9.5 Exact Owner-Approved Isolated Recovery One-Shot
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-5-isolated-recovery-once.yml]
permissions: {contents: read}
concurrency:
  group: queen-s9-5-owner-recovery-15f72765-a783-4053-855d-39f68dbd2d35
  cancel-in-progress: false
jobs:
  isolated-recovery-provider:
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'S9-RECOVER-OWNER-ONCE:15f72765-a783-4053-855d-39f68dbd2d35') }}
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      HIVE_SHA: 296677c77946b91ca1c8f9da70d41d87b975c5e4
      RECOVERY_MISSION_ID: 15f72765-a783-4053-855d-39f68dbd2d35
      ORIGINAL_FAULT_CLAIM_ID: 1ed138a8-c671-4bf1-9d31-8569d0a3fe22
    steps:
      - name: Verify one-time owner OIDC success and source lock with read-only GH API
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/audit/s9-access-policy-owner-token-20261111'
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq '.commit.sha')" = "$HIVE_SHA"
          pointer="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\n')"
          test "$pointer" = "$HIVE_SHA"
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/43388499218 \
            | jq -e '.status=="completed" and .conclusion=="success" and .event=="workflow_dispatch" and .run_attempt==1 and .actor.login=="giovannifidel-collab" and .head_sha=="604d1d01a629d4bfca4de9e762818925308be214"' >/dev/null
          test "$(date -u +%s)" -lt "$(date -u -d '2026-11-13T08:04:33Z' +%s)"
          echo S9_5_OWNER_OIDC_AND_SOURCE_EXACT=PASS
          echo S9_5_ORIGINAL_FAULT_CLAIM_NEVER_RETRIED=TRUE
          echo S9_5_NEW_SCOPED_RECOVERY_ONLY=TRUE

      - name: Execute real zero-cost GitHub-hosted recovery workload and emit bounded receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const e=process.env;
          if(e.GITHUB_RUN_ATTEMPT!=='1'||e.RECOVERY_MISSION_ID!=='15f72765-a783-4053-855d-39f68dbd2d35'||
            e.ORIGINAL_FAULT_CLAIM_ID!=='1ed138a8-c671-4bf1-9d31-8569d0a3fe22')
            throw Error('S9_5_REPLAY_OR_SCOPE_DENIED');
          const prime=1000000007n;
          let sum=0n;
          for(let i=1n;i<=100000n;i++) sum=(sum+i*i)%prime;
          const material=['recovery',e.RECOVERY_MISSION_ID,e.ORIGINAL_FAULT_CLAIM_ID,sum.toString()].join('|');
          const proof_sha256=crypto.createHash('sha256').update(material).digest('hex');
          const receipt={
            schema:'queen.s9.5.independent-isolated-recovery-provider.v1',
            mission_id:e.RECOVERY_MISSION_ID,
            original_fault_claim_id:e.ORIGINAL_FAULT_CLAIM_ID,
            original_fault_ci_run_id:43383707152,
            owner_oidc_ci_run_id:43388499218,
            source_sha:e.HIVE_SHA,
            github_provider_run_id:Number(e.GITHUB_RUN_ID),
            github_run_attempt:Number(e.GITHUB_RUN_ATTEMPT),
            workload:{algorithm:'sum-of-squares-mod-prime',iterations:100000,prime:String(prime),result:sum.toString()},
            proof_sha256,
            outcome:'PROVIDER_COMPUTE_COMPLETED_NO_PROJECT_WRITE',
            product_writes:false,
            production_writes:false,
            paid_fallback:false,
            school_training_eligible:false,
            automatic_retry:false,
            isolated_recovery_only:true
          };
          const file=e.RUNNER_TEMP+'/s9-5-isolated-recovery-receipt.json';
          fs.writeFileSync(file,JSON.stringify(receipt,null,2)+'\n',{mode:0o600});
          console.log('S9_5_RECOVERY_PROVIDER_RESULT='+sum.toString());
          console.log('S9_5_RECOVERY_PROOF_SHA256='+proof_sha256);
          console.log('S9_5_RECOVERY_RUN_ID='+e.GITHUB_RUN_ID);
          console.log('S9_5_RECOVERY_ACTUAL_GITHUB_RUNNER=PASS');
          console.log('S9_5_RECOVERY_PRODUCTION_WRITES=0');
          NODE
      - name: Upload independently checkable real-provider receipt
        uses: actions/upload-artifact@v4
        with:
          name: s9-5-owner-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/s9-5-isolated-recovery-receipt.json
          if-no-files-found: error
          retention-days: 7
