name: RAZZO V7 Legacy Autoscaler Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: razzo-v7-legacy-autoscaler-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run autoscaler and dispatcher unit contracts only
        run: |
          python -m unittest razzo.v7.test_autoscaler -v
          python -m unittest razzo.v7.test_dispatcher_pool -v
      - name: State diagnostic boundary
        run: echo "Legacy autoscaler is manual diagnostics only and cannot dispatch product work."
