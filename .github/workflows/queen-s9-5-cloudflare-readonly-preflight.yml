name: "Queen S9.5 Cloudflare API / Access read-only preflight (NO DEPLOY)"
on:
  push:
    branches:
      - audit/s9-5-cloudflare-api-readonly-20261117
    paths:
      - .github/workflows/queen-s9-5-cloudflare-readonly-preflight.yml

permissions:
  contents: read
concurrency:
  group: queen-s9-5-cloudflare-readonly-preflight
  cancel-in-progress: false

jobs:
  inspect-existing-cloudflare:
    if: ${{ github.actor == 'giovannifidel-collab' && github.ref == 'refs/heads/audit/s9-5-cloudflare-api-readonly-20261117' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: pfarma-ci-trusted
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_SECONDARY: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
    steps:
      - name: Assert unchanged authoritative HIVE source and signed CI boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          SHA="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq '.commit.sha')"
          PTR="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\n')"
          test "$SHA" = "$PTR"
          test "$SHA" = "6d20e61a023748bff36175f1f643c9f5781b3b9f"
          echo "S95_READONLY_SOURCE_POINTER=PASS"
          echo "S95_READONLY_NO_WRITES=TRUE"
      - name: Existing Cloudflare Pages API and protected Access readback (GET ONLY)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,subprocess,re
          report={'kind':'S9_5_EXISTING_CLOUDFLARE_READONLY','no_deploy':True,'no_project_write':True,'no_secrets_exposed':True}
          token=os.getenv('CF_PRIMARY') or os.getenv('CF_SECONDARY')
          report['cloudflare_api_token_present']=bool(token)
          report['relay_runtime_secret_present']=bool(os.getenv('HIVE_RUNTIME_BEARER_TOKEN'))
          report['access_service_token_present']=bool(os.getenv('CF_ACCESS_CLIENT_ID') and os.getenv('CF_ACCESS_CLIENT_SECRET'))
          if not token:
              print('S95_CLOUDFLARE_TOKEN_UNAVAILABLE=TRUE')
              print(json.dumps(report,sort_keys=True))
              raise SystemExit(2)
          def cf(path):
              request=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as h: return h.status,json.load(h)
              except urllib.error.HTTPError as e: return e.code,{}
              except Exception: return 0,{}
          status,accounts=cf('/accounts?per_page=50')
          report['account_get_http']=status
          if status!=200 or accounts.get('success') is not True:
              print(json.dumps(report,sort_keys=True))
              raise SystemExit(3)
          matches=[]
          for a in accounts.get('result',[]):
              aid=a.get('id')
              if re.fullmatch('[a-f0-9]{32}',str(aid or '')):
                  code,data=cf('/accounts/'+aid+'/pages/projects/hive-alveare')
                  if code==200 and data.get('success') is True and (data.get('result') or {}).get('name')=='hive-alveare':
                      matches.append((aid,data['result']))
          report['matching_hive_pages_projects']=len(matches)
          if len(matches)!=1:
              print(json.dumps(report,sort_keys=True))
              raise SystemExit(4)
          account,project=matches[0]
          report['account_identity_verified']=True
          source=project.get('source') or {}
          cfg=source.get('config') or {}
          build=project.get('build_config') or {}
          report['git_source_is_hive_main']=source.get('type')=='github' and cfg.get('repo_name')=='hive-alveare' and cfg.get('production_branch')=='main'
          report['pages_build_root_matches']=build.get('root_dir')=='cloudflare' and build.get('destination_dir')=='public'
          report['pages_build_command_present']=bool(build.get('build_command'))
          envs=project.get('deployment_configs') or {}
          prod=(envs.get('production') or {}).get('env_vars') or {}
          preview=(envs.get('preview') or {}).get('env_vars') or {}
          report['prod_neon_binding_present']='HIVE_DATA_API_URL' in prod
          report['preview_prod_neon_binding_absent']='HIVE_DATA_API_URL' not in preview
          report['prod_runtime_bearer_present']='HIVE_RUNTIME_BEARER_TOKEN' in prod
          report['prod_env_keys_count']=len(prod)
          dep=project.get('canonical_deployment') or {}
          report['prod_deployment_success']=(dep.get('latest_stage') or {}).get('status')=='success'
          report['prod_commit']=(dep.get('deployment_trigger') or {}).get('metadata',{}).get('commit_hash')
          report['rollback_deployment_id']=dep.get('id')
          if report['access_service_token_present']:
              base='https://hive-alveare.pages.dev'
              for name,path in [('health','/api/runtime-health'),('s95_get','/api/queen-s9-reconcile')]:
                  cmd=['curl','--silent','--show-error','--location','--max-time','20','-o','/dev/null','-w','%{http_code}',
                       '-H','Cf-Access-Client-Id: '+os.environ['CF_ACCESS_CLIENT_ID'],
                       '-H','Cf-Access-Client-Secret: '+os.environ['CF_ACCESS_CLIENT_SECRET'],base+path]
                  try:
                      res=subprocess.run(cmd,capture_output=True,text=True,timeout=25)
                      report['access_'+name+'_http']=res.stdout.strip() if res.returncode==0 else 'NETWORK_ERROR'
                  except Exception:
                      report['access_'+name+'_http']='NETWORK_ERROR'
          print('S95_CLOUDFLARE_EXISTING_API_READONLY_REPORT='+json.dumps(report,sort_keys=True))
          if not (report['git_source_is_hive_main'] and report['pages_build_root_matches'] and
                  report['prod_neon_binding_present'] and report['preview_prod_neon_binding_absent'] and
                  report['prod_deployment_success']):
              raise SystemExit('S95_CLOUDFLARE_PRODUCTION_PREFLIGHT_DENY')
          print('S95_CLOUDFLARE_EXISTING_API_PREFLIGHT=PASS')
          print('S95_CLOUDFLARE_NO_MUTATION=TRUE')
          PY
