name: Queen S10 Existing World Scheduler Heartbeat Source-only Regression (NO RELEASE)
on:
  push:
    branches: [fix/s10-world-sync-heartbeat-no-extra-loop-20261119, fix/s10-cloudflare-world-clock-cutover-20261119]
    paths:
      - .github/workflows/hive-world-sync.yml
      - .github/workflows/queen-s10-world-heartbeat-source-ci.yml
      - ops/queen/s10/world-observation-publication.mjs
      - ops/queen/s10/tests/world-observation-publication.test.mjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hive-world-sync.yml
      - .github/workflows/queen-s10-world-heartbeat-source-ci.yml
      - ops/queen/s10/world-observation-publication.mjs
      - ops/queen/s10/tests/world-observation-publication.test.mjs
permissions: {contents: read}
jobs:
  verify-no-new-loop-no-fake-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact original relay source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scope single replacement clock and original World source paths to exact ten non-S1 files
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify origin/main >/dev/null
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          test "${#files[@]}" -eq 10
          for path in "${files[@]}"; do
            case "$path" in
              .github/workflows/hive-world-sync.yml|.github/workflows/queen-s10-world-heartbeat-source-ci.yml|.github/workflows/queen-s10-s1-heartbeat-source-ci.yml|.github/workflows/queen-s10-world-clock-source-ci.yml|ops/queen/s10/tests/world-observation-publication.test.mjs|ops/queen/s10/world-clock/worker.mjs|ops/queen/s10/world-clock/wrangler.jsonc|ops/queen/s10/world-clock/wrangler.disabled.jsonc|ops/queen/s10/world-clock/tests/worker.test.mjs|ops/queen/s10/world-clock/README.md) ;;
              *) echo "S10_WORLD_SCHEDULER_UNAUTHORIZED_FILE=$path"; exit 32 ;;
            esac
          done
          echo 'S10_WORLD_SINGLE_REPLACEMENT_TIME_SOURCE_TEN_ALLOWLISTED_FILES=PASS'
      - name: Observe real fail-closed source decisions and all negative scenarios
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/queen/s10/world-observation-publication.mjs
          node --check ops/queen/s10/tests/world-observation-publication.test.mjs
          node --test ops/queen/s10/tests/world-observation-publication.test.mjs
          ! grep -Eq '^  schedule:' .github/workflows/hive-world-sync.yml
          grep -Fq 'clock_minute:' .github/workflows/hive-world-sync.yml
          grep -Fq '"crons": ["* * * * *"]' ops/queen/s10/world-clock/wrangler.jsonc
          node --test ops/queen/s10/world-clock/tests/worker.test.mjs
          grep -Fq "if: steps.publish.outputs.changed == 'true' && github.ref == 'refs/heads/main'" .github/workflows/hive-world-sync.yml
          grep -Fq 'WORLD_OBSERVATION_HEARTBEAT=RECORDED_NO_S1_WAKE' .github/workflows/hive-world-sync.yml
          grep -Fq "git push" .github/workflows/hive-world-sync.yml
          echo 'S10_WORLD_SOURCE_OBSERVATION_HEARTBEAT_NEGATIVE_TESTS=PASS'
          echo 'S10_WORLD_WAKE_REQUIRES_REAL_SEMANTIC_CHANGE=PASS'
          echo 'S10_NO_PROVIDER_NO_SCHOOL_NO_SECOND_S1=TRUE'
          echo 'S10_SOURCE_ONLY_NO_PRODUCTION_WORLD_COMMIT_OR_DEPLOY=TRUE'
