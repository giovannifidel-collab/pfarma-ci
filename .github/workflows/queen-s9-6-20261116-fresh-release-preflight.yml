name: Queen S9.6 Owner Release Preflight - Family PR874 and S9.5 PR96
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-6-20261116-fresh-release-preflight.yml]
permissions: {contents: read}
jobs:
  source-locked-no-prod:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Exact HIVE source and unrelated S1 remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = 6d20e61a023748bff36175f1f643c9f5781b3b9f
          gh api repos/giovannifidel-collab/hive-alveare/pulls/96 | jq -e '.state=="open" and .draft==true and .merged==false and .base.sha=="6d20e61a023748bff36175f1f643c9f5781b3b9f" and .head.sha=="062bac5d4898e3e33e23efede02336d7028b8c0e"' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/actions/runs/43963022017 | jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha=="062bac5d4898e3e33e23efede02336d7028b8c0e"' >/dev/null
          echo S9_6_S95_S1_SOURCE_CANDIDATE_CI=PASS
      - name: Family single-test PR and separate Owner merge workflow are ready with no current merge
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/giovannifidel-collab/family-cloud/pulls/874 | jq -e '.state=="open" and .draft==true and .merged==false and .head.sha=="a0620f465576b29381f5f6c3d076ab1f7c786cea" and .base.sha=="17b242eca13d7c73607e0bc52c64146750020cb7"' >/dev/null
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/43963430195 | jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1' >/dev/null
          test "$(gh api repos/giovannifidel-collab/family-cloud/branches/main --jq .commit.sha)" = b4e796f0202fd1e6ae89029674d69210e9bbbc8d
          echo S9_6_FAMILY_PR874_OWNER_MERGE_GATE_READY=PASS
      - name: Current live production S9.1 remains default-deny
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          out="$RUNNER_TEMP/queen-s9-readiness.json"
          code="$(curl -sS --max-time 25 -o "$out" -w '%{http_code}' \
             -H "Cf-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
             -H "Cf-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
             -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
             'https://hive-alveare.pages.dev/api/queen-s9-readiness')"
          test "$code" = 200
          jq -e '.ok==true and .read_only==true and .can_dispatch==false and .can_merge==false and .can_deploy==false and .can_train_school==false and .paid_fallback==false' "$out" >/dev/null
          echo S9_6_PROTECTED_PRODUCTION_SCOPE_NOT_BROKEN=PASS
          echo S9_6_GENERAL_PRODUCTION_S95_UNATTENDED_CAS=NOT_YET_CERTIFIED
          echo S9_6_GLOBAL_S9_EXIT=NOT_YET_CERTIFIED
