name: Queen S9.6 Independent Final Boundary Audit - Live Source and Scope
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-6-final-boundary-20261116.yml]
permissions: {contents: read}
jobs:
  independent-final-scope-check:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 9
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      SOURCE_SHA: 6d20e61a023748bff36175f1f643c9f5781b3b9f
    steps:
      - name: Verify exact Owner release, immutable HIVE and six-project CI
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = "$SOURCE_SHA"
          ptr="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\n')"
          test "$ptr" = "$SOURCE_SHA"
          gh api repos/giovannifidel-collab/hive-alveare/pulls/95 | jq -e --arg sha "$SOURCE_SHA" '.merged==true and .merge_commit_sha==$sha' >/dev/null
          for run in 43574845080 43575259096 43904759752 43905355845 43905966416 43914184651 43917186701 43388499218 43388823023; do
            gh api "repos/giovannifidel-collab/pfarma-ci/actions/runs/$run" | jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1' >/dev/null
            echo "S9_6_LIVE_EVIDENCE_CI_$run=PASS"
          done
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/43383707152 | jq -e '.status=="completed" and .conclusion=="failure" and .run_attempt==1' >/dev/null
          echo S9_6_LIVE_MAIN_GITHUB_OWNER_PROOF_CHAIN=PASS
      - name: Independently verify six docs-only drafts are not product releases
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r repo pr sha ref; do
            gh api "repos/giovannifidel-collab/$repo/pulls/$pr" | jq -e --arg sha "$sha" --arg ref "$ref" \
              '.state=="open" and .draft==true and .merged==false and .base.sha==$sha and .base.ref==$ref and .changed_files==1' >/dev/null
            echo "S9_6_DRAFT_CANARY_$repo=PASS"
          done <<'PROJECTS'
          project-giovanni|1169|4f67bda2e1bf63db12c1d9d7311b57f12b7bc707|main
          hive-field|1|6816df638304a6decb05b9b4bd6543d8600f5e7c|main
          giochem|3|8d8922171bfdc3554cb7786d08b3594ec681f59a|main
          pfarma-cloud|2277|1d460184944355ed2d4b375bfe03b35a70c7aa41|main
          family-cloud|873|17b242eca13d7c73607e0bc52c64146750020cb7|agent/bootstrap-family-cloud
          gio-OS|2|31103989996a664dff385896143dccd03072cdf6|main
          PROJECTS
          test "$(gh api repos/giovannifidel-collab/family-cloud/branches/main --jq .commit.sha)" = b4e796f0202fd1e6ae89029674d69210e9bbbc8d
          echo S9_6_FAMILY_BRANCH_RECONCILIATION_REQUIRED=TRUE
          echo S9_6_SIX_DOCS_ONLY_NO_PRODUCT_AUTONOMY=PASS
      - name: Independent protected Cloudflare readback and default-deny
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
          for route in runtime-health queen-state queen-s9-readiness; do
            code="$(curl -sS --max-time 26 -o "$RUNNER_TEMP/$route.json" -w '%{http_code}' \
              -H "Cf-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "Cf-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              "https://hive-alveare.pages.dev/api/$route")"
            test "$code" = 200
            jq -e '.ok==true' "$RUNNER_TEMP/$route.json" >/dev/null
            echo "S9_6_PROTECTED_$route=PASS"
          done
          jq -e '.stage=="S9.1" and .read_only==true and .can_dispatch==false and .can_merge==false and .can_deploy==false and .can_train_school==false and .paid_fallback==false' "$RUNNER_TEMP/queen-s9-readiness.json" >/dev/null
          echo S9_6_PRODUCTION_DEFAULT_DENY=PASS
          echo S9_6_ISOLATED_RECEIPT_CAS_NOT_PROD_RECOVERY=TRUE
          echo S9_6_UNATTENDED_GENERAL_AUTONOMY_CERTIFIED=FALSE
      - name: Scope summary
        run: |
          {
            echo '## S9.6 live boundary'
            echo '- HIVE source, Owner release and six-project functional tests PASS.'
            echo '- Six project docs-only PRs remain drafts.'
            echo '- Cloudflare protected live S9 health and default-deny PASS.'
            echo '- Family Cloud branches still divergent. Project source mutation not approved.'
            echo '- Isolated Neon receipt-trigger CAS does not certify unattended production S1 recovery.'
            echo '- Full S9 global exit: NOT CERTIFIED.'
          } >> "$GITHUB_STEP_SUMMARY"
