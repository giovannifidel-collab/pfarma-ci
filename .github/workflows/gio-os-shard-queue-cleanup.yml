name: GIO OS Shard Queue Cleanup

on:
  workflow_call:
  push:
    branches: [gio-os-distributed-build]
    paths:
      - '.github/workflows/gio-os-shard-queue-cleanup.yml'

permissions:
  contents: read
  actions: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: pfarma-ci-trusted
    env:
      SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
    steps:
      - name: Cancel only audited broken GIO source-pack runs
        shell: bash
        run: |
          set -euo pipefail
          : "${SOURCE_TOKEN:?PFARMA_SOURCE_TOKEN required}"
          cancel_run() {
            repo="$1"; id="$2"; label="$3"
            url="https://api.github.com/repos/$repo/actions/runs/$id"
            state="$(curl -fsSL -H "Authorization: Bearer $SOURCE_TOKEN" -H 'Accept: application/vnd.github+json' "$url" | python3 -c 'import json,sys; x=json.load(sys.stdin); print(x["status"]+"/"+(x.get("conclusion") or ""))')"
            echo "BEFORE $label $repo $id $state"
            case "$state" in
              completed/*) echo "SKIP completed $label" ;;
              *)
                code="$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST \
                  -H "Authorization: Bearer $SOURCE_TOKEN" \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "$url/cancel")"
                case "$code" in
                  202|409) echo "CANCEL $label HTTP=$code" ;;
                  *) echo "FAILED $label HTTP=$code" >&2; cat /tmp/cancel.json >&2; exit 1 ;;
                esac
                ;;
            esac
          }

          # Explicit audited allow-list: only GIO Android Source Pack generation v1-20260902.
          cancel_run giovannifidel-collab/razzo-shard-0151 33650342317 pack00
          cancel_run giovannifidel-collab/razzo-shard-0021 33650365304 pack01
          cancel_run giovannifidel-collab/razzo-shard-0143 33650389096 pack02
          cancel_run giovannifidel-collab/razzo-shard-0063 33650413711 pack03
          cancel_run giovannifidel-collab/razzo-shard-0128 33650434592 pack04
          cancel_run giovannifidel-collab/razzo-shard-0212 33650455510 pack05
          cancel_run giovannifidel-collab/razzo-shard-0185 33650480069 pack06
          cancel_run giovannifidel-collab/razzo-shard-0209 33650500139 pack07
          cancel_run giovannifidel-collab/razzo-shard-0191 33650516707 pack08
          cancel_run giovannifidel-collab/razzo-shard-0215 33650537129 pack09
          cancel_run giovannifidel-collab/razzo-shard-0010 33650563929 pack10
          cancel_run giovannifidel-collab/razzo-shard-0198 33650590432 pack11
          cancel_run giovannifidel-collab/razzo-shard-0238 33650613536 pack12
          cancel_run giovannifidel-collab/razzo-shard-0208 33650633850 pack13
          cancel_run giovannifidel-collab/razzo-shard-0166 33650657264 pack14
          cancel_run giovannifidel-collab/razzo-shard-0074 33650669312 pack15

      - name: Verify active broken pack runs are gone
        shell: bash
        run: |
          set -euo pipefail
          : "${SOURCE_TOKEN:?PFARMA_SOURCE_TOKEN required}"
          python3 - <<'PY'
          import os, time, json, urllib.request
          tok=os.environ['SOURCE_TOKEN']
          targets=[
            ('razzo-shard-0151',33650342317),('razzo-shard-0021',33650365304),('razzo-shard-0143',33650389096),('razzo-shard-0063',33650413711),
            ('razzo-shard-0128',33650434592),('razzo-shard-0212',33650455510),('razzo-shard-0185',33650480069),('razzo-shard-0209',33650500139),
            ('razzo-shard-0191',33650516707),('razzo-shard-0215',33650537129),('razzo-shard-0010',33650563929),('razzo-shard-0198',33650590432),
            ('razzo-shard-0238',33650613536),('razzo-shard-0208',33650633850),('razzo-shard-0166',33650657264),('razzo-shard-0074',33650669312)]
          def get(repo,rid):
              q=urllib.request.Request(f'https://api.github.com/repos/giovannifidel-collab/{repo}/actions/runs/{rid}',headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as r: return json.load(r)
          for _ in range(8):
              active=[]
              for repo,rid in targets:
                  x=get(repo,rid)
                  if x['status']!='completed': active.append((repo,rid,x['status']))
              print('ACTIVE',active,flush=True)
              if not active: break
              time.sleep(5)
          if active: raise SystemExit('audited GIO shard runs still active: '+repr(active))
          print('GIO_BROKEN_SHARD_WAVE_DRAINED=PASS')
          PY

      - name: Guard central valid source-pack fabric
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh api 'repos/giovannifidel-collab/pfarma-ci/actions/runs/33649902948' --jq '.status + "/" + (.conclusion // "")')"
          echo "PROTECTED central-fabric 33649902948 $state"
          test "$state" != 'completed/cancelled'
