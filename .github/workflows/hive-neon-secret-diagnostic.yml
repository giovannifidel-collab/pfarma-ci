name: HIVE Neon Secret Diagnostic

on:
  push:
    branches:
      - queen-universal-fabric-vnext
    paths:
      - ".github/workflows/hive-neon-secret-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      HIVE_NEON_DATABASE_URL: ${{ secrets.HIVE_NEON_DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HIVE_NEON_PROJECT_ID: ${{ secrets.HIVE_NEON_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      HIVE_NEON_TOKEN: ${{ secrets.HIVE_NEON_TOKEN }}
    steps:
      - name: Check presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in HIVE_NEON_DATABASE_URL NEON_DATABASE_URL DATABASE_URL HIVE_NEON_PROJECT_ID NEON_API_KEY HIVE_NEON_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "$name=PRESENT"
            else
              echo "$name=MISSING"
            fi
          done
