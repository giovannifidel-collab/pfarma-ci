name: Queen S12 — One Exact Private Project Draft PR (Owner + Neon + Free Model)
on:
  push:
    branches: [s12/one-project-draft-runner-source-20261121, s12/runner-safe-deny-diagnostics-20261122, s12/runner-owner-signature-consistency-20261123]
    paths: ['.github/workflows/queen-s12-one-project-draft-runner.yml']
  workflow_dispatch:
    inputs:
      project_id:
        type: choice
        description: 'Exactly one original Owner-scoped private project'
        options: [project-giovanni, hive-field]
        required: true
      approve_one_s12_private_draft:
        type: boolean
        description: 'Owner approves exactly ONE private DRAFT PR with no merge or deploy; fresh signed Owner grant and free quota are separately required'
        default: false
        required: true
permissions: {contents: read}
concurrency:
  group: queen-s12-one-project-draft
  cancel-in-progress: false
jobs:
  bounded-source-only-ci:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: One exact workflow and fail-closed existing S8 architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only origin/main...HEAD)" = .github/workflows/queen-s12-one-project-draft-runner.yml
          grep -Fq 'approve_one_s12_private_draft' .github/workflows/queen-s12-one-project-draft-runner.yml
          grep -Fq 'S12_NEW_TRUSTED_OWNER_GRANT_REQUIRED=TRUE' .github/workflows/queen-s12-one-project-draft-runner.yml
          grep -Fq 'S12_TRUSTED_OWNER_INTAKE_HTTP=' .github/workflows/queen-s12-one-project-draft-runner.yml
          grep -Fq 'S12_TRUSTED_OWNER_INTAKE_REASON=' .github/workflows/queen-s12-one-project-draft-runner.yml
          grep -Fq 'S12_OWNER_SIGNER_PROPAGATION_CONFIRMED=PASS' .github/workflows/queen-s12-one-project-draft-runner.yml
          grep -Fq 'S12_SIGNER_GITHUB_SOURCE_OR_OIDC_INVALID_DENY' .github/workflows/queen-s12-one-project-draft-runner.yml
          grep -Fq "deny('TRUSTED_NEON_GATE_FAILED')" .github/workflows/queen-s12-one-project-draft-runner.yml
          grep -Fq 'persist-credentials: false' .github/workflows/queen-s12-one-project-draft-runner.yml
          grep -Fq 'cloudflare/functions/api/queen-s12-project-proposal.js' .github/workflows/queen-s12-one-project-draft-runner.yml
          echo S12_ONE_BOUNDED_SOURCE_ONLY_CI=PASS
          echo S12_NO_OWNER_SIGNING_NO_MODEL_NO_NEON_OR_PROJECT_WRITE=TRUE
  private-one-project-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_one_s12_private_draft == true && github.actor == 'giovannifidel-collab'
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 22
    permissions: {contents: read, id-token: write}
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      S12_PROJECT_ID: ${{ inputs.project_id }}
    steps:
      - name: Resolve current approved HIVE source and exact private project lock
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_TRIGGERING_ACTOR" = giovannifidel-collab
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test -n "$GH_TOKEN" && test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
          case "$S12_PROJECT_ID" in
            project-giovanni)
              repo=giovannifidel-collab/project-giovanni
              sha=4f67bda2e1bf63db12c1d9d7311b57f12b7bc707
              ;;
            hive-field)
              repo=giovannifidel-collab/hive-field
              sha=2b51de88dec2e4e4ae01102fac2a3b95a9f0b5fd
              ;;
            *) echo S12_PROJECT_NOT_IN_OWNER_SCOPE; exit 41 ;;
          esac
          hive="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)"
          ptr="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')"
          test "$hive" = "$ptr"
          test "$(gh api "repos/$repo/branches/main" --jq .commit.sha)" = "$sha"
          # Require a reviewed, merged S12 trusted-runner source, not a PR branch.
          gh api "repos/giovannifidel-collab/hive-alveare/contents/ops/queen/s12/s12-trusted-project-draft.mjs?ref=$hive" --jq .sha | grep -Eq '^[0-9a-f]{40}$'
          echo "hive_sha=$hive" >> "$GITHUB_OUTPUT"
          echo "project_repo=$repo" >> "$GITHUB_OUTPUT"
          echo "project_sha=$sha" >> "$GITHUB_OUTPUT"
          echo S12_SOURCE_AND_CURRENT_HEAD_VALIDATED=PASS
          echo S12_NEW_TRUSTED_OWNER_GRANT_REQUIRED=TRUE
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: ${{ steps.source.outputs.hive_sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: hive-source
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.project_repo }}
          ref: ${{ steps.source.outputs.project_sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: project-source
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Source-only security tests before any model or project action
        shell: bash
        run: |
          set -euo pipefail
          node --check hive-source/ops/queen/s12/s12-trusted-project-draft.mjs
          node --test hive-source/ops/queen/s12/tests/s12-trusted-project-draft.test.mjs
          echo S12_INDEPENDENT_RUNNER_GATES=PASS
      - name: Verify latest current-SHA Owner signer completed and allow GitHub run-index propagation
        shell: bash
        run: |
          set -euo pipefail
          # The preceding Owner signer is completed at most seconds before this runner.
          # GitHub's REST workflow-runs listing can briefly lag its run-detail/job API.
          # NEVER accept an incomplete, stale, wrong-SHA, nonmanual or foreign signer.
          signer_id=''
          for attempt in $(seq 1 18); do
            response="$(gh api -H 'Cache-Control: no-cache' \
              'repos/giovannifidel-collab/pfarma-ci/actions/runs?event=workflow_dispatch&per_page=100' 2>/dev/null)" || response=''
            if test -n "$response"; then
              signer_id="$(jq -r --arg sha "$GITHUB_SHA" \
                '[.workflow_runs[] | select(.path==".github/workflows/queen-owner-s12-two-project-draft-oidc.yml" and .head_sha==$sha and .head_branch=="main" and .event=="workflow_dispatch" and .status=="completed" and .conclusion=="success" and .run_attempt==1 and .actor.login=="giovannifidel-collab" and .triggering_actor.login=="giovannifidel-collab" and .repository.full_name=="giovannifidel-collab/pfarma-ci")] | sort_by(.created_at) | last | .id // empty' <<<"$response")"
            fi
            if test -n "$signer_id" && test "$signer_id" -gt 0; then
              signer="$(gh api "repos/giovannifidel-collab/pfarma-ci/actions/runs/$signer_id")"
              created="$(jq -r .created_at <<<"$signer")"
              age="$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))"
              if test "$age" -ge 0 && test "$age" -le 1200 &&
                jq -e --arg sha "$GITHUB_SHA" \
                '.event=="workflow_dispatch" and .path==".github/workflows/queen-owner-s12-two-project-draft-oidc.yml" and .head_sha==$sha and .head_branch=="main" and .status=="completed" and .conclusion=="success" and .run_attempt==1 and .actor.login=="giovannifidel-collab" and .triggering_actor.login=="giovannifidel-collab"' <<<"$signer" >/dev/null; then
                  # Keep the original trusted Worker OIDC + Neon proof as final authority.
                  # This wait is for cross-endpoint visibility only, not an Owner bypass.
                  sleep 20
                  echo S12_OWNER_SIGNER_PROPAGATION_CONFIRMED=PASS
                  break
              fi
            fi
            signer_id=''
            sleep 5
          done
          if test -z "$signer_id"; then
            echo S12_SIGNER_GITHUB_SOURCE_OR_OIDC_INVALID_DENY
            exit 42
          fi
          echo S12_NEW_FRESH_OWNER_OIDC_AND_NEON_CAS_STILL_REQUIRED=TRUE
      - name: Fresh GitHub Owner OIDC registers exactly one trusted Neon execution lease
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const e=process.env,deny=x=>{throw Error('S12_OWNER_INTAKE_DENY_'+x)};
          const url=e.ACTIONS_ID_TOKEN_REQUEST_URL;
          if(!url||!e.ACTIONS_ID_TOKEN_REQUEST_TOKEN||!e.CF_ACCESS_CLIENT_ID||!e.CF_ACCESS_CLIENT_SECRET)deny('OIDC_OR_ACCESS_MISSING');
          const t=await fetch(url+(url.includes('?')?'&':'?')+'audience='+encodeURIComponent('hive-queen-s12-one-project-draft-execution-v1'),{
           headers:{authorization:'Bearer '+e.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!t.ok)deny('OIDC_ISSUER');
          const oidc=(await t.json()).value;
          if(typeof oidc!=='string'||oidc.length<300)deny('OIDC_INVALID');
          const body={action:'register',project_id:e.S12_PROJECT_ID,
           run_id:Number(e.GITHUB_RUN_ID),run_attempt:Number(e.GITHUB_RUN_ATTEMPT),
           public_sha:e.GITHUB_SHA};
          
          const r=await fetch('https://hive-alveare.pages.dev/api/queen-s12-trusted-owner-intake',{
           method:'POST',redirect:'error',
           headers:{'CF-Access-Client-Id':e.CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret':e.CF_ACCESS_CLIENT_SECRET,
            'X-Queen-CI-OIDC':oidc,'content-type':'application/json'},
           body:JSON.stringify(body)});
          const j=await r.json().catch(()=>null);
          if(!r.ok||j?.ok!==true||j?.decision!=='TRUSTED_OWNER_NEON_LEASE_ONLY'){
            // Safe diagnostics only: never print tokens, OIDC, Access headers or raw responses.
            const reason=typeof j?.reason==='string'&&/^[a-z0-9_-]{1,96}$/i.test(j.reason)?j.reason:'unknown_or_nonjson';
            console.error('S12_TRUSTED_OWNER_INTAKE_HTTP='+r.status);
            console.error('S12_TRUSTED_OWNER_INTAKE_REASON='+reason);
            deny('TRUSTED_NEON_GATE_FAILED');
          }
          console.log('S12_REGISTER_OWNER_OIDC_NEON_GATE=PASS');
          JS
      - name: Independently verify Cloudflare Workers Free plan and current daily neurons
        shell: bash
        env:
          DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALT_DEPLOY: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
          BILLING: ${{ secrets.CF_BILLING_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,datetime
          deploy=os.getenv('DEPLOY') or os.getenv('ALT_DEPLOY')
          billing=os.getenv('BILLING')
          tokens=[('deploy',os.getenv('DEPLOY')),('fallback',os.getenv('ALT_DEPLOY')),('billing',billing)]
          if not deploy or not billing:
              print('S12_FREE_NEURONS=DENY_EXISTING_READ_TOKEN_MISSING');raise SystemExit(2)
          def call(path,token,payload=None):
              if not token:return 0,{}
              headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
              data=None
              if payload is not None:
                  headers['Content-Type']='application/json'
                  data=json.dumps(payload).encode()
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,
                  data=data,method='POST' if data else 'GET',headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=18) as res:return res.status,json.load(res)
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode('utf-8'))
                  except:return e.code,{}
              except Exception:return 0,{}
          code,accounts=call('/accounts?per_page=100',deploy)
          if code!=200 or accounts.get('success') is not True:
              print('S12_FREE_NEURONS=DENY_HIVE_ACCOUNT_NOT_VERIFIED');raise SystemExit(3)
          ids=[]
          for a in accounts.get('result',[]):
              account=str(a.get('id',''))
              if len(account)!=32:continue
              c,p=call('/accounts/'+account+'/pages/projects/hive-alveare',deploy)
              if c==200 and p.get('success') is True and p.get('result',{}).get('name')=='hive-alveare':
                  ids.append(account)
          if len(ids)!=1:
              print('S12_FREE_NEURONS=DENY_MULTIPLE_ACCOUNTS');raise SystemExit(4)
          aid=ids[0]
          code,subs=call('/accounts/'+aid+'/subscriptions',billing)
          if code!=200 or subs.get('success') is not True or not isinstance(subs.get('result'),list):
              print('S12_FREE_NEURONS=DENY_BILLING_READ_UNKNOWN');raise SystemExit(5)
          billed=[]
          for item in subs['result']:
              plan=item.get('rate_plan') or {}
              n=' '.join(str(plan.get(k) or '') for k in ('id','name','public_name','scope')).lower()
              if ('worker' in n or 'ai gateway' in n) and str(item.get('state','')).lower() not in ('expired','cancelled','failed'):
                  billed.append(n)
          paid=any(any(t in n for t in ('paid','standard','enterprise','bundled')) for n in billed)
          ambiguous=any(not any(t in n for t in ('free','paid','standard','enterprise','bundled')) for n in billed)
          if paid or ambiguous:
              print('S12_FREE_NEURONS=DENY_WORKERS_PLAN_UNVERIFIED');raise SystemExit(6)
          utc=datetime.datetime.now(datetime.timezone.utc)
          start=utc.replace(hour=0,minute=0,second=0,microsecond=0).isoformat(timespec='seconds').replace('+00:00','Z')
          end=utc.isoformat(timespec='seconds').replace('+00:00','Z')
          query='query($tag:String!,$start:Time!,$end:Time!){viewer{accounts(filter:{accountTag:$tag}){aiInferenceAdaptiveGroups(limit:100,filter:{datetime_geq:$start,datetime_leq:$end}){sum{totalNeurons}}}}}'
          request={'query':query,'variables':{'tag':aid,'start':start,'end':end}}
          metrics=None
          for label,t in tokens:
              if not t:continue
              status,result=call('/graphql',t,request)
              if status!=200 or result.get('errors'):
                  print('S12_'+label.upper()+'_ANALYTICS_READ='+('UNAUTHORIZED' if status in (401,403) else 'SCHEMA_OR_ACCESS_UNKNOWN'))
                  continue
              accs=((result.get('data') or {}).get('viewer') or {}).get('accounts') or []
              if len(accs)!=1:continue
              groups=accs[0].get('aiInferenceAdaptiveGroups')
              if not isinstance(groups,list):continue
              vals=[((g.get('sum') or {}).get('totalNeurons')) for g in groups]
              if any(not isinstance(x,(int,float)) or x<0 for x in vals):continue
              metrics=sum(vals)
              print('S12_ANALYTICS_TOKEN_REUSED='+label)
              break
          if metrics is None:
              print('S12_FREE_NEURONS=DENY_DAILY_USAGE_UNVERIFIED');raise SystemExit(7)
          print('S12_FREE_PLAN=VERIFIED')
          print('S12_AI_NEURONS_USED_SINCE_UTC_MIDNIGHT='+str(round(metrics,2)))
          print('S12_NO_MODEL_INFERENCE=TRUE')
          print('S12_NO_WRITES=TRUE')
          if metrics>5000:
              print('S12_FREE_NEURONS=DENY_NOT_ENOUGH_CERTIFIED_HEADROOM')
              raise SystemExit(8)
          print('S12_FREE_NEURONS=PASS_READONLY_PROVISIONAL_CAP')
          print('S12_COST_ATTESTATION_NOT_NEON_OWNER_PERMISSION=TRUE')
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'],'s12-independent-free-quota.json').write_text(json.dumps({'used_neurons':float(metrics),'free_plan_verified':True,'workers_paid_absent':True,'account_verified':True,'analytics_verified':True}))
          PY
      - name: Fresh GitHub Owner OIDC seals independent FREE usage in Neon
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const e=process.env,deny=x=>{throw Error('S12_OWNER_INTAKE_DENY_'+x)};
          const url=e.ACTIONS_ID_TOKEN_REQUEST_URL;
          if(!url||!e.ACTIONS_ID_TOKEN_REQUEST_TOKEN||!e.CF_ACCESS_CLIENT_ID||!e.CF_ACCESS_CLIENT_SECRET)deny('OIDC_OR_ACCESS_MISSING');
          const t=await fetch(url+(url.includes('?')?'&':'?')+'audience='+encodeURIComponent('hive-queen-s12-one-project-draft-execution-v1'),{
           headers:{authorization:'Bearer '+e.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!t.ok)deny('OIDC_ISSUER');
          const oidc=(await t.json()).value;
          if(typeof oidc!=='string'||oidc.length<300)deny('OIDC_INVALID');
          const body={action:'attest_cost',project_id:e.S12_PROJECT_ID,
           run_id:Number(e.GITHUB_RUN_ID),run_attempt:Number(e.GITHUB_RUN_ATTEMPT),
           public_sha:e.GITHUB_SHA};
          const cost=JSON.parse(fs.readFileSync(e.RUNNER_TEMP+'/s12-independent-free-quota.json','utf8'));
          Object.assign(body,cost);
          if(!Number.isFinite(cost.used_neurons)||cost.used_neurons<0||cost.used_neurons>5000)deny('FREE_LIMIT');
          const r=await fetch('https://hive-alveare.pages.dev/api/queen-s12-trusted-owner-intake',{
           method:'POST',redirect:'error',
           headers:{'CF-Access-Client-Id':e.CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret':e.CF_ACCESS_CLIENT_SECRET,
            'X-Queen-CI-OIDC':oidc,'content-type':'application/json'},
           body:JSON.stringify(body)});
          const j=await r.json().catch(()=>null);
          if(!r.ok||j?.ok!==true||j?.decision!=='FRESH_FREE_PLAN_READBACK_ONLY')deny('TRUSTED_NEON_GATE_FAILED');
          console.log('S12_ATTEST_COST_OWNER_OIDC_NEON_GATE=PASS');
          JS
      - name: One real Owner-authorized proposal, independent Docker and private DRAFT PR
        shell: bash
        run: node hive-source/ops/queen/s12/s12-trusted-project-draft.mjs
      - name: Authenticated independent draft-PR GitHub readback and provisional Neon receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const e=process.env,deny=x=>{throw Error('S12_OWNER_INTAKE_DENY_'+x)};
          const url=e.ACTIONS_ID_TOKEN_REQUEST_URL;
          if(!url||!e.ACTIONS_ID_TOKEN_REQUEST_TOKEN||!e.CF_ACCESS_CLIENT_ID||!e.CF_ACCESS_CLIENT_SECRET)deny('OIDC_OR_ACCESS_MISSING');
          const t=await fetch(url+(url.includes('?')?'&':'?')+'audience='+encodeURIComponent('hive-queen-s12-one-project-draft-execution-v1'),{
           headers:{authorization:'Bearer '+e.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!t.ok)deny('OIDC_ISSUER');
          const oidc=(await t.json()).value;
          if(typeof oidc!=='string'||oidc.length<300)deny('OIDC_INVALID');
          const body={action:'complete',project_id:e.S12_PROJECT_ID,
           run_id:Number(e.GITHUB_RUN_ID),run_attempt:Number(e.GITHUB_RUN_ATTEMPT),
           public_sha:e.GITHUB_SHA};
          const receipt=JSON.parse(fs.readFileSync(e.RUNNER_TEMP+'/s12-'+e.S12_PROJECT_ID+'-draft-receipt.json','utf8'));
          Object.assign(body,{draft_pr_number:receipt.draft_pr_number,proposal_sha256:receipt.content_sha256,
           tests_passed:receipt.test_status==='PASS_NETWORKLESS_READONLY',test_count:receipt.test_count});
          const r=await fetch('https://hive-alveare.pages.dev/api/queen-s12-trusted-owner-intake',{
           method:'POST',redirect:'error',
           headers:{'CF-Access-Client-Id':e.CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret':e.CF_ACCESS_CLIENT_SECRET,
            'X-Queen-CI-OIDC':oidc,'content-type':'application/json'},
           body:JSON.stringify(body)});
          const j=await r.json().catch(()=>null);
          if(!r.ok||j?.ok!==true||j?.decision!=='PROJECT_DRAFT_NEON_PROVISIONAL_ONLY')deny('TRUSTED_NEON_GATE_FAILED');
          console.log('S12_COMPLETE_OWNER_OIDC_NEON_GATE=PASS');
          JS
      - name: No terminal certificate until independent Neon CAS
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/s12-$S12_PROJECT_ID-draft-receipt.json"
          jq -e '.neon_terminal_certified==false and .test_status=="PASS_NETWORKLESS_READONLY" and .auto_merge==false and .auto_deploy==false' "$RUNNER_TEMP/s12-$S12_PROJECT_ID-draft-receipt.json"
          echo S12_DRAFT_SOURCE_AND_CI_VERIFIED_NOT_YET_TERMINAL=TRUE
      - name: Erase all private source, model and independent test artifacts
        if: always()
        shell: bash
        run: rm -rf hive-source project-source "$RUNNER_TEMP/s12-project-giovanni-draft-receipt.json" "$RUNNER_TEMP/s12-hive-field-draft-receipt.json" "$RUNNER_TEMP/s12-project-giovanni-isolated-tests.log" "$RUNNER_TEMP/s12-hive-field-isolated-tests.log" "$RUNNER_TEMP/s12-independent-free-quota.json"
