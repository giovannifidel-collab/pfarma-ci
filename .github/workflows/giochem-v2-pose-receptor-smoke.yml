name: GIOCHEM V2 Pose Receptor Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/giochem-v2-pose-receptor-smoke.yml'

permissions:
  contents: read

env:
  GIOCHEM_OPENFE_DATA: /tmp/giochem-openfe

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve private source token
        shell: bash
        env:
          GIOCHEM_TOKEN: ${{ secrets.GIOCHEM_SOURCE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          token="${GIOCHEM_TOKEN:-${FALLBACK_TOKEN:-}}"
          test -n "$token"
          echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/giochem
          ref: 709d061e68aa1fffba64c2e431458ff051ee5e80
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V2 receptor-preparation stack
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y autodock-vina
          python -m pip install --disable-pip-version-check --no-cache-dir -r scientific-api/requirements.txt
          python -m pip install --disable-pip-version-check --no-cache-dir 'openmm>=8.2'
          python -m pip install --disable-pip-version-check --no-cache-dir 'git+https://github.com/openmm/pdbfixer.git@v1.12'
          mkdir -p "$GIOCHEM_OPENFE_DATA"
          python - <<'PY'
          import openmm, pdbfixer
          print('OPENMM', openmm.__version__)
          print('PDBFIXER', getattr(pdbfixer, '__version__', '1.12-source'))
          PY
      - name: Prepare every V2 pose receptor with PDBFixer and Meeko
        working-directory: private-source
        run: python scripts/test_v2_pose_receptors.py
      - name: Clean
        if: always()
        run: rm -rf private-source
