name: S9.5 GitHub Secret Provisioning Capability Readonly Check
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-5-github-secrets-permission-smoke.yml]
permissions: {contents: read}
jobs:
  check-public-key-endpoint-only:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
    steps:
      - name: Test repository Actions secret public-key read permission, NEVER print key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          if gh api repos/giovannifidel-collab/pfarma-ci/actions/secrets/public-key --jq .key_id > "$RUNNER_TEMP/key-id" 2>/dev/null; then
            test -s "$RUNNER_TEMP/key-id"
            echo S9_5_RELAY_SECRET_PUBLIC_KEY_API_READABLE=true
          else
            echo S9_5_RELAY_SECRET_PUBLIC_KEY_API_READABLE=false
          fi
          rm -f "$RUNNER_TEMP/key-id"
          echo S9_5_SECRETS_VALUES_NOT_READ=TRUE
          echo S9_5_NO_SECRET_CHANGE_OR_DEPLOY=TRUE
