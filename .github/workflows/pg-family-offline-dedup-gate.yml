name: Project Giovanni + Family Cloud RAZZO Wave Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/pg-family-offline-dedup/**'
      - '.github/workflows/pg-family-offline-dedup-gate.yml'

permissions:
  contents: read

jobs:
  project-giovanni:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < validation/pg-family-offline-dedup/project-giovanni.ref)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - env:
          TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: project-giovanni
          fetch-depth: 1
          persist-credentials: false
      - run: test "$(git -C project-giovanni rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: project-giovanni
        run: npm install --no-audit --no-fund
      - working-directory: project-giovanni
        run: npx --yes tsc --noEmit
      - working-directory: project-giovanni
        run: npm run test:factory
      - working-directory: project-giovanni
        run: npm run factory:plan
      - working-directory: project-giovanni
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci_placeholder'
        run: npm run build
      - if: always()
        run: rm -rf project-giovanni

  family-cloud:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < validation/pg-family-offline-dedup/family-cloud.ref)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - env:
          TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: family-cloud
          fetch-depth: 1
          persist-credentials: false
      - run: test "$(git -C family-cloud rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: family-cloud
        run: npm install --no-audit --no-fund
      - working-directory: family-cloud
        run: npm run typecheck
      - working-directory: family-cloud
        run: npm test
      - working-directory: family-cloud
        run: npm run factory:plan
      - if: always()
        run: rm -rf family-cloud
