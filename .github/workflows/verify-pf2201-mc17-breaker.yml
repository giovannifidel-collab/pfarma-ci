name: Verify PFarma MC17 Breaker

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mc17-breaker:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Resolve exact PFarma SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < razzo/pfarma-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require private-source token
        env: {TOKEN: "${{ secrets.PFARMA_SOURCE_TOKEN }}"}
        run: test -n "$TOKEN"
      - name: Checkout exact private candidate
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: test "$(git -C product rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile touched runtime
        working-directory: product
        run: python -m compileall -q backend/visit_services.py application_runtime.py tests/test_mc17_offline_revision_conflict.py
      - name: Stale revision regression
        working-directory: product
        run: PYTHONPATH=. python tests/test_mc17_offline_revision_conflict.py -v
      - name: MC16-MC20 continuity regression
        working-directory: product
        env:
          PFARMA_FEEDBACK_GITHUB_SYNC: '0'
        run: PYTHONPATH=. python tests/test_pfarma_finalization_mc16_20.py -v
      - name: Factory regression and planner smoke
        working-directory: product
        run: |
          python -m unittest factory.test_razzo_executor factory.test_continuous_loop factory.test_github_worker_runtime -v
          python -m factory.plan
      - if: always()
        run: rm -rf product
