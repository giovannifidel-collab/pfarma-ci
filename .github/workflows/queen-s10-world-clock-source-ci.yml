name: Queen S10 Minute World Clock Replacement Source Security CI (NO DEPLOY)
on:
  push:
    branches: [fix/s10-cloudflare-world-clock-cutover-20261119]
    paths:
      - .github/workflows/hive-world-sync.yml
      - .github/workflows/queen-s10-world-clock-source-ci.yml
      - .github/workflows/queen-s10-world-heartbeat-source-ci.yml
      - .github/workflows/queen-s10-s1-heartbeat-source-ci.yml
      - ops/queen/s10/world-clock/**
      - ops/queen/s10/tests/world-observation-publication.test.mjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hive-world-sync.yml
      - .github/workflows/queen-s10-world-clock-source-ci.yml
      - .github/workflows/queen-s10-world-heartbeat-source-ci.yml
      - .github/workflows/queen-s10-s1-heartbeat-source-ci.yml
      - ops/queen/s10/world-clock/**
      - ops/queen/s10/tests/world-observation-publication.test.mjs
permissions: {contents: read}
jobs:
  source-privacy-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source with no persistent credentials
        uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Require exactly ten approved files, no S1 or Neon writer modifications
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify origin/main >/dev/null
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 10
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/hive-world-sync.yml|\
              .github/workflows/queen-s10-world-clock-source-ci.yml|\
              .github/workflows/queen-s10-world-heartbeat-source-ci.yml|\
              .github/workflows/queen-s10-s1-heartbeat-source-ci.yml|\
              ops/queen/s10/tests/world-observation-publication.test.mjs|\
              ops/queen/s10/world-clock/worker.mjs|\
              ops/queen/s10/world-clock/wrangler.jsonc|\
              ops/queen/s10/world-clock/wrangler.disabled.jsonc|\
              ops/queen/s10/world-clock/tests/worker.test.mjs|\
              ops/queen/s10/world-clock/README.md) ;;
              *) echo "S10_CLOCK_UNAUTHORIZED_DIFF=$file"; exit 31 ;;
            esac
          done
          echo S10_CLOCK_EXACT_TEN_SOURCE_ONLY_PATHS=PASS
      - name: Worker and original World semantic clock negative tests
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/queen/s10/world-clock/worker.mjs
          node --check ops/queen/s10/world-clock/tests/worker.test.mjs
          node --check ops/queen/s10/world-observation-publication.mjs
          node --test ops/queen/s10/world-clock/tests/worker.test.mjs
          node --test ops/queen/s10/tests/world-observation-publication.test.mjs
          echo S10_MINUTE_CLOCK_FRESH_STALE_DUPLICATE_AUTH_AND_FAIL_CLOSED=PASS
      - name: One source-of-truth S1 and no parallel GitHub cron
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^  repository_dispatch:' .github/workflows/queen-s1-event-ingress.yml)" = 1
          ! grep -Fq 'repository_dispatch:' .github/workflows/hive-queen-event-ingress.yml
          ! grep -Eq '^  schedule:' .github/workflows/hive-world-sync.yml
          grep -Fq 'clock_minute:' .github/workflows/hive-world-sync.yml
          grep -Fq 'WORLD_OBSERVATION_HEARTBEAT=RECORDED_NO_S1_WAKE' .github/workflows/hive-world-sync.yml
          grep -Fq "if: steps.publish.outputs.changed == 'true' && github.ref == 'refs/heads/main'" .github/workflows/hive-world-sync.yml
          grep -Fq 'HOP >= 3' .github/workflows/hive-world-sync.yml
          grep -Fq '"crons": ["* * * * *"]' ops/queen/s10/world-clock/wrangler.jsonc
          grep -Fq '"crons": []' ops/queen/s10/world-clock/wrangler.disabled.jsonc
          grep -Fq 'CLOCK_ENABLED": "false"' ops/queen/s10/world-clock/wrangler.disabled.jsonc
          echo S10_ONE_S1_ONE_PERIODIC_TIME_SOURCE_AND_ROLLBACK=PASS
          echo S10_NO_SOURCE_ONLY_DEPLOY_NO_PROVIDER_NO_SCHOOL_NO_NEON_WRITE=TRUE