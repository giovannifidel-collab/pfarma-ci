name: Project Giovanni · Preparatore V2 Codex

on:
  repository_dispatch:
    types: [preparatore-v2-request]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: project-giovanni-preparatore-v2-codex-auth
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event_name == 'repository_dispatch' && github.repository == 'giovannifidel-collab/pfarma-ci' && github.event.client_payload.job_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: photo-ai-private
    steps:
      - name: Checkout trusted public worker
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Codex CLI before loading credentials
        run: npm install --global @openai/codex@0.145.0
      - name: Create isolated directories
        id: dirs
        shell: bash
        run: |
          set -euo pipefail
          JOB_DIR="$(mktemp -d)"
          CODEX_DIR="$(mktemp -d)"
          echo "job_dir=$JOB_DIR" >> "$GITHUB_OUTPUT"
          echo "codex_dir=$CODEX_DIR" >> "$GITHUB_OUTPUT"
      - name: Resolve authorized job owner
        id: owner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PREPARATORE_JOB_ID: ${{ github.event.client_payload.job_id }}
        run: node scripts/resolve-preparatore-v2-user.mjs "$PREPARATORE_JOB_ID"
      - name: Claim job and download private inputs
        id: prepare
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PREPARATORE_USER_ID: ${{ steps.owner.outputs.user_id }}
          PREPARATORE_JOB_ID: ${{ github.event.client_payload.job_id }}
          PREPARATORE_JOB_DIR: ${{ steps.dirs.outputs.job_dir }}
        run: node scripts/preparatore-v2-job.mjs prepare "$PREPARATORE_JOB_ID" "$PREPARATORE_JOB_DIR"
      - name: Restore encrypted ChatGPT-managed Codex authentication
        id: restore
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CODEX_AUTH_STATE_KEY_B64: ${{ secrets.CODEX_AUTH_STATE_KEY_B64 }}
          CODEX_AUTH_SEED_B64: ${{ secrets.CODEX_AUTH_SEED_B64 }}
          CODEX_HOME: ${{ steps.dirs.outputs.codex_dir }}
        run: node scripts/codex-auth-state.mjs restore
      - name: Analyze photos and generate candidate plan
        id: codex
        continue-on-error: true
        env:
          CODEX_HOME: ${{ steps.dirs.outputs.codex_dir }}
          JOB_DIR: ${{ steps.dirs.outputs.job_dir }}
        shell: bash
        run: |
          set -euo pipefail
          codex exec \
            --skip-git-repo-check \
            --ephemeral \
            --sandbox read-only \
            -i "$JOB_DIR/front.jpg" \
            -i "$JOB_DIR/side.jpg" \
            -i "$JOB_DIR/back.jpg" \
            --output-schema .github/photo-ai/preparatore-v2.schema.json \
            -o "$JOB_DIR/result.json" \
            - < "$JOB_DIR/prompt.txt" > "$JOB_DIR/codex.stdout" 2> "$JOB_DIR/codex.stderr"
      - name: Persist refreshed ChatGPT authentication
        if: always() && steps.restore.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CODEX_AUTH_STATE_KEY_B64: ${{ secrets.CODEX_AUTH_STATE_KEY_B64 }}
          CODEX_HOME: ${{ steps.dirs.outputs.codex_dir }}
        run: node scripts/codex-auth-state.mjs persist
      - name: Validate and publish candidate result
        id: complete
        if: steps.codex.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PREPARATORE_USER_ID: ${{ steps.owner.outputs.user_id }}
          PREPARATORE_JOB_ID: ${{ github.event.client_payload.job_id }}
          PREPARATORE_JOB_DIR: ${{ steps.dirs.outputs.job_dir }}
        run: node scripts/preparatore-v2-job.mjs complete "$PREPARATORE_JOB_ID" "$PREPARATORE_JOB_DIR"
      - name: Fail safely and delete temporary photos
        if: always() && steps.prepare.outcome == 'success' && (steps.codex.outcome != 'success' || steps.complete.outcome != 'success')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PREPARATORE_USER_ID: ${{ steps.owner.outputs.user_id }}
          PREPARATORE_JOB_ID: ${{ github.event.client_payload.job_id }}
          PREPARATORE_JOB_DIR: ${{ steps.dirs.outputs.job_dir }}
        run: node scripts/preparatore-v2-job.mjs fail "$PREPARATORE_JOB_ID" "$PREPARATORE_JOB_DIR"
      - name: Remove runner-local sensitive files
        if: always()
        shell: bash
        env:
          JOB_DIR: ${{ steps.dirs.outputs.job_dir }}
          CODEX_DIR: ${{ steps.dirs.outputs.codex_dir }}
        run: |
          set -euo pipefail
          test -n "$JOB_DIR" && test "$JOB_DIR" != "/" && rm -rf -- "$JOB_DIR"
          test -n "$CODEX_DIR" && test "$CODEX_DIR" != "/" && rm -rf -- "$CODEX_DIR"
      - name: Mark failed analysis
        if: always() && (steps.owner.outcome != 'success' || steps.prepare.outcome != 'success' || steps.codex.outcome != 'success' || steps.complete.outcome != 'success')
        run: exit 1

  cleanup-expired:
    if: github.event_name == 'schedule' && github.repository == 'giovannifidel-collab/pfarma-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: photo-ai-private
    steps:
      - name: Checkout trusted cleanup code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Delete expired private photos and expire jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cleanup-preparatore-v2-jobs.mjs
