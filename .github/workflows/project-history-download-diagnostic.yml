name: Project History Download Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'razzo/wave-0530-project-ref.txt'
      - '.github/workflows/project-history-download-diagnostic.yml'
permissions: {contents: read}

jobs:
  focused:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: ref
        shell: bash
        run: |
          sha="$(tr -d '\r\n' < razzo/wave-0530-project-ref.txt)"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: ${{ steps.ref.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: project
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Import portable history modules
        working-directory: project
        run: node --input-type=module -e "await import('./lib/workoutHistoryExportPayloadIntegrity.ts'); await import('./lib/workoutHistoryExportDownload.ts')"
      - name: Fingerprint canonical payload
        working-directory: project
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { buildWorkoutHistoryExportPayload, serializeWorkoutHistoryExportPayload } = await import('./lib/workoutHistoryExportPayload.ts');
          const { fingerprintSerializedWorkoutHistoryExportPayload } = await import('./lib/workoutHistoryExportPayloadIntegrity.ts');
          const snapshot={version:1,userId:'user 1',count:1,firstCompletedAt:'2026-07-01T10:00:00.000Z',lastCompletedAt:'2026-07-01T10:00:00.000Z',sessionIds:['s1'],completionHashes:['b'.repeat(64)]};
          const manifest={version:1,format:'application/json',userId:'user 1',recordCount:1,firstCompletedAt:snapshot.firstCompletedAt,lastCompletedAt:snapshot.lastCompletedAt,snapshotSha256:'a'.repeat(64)};
          const payload=buildWorkoutHistoryExportPayload(snapshot,manifest);
          const serialized=serializeWorkoutHistoryExportPayload(payload);
          const fp=await fingerprintSerializedWorkoutHistoryExportPayload(serialized);
          if(!/^[0-9a-f]{64}$/.test(fp.sha256)||fp.byteLength<1) process.exit(2);
          NODE
      - name: Build download descriptor
        working-directory: project
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { buildWorkoutHistoryExportPayload, serializeWorkoutHistoryExportPayload } = await import('./lib/workoutHistoryExportPayload.ts');
          const { fingerprintSerializedWorkoutHistoryExportPayload } = await import('./lib/workoutHistoryExportPayloadIntegrity.ts');
          const { previewWorkoutHistoryExportDownload } = await import('./lib/workoutHistoryExportDownload.ts');
          const snapshot={version:1,userId:'user 1',count:1,firstCompletedAt:'2026-07-01T10:00:00.000Z',lastCompletedAt:'2026-07-01T10:00:00.000Z',sessionIds:['s1'],completionHashes:['b'.repeat(64)]};
          const manifest={version:1,format:'application/json',userId:'user 1',recordCount:1,firstCompletedAt:snapshot.firstCompletedAt,lastCompletedAt:snapshot.lastCompletedAt,snapshotSha256:'a'.repeat(64)};
          const payload=buildWorkoutHistoryExportPayload(snapshot,manifest);
          const fp=await fingerprintSerializedWorkoutHistoryExportPayload(serializeWorkoutHistoryExportPayload(payload));
          const descriptor=await previewWorkoutHistoryExportDownload(payload,fp);
          if(!descriptor.fileName.startsWith('workout-history-user_1-')) process.exit(3);
          NODE
      - name: Happy-path descriptor test
        working-directory: project
        run: node --test --test-name-pattern='download descriptor is deterministic' factory/history-export-download.test.mjs
