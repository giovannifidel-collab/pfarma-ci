name: Queen S7 Owner-Approved Kaggle GPU02 First Live Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/queen-s7-owner-approved-gpu02-once.yml']
permissions: {contents: read}
concurrency:
  group: queen-s7-owner-gpu02-once
  cancel-in-progress: false
jobs:
  dispatch-one-approved-provider-probe:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      GPU02_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_GPU02 }}
    steps:
      - name: Verify existing owner-approved GPU02 Kaggle token without displaying it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'S7_CI_DISPATCH_PERMISSION_MISSING'; exit 60; }
          test -n "${GPU02_TOKEN:-}" || { echo 'S7_GPU02_KAGGLE_TOKEN_MISSING'; exit 61; }
          echo 'S7_GPU02_KAGGLE_TOKEN_PRESENT_ONLY=PASS'
      - name: Dispatch one source-locked bounded private GPU02 hardware canary
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run queen-s7-authorized-kaggle-probe.yml \
            --repo giovannifidel-collab/pfarma-ci --ref main \
            -f node_id=hive-gpu-node-02
          echo 'S7_GPU02_SINGLE_APPROVED_WORKFLOW_DISPATCHED=PASS'
