name: HIVE Queen Pages Capability

on:
  push:
    branches:
      - queen-universal-fabric-vnext
    paths:
      - ".github/workflows/hive-queen-pages-capability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT: ${{ secrets.HIVE_CF_ACCOUNT_ID }}
      HIVE_TOKEN: ${{ secrets.HIVE_CF_AIG_TOKEN }}
      LEGACY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Select existing token with Pages access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT"
          SELECTED=''
          for pair in HIVE_TOKEN LEGACY_TOKEN; do
            token="${!pair:-}"
            [[ -n "$token" ]] || continue
            code="$(curl -sS -o "/tmp/${pair}.json" -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects")"
            echo "$pair:PAGES_LIST_HTTP=$code"
            if [[ "$code" == '200' ]] && jq -e '.success==true' "/tmp/${pair}.json" >/dev/null 2>&1; then
              SELECTED="$pair"
              break
            fi
          done
          [[ -n "$SELECTED" ]] || { echo 'NO_PAGES_CAPABLE_TOKEN'; exit 20; }
          echo "SELECTED_TOKEN_NAME=$SELECTED"
          echo 'PAGES_API=PASS'
