name: HIVE Queen Pages Capability

on:
  push:
    branches: [queen-universal-fabric-vnext]
    paths: [".github/workflows/hive-queen-pages-capability.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT: ${{ secrets.HIVE_CF_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.HIVE_CF_AIG_TOKEN }}
    steps:
      - name: Discover account visible to runtime token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT"; test -n "$CF_TOKEN"
          code="$(curl -sS -o /tmp/accounts -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
          echo "ACCOUNTS_HTTP=$code"
          if [[ "$code" == 200 ]]; then
            jq '{success,accounts:[.result[]|{id,name}]}' /tmp/accounts
          else
            jq '{success,errors}' /tmp/accounts 2>/dev/null || true
          fi
          verify="$(curl -sS -o /tmp/verify -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify")"
          pages="$(curl -sS -o /tmp/pages -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects")"
          echo "CONFIGURED_ACCOUNT_TOKEN_VERIFY_HTTP=$verify"
          echo "CONFIGURED_ACCOUNT_PAGES_HTTP=$pages"
