name: HIVE Queen Pages Capability

on:
  push:
    branches: [queen-universal-fabric-vnext]
    paths: [".github/workflows/hive-queen-pages-capability.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT: ${{ secrets.HIVE_CF_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.HIVE_CF_AIG_TOKEN }}
    steps:
      - name: Diagnose Cloudflare account scopes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT"; test -n "$CF_TOKEN"
          for item in account aig pages; do
            case "$item" in
              account) url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT" ;;
              aig) url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/ai-gateway/gateways" ;;
              pages) url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" ;;
            esac
            code="$(curl -sS -o "/tmp/$item" -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$url")"
            echo "${item^^}_HTTP=$code"
            if [[ "$item" == account && "$code" == 200 ]]; then jq '{success,account_name:.result.name}' /tmp/account; fi
            if [[ "$code" != 200 ]]; then jq '{success,errors}' "/tmp/$item" 2>/dev/null || true; fi
          done
