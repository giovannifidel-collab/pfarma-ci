name: HIVE Queen Pages Capability

on:
  push:
    branches: [queen-universal-fabric-vnext]
    paths: [".github/workflows/hive-queen-pages-capability.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEW_TOKEN: ${{ secrets.HIVE_CF_AIG_TOKEN }}
      LEGACY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_ACCOUNT: ${{ secrets.HIVE_CF_ACCOUNT_ID }}
    steps:
      - name: Discover Cloudflare accounts and Pages ownership
        shell: bash
        run: |
          set -euo pipefail
          for label in NEW_TOKEN LEGACY_TOKEN; do
            token="${!label:-}"
            [[ -n "$token" ]] || continue
            code="$(curl -sS -o "/tmp/${label}-accounts" -w '%{http_code}' -H "Authorization: Bearer $token" 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
            echo "$label:ACCOUNTS_HTTP=$code"
            if [[ "$code" == 200 ]]; then
              jq -r '.result[]|"ACCOUNT name=\(.name) id=\(.id)"' "/tmp/${label}-accounts"
              while IFS= read -r account; do
                pcode="$(curl -sS -o /tmp/pages -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/accounts/$account/pages/projects")"
                echo "$label:ACCOUNT=$account:PAGES_HTTP=$pcode"
                if [[ "$pcode" == 200 ]]; then jq -r '.result[]?.name|"PAGE_PROJECT="+.' /tmp/pages; fi
              done < <(jq -r '.result[].id' "/tmp/${label}-accounts")
            fi
          done
          echo 'DISCOVERY_DONE=1'
