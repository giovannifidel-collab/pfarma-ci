name: HIVE Kimi Dispatcher

on:
  push:
    branches:
      - hive-kimi-dispatcher-v0
    paths:
      - hive-kimi-dispatcher/trigger.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: hive-kimi-dispatcher-v0-windows
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        working-directory: hive-kimi-dispatcher
        run: |
          npm install --ignore-scripts
          npx playwright install chromium
      - name: Dispatch Kimi
        run: node hive-kimi-dispatcher/dispatch.mjs
      - name: Upload diagnostic screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hive-kimi-dispatcher-diagnostic-windows
          path: hive-kimi-dispatcher-*.png
          if-no-files-found: ignore
