name: Queen S9.5 Owner exact runtime bearer install once - no merge or deploy
on:
  push:
    branches: [audit/s9-5-cloudflare-api-readonly-20261117]
    paths: [.github/workflows/queen-s9-5-owner-runtime-secret-once.yml]
permissions: {contents: read}
concurrency:
  group: queen-s9-5-owner-runtime-secret-once
  cancel-in-progress: false
jobs:
  exact-owner-secret-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: pfarma-ci-trusted
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_SECONDARY: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      RUNTIME_EXISTS: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
    steps:
      - name: Verify signed Owner lease, exact GitHub source and Cloudflare baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,datetime,base64,re,subprocess
          assert os.environ['GITHUB_ACTOR']=='giovannifidel-collab' and os.environ['GITHUB_RUN_ATTEMPT']=='1' and os.environ['GITHUB_REF']=='refs/heads/audit/s9-5-cloudflare-api-readonly-20261117','S95_RUN_IDENTITY_DENIED'
          assert not os.getenv('RUNTIME_EXISTS'),'S95_GITHUB_SECRET_ALREADY_EXISTS_DENY'
          gh_token=os.getenv('GH_TOKEN');cf_token=os.getenv('CF_PRIMARY') or os.getenv('CF_SECONDARY')
          assert gh_token and cf_token and os.getenv('CF_ACCESS_CLIENT_ID') and os.getenv('CF_ACCESS_CLIENT_SECRET'),'S95_TRUSTED_CREDENTIALS_MISSING'
          def gh(repo,path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+gh_token,'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          now=datetime.datetime.now(datetime.timezone.utc)
          assert datetime.datetime.fromisoformat('2026-11-18T06:44:59.432+00:00')<=now<datetime.datetime.fromisoformat('2026-11-18T06:59:59.432+00:00'),'S95_OWNER_LEASE_EXPIRED'
          relay='giovannifidel-collab/pfarma-ci';hive='giovannifidel-collab/hive-alveare'
          auth=gh(relay,'actions/runs/44253609961')
          assert auth['status']=='completed' and auth['conclusion']=='success' and auth['event']=='workflow_dispatch' and auth['run_attempt']==1 and auth['actor']['login']=='giovannifidel-collab','S95_SIGNED_OWNER_OIDC_DENY'
          assert gh(hive,'branches/main')['commit']['sha']=='6d20e61a023748bff36175f1f643c9f5781b3b9f','S95_HIVE_MAIN_DRIFT'
          ptr=gh(relay,'contents/hive-source-ref.txt')
          assert base64.b64decode(ptr['content']).decode().strip()=='6d20e61a023748bff36175f1f643c9f5781b3b9f','S95_RELAY_SOURCE_DRIFT'
          for repo,number,sha in [(hive,96,'843e2a0dd9abff8a86c426c2d8ba9090c948e80c'),(relay,1295,'17baebc3b3505b13354abe86e82af903146bbd9a')]:
              p=gh(repo,'pulls/'+str(number))
              assert p['state']=='open' and p['draft'] is True and p['head']['sha']==sha and p['base']['ref']=='main','S95_PR_HEAD_DRIFT'
          for repo,number,sha in [(hive,43970691264,'843e2a0dd9abff8a86c426c2d8ba9090c948e80c'),(relay,43972281347,'17baebc3b3505b13354abe86e82af903146bbd9a')]:
              r=gh(repo,'actions/runs/'+str(number))
              assert r['conclusion']=='success' and r['run_attempt']==1 and r['head_sha']==sha,'S95_SOURCE_CI_DENIED'
          def cf(path):
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers={'Authorization':'Bearer '+cf_token,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as r:return json.load(r)
          ac=cf('/accounts?per_page=50'); assert ac.get('success') is True,'S95_CF_AUTH'
          matches=[]
          for a in ac.get('result') or []:
              aid=a.get('id')
              if not re.fullmatch('[a-f0-9]{32}',str(aid)):continue
              try:
                  p=cf('/accounts/'+aid+'/pages/projects/hive-alveare')
                  if p.get('success') and p['result'].get('name')=='hive-alveare':matches.append((aid,p['result']))
              except urllib.error.HTTPError:pass
          assert len(matches)==1,'S95_CF_PROJECT_NOT_UNIQUE'
          aid,p=matches[0]
          src=p.get('source') or {};config=src.get('config') or {}
          assert src.get('type')=='github' and config.get('repo_name')=='hive-alveare' and config.get('production_branch')=='main','S95_CF_SOURCE_MISMATCH'
          dep=p.get('canonical_deployment') or {}
          assert dep.get('id')=='9b59bf3f-50f1-4810-ad63-fe913a822015' and (dep.get('latest_stage') or {}).get('status')=='success','S95_CF_ROLLBACK_BASE_DRIFT'
          assert (dep.get('deployment_trigger') or {}).get('metadata',{}).get('commit_hash')=='6d20e61a023748bff36175f1f643c9f5781b3b9f','S95_CF_PROD_SHA_DRIFT'
          cfg=p.get('deployment_configs') or {};prod=(cfg.get('production') or {}).get('env_vars') or {};preview=(cfg.get('preview') or {}).get('env_vars') or {}
          assert len(prod)==2 and 'HIVE_DATA_API_URL' in prod and 'HIVE_RUNTIME_BEARER_TOKEN' not in prod and 'HIVE_DATA_API_URL' not in preview,'S95_CF_BINDINGS_DRIFT'
          args=['curl','--silent','--show-error','--max-time','20','-o','/dev/null','-w','%{http_code}',
                '-H','Cf-Access-Client-Id: '+os.environ['CF_ACCESS_CLIENT_ID'],
                '-H','Cf-Access-Client-Secret: '+os.environ['CF_ACCESS_CLIENT_SECRET'],
                'https://hive-alveare.pages.dev/api/runtime-health']
          rr=subprocess.run(args,capture_output=True,text=True,timeout=25)
          assert rr.returncode==0 and rr.stdout.strip()=='200','S95_CF_HEALTH_DENY'
          with open(os.environ['GITHUB_ENV'],'a') as file:file.write('S95_CF_ACCOUNT_ID='+aid+'\n')
          print('S95_OWNER_SIGNED_LEASE_AND_CLOUDFLARE_BASELINE=PASS')
          PY
      - name: Install one random bearer into GitHub environment and Cloudflare production only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,secrets,subprocess,urllib.request,datetime
          assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat('2026-11-18T06:59:59.432+00:00'),'S95_EXPIRED_BEFORE_MUTATION'
          bearer=secrets.token_urlsafe(64)
          ghcmd=['gh','secret','set','HIVE_RUNTIME_BEARER_TOKEN','--env','pfarma-ci-trusted','--repo','giovannifidel-collab/pfarma-ci']
          wr=subprocess.run(ghcmd,input=bearer,text=True,capture_output=True,timeout=35)
          if wr.returncode:raise SystemExit('S95_GITHUB_ENVIRONMENT_SECRET_WRITE_DENIED')
          print('S95_GITHUB_ENVIRONMENT_SECRET=STORED')
          tok=os.getenv('CF_PRIMARY') or os.getenv('CF_SECONDARY')
          uri='https://api.cloudflare.com/client/v4/accounts/'+os.environ['S95_CF_ACCOUNT_ID']+'/pages/projects/hive-alveare'
          headers={'Authorization':'Bearer '+tok,'Accept':'application/json','Content-Type':'application/json'}
          def patch(body):
              req=urllib.request.Request(uri,data=json.dumps(body).encode(),headers=headers,method='PATCH')
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          try:
              result=patch({'deployment_configs':{'production':{'env_vars':{'HIVE_RUNTIME_BEARER_TOKEN':{'type':'secret_text','value':bearer}}}}})
              prod=((result.get('result') or {}).get('deployment_configs') or {}).get('production') or {}
              env=prod.get('env_vars') or {}
              if not result.get('success') or len(env)!=3 or 'HIVE_DATA_API_URL' not in env or 'HIVE_RUNTIME_BEARER_TOKEN' not in env:raise ValueError('PROD_ENV_NOT_PRESERVED')
              print('S95_CLOUDFLARE_RUNTIME_SECRET=STORED')
              print('S95_PREEXISTING_PROD_ENV_PRESERVED=PASS')
          except Exception:
              try:patch({'deployment_configs':{'production':{'env_vars':{'HIVE_RUNTIME_BEARER_TOKEN':None}}}})
              except Exception:pass
              subprocess.run(['gh','secret','delete','HIVE_RUNTIME_BEARER_TOKEN','--env','pfarma-ci-trusted','--repo','giovannifidel-collab/pfarma-ci'],capture_output=True,text=True,timeout=30)
              raise SystemExit('S95_CLOUDFLARE_SECRET_WRITE_FAILED_COMPENSATING_ROLLBACK_ATTEMPTED')
          PY
      - name: Verify both bindings exist without reading their values
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/giovannifidel-collab/pfarma-ci/environments/pfarma-ci-trusted/secrets/HIVE_RUNTIME_BEARER_TOKEN --jq '.name' | grep -qx HIVE_RUNTIME_BEARER_TOKEN
          python3 - <<'PY'
          import os,json,urllib.request
          token=os.getenv('CF_PRIMARY') or os.getenv('CF_SECONDARY')
          path='https://api.cloudflare.com/client/v4/accounts/'+os.environ['S95_CF_ACCOUNT_ID']+'/pages/projects/hive-alveare'
          req=urllib.request.Request(path,headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(req,timeout=25) as r: data=json.load(r)['result']
          cfg=data['deployment_configs'];p=cfg['production']['env_vars'];v=cfg['preview'].get('env_vars') or {}
          assert len(p)==3 and 'HIVE_DATA_API_URL' in p and p['HIVE_RUNTIME_BEARER_TOKEN']['type']=='secret_text','S95_PROD_SECRET_READBACK_DENY'
          assert 'HIVE_RUNTIME_BEARER_TOKEN' not in v,'S95_PREVIEW_BEARER_NOT_ALLOWED'
          print('S95_RUNTIME_SECRET_GITHUB_AND_CLOUDFLARE_READBACK=PASS')
          print('S95_NO_MERGE_NO_DEPLOY_NO_PROVIDER_NO_SCHOOL=TRUE')
          PY