name: HIVE Verifier Shape Diagnostic

on:
  push:
    branches:
      - queen-universal-fabric-vnext
    paths:
      - ".github/workflows/hive-verifier-shape-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      HIVE_CF_AIG_TOKEN: ${{ secrets.HIVE_CF_AIG_TOKEN }}
      HIVE_CF_ACCOUNT_ID: ${{ secrets.HIVE_CF_ACCOUNT_ID }}
      HIVE_CF_GATEWAY_ID: default
    steps:
      - uses: actions/checkout@v4
        with:
          ref: queen-universal-fabric-vnext
      - name: Diagnose verifier JSON shape
        shell: bash
        run: |
          set -u
          export HIVE_AGENT_INPUT='{"role":"verifier","task":"Return ONLY this JSON: {\"verified\":true,\"score\":1,\"reason\":\"ok\"}","system":"Output JSON only.","temperature":0,"max_tokens":192}'
          set +e
          RESULT="$(node ops/queen/ai-fabric/cloudflare-agent.mjs)"
          CODE=$?
          set -e
          printf '%s' "$RESULT" | jq '{status,text_present:((.text // "")|length > 0),metadata}'
          exit "$CODE"
