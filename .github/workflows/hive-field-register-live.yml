name: HIVE Field Live Registration

on:
  push:
    branches: [queen-universal-fabric-vnext]
    paths:
      - '.github/workflows/hive-field-register-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 8
    env:
      HIVE_BASE_URL: ${{ secrets.HIVE_BASE_URL }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Register HIVE Field and verify Queen sees it
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HIVE_BASE_URL:-https://hive-alveare.pages.dev}"; BASE="${BASE%/}"
          headers=(-H 'Content-Type: application/json')
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            headers+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          if [[ -n "${HIVE_RUNTIME_BEARER_TOKEN:-}" ]]; then
            headers+=(-H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN")
          fi
          body='{"slug":"hive-field","name":"HIVE Field","project_url":"https://hive-field-v8.vercel.app","repo_url":"https://github.com/giovannifidel-collab/hive-field","priority":88,"metadata":{"domain":"field-force-management","hierarchy_role":"specialist_cell","parent_control_plane":"hive","source_authority":"private-repository","production_runtime":"https://hive-field-v8.vercel.app","public_ci_transport":"https://github.com/giovannifidel-collab/pfarma-ci"}}'
          code="$(curl -sS --max-time 60 -o /tmp/register -w '%{http_code}' -X POST "${headers[@]}" "$BASE/api/project-register" -d "$body")"
          echo "HIVE_FIELD_REGISTER_HTTP=$code"
          cat /tmp/register | jq '{ok,error,project}'
          test "$code" = 201
          jq -e '.ok == true and .project.slug == "hive-field"' /tmp/register >/dev/null

          sleep 3
          code="$(curl -sS --max-time 60 -o /tmp/world -w '%{http_code}' "${headers[@]}" "$BASE/api/world-state")"
          echo "WORLD_STATE_HTTP=$code"
          test "$code" = 200
          jq -e '.ok == true and any(.data.projects[]; .slug == "hive-field" and .name == "HIVE Field")' /tmp/world >/dev/null
          jq -r '.data.projects[] | select(.slug=="hive-field") | "HIVE_FIELD_QUEEN_VISIBLE=PASS status="+.status+" source="+(.authoritative.source.repo//"none")' /tmp/world
