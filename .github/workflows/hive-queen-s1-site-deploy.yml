name: HIVE Queen S1 Site Deploy

on:
  push:
    branches:
      - main
      - convergence/queen-s1-promote-v1
    paths:
      - '.github/workflows/hive-queen-s1-site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.HIVE_CF_AIG_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HIVE_CF_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
      HIVE_BASE_URL: ${{ secrets.HIVE_BASE_URL }}
      PRIVATE_SHA: c73eb935cb5a9559a4dea43b46b464da8341ef23
      EXPECTED_COGNITIVE_ENGINE_BLOB: 21513226a823d4f26bf40d43d2bc9bde384552a8
      EXPECTED_CAPABILITY_GRAPH_BLOB: 1393458682111529d37e4eb1f4b050af01d252a9
    steps:
      - name: Preflight Cloudflare Pages authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          code="$(curl -sS -o /tmp/project -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/hive-alveare")"
          test "$code" = 200
          jq -e '.success == true and .result.name == "hive-alveare"' /tmp/project >/dev/null
          echo 'PAGES_PREFLIGHT=PASS'

      - name: Check out exact private S1 authority source
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact S1 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$PRIVATE_SHA"
          test -f private-source/ops/queen/cognitive/cognitive-engine.mjs
          test -f private-source/ops/queen/core/CAPABILITY_GRAPH.v1.json
          test -f private-source/ops/queen/core/event-router.mjs
          node private-source/ops/queen/core/validate-s1-core.mjs
          grep -Fq "$EXPECTED_COGNITIVE_ENGINE_BLOB" private-source/cloudflare/functions/_lib/queen-runtime.js
          grep -Fq "$EXPECTED_CAPABILITY_GRAPH_BLOB" private-source/cloudflare/functions/_lib/queen-runtime.js
          echo 'QUEEN_S1_SOURCE=PASS'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull Pages config and bind Workers AI
        working-directory: private-source/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          npx --yes wrangler@4 pages download config hive-alveare --force >/tmp/wrangler-download.log 2>&1
          config=''
          for f in wrangler.jsonc wrangler.json wrangler.toml; do [[ -f "$f" ]] && { config="$f"; break; }; done
          test -n "$config" || { cat /tmp/wrangler-download.log; exit 40; }
          if [[ "$config" == *.toml ]]; then
            grep -Eq '^\s*\[ai\]\s*$' "$config" || printf '\n[ai]\nbinding = "AI"\n' >> "$config"
            grep -Eq '^\s*\[env\.production\.ai\]\s*$' "$config" || printf '\n[env.production.ai]\nbinding = "AI"\n' >> "$config"
          else
            python3 -c 'from pathlib import Path; import sys,re; p=Path(sys.argv[1]); s=p.read_text(); i=s.find("{"); assert i>=0; s=s if re.search(r"(?m)^\s*["\x27]ai["\x27]\s*:",s) else s[:i+1]+"\n  \"ai\": {\"binding\": \"AI\"},"+s[i+1:]; p.write_text(s)' "$config"
          fi
          echo 'WORKERS_AI_BINDING_CONFIGURED=PASS'

      - name: Preserve Queen GitHub dispatcher secret
        working-directory: private-source/cloudflare
        shell: bash
        env:
          HIVE_GITHUB_DISPATCH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HIVE_GITHUB_DISPATCH_TOKEN"
          printf '%s' "$HIVE_GITHUB_DISPATCH_TOKEN" | npx --yes wrangler@4 pages secret put HIVE_GITHUB_DISPATCH_TOKEN --project-name hive-alveare >/tmp/pages-secret.log 2>&1
          echo 'QUEEN_GITHUB_DISPATCH_SECRET=PASS'

      - name: Deploy Queen S1
        working-directory: private-source/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy public --project-name hive-alveare --branch main
          echo 'QUEEN_S1_SITE_DEPLOY=PASS'

      - name: Wait for propagation
        run: sleep 15

      - name: Verify live S1 provenance without project mutation
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HIVE_BASE_URL:-https://hive-alveare.pages.dev}"; BASE="${BASE%/}"
          headers=()
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            headers+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          if [[ -n "${HIVE_RUNTIME_BEARER_TOKEN:-}" ]]; then
            headers+=(-H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN")
          fi
          code="$(curl -sS --max-time 30 -o /tmp/state -w '%{http_code}' "${headers[@]}" "$BASE/api/queen-state")"
          test "$code" = 200
          jq -e --arg ce "$EXPECTED_COGNITIVE_ENGINE_BLOB" --arg cg "$EXPECTED_CAPABILITY_GRAPH_BLOB" '
            .ok == true
            and .state.canonical.source_lock.cognitive_engine_blob == $ce
            and .state.canonical.source_lock.capability_graph_blob == $cg
            and .state.canonical.mesh_version == "1.0.0-s1"
          ' /tmp/state >/dev/null
          echo 'QUEEN_S1_LIVE_SOURCE_LOCK=PASS'
          echo 'PROJECT_MUTATION_PERFORMED=false'
          echo 'QUEEN_S1_LIVE_PROVENANCE=PASS'

      - name: Remove private source checkout
        if: always()
        run: rm -rf private-source
