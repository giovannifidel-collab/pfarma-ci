name: Project Giovanni Build Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'razzo/project-giovanni-ref.txt'
      - '.github/workflows/project-giovanni-build-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone exact private source quietly and diagnose build
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(curl -fsSL https://raw.githubusercontent.com/giovannifidel-collab/pfarma-ci/${GITHUB_SHA}/razzo/project-giovanni-ref.txt 2>/dev/null || true)"
          sha="$(printf '%s' "$sha" | tr -d '\r\n')"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            # Pull-request merge SHAs are not raw-content refs; read the file through the checked PR branch API instead.
            sha='27befa2e94fc794b57f5ba950d8616078e1adc96'
          fi
          test -n "$SOURCE_TOKEN"
          mkdir source && cd source
          git init -q
          git remote add origin https://github.com/giovannifidel-collab/project-giovanni.git
          auth="$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$sha"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$sha"
          npm install --silent --no-audit --no-fund
          set +e
          NEXT_TELEMETRY_DISABLED=1 npm run build > ../build.log 2>&1
          status=$?
          set -e
          echo "===== BUILD TAIL ====="
          tail -n 90 ../build.log
          echo "===== END BUILD TAIL ====="
          exit "$status"
