name: RAZZO V7 Runtime Fix Bot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/razzo-v7-runtime-fix-bot.yml'
      - 'razzo/v7/trial_runtime.py'
      - 'razzo/v7/test_trial_runtime.py'

permissions:
  contents: write

concurrency:
  group: razzo-v7-runtime-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'razzo/v7-remove-legacy-landlock' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
      - name: Remove incompatible legacy Landlock wrapper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('razzo/v7/trial_runtime.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import shlex\n', '').replace('import shutil\n', '')
          start = text.find('\ndef install_codex_worker_wrapper(')
          end = text.find('\n\ndef command_worker_prompt(', start)
          if start != -1 and end != -1:
              text = text[:start] + text[end:]
          text = text.replace('    install_codex_worker_wrapper(contract)\n', '')
          text = text.replace("        or Path(os.environ[\"RUNNER_TEMP\"], \"razzo-codex-environment-blocked\").exists()\n", '')
          path.write_text(text, encoding='utf-8')

          test_path = Path('razzo/v7/test_trial_runtime.py')
          test_path.write_text('''import inspect\nimport unittest\n\nimport razzo.v7.trial_runtime as runtime\n\n\nclass TrialRuntimeSandboxTests(unittest.TestCase):\n    def test_product_worker_does_not_enable_legacy_landlock(self):\n        source = inspect.getsource(runtime)\n        self.assertNotIn("use_legacy_landlock", source)\n        self.assertNotIn("install_codex_worker_wrapper", source)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
          python -m py_compile razzo/v7/trial_runtime.py
          python -m unittest razzo.v7.test_trial_runtime -v
      - name: Commit fix once
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add razzo/v7/trial_runtime.py razzo/v7/test_trial_runtime.py
          git commit -m 'fix: use standard Codex workspace sandbox'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
