name: Project Giovanni Photo Safety Exact ade173

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/photo-safety-ade173/**'
      - '.github/workflows/photo-safety-ade173-exact.yml'

permissions:
  contents: read

jobs:
  quality:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: source
        run: |
          sha="$(tr -d '\r\n' < validation/photo-safety-ade173/project.ref)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - run: test -n "$TOKEN"
        env: {TOKEN: "${{ secrets.PFARMA_SOURCE_TOKEN }}"}
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - run: test "$(git -C source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: source
        run: npm install --no-audit --no-fund
      - name: Direct P0 Photo AI safety vectors
        working-directory: source
        run: node --experimental-strip-types tools/test_photo_analysis_output_safety.cjs lib/photoAnalysisOutputSafety.ts
      - name: TypeScript
        working-directory: source
        run: npx --yes tsc --noEmit
      - name: RAZZO Factory suite
        working-directory: source
        run: npm run test:factory
      - name: Planner
        working-directory: source
        run: npm run factory:plan
      - name: Next build
        working-directory: source
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci_placeholder'
        run: npm run build
      - if: always()
        run: rm -rf source
