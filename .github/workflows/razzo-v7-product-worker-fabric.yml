name: RAZZO V7 Product Worker Fabric

on:
  push:
    branches: [main]
    paths:
      - 'razzo/v7/product_discovery.py'
      - 'razzo/v7/test_product_discovery.py'
      - 'razzo/v7/provider_capacity.py'
      - 'razzo/v7/test_provider_capacity.py'
      - 'razzo/v7/dispatcher_pool.py'
      - 'razzo/v7/test_dispatcher_pool.py'
      - 'razzo/projects.json'
      - 'razzo/project-state.json'
      - '.github/workflows/razzo-v7-product-worker-fabric.yml'
      - 'tools/validate_public_repo.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: razzo-v7-product-factory-global
  cancel-in-progress: false

env:
  PRODUCT_WORKER_CAP_FALLBACK: '220'
  MATRIX_EXECUTION_CEILING: '256'
  GENERIC_DISPATCHER_POOL_SIZE: '100'

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
      dispatcher_matrix: ${{ steps.discover.outputs.dispatcher_matrix }}
      dispatcher_count: ${{ steps.discover.outputs.dispatcher_count }}
      operational_cap: ${{ steps.capacity.outputs.cap }}
      capacity_decision: ${{ steps.capacity.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact control-plane SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Product discovery and dispatcher contract tests
        run: |
          python -m unittest razzo.v7.test_product_discovery -v
          python -m unittest razzo.v7.test_provider_capacity -v
          python -m unittest razzo.v7.test_dispatcher_pool -v
      - id: capacity
        name: Learn provider-aware concurrency ceiling
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          decision="$(python razzo/v7/provider_capacity.py --previous-cap "${PRODUCT_WORKER_CAP_FALLBACK}")"
          raw_cap="$(python -c 'import json,sys; print(int(json.load(sys.stdin)["operational_cap"]))' <<< "$decision")"
          cap="$raw_cap"
          if [ "$cap" -gt "$MATRIX_EXECUTION_CEILING" ]; then cap="$MATRIX_EXECUTION_CEILING"; fi
          if [ "$cap" -lt 1 ]; then cap=1; fi
          echo "cap=$cap" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
      - id: discover
        name: Discover and lease real product work
        env:
          PFARMA_SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          RAZZO_PRODUCT_WORKER_CAP: ${{ steps.capacity.outputs.cap }}
          DISPATCHER_POOL_SIZE: ${{ env.GENERIC_DISPATCHER_POOL_SIZE }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$(python razzo/v7/product_discovery.py)"
          export RAW_MATRIX="$raw"
          export PROVIDER_CAP="${{ steps.capacity.outputs.cap }}"
          dispatch="$(python - <<'PY'
          import json, os
          from razzo.v7.dispatcher_pool import annotate_work_items
          items = list(json.loads(os.environ['RAW_MATRIX']).get('include', []))
          annotated, leases = annotate_work_items(
              items,
              provider_cap=int(os.environ['PROVIDER_CAP']),
              dispatcher_pool_size=int(os.environ['DISPATCHER_POOL_SIZE']),
          )
          print(json.dumps({
              'workers': {'include': annotated},
              'dispatchers': {'include': [lease.to_matrix_entry() for lease in leases]},
          }, separators=(',', ':')))
          PY
          )"
          matrix="$(python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["workers"],separators=(",",":")))' <<< "$dispatch")"
          dispatcher_matrix="$(python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["dispatchers"],separators=(",",":")))' <<< "$dispatch")"
          count="$(python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$matrix")"
          dispatcher_count="$(python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$dispatcher_matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "dispatcher_matrix=$dispatcher_matrix" >> "$GITHUB_OUTPUT"
          echo "dispatcher_count=$dispatcher_count" >> "$GITHUB_OUTPUT"
          echo "Discovered $count work item(s); activated $dispatcher_count dispatcher(s)."

  dispatchers:
    needs: plan
    if: needs.plan.outputs.dispatcher_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 100
      matrix: ${{ fromJSON(needs.plan.outputs.dispatcher_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate lease and write isolated dispatcher receipt
        env:
          DISPATCHER_ID: ${{ matrix.dispatcher_id }}
          ITEMS_JSON: ${{ matrix.items_json }}
          LEASE_DIGEST: ${{ matrix.lease_digest }}
          WORK_COUNT: ${{ matrix.work_count }}
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/dispatcher-receipt"
          rm -rf "$out" && mkdir -p "$out"
          export OUT="$out"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from razzo.v7.dispatcher_pool import verify_dispatcher_lease
          items = json.loads(os.environ['ITEMS_JSON'])
          assert len(items) == int(os.environ['WORK_COUNT'])
          verify_dispatcher_lease(os.environ['DISPATCHER_ID'], items, os.environ['LEASE_DIGEST'])
          receipt = {
              'dispatcher_id': os.environ['DISPATCHER_ID'],
              'lease_digest': os.environ['LEASE_DIGEST'],
              'work_count': len(items),
              'collision_domains': [item['collision_domain'] for item in items],
              'run_id': '${{ github.run_id }}',
              'status': 'leased',
          }
          receipt['receipt_digest'] = hashlib.sha256(json.dumps(receipt, sort_keys=True).encode()).hexdigest()
          Path(os.environ['OUT'], f"{receipt['dispatcher_id']}.json").write_text(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-v7-dispatch-receipt-${{ matrix.dispatcher_id }}
          path: ${{ runner.temp }}/dispatcher-receipt/${{ matrix.dispatcher_id }}.json
          if-no-files-found: error

  workers:
    needs: [plan, dispatchers]
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.operational_cap) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: photo-ai-private
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.145.0
      - name: Require private source token
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"
      - name: Check out exact private product source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.exact_sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact product SHA
        working-directory: product-source
        run: test "$(git rev-parse HEAD)" = "${{ matrix.exact_sha }}"
      - name: Restore encrypted ChatGPT-managed Codex authentication
        id: restore
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CODEX_AUTH_STATE_KEY_B64: ${{ secrets.CODEX_AUTH_STATE_KEY_B64 }}
          CODEX_AUTH_SEED_B64: ${{ secrets.CODEX_AUTH_SEED_B64 }}
          CODEX_HOME: ${{ runner.temp }}/razzo-codex-${{ matrix.project_id }}-${{ matrix.issue_number }}-${{ matrix.slice_id }}
        run: node scripts/codex-auth-state.mjs restore
      - name: Create bounded product-work prompt
        env:
          ISSUE_TITLE: ${{ matrix.issue_title }}
          ISSUE_BODY: ${{ matrix.issue_body }}
          COLLISION_DOMAIN: ${{ matrix.collision_domain }}
          WORK_SLICE: ${{ matrix.work_slice }}
          DISPATCHER_ID: ${{ matrix.dispatcher_id }}
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/product-work.txt" <<'EOF'
          You are a RAZZO V7 product worker operating on one real GitHub issue.
          Implement the smallest meaningful product improvement that directly advances the assigned work slice.
          Never write to production, user data, external systems, secrets, paid infrastructure or irreversible migrations.
          Do not modify workflows, infrastructure, authentication boundaries or factory policy.
          Do not weaken tests. Work only from the exact SHA. Keep changes narrow and collision-resistant.
          Prefer executable product code plus focused regression tests. Do not commit or push; the outer worker owns Git operations.
          Run no network commands.
          EOF
          printf 'DISPATCHER: %s\nCOLLISION DOMAIN: %s\nWORK SLICE: %s\nISSUE TITLE:\n%s\nISSUE BODY:\n%s\n' "$DISPATCHER_ID" "$COLLISION_DOMAIN" "$WORK_SLICE" "$ISSUE_TITLE" "$ISSUE_BODY" >> "${RUNNER_TEMP}/product-work.txt"
      - name: Execute real product worker
        id: codex
        working-directory: product-source
        env:
          CODEX_HOME: ${{ runner.temp }}/razzo-codex-${{ matrix.project_id }}-${{ matrix.issue_number }}-${{ matrix.slice_id }}
        shell: bash
        run: codex exec --skip-git-repo-check --ephemeral --sandbox workspace-write - < "${RUNNER_TEMP}/product-work.txt"
      - name: Reject forbidden change surfaces
        id: diff
        working-directory: product-source
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}')"
          if [ -z "$changed" ]; then echo 'has_changes=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          if echo "$changed" | grep -E '(^|/)(\.github/workflows|migrations|infra|secrets)(/|$)|factory/(policy|task[-_]graph)'; then exit 1; fi
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"
      - name: Run project factory tests
        if: steps.diff.outputs.has_changes == 'true'
        working-directory: product-source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n '${{ matrix.factory_test }}' ]; then bash -lc '${{ matrix.factory_test }}'; fi
          if [ -n '${{ matrix.factory_plan }}' ]; then bash -lc '${{ matrix.factory_plan }}'; fi
      - name: Commit, push safe branch and open PR
        if: steps.diff.outputs.has_changes == 'true'
        id: publish
        working-directory: product-source
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          ISSUE_TITLE: ${{ matrix.issue_title }}
        shell: bash
        run: |
          set -euo pipefail
          branch="razzo/v7/${{ matrix.project_id }}/issue-${{ matrix.issue_number }}-${{ matrix.slice_id }}-${GITHUB_RUN_ID}"
          git config user.name 'RAZZO V7 Product Worker'
          git config user.email 'razzo-v7@users.noreply.github.com'
          git switch -c "$branch"
          git add -A
          git commit -m "RAZZO V7: advance #${{ matrix.issue_number }} (${{ matrix.slice_id }})"
          git push "https://x-access-token:${SOURCE_TOKEN}@github.com/${{ matrix.repository }}.git" "HEAD:${branch}"
          export BRANCH="$branch"
          export PR_TITLE="RAZZO V7: advance #${{ matrix.issue_number }} [${{ matrix.slice_id }}] — ${ISSUE_TITLE}"
          export PR_BASE='${{ matrix.integration_lane }}'
          export PR_BODY='Automated bounded product worker. Exact input SHA `${{ matrix.exact_sha }}`. Requires normal exact-SHA CI and integration policy.'
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({'title': os.environ['PR_TITLE'], 'head': os.environ['BRANCH'], 'base': os.environ['PR_BASE'], 'body': os.environ['PR_BODY']}))
          PY
          )"
          response="$(curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${{ matrix.repository }}/pulls" -d "$payload")"
          echo "pr=$(python -c 'import json,sys; print(json.load(sys.stdin)["number"])' <<< "$response")" >> "$GITHUB_OUTPUT"
      - name: Persist refreshed ChatGPT authentication
        if: always() && steps.restore.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CODEX_AUTH_STATE_KEY_B64: ${{ secrets.CODEX_AUTH_STATE_KEY_B64 }}
          CODEX_HOME: ${{ runner.temp }}/razzo-codex-${{ matrix.project_id }}-${{ matrix.issue_number }}-${{ matrix.slice_id }}
        run: node scripts/codex-auth-state.mjs persist
      - name: Write isolated execution receipt
        if: always()
        env:
          OUT: ${{ runner.temp }}/worker-receipt
        shell: bash
        run: |
          rm -rf "$OUT" && mkdir -p "$OUT"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          data = {
            'project_id': '${{ matrix.project_id }}',
            'repository': '${{ matrix.repository }}',
            'issue_number': ${{ matrix.issue_number }},
            'slice_id': '${{ matrix.slice_id }}',
            'work_slice': '${{ matrix.work_slice }}',
            'collision_domain': '${{ matrix.collision_domain }}',
            'dispatcher_id': '${{ matrix.dispatcher_id }}',
            'dispatcher_lease_digest': '${{ matrix.dispatcher_lease_digest }}',
            'input_exact_sha': '${{ matrix.exact_sha }}',
            'worker_id': 'product-${{ matrix.project_id }}-${{ matrix.issue_number }}-${{ matrix.slice_id }}',
            'codex_outcome': '${{ steps.codex.outcome }}',
            'has_changes': '${{ steps.diff.outputs.has_changes }}',
            'pr_number': '${{ steps.publish.outputs.pr }}',
            'run_id': '${{ github.run_id }}',
          }
          data['receipt_digest'] = hashlib.sha256(json.dumps(data, sort_keys=True).encode()).hexdigest()
          Path(os.environ['OUT'], 'receipt.json').write_text(json.dumps(data, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razzo-v7-product-receipt-${{ matrix.project_id }}-${{ matrix.issue_number }}-${{ matrix.slice_id }}
          path: ${{ runner.temp }}/worker-receipt/receipt.json
          if-no-files-found: error
      - name: Remove private source and auth state
        if: always()
        run: rm -rf product-source "${RUNNER_TEMP}/razzo-codex-${{ matrix.project_id }}-${{ matrix.issue_number }}-${{ matrix.slice_id }}" "${RUNNER_TEMP}/product-work.txt"

  aggregate:
    needs: [plan, dispatchers, workers]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: razzo-v7-product-receipt-*
          path: receipts
      - uses: actions/download-artifact@v4
        with:
          pattern: razzo-v7-dispatch-receipt-*
          path: dispatch-receipts
      - name: Verify aggregate receipts
        env:
          EXPECTED: ${{ needs.plan.outputs.count }}
          EXPECTED_DISPATCHERS: ${{ needs.plan.outputs.dispatcher_count }}
          OPERATIONAL_CAP: ${{ needs.plan.outputs.operational_cap }}
          CAPACITY_DECISION: ${{ needs.plan.outputs.capacity_decision }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          worker_files = sorted(Path('receipts').glob('**/receipt.json'))
          dispatch_files = sorted(Path('dispatch-receipts').glob('**/*.json'))
          expected = int(os.environ['EXPECTED'])
          expected_dispatchers = int(os.environ['EXPECTED_DISPATCHERS'])
          assert len(worker_files) == expected, (len(worker_files), expected)
          assert len(dispatch_files) == expected_dispatchers, (len(dispatch_files), expected_dispatchers)
          receipts = [json.loads(p.read_text()) for p in worker_files]
          dispatch_receipts = [json.loads(p.read_text()) for p in dispatch_files]
          ids = [r['worker_id'] for r in receipts]
          domains = [r['collision_domain'] for r in receipts]
          dispatcher_ids = [r['dispatcher_id'] for r in dispatch_receipts]
          leased_domains = [d for r in dispatch_receipts for d in r['collision_domains']]
          assert len(ids) == len(set(ids))
          assert len(domains) == len(set(domains))
          assert len(dispatcher_ids) == len(set(dispatcher_ids))
          assert set(domains) == set(leased_domains)
          assert all(r['dispatcher_id'] in set(dispatcher_ids) for r in receipts)
          prs = [r['pr_number'] for r in receipts if r.get('pr_number')]
          print(json.dumps({
            'cycle_type': 'PRODUCT_WORK',
            'workstreams_dispatched': expected,
            'active_generic_dispatchers': expected_dispatchers,
            'receipts': len(receipts),
            'dispatch_receipts': len(dispatch_receipts),
            'product_prs_created': len(prs),
            'duplicate_execution': False,
            'collision_domains_unique': True,
            'provider_aware_operational_cap': int(os.environ['OPERATIONAL_CAP']),
            'capacity_decision': json.loads(os.environ['CAPACITY_DECISION']),
            'registry_logical_burst': 1000,
            'generation_promoted': False,
          }, indent=2))
          PY