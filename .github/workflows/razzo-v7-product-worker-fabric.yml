name: RAZZO V7 Safe Product Factory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Recovery mode"
        required: true
        type: choice
        options:
          - plan-only
        default: plan-only
      max_workers:
        description: "Maximum logical shards to allocate (1-3)"
        required: true
        type: string
        default: "3"

permissions:
  contents: read
  actions: read

concurrency:
  group: razzo-v7-safe-factory
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    steps:
      - name: Check out exact control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact control-plane SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Run planner contract tests
        run: |
          python -m unittest razzo.v7.test_actionability -v
          python -m unittest razzo.v7.test_product_discovery -v
          python -m unittest razzo.v7.test_dispatcher_pool -v

      - name: Build safe plan
        env:
          PFARMA_SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          REQUESTED_WORKERS: ${{ inputs.max_workers }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          max_workers="$(python - <<'PY'
          import os
          try:
              value = int(os.environ['REQUESTED_WORKERS'])
          except ValueError as exc:
              raise SystemExit('max_workers must be an integer') from exc
          if value < 1 or value > 3:
              raise SystemExit('max_workers must be between 1 and 3')
          print(value)
          PY
          )"
          export RAZZO_MAX_WORKERS="$max_workers"

          raw="$(python razzo/v7/product_discovery.py)"
          export RAW="$raw"

          mkdir -p "$RUNNER_TEMP/razzo-plan"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from razzo.v7.dispatcher_pool import annotate_work_items

          discovered = json.loads(os.environ['RAW'])
          workers, leases = annotate_work_items(
              list(discovered.get('include', [])),
              provider_cap=int(os.environ['RAZZO_MAX_WORKERS']),
              run_id=os.environ['RUN_ID'],
          )
          plan = {
              'run_id': os.environ['RUN_ID'],
              'mode': 'plan-only',
              'max_workers': int(os.environ['RAZZO_MAX_WORKERS']),
              'product_progress': False,
              'workers': workers,
              'dispatchers': [lease.to_matrix_entry() for lease in leases],
              'rejected': discovered.get('rejected', []),
          }
          Path(os.environ['RUNNER_TEMP'], 'razzo-plan', 'plan.json').write_text(
              json.dumps(plan, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          summary = {
              'classification': 'PLAN_ONLY',
              'planned_items': len(workers),
              'rejected_candidates': len(plan['rejected']),
              'allocated_shards': [item.get('shard_id') for item in workers],
              'product_progress': False,
          }
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('# RAZZO V7 Safe Plan Gate\n\n```json\n')
              handle.write(json.dumps(summary, indent=2))
              handle.write('\n```\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload verified plan
        uses: actions/upload-artifact@v4
        with:
          name: razzo-v7-safe-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/razzo-plan/plan.json
          if-no-files-found: error
