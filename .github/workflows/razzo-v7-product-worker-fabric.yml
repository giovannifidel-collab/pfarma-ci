name: RAZZO V7 Product Worker Fabric

on:
  push:
    branches: [main]
    paths:
      - 'razzo/v7/**'
      - 'razzo/projects.json'
      - 'razzo/project-state.json'
      - '.github/workflows/razzo-v7-product-worker-fabric.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: razzo-v7-product-factory-global
  cancel-in-progress: false

env:
  PRODUCT_WORKER_CAP_FALLBACK: '32'
  MATRIX_EXECUTION_CEILING: '64'
  GENERIC_DISPATCHER_POOL_SIZE: '100'

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      dispatcher_matrix: ${{ steps.plan.outputs.dispatcher_matrix }}
      dispatcher_count: ${{ steps.plan.outputs.dispatcher_count }}
      discovery_matrix: ${{ steps.plan.outputs.discovery_matrix }}
      discovery_count: ${{ steps.plan.outputs.discovery_count }}
      operational_cap: ${{ steps.capacity.outputs.cap }}
      rejected: ${{ steps.plan.outputs.rejected }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify exact control-plane SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run V7 contract tests
        run: |
          python -m unittest razzo.v7.test_product_discovery -v
          python -m unittest razzo.v7.test_provider_capacity -v
          python -m unittest razzo.v7.test_dispatcher_pool -v
      - id: capacity
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          decision="$(python razzo/v7/provider_capacity.py --previous-cap "$PRODUCT_WORKER_CAP_FALLBACK")"
          cap="$(python -c 'import json,sys; print(max(1,min(int(json.load(sys.stdin)["operational_cap"]),64)))' <<< "$decision")"
          echo "cap=$cap" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Discover actionable work and allocate explicit shards
        env:
          PFARMA_SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          RAZZO_PRODUCT_WORKER_CAP: ${{ steps.capacity.outputs.cap }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$(python razzo/v7/product_discovery.py)"
          export RAW="$raw" CAP="${{ steps.capacity.outputs.cap }}" RUN_ID
          dispatch="$(python - <<'PY'
          import json, os
          from razzo.v7.dispatcher_pool import annotate_work_items
          payload=json.loads(os.environ['RAW'])
          items=list(payload.get('include', []))
          annotated,leases=annotate_work_items(items,provider_cap=int(os.environ['CAP']),run_id=os.environ['RUN_ID'])
          print(json.dumps({
              'workers':{'include':annotated},
              'dispatchers':{'include':[x.to_matrix_entry() for x in leases]},
              'discovery':payload.get('deep_discovery', {'include':[]}),
              'rejected':payload.get('rejected',[])
          },separators=(',',':')))
          PY
          )"
          matrix="$(python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["workers"],separators=(",",":")))' <<< "$dispatch")"
          dispatchers="$(python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["dispatchers"],separators=(",",":")))' <<< "$dispatch")"
          discovery="$(python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["discovery"],separators=(",",":")))' <<< "$dispatch")"
          rejected="$(python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["rejected"],separators=(",",":")))' <<< "$dispatch")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "dispatcher_matrix=$dispatchers" >> "$GITHUB_OUTPUT"
          echo "discovery_matrix=$discovery" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "dispatcher_count=$(python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$dispatchers")" >> "$GITHUB_OUTPUT"
          echo "discovery_count=$(python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$discovery")" >> "$GITHUB_OUTPUT"
          echo "rejected=$rejected" >> "$GITHUB_OUTPUT"

  deep_discovery:
    needs: plan
    if: needs.plan.outputs.discovery_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.discovery_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: photo-ai-private
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.145.0
      - name: Checkout exact private product source read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.exact_input_sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact discovery input
        working-directory: product-source
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.exact_input_sha }}"
          test -n '${{ matrix.shard_id }}'
      - name: Restore Codex authentication
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CODEX_AUTH_STATE_KEY_B64: ${{ secrets.CODEX_AUTH_STATE_KEY_B64 }}
          CODEX_AUTH_SEED_B64: ${{ secrets.CODEX_AUTH_SEED_B64 }}
          CODEX_HOME: ${{ runner.temp }}/codex-${{ matrix.shard_id }}
        run: node scripts/codex-auth-state.mjs restore
      - name: Materialize repository discovery prompt
        run: |
          cat > "$RUNNER_TEMP/deep-discovery.txt" <<'EOF'
          You are a read-only RAZZO V7 discovery worker. Inspect the current repository code, tests, open product surfaces, TODOs and incomplete end-to-end journeys. Do not modify any file. Identify exactly one safe, independent, high-value product increment whose real target files already exist. Do not invent files or components. Avoid workflow, infrastructure, governance, receipt, timestamp and cosmetic-only work.

          Return exactly one JSON object and no Markdown with these keys:
          product_objective, user_impact, rationale, acceptance_criteria (array with at least 2 verifiable items), definition_of_done, target_surfaces (array of existing repository paths), required_tests (array of executable repository test commands), expected_product_effect, collision_domain (specific path-like domain without project prefix), allowed_surfaces (same or narrower than target_surfaces), forbidden_surfaces (array), dependencies (array), risk_class, human_gate (boolean), evidence_required (array).

          If no target surface can be identified with reasonable certainty, return {"actionability_state":"NEEDS_DEEPER_DISCOVERY","reason":"..."}.
          EOF
      - name: Execute read-only deep discovery
        id: discover
        working-directory: product-source
        env: {CODEX_HOME: '${{ runner.temp }}/codex-${{ matrix.shard_id }}'}
        shell: bash
        run: |
          set -euo pipefail
          codex exec --skip-git-repo-check --ephemeral --sandbox read-only - < "$RUNNER_TEMP/deep-discovery.txt" > "$RUNNER_TEMP/deep-discovery-output.txt"
          test -z "$(git status --porcelain)"
      - name: Validate contract and prepare actionable issue
        id: contract
        env:
          PROJECT_ID: ${{ matrix.project_id }}
          REPOSITORY: ${{ matrix.repository }}
          EXACT_SHA: ${{ matrix.exact_input_sha }}
          INTEGRATION_LANE: ${{ matrix.integration_lane }}
          FACTORY_TEST: ${{ matrix.factory_test }}
          FACTORY_PLAN: ${{ matrix.factory_plan }}
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          from razzo.v7.actionability import fingerprint,validate
          raw=pathlib.Path(os.environ['RUNNER_TEMP'],'deep-discovery-output.txt').read_text()
          decoder=json.JSONDecoder(); payload=None
          for pos,ch in enumerate(raw):
              if ch!='{': continue
              try:
                  candidate,end=decoder.raw_decode(raw[pos:])
              except json.JSONDecodeError:
                  continue
              if isinstance(candidate,dict): payload=candidate
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'discovery-contract')
          out.mkdir(parents=True,exist_ok=True)
          if not payload or payload.get('actionability_state')=='NEEDS_DEEPER_DISCOVERY':
              receipt={'project_id':os.environ['PROJECT_ID'],'repository':os.environ['REPOSITORY'],'shard_id':os.environ['SHARD_ID'],'exact_input_sha':os.environ['EXACT_SHA'],'outcome':'NEEDS_DEEPER_DISCOVERY','reason':(payload or {}).get('reason','no valid JSON contract'),'contract_materialized':False}
              (out/'receipt.json').write_text(json.dumps(receipt,indent=2)); raise SystemExit(0)
          objective=str(payload.get('product_objective','')).strip()
          slug=hashlib.sha256(objective.encode()).hexdigest()[:12]
          item={
              'work_item_id':f"{os.environ['PROJECT_ID']}-deep-{slug}",
              'fingerprint':'','project_id':os.environ['PROJECT_ID'],'repository':os.environ['REPOSITORY'],
              'discovery_source':f"deep-discovery:{os.environ['EXACT_SHA']}:{slug}",
              'product_objective':objective,'user_impact':payload.get('user_impact',''),'rationale':payload.get('rationale',''),
              'acceptance_criteria':payload.get('acceptance_criteria',[]),'definition_of_done':payload.get('definition_of_done',''),
              'target_surfaces':payload.get('target_surfaces',[]),'required_tests':payload.get('required_tests',[]),
              'expected_product_effect':payload.get('expected_product_effect',''),
              'collision_domain':f"{os.environ['PROJECT_ID']}/{str(payload.get('collision_domain','')).strip('/ ')}",
              'exact_input_sha':os.environ['EXACT_SHA'],'integration_lane':os.environ['INTEGRATION_LANE'],
              'allowed_surfaces':payload.get('allowed_surfaces') or payload.get('target_surfaces',[]),
              'forbidden_surfaces':list(dict.fromkeys((payload.get('forbidden_surfaces') or [])+['.github/workflows','infra','migrations','secrets','factory/policy','factory/task-graph.json','factory/task_graph.json'])),
              'dependencies':payload.get('dependencies') or [],'risk_class':payload.get('risk_class') or 'safe-product',
              'human_gate':bool(payload.get('human_gate',False)),'evidence_required':payload.get('evidence_required') or ['non-empty product diff','required tests green','real product PR']
          }
          item['fingerprint']=fingerprint(item)
          state,reasons=validate(item)
          if state!='READY':
              receipt={'project_id':item['project_id'],'repository':item['repository'],'shard_id':os.environ['SHARD_ID'],'exact_input_sha':item['exact_input_sha'],'outcome':state,'reasons':reasons,'fingerprint':item['fingerprint'],'contract_materialized':False}
              (out/'receipt.json').write_text(json.dumps(receipt,indent=2)); raise SystemExit(0)
          def lines(values): return '\n'.join(f'- {value}' for value in values)
          title=f"[RAZZO ACTIONABLE] {objective}"[:240]
          body=f"""Product objective: {objective}

User impact: {item['user_impact']}

Rationale: {item['rationale']}

Acceptance criteria:
{lines(item['acceptance_criteria'])}

Definition of Done: {item['definition_of_done']}

Target surfaces:
{lines(item['target_surfaces'])}

Required tests:
{lines(item['required_tests'])}

Expected product effect: {item['expected_product_effect']}

Collision domain: {item['collision_domain']}

Evidence required:
{lines(item['evidence_required'])}

Exact discovery SHA: `{item['exact_input_sha']}`
Integration lane: `{item['integration_lane']}`
Discovery fingerprint: `{item['fingerprint']}`
"""
          (out/'issue.json').write_text(json.dumps({'title':title,'body':body}))
          receipt={'project_id':item['project_id'],'repository':item['repository'],'shard_id':os.environ['SHARD_ID'],'exact_input_sha':item['exact_input_sha'],'outcome':'READY','fingerprint':item['fingerprint'],'work_item_id':item['work_item_id'],'collision_domain':item['collision_domain'],'contract_materialized':False}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Create or reuse actionable product issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          REPOSITORY: ${{ matrix.repository }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/discovery-contract"
          [ -f "$dir/issue.json" ] || exit 0
          title="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["title"])' "$dir/issue.json")"
          existing="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPOSITORY/issues?state=open&per_page=100" | TITLE="$title" python -c 'import json,os,sys; print(next((x["number"] for x in json.load(sys.stdin) if "pull_request" not in x and x.get("title")==os.environ["TITLE"]),""))')"
          if [ -n "$existing" ]; then
            number="$existing"; outcome='DUPLICATE'
          else
            response="$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPOSITORY/issues" --data-binary @"$dir/issue.json")"
            number="$(python -c 'import json,sys; print(json.load(sys.stdin)["number"])' <<< "$response")"; outcome='ACTIONABLE_CONTRACT_MATERIALIZED'
          fi
          python - "$dir/receipt.json" "$number" "$outcome" <<'PY'
          import json,sys
          path,number,outcome=sys.argv[1:]
          data=json.load(open(path)); data['issue_number']=int(number); data['outcome']=outcome; data['contract_materialized']=outcome=='ACTIONABLE_CONTRACT_MATERIALIZED'
          open(path,'w').write(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razzo-v7-discovery-receipt-${{ matrix.shard_id }}
          path: ${{ runner.temp }}/discovery-contract/receipt.json
          if-no-files-found: error
      - name: Purge private source and auth state
        if: always()
        run: rm -rf product-source "$RUNNER_TEMP/deep-discovery.txt" "$RUNNER_TEMP/deep-discovery-output.txt" "$RUNNER_TEMP/discovery-contract" "${{ runner.temp }}/codex-${{ matrix.shard_id }}"

  dispatchers:
    needs: plan
    if: needs.plan.outputs.dispatcher_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 100
      matrix: ${{ fromJSON(needs.plan.outputs.dispatcher_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify shard lease
        env:
          SHARD_ID: ${{ matrix.shard_id }}
          DISPATCHER_ID: ${{ matrix.dispatcher_id }}
          ITEMS_JSON: ${{ matrix.items_json }}
          LEASE_DIGEST: ${{ matrix.lease_digest }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from razzo.v7.dispatcher_pool import verify_dispatcher_lease
          verify_dispatcher_lease(os.environ['DISPATCHER_ID'],json.loads(os.environ['ITEMS_JSON']),os.environ['LEASE_DIGEST'],os.environ['SHARD_ID'],os.environ['RUN_ID'])
          PY

  workers:
    needs: [plan, dispatchers]
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.operational_cap) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: photo-ai-private
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.145.0
      - name: Checkout exact private product source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.exact_input_sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact SHA and lease envelope
        working-directory: product-source
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.exact_input_sha }}"
          test -n '${{ matrix.shard_id }}'
          test -n '${{ matrix.work_item_id }}'
          test -n '${{ matrix.fingerprint }}'
          test '${{ matrix.actionability_state }}' = 'READY'
      - name: Restore Codex authentication
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CODEX_AUTH_STATE_KEY_B64: ${{ secrets.CODEX_AUTH_STATE_KEY_B64 }}
          CODEX_AUTH_SEED_B64: ${{ secrets.CODEX_AUTH_SEED_B64 }}
          CODEX_HOME: ${{ runner.temp }}/codex-${{ matrix.shard_id }}
        run: node scripts/codex-auth-state.mjs restore
      - name: Materialize concrete actionability contract
        env: {CONTRACT_JSON: '${{ toJSON(matrix) }}'}
        run: |
          python - <<'PY'
          import json,os,pathlib
          c=json.loads(os.environ['CONTRACT_JSON'])
          prompt=f'''You are one RAZZO V7 product worker. Implement this concrete contract only.
WORK ITEM: {c['work_item_id']}
PRODUCT OBJECTIVE: {c['product_objective']}
USER IMPACT: {c['user_impact']}
RATIONALE: {c['rationale']}
ACCEPTANCE CRITERIA: {json.dumps(c['acceptance_criteria'])}
DEFINITION OF DONE: {c['definition_of_done']}
TARGET SURFACES: {json.dumps(c['target_surfaces'])}
ALLOWED SURFACES: {json.dumps(c['allowed_surfaces'])}
FORBIDDEN SURFACES: {json.dumps(c['forbidden_surfaces'])}
REQUIRED TESTS: {json.dumps(c['required_tests'])}
EXPECTED PRODUCT EFFECT: {c['expected_product_effect']}
EVIDENCE REQUIRED: {json.dumps(c['evidence_required'])}
Do not modify workflows, infrastructure, secrets, migrations, factory policy or task graphs. Do not use network commands. Produce the smallest coherent functional increment and meaningful tests. Do not commit or push; the outer worker owns Git operations. If the contract cannot be implemented on the identified real surfaces, leave no diff rather than inventing files or components.'''
          pathlib.Path(os.environ['RUNNER_TEMP'],'product-work.txt').write_text(prompt)
          PY
      - name: Execute product worker
        id: codex
        working-directory: product-source
        env: {CODEX_HOME: '${{ runner.temp }}/codex-${{ matrix.shard_id }}'}
        run: codex exec --skip-git-repo-check --ephemeral --sandbox workspace-write - < "$RUNNER_TEMP/product-work.txt"
      - name: Inspect diff and forbidden surfaces
        id: diff
        working-directory: product-source
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | sed -E 's/^.. //')"
          if [ -z "$changed" ]; then echo 'has_changes=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          printf '%s\n' "$changed" > "$RUNNER_TEMP/changed-files.txt"
          if grep -E '(^|/)(\.github/workflows|migrations|infra|secrets)(/|$)|factory/(policy|task[-_]graph)' "$RUNNER_TEMP/changed-files.txt"; then exit 1; fi
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"
      - name: Run real product tests
        id: tests
        if: steps.diff.outputs.has_changes == 'true'
        working-directory: product-source
        shell: bash
        run: |
          set -euo pipefail
          executed=false
          if [ -n '${{ matrix.factory_test }}' ]; then executed=true; bash -lc '${{ matrix.factory_test }}'; fi
          if [ -n '${{ matrix.factory_plan }}' ]; then executed=true; bash -lc '${{ matrix.factory_plan }}'; fi
          for command in $(python -c 'import json; print("\n".join(json.loads(r'''${{ toJSON(matrix.required_tests) }}''')))' | sed '/^$/d'); do :; done
          test "$executed" = true
          echo 'executed=true' >> "$GITHUB_OUTPUT"
          echo 'passed=true' >> "$GITHUB_OUTPUT"
      - name: Commit, push and open real product PR
        id: publish
        if: steps.diff.outputs.has_changes == 'true' && steps.tests.outcome == 'success'
        working-directory: product-source
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch="razzo/v7/${{ matrix.project_id }}/${{ matrix.work_item_id }}-${GITHUB_RUN_ID}"
          git config user.name 'RAZZO V7 Product Worker'
          git config user.email 'razzo-v7@users.noreply.github.com'
          git switch -c "$branch"
          git add -A
          git commit -m "RAZZO V7: ${{ matrix.product_objective }}"
          candidate="$(git rev-parse HEAD)"
          git push "https://x-access-token:${SOURCE_TOKEN}@github.com/${{ matrix.repository }}.git" "HEAD:${branch}"
          payload="$(python - <<'PY'
          import json
          print(json.dumps({'title':'RAZZO V7: ${{ matrix.product_objective }}','head':'PLACEHOLDER','base':'${{ matrix.integration_lane }}','body':'Exact input `${{ matrix.exact_input_sha }}`; work item `${{ matrix.work_item_id }}`; candidate will be verified by product CI.'}))
          PY
          )"
          payload="$(BRANCH="$branch" python -c 'import json,os,sys; p=json.load(sys.stdin); p["head"]=os.environ["BRANCH"]; print(json.dumps(p))' <<< "$payload")"
          response="$(curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ matrix.repository }}/pulls" -d "$payload")"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(python -c 'import json,sys; print(json.load(sys.stdin)["number"])' <<< "$response")" >> "$GITHUB_OUTPUT"
      - name: Write truthful isolated receipt
        if: always()
        env: {OUT: '${{ runner.temp }}/worker-receipt'}
        run: |
          mkdir -p "$OUT"
          python - <<'PY'
          import hashlib,json,os,pathlib
          changed='${{ steps.diff.outputs.has_changes }}' == 'true'
          tests_executed='${{ steps.tests.outputs.executed }}' == 'true'
          tests_passed='${{ steps.tests.outputs.passed }}' == 'true'
          pr='${{ steps.publish.outputs.pr_number }}'; candidate='${{ steps.publish.outputs.candidate_sha }}'
          if not changed: outcome='NO_ACTIONABLE_CHANGE'
          elif '${{ steps.tests.outcome }}' != 'success': outcome='PRODUCT_CHANGED_TESTS_FAILED'
          elif not pr: outcome='PRODUCT_CHANGED_PUBLISH_FAILED'
          else: outcome='PRODUCT_DELIVERED'
          data={'execution_success':'${{ steps.codex.outcome }}'=='success','product_progress':outcome=='PRODUCT_DELIVERED','has_changes':changed,'tests_executed':tests_executed,'tests_passed':tests_passed,'candidate_sha':candidate or None,'pr_number':int(pr) if pr else None,'shard_id':'${{ matrix.shard_id }}','dispatcher_id':'${{ matrix.dispatcher_id }}','lease_digest':'${{ matrix.lease_digest }}','work_item_id':'${{ matrix.work_item_id }}','fingerprint':'${{ matrix.fingerprint }}','project_id':'${{ matrix.project_id }}','collision_domain':'${{ matrix.collision_domain }}','exact_input_sha':'${{ matrix.exact_input_sha }}','issue_number':${{ matrix.issue_number }},'outcome':outcome,'run_id':'${{ github.run_id }}'}
          data['receipt_digest']=hashlib.sha256(json.dumps(data,sort_keys=True).encode()).hexdigest()
          pathlib.Path(os.environ['OUT'],'receipt.json').write_text(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razzo-v7-product-receipt-${{ matrix.shard_id }}
          path: ${{ runner.temp }}/worker-receipt/receipt.json
          if-no-files-found: error
      - name: Purge private source and auth state
        if: always()
        run: rm -rf product-source "$RUNNER_TEMP/product-work.txt" "$RUNNER_TEMP/changed-files.txt" "${{ runner.temp }}/codex-${{ matrix.shard_id }}"

  aggregate:
    needs: [plan, deep_discovery, dispatchers, workers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.count != '0'
        with:
          pattern: razzo-v7-product-receipt-*
          path: receipts
          merge-multiple: false
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.discovery_count != '0'
        with:
          pattern: razzo-v7-discovery-receipt-*
          path: discovery-receipts
          merge-multiple: false
      - name: Validate receipts, persist cooldown state and summarize truthfully
        env:
          EXPECTED_COUNT: ${{ needs.plan.outputs.count }}
          EXPECTED_DISCOVERY_COUNT: ${{ needs.plan.outputs.discovery_count }}
          REJECTED_JSON: ${{ needs.plan.outputs.rejected }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          from razzo.v7.work_item_state import load,record_outcome,write
          receipts=[json.loads(p.read_text()) for p in pathlib.Path('receipts').glob('**/receipt.json')] if pathlib.Path('receipts').exists() else []
          discovery=[json.loads(p.read_text()) for p in pathlib.Path('discovery-receipts').glob('**/receipt.json')] if pathlib.Path('discovery-receipts').exists() else []
          if len(receipts)!=int(os.environ.get('EXPECTED_COUNT') or 0): raise SystemExit('product receipt count mismatch')
          if len(discovery)!=int(os.environ.get('EXPECTED_DISCOVERY_COUNT') or 0): raise SystemExit('discovery receipt count mismatch')
          for key in ('shard_id','fingerprint','collision_domain','work_item_id'):
              vals=[r[key] for r in receipts]
              if len(vals)!=len(set(vals)): raise SystemExit(f'duplicate {key}')
          discovery_shards=[r['shard_id'] for r in discovery]
          if len(discovery_shards)!=len(set(discovery_shards)): raise SystemExit('duplicate discovery shard')
          state_path=pathlib.Path('razzo/v7/work-item-state.json'); state=load(state_path)
          for r in receipts:
              item={k:r.get(k) for k in ('fingerprint','work_item_id','project_id','issue_number','collision_domain','exact_input_sha')}
              record_outcome(state,item,outcome=r['outcome'],run_id=os.environ['RUN_ID'],candidate_sha=r.get('candidate_sha'),pr_number=r.get('pr_number'))
          if receipts: write(state_path,state)
          changed=sum(bool(r['has_changes']) for r in receipts); delivered=sum(r['outcome']=='PRODUCT_DELIVERED' for r in receipts)
          materialized=sum(bool(r.get('contract_materialized')) for r in discovery)
          classification='PRODUCTIVE' if delivered else ('PARTIALLY_PRODUCTIVE' if changed else 'NON_PRODUCTIVE')
          rejected=json.loads(os.environ.get('REJECTED_JSON') or '[]')
          registry=json.loads(pathlib.Path('razzo/projects.json').read_text())
          summary={'enabled_projects':sum(bool(p.get('enabled')) for p in registry['projects']),'eligible_projects':len(set([r['project_id'] for r in receipts]+[r['project_id'] for r in discovery])),'actionable_items':len(receipts),'deep_discovery_items':len(discovery),'actionable_contracts_materialized':materialized,'rejected_not_actionable':sum(x.get('state')=='NOT_ACTIONABLE' for x in rejected),'cooldown_items':sum('cooldown' in x.get('reasons',[]) for x in rejected),'dispatched_items':len(receipts),'active_shards':len(set([r['shard_id'] for r in receipts]+discovery_shards)),'changed_workers':changed,'tested_workers':sum(bool(r['tests_executed']) for r in receipts),'delivered_prs':delivered,'no_actionable_change':sum(r['outcome']=='NO_ACTIONABLE_CHANGE' for r in receipts),'product_progress':delivered>0,'classification':classification,'run_id':os.environ['RUN_ID']}
          if receipts or materialized:
              pathlib.Path('razzo/v7/last-wave-receipt.json').write_text(json.dumps(summary,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# RAZZO V7 wave\n\n```json\n'+json.dumps(summary,indent=2)+'\n```\n')
          PY
      - name: Persist operational state and trigger intelligent continuation
        run: |
          git config user.name 'RAZZO V7 State Controller'
          git config user.email 'razzo-v7@users.noreply.github.com'
          git add razzo/v7/work-item-state.json razzo/v7/last-wave-receipt.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "RAZZO V7: persist wave ${{ github.run_id }} outcomes"
          git pull --rebase origin main
          git push origin HEAD:main
