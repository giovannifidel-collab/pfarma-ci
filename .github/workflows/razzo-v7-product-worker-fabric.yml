name: RAZZO V7 Safe Product Factory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan only or execute real product workers"
        required: true
        type: choice
        options:
          - plan-only
          - execute
        default: plan-only
      max_workers:
        description: "Maximum parallel product workers (1-3 during recovery)"
        required: true
        type: string
        default: "3"

permissions:
  contents: read
  actions: read

concurrency:
  group: razzo-v7-safe-factory
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      dispatcher_matrix: ${{ steps.plan.outputs.dispatcher_matrix }}
      count: ${{ steps.plan.outputs.count }}
      rejected: ${{ steps.plan.outputs.rejected }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact control-plane SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run safe-factory contract tests
        run: |
          python -m unittest razzo.v7.test_product_discovery -v
          python -m unittest razzo.v7.test_dispatcher_pool -v
      - id: plan
        name: Discover explicit actionable contracts and allocate shards
        env:
          PFARMA_SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          REQUESTED_WORKERS: ${{ inputs.max_workers }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          max_workers="$(python - <<'PY'
          import os
          try:
              value = int(os.environ['REQUESTED_WORKERS'])
          except ValueError as exc:
              raise SystemExit('max_workers must be an integer') from exc
          print(max(1, min(value, 3)))
          PY
          )"
          export RAZZO_MAX_WORKERS="$max_workers"
          raw="$(python razzo/v7/product_discovery.py)"
          export RAW="$raw" RUN_ID
          dispatch="$(python - <<'PY'
          import json, os
          from razzo.v7.dispatcher_pool import annotate_work_items

          payload = json.loads(os.environ['RAW'])
          workers, leases = annotate_work_items(
              list(payload.get('include', [])),
              provider_cap=int(os.environ['RAZZO_MAX_WORKERS']),
              run_id=os.environ['RUN_ID'],
          )
          print(json.dumps({
              'workers': {'include': workers},
              'dispatchers': {'include': [lease.to_matrix_entry() for lease in leases]},
              'rejected': payload.get('rejected', []),
          }, separators=(',', ':')))
          PY
          )"
          matrix="$(python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["workers"],separators=(",",":")))' <<< "$dispatch")"
          dispatchers="$(python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["dispatchers"],separators=(",",":")))' <<< "$dispatch")"
          rejected="$(python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["rejected"],separators=(",",":")))' <<< "$dispatch")"
          count="$(python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "dispatcher_matrix=$dispatchers" >> "$GITHUB_OUTPUT"
          echo "rejected=$rejected" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/razzo-plan"
          printf '%s\n' "$dispatch" > "$RUNNER_TEMP/razzo-plan/plan.json"
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-v7-safe-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/razzo-plan/plan.json
          if-no-files-found: error

  dispatchers:
    needs: plan
    if: ${{ inputs.mode == 'execute' && needs.plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.dispatcher_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify signed shard lease
        env:
          SHARD_ID: ${{ matrix.shard_id }}
          DISPATCHER_ID: ${{ matrix.dispatcher_id }}
          ITEMS_JSON: ${{ matrix.items_json }}
          LEASE_DIGEST: ${{ matrix.lease_digest }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from razzo.v7.dispatcher_pool import verify_dispatcher_lease

          verify_dispatcher_lease(
              os.environ['DISPATCHER_ID'],
              json.loads(os.environ['ITEMS_JSON']),
              os.environ['LEASE_DIGEST'],
              os.environ['SHARD_ID'],
              os.environ['RUN_ID'],
          )
          PY

  workers:
    needs: [plan, dispatchers]
    if: ${{ inputs.mode == 'execute' && needs.plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: photo-ai-private
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.145.0
      - name: Checkout exact private product source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.exact_input_sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact SHA and actionability envelope
        working-directory: product-source
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.exact_input_sha }}"
          test '${{ matrix.actionability_state }}' = 'READY'
          test -n '${{ matrix.shard_id }}'
          test -n '${{ matrix.lease_digest }}'
      - name: Restore Codex authentication
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CODEX_AUTH_STATE_KEY_B64: ${{ secrets.CODEX_AUTH_STATE_KEY_B64 }}
          CODEX_AUTH_SEED_B64: ${{ secrets.CODEX_AUTH_SEED_B64 }}
          CODEX_HOME: ${{ runner.temp }}/codex-${{ matrix.shard_id }}
        run: node scripts/codex-auth-state.mjs restore
      - name: Materialize bounded product contract
        env:
          CONTRACT_JSON: ${{ toJSON(matrix) }}
        run: |
          python - <<'PY'
          import json, os, pathlib

          contract = json.loads(os.environ['CONTRACT_JSON'])
          prompt = f'''You are a RAZZO V7 product worker operating on one explicit, validated contract.
Implement only this work item and only on the listed allowed surfaces.

WORK ITEM: {contract['work_item_id']}
ISSUE: #{contract['issue_number']}
PRODUCT OBJECTIVE: {contract['product_objective']}
USER IMPACT: {contract['user_impact']}
RATIONALE: {contract['rationale']}
ACCEPTANCE CRITERIA: {json.dumps(contract['acceptance_criteria'])}
DEFINITION OF DONE: {contract['definition_of_done']}
TARGET SURFACES: {json.dumps(contract['target_surfaces'])}
ALLOWED SURFACES: {json.dumps(contract['allowed_surfaces'])}
FORBIDDEN SURFACES: {json.dumps(contract['forbidden_surfaces'])}
EXPECTED PRODUCT EFFECT: {contract['expected_product_effect']}
EVIDENCE REQUIRED: {json.dumps(contract['evidence_required'])}

Do not modify workflows, infrastructure, migrations, secrets, factory policy, task graphs or files outside allowed surfaces. Do not use network commands. Do not commit or push. Add or update meaningful tests inside allowed surfaces when appropriate. If the contract cannot be implemented on the existing identified surfaces, leave the tree unchanged rather than inventing files or components.'''
          pathlib.Path(os.environ['RUNNER_TEMP'], 'product-work.txt').write_text(prompt)
          PY
      - name: Execute product worker
        id: codex
        working-directory: product-source
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-${{ matrix.shard_id }}
        run: codex exec --skip-git-repo-check --ephemeral --sandbox workspace-write - < "$RUNNER_TEMP/product-work.txt"
      - name: Enforce changed-file boundaries
        id: diff
        working-directory: product-source
        env:
          ALLOWED_JSON: ${{ toJSON(matrix.allowed_surfaces) }}
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain | sed -E 's/^.. //' > "$RUNNER_TEMP/changed-files.txt"
          if [ ! -s "$RUNNER_TEMP/changed-files.txt" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import fnmatch, json, os, pathlib

          changed = [line.strip() for line in pathlib.Path(os.environ['RUNNER_TEMP'], 'changed-files.txt').read_text().splitlines() if line.strip()]
          allowed = [str(value).strip().rstrip('/') for value in json.loads(os.environ['ALLOWED_JSON'])]
          forbidden = ('.github/workflows/', 'infra/', 'migrations/', 'secrets/', 'factory/policy', 'factory/task-graph', 'factory/task_graph')

          def matches(path: str, rule: str) -> bool:
              if any(token in rule for token in '*?['):
                  return fnmatch.fnmatch(path, rule)
              return path == rule or path.startswith(rule + '/')

          for path in changed:
              if path.startswith(forbidden):
                  raise SystemExit(f'forbidden changed path: {path}')
              if not any(matches(path, rule) for rule in allowed):
                  raise SystemExit(f'changed path outside contract: {path}')
          PY
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
      - name: Run registry-controlled product tests
        id: tests
        if: steps.diff.outputs.has_changes == 'true'
        working-directory: product-source
        env:
          FACTORY_TEST: ${{ matrix.factory_test }}
          FACTORY_PLAN: ${{ matrix.factory_plan }}
        shell: bash
        run: |
          set -euo pipefail
          executed=false
          if [ -n "$FACTORY_TEST" ]; then
            executed=true
            bash -lc "$FACTORY_TEST"
          fi
          if [ -n "$FACTORY_PLAN" ]; then
            executed=true
            bash -lc "$FACTORY_PLAN"
          fi
          test "$executed" = true
          echo "executed=true" >> "$GITHUB_OUTPUT"
          echo "passed=true" >> "$GITHUB_OUTPUT"
      - name: Verify expected integration head
        id: base
        if: steps.diff.outputs.has_changes == 'true' && steps.tests.outcome == 'success'
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        working-directory: product-source
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote "https://x-access-token:${SOURCE_TOKEN}@github.com/${{ matrix.repository }}.git" "refs/heads/${{ matrix.integration_lane }}" | awk '{print $1}')"
          if [ "$remote_head" = '${{ matrix.exact_input_sha }}' ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit, push and open product PR
        id: publish
        if: steps.base.outputs.fresh == 'true'
        working-directory: product-source
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          short_fp="$(printf '%s' '${{ matrix.fingerprint }}' | cut -c1-12)"
          branch="razzo/v7/${{ matrix.project_id }}/${short_fp}-${GITHUB_RUN_ID}"
          git config user.name "RAZZO V7 Safe Product Worker"
          git config user.email "razzo-v7@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "RAZZO V7: ${{ matrix.product_objective }}"
          candidate_sha="$(git rev-parse HEAD)"
          git push "https://x-access-token:${SOURCE_TOKEN}@github.com/${{ matrix.repository }}.git" "HEAD:${branch}"
          export BRANCH="$branch"
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              'title': 'RAZZO V7: ${{ matrix.product_objective }}',
              'head': os.environ['BRANCH'],
              'base': '${{ matrix.integration_lane }}',
              'body': 'Implements #${{ matrix.issue_number }} from exact input `${{ matrix.exact_input_sha }}`. Shard `${{ matrix.shard_id }}`; work item `${{ matrix.work_item_id }}`. Registry-controlled product tests passed before publication.',
          }))
          PY
          )"
          response="$(curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ matrix.repository }}/pulls" -d "$payload")"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(python -c 'import json,sys; print(json.load(sys.stdin)["number"])' <<< "$response")" >> "$GITHUB_OUTPUT"
      - name: Write truthful worker receipt
        if: always()
        env:
          OUT: ${{ runner.temp }}/worker-receipt
        run: |
          mkdir -p "$OUT"
          python - <<'PY'
          import hashlib, json, os, pathlib

          changed = '${{ steps.diff.outputs.has_changes }}' == 'true'
          tests_executed = '${{ steps.tests.outputs.executed }}' == 'true'
          tests_passed = '${{ steps.tests.outputs.passed }}' == 'true'
          fresh = '${{ steps.base.outputs.fresh }}'
          pr_number = '${{ steps.publish.outputs.pr_number }}'
          candidate_sha = '${{ steps.publish.outputs.candidate_sha }}'

          if not changed:
              outcome = 'NO_ACTIONABLE_CHANGE'
          elif '${{ steps.tests.outcome }}' != 'success':
              outcome = 'PRODUCT_CHANGED_TESTS_FAILED'
          elif fresh != 'true':
              outcome = 'STALE_BASE'
          elif not pr_number:
              outcome = 'PRODUCT_CHANGED_PUBLISH_FAILED'
          else:
              outcome = 'PRODUCT_DELIVERED'

          receipt = {
              'run_id': '${{ github.run_id }}',
              'execution_success': '${{ steps.codex.outcome }}' == 'success',
              'product_progress': outcome == 'PRODUCT_DELIVERED',
              'outcome': outcome,
              'project_id': '${{ matrix.project_id }}',
              'repository': '${{ matrix.repository }}',
              'issue_number': ${{ matrix.issue_number }},
              'work_item_id': '${{ matrix.work_item_id }}',
              'fingerprint': '${{ matrix.fingerprint }}',
              'collision_domain': '${{ matrix.collision_domain }}',
              'shard_id': '${{ matrix.shard_id }}',
              'dispatcher_id': '${{ matrix.dispatcher_id }}',
              'lease_digest': '${{ matrix.lease_digest }}',
              'exact_input_sha': '${{ matrix.exact_input_sha }}',
              'has_changes': changed,
              'tests_executed': tests_executed,
              'tests_passed': tests_passed,
              'candidate_sha': candidate_sha or None,
              'pr_number': int(pr_number) if pr_number else None,
          }
          receipt['receipt_digest'] = hashlib.sha256(json.dumps(receipt, sort_keys=True).encode()).hexdigest()
          pathlib.Path(os.environ['OUT'], 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razzo-v7-safe-receipt-${{ matrix.shard_id }}
          path: ${{ runner.temp }}/worker-receipt/receipt.json
          if-no-files-found: error
      - name: Purge private checkout and authentication state
        if: always()
        run: rm -rf product-source "$RUNNER_TEMP/product-work.txt" "$RUNNER_TEMP/changed-files.txt" "${{ runner.temp }}/codex-${{ matrix.shard_id }}"

  aggregate:
    needs: [plan, dispatchers, workers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ inputs.mode == 'execute' && needs.plan.outputs.count != '0' }}
        with:
          pattern: razzo-v7-safe-receipt-*
          path: receipts
          merge-multiple: false
      - name: Validate receipts and write non-recursive summary
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_COUNT: ${{ needs.plan.outputs.count }}
          REJECTED_JSON: ${{ needs.plan.outputs.rejected }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, pathlib

          expected = int(os.environ.get('EXPECTED_COUNT') or 0)
          receipts = [json.loads(path.read_text()) for path in pathlib.Path('receipts').glob('**/receipt.json')] if pathlib.Path('receipts').exists() else []
          if os.environ['MODE'] == 'execute' and len(receipts) != expected:
              raise SystemExit(f'receipt count mismatch: expected {expected}, got {len(receipts)}')
          for key in ('shard_id', 'work_item_id', 'fingerprint', 'collision_domain'):
              values = [receipt[key] for receipt in receipts]
              if len(values) != len(set(values)):
                  raise SystemExit(f'duplicate {key}')

          changed = sum(bool(receipt['has_changes']) for receipt in receipts)
          delivered = sum(receipt['outcome'] == 'PRODUCT_DELIVERED' for receipt in receipts)
          classification = 'PLAN_ONLY'
          if os.environ['MODE'] == 'execute':
              classification = 'PRODUCTIVE' if delivered else ('PARTIALLY_PRODUCTIVE' if changed else 'NON_PRODUCTIVE')
          rejected = json.loads(os.environ.get('REJECTED_JSON') or '[]')
          summary = {
              'run_id': os.environ['RUN_ID'],
              'mode': os.environ['MODE'],
              'planned_items': expected,
              'active_shards': sorted({receipt['shard_id'] for receipt in receipts}),
              'changed_workers': changed,
              'tested_workers': sum(bool(receipt['tests_executed']) for receipt in receipts),
              'delivered_prs': delivered,
              'no_actionable_change': sum(receipt['outcome'] == 'NO_ACTIONABLE_CHANGE' for receipt in receipts),
              'stale_base': sum(receipt['outcome'] == 'STALE_BASE' for receipt in receipts),
              'rejected_candidates': len(rejected),
              'product_progress': delivered > 0,
              'classification': classification,
          }
          out = pathlib.Path(os.environ['RUNNER_TEMP'], 'razzo-summary')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write('# RAZZO V7 Safe Factory\n\n```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-v7-safe-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/razzo-summary/summary.json
          if-no-files-found: error
