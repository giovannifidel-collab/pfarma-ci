name: Preparatore PLUS · Public Production E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preparatore-public-production-e2e.yml'

permissions:
  contents: read

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: photo-ai-private
    steps:
      - name: Resolve private source token
        env:
          GIO_TOKEN: ${{ secrets.PROJECT_GIOVANNI_SOURCE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          token="${GIO_TOKEN:-${FALLBACK_TOKEN:-}}"
          test -n "$token"
          echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Checkout production E2E source
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: main
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated JPEG fixture encoder
        run: npm install --no-save --no-audit --no-fund jpeg-js@0.4.4

      - name: Simulate production photo upload and wait for public worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_BASE_URL: https://project-giovanni.vercel.app
        run: node scripts/preparatore-production-e2e-smoke-runner.mjs
