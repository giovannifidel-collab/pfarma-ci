name: Delete Wedding Temp Maintenance Worker 20260909

on:
  push:
    branches:
      - wedding-external-stress-20260909
    paths:
      - '.github/workflows/wedding-maintenance-tempworker-delete-20260909.yml'

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pfarma-ci-trusted
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: 6f6de52331e398c395d3de97c83011cd
      NAME: rr-wedding-maint-20260909-probe
    steps:
      - name: Delete temporary worker directly
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          code="$(curl -sS -o /tmp/del.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/services/$NAME")"
          echo "DELETE_HTTP=$code"
          cat /tmp/del.json | jq '{success,errors}'
          [[ "$code" == 200 || "$code" == 404 ]]
