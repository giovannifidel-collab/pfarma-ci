name: Queen Verified Execution Bridge Installer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/queen-execution-bridge-install.yml

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      WORKSPACE_TARGET: ${{ github.workspace }}/public-target
    steps:
      - name: Check out installer payload
        uses: actions/checkout@v4
        with:
          ref: main
          path: bootstrap
          fetch-depth: 1
          persist-credentials: false

      - name: Check out public execution branch
        uses: actions/checkout@v4
        with:
          ref: queen-universal-fabric-vnext
          path: public-target
          fetch-depth: 1
          persist-credentials: false

      - name: Install and prove Queen execution bridge
        shell: bash
        run: bash bootstrap/ops/queen-execution-bridge-install.sh
