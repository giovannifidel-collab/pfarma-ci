name: Queen S7 Owner-Approved CPU02-05 Exact Installer Once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/queen-s7-live-cpu02-05-once.yml']
permissions: {contents: read}
concurrency:
  group: queen-s7-owner-cpu02-05-once
  cancel-in-progress: false
jobs:
  owner-approved-install:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      PRIVATE_SHA: c7aca674b5cdb22fdeff88c42a018bb7bec3666c
      CPU00_SHA: 95d898d3e229eee22959726d5abd918ac1c5688b
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: queen-source
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-compute-node-00
          ref: ${{ env.CPU00_SHA }}
          persist-credentials: false
          path: cpu00-source
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Source-lock and deny-by-default installer tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C queen-source rev-parse HEAD)" = "$PRIVATE_SHA"
          test "$(git -C cpu00-source rev-parse HEAD)" = "$CPU00_SHA"
          node --test queen-source/ops/queen/compute/s7/tests/*.test.mjs
          mkdir -p "$RUNNER_TEMP/s7-source-locked"
          node queen-source/ops/queen/compute/s7/build-cpu-installers.mjs cpu00-source "$RUNNER_TEMP/s7-source-locked"
      - name: Install each remaining account independently, require provider selftest
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          for idx in 02 03 04 05; do
            node="hive-compute-node-$idx"
            case "$idx" in
              02) repo="axis41990-art/hive-compute-node-02" ;;
              03) repo="pfarmaestetista-cell/hive-compute-node-03" ;;
              04) repo="pfarmagalenica-commits/hive-compute-node-04" ;;
              05) repo="pandolfopatrickantonio-lang/hive-compute-node-05" ;;
            esac
            node queen-source/ops/queen/compute/s7/install-authorized-cpu-node.mjs "$node" "$RUNNER_TEMP/s7-source-locked" --dry-run
            node queen-source/ops/queen/compute/s7/install-authorized-cpu-node.mjs "$node" "$RUNNER_TEMP/s7-source-locked"
            sha="$(gh api "repos/$repo/branches/main" --jq '.commit.sha')"
            test -n "$sha"
            matched=''
            for i in {1..60}; do
              matched="$(gh api "repos/$repo/actions/runs?event=push&per_page=20" \
                | jq -r --arg sha "$sha" '[.workflow_runs[]|select(.head_sha==$sha and .head_branch=="main")]|first|.id // empty')"
              test -n "$matched" && break
              sleep 3
            done
            test -n "$matched" || { echo "S7_$node"_PROVIDER_CANARY_MISSING; exit 64; }
            status=''
            for i in {1..100}; do
              status="$(gh api "repos/$repo/actions/runs/$matched" --jq '.status')"
              test "$status" = completed && break
              sleep 3
            done
            test "$status" = completed || { echo "S7_$node"_PROVIDER_CANARY_TIMEOUT; exit 65; }
            conclusion="$(gh api "repos/$repo/actions/runs/$matched" --jq '.conclusion')"
            test "$conclusion" = success || { echo "S7_$node"_PROVIDER_CANARY_FAILURE; exit 66; }
            echo "S7_$node"_SOURCE_INSTALLED_AND_PROVIDER_CANARY=PASS
          done
          echo 'S7_ALL_FIVE_CPU_WORKERS_INSTALLED_AND_CANARY_LIVE=PASS'
      - name: Temporary bundle cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/s7-source-locked" queen-source cpu00-source
