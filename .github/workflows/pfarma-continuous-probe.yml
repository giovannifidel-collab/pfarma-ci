name: PFarma RAZZO Continuous Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'pfarma-continuous-ref.txt'
      - '.github/workflows/pfarma-continuous-probe.yml'

permissions:
  contents: read

concurrency:
  group: pfarma-continuous-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  factory:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pfarma-ci-trusted
    steps:
      - name: Checkout public control repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve exact PFarma SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < pfarma-continuous-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require private-source token
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"
      - name: Checkout exact PFarma commit
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: test "$(git -C private-source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile factory
        working-directory: private-source
        run: python -m compileall -q factory
      - name: Executor tests
        working-directory: private-source
        run: python -m unittest factory.test_razzo_executor -v
      - name: Continuous-loop tests
        working-directory: private-source
        run: python -m unittest factory.test_continuous_loop -v
      - name: Factory planner smoke
        working-directory: private-source
        run: python -m factory.plan
