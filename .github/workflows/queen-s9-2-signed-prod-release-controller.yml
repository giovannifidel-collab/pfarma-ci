name: Queen S9.2 Owner-Signed Git-Connected One-Release Control With Rollback
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-2-signed-prod-release-controller.yml]
permissions: {contents: read}
concurrency:
  group: queen-s9-2-temporary-build-configuration
  cancel-in-progress: false
jobs:
  bound-source-prod-release:
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'S9-RELEASE-SIGNED-OWNER-MANUAL-MERGE:') }}
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 9
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      BASE_SHA: 296677c77946b91ca1c8f9da70d41d87b975c5e4
      CANDIDATE_SHA: d9d8d7c8de1ab59dbde628a3605844fe7676d71d
      OWNER_RUN: '43405119995'
    steps:
      - name: Load immutable release controller and revalidate owner and authoritative source
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/s9-2-controller.py" <<'PY'
          import os,json,re,time,subprocess,urllib.request,urllib.error,sys
          from datetime import datetime,timezone
          GH=os.environ['GH_TOKEN'];CF=os.environ['CF_TOKEN']
          BASE=os.environ['BASE_SHA'];CAND=os.environ['CANDIDATE_SHA']
          ROOT='https://api.cloudflare.com/client/v4'
          DEADLINE=datetime.fromisoformat('2026-11-13T10:10:27.849+00:00')
          ROLLBACK='1f5176b8-5538-42ff-ab5d-1738eaeebe39'
          COMPAT='QUEEN_S9_EPHEMERAL_BUILD=1 node ../ops/queen/s9/pages-legacy-import-adapter.mjs --apply-ephemeral'
          state_path=os.environ['RUNNER_TEMP']+'/s9-prod-state.json'
          def require(cond,msg):
              if not cond:raise RuntimeError(msg)
          def read_state():
              try:return json.load(open(state_path))
              except:return {}
          def write_state(obj):
              with open(state_path,'w') as f:json.dump(obj,f,indent=2)
          def request(domain,method,path,data=None):
              headers={'Authorization':'Bearer '+(GH if domain=='gh' else CF),'Accept':'application/json'}
              b=None
              if data is not None:b=json.dumps(data,separators=(',',':')).encode();headers['Content-Type']='application/json'
              url=('https://api.github.com/' if domain=='gh' else ROOT+'/')+path.lstrip('/')
              req=urllib.request.Request(url,headers=headers,data=b,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:return resp.status,json.load(resp)
              except urllib.error.HTTPError as e:
                  try:return e.code,json.load(e)
                  except:return e.code,{}
              except Exception:return 0,{}
          def gh(path):
              st,d=request('gh','GET',path)
              require(st==200,'GITHUB_SOURCE_OR_OWNER_UNAVAILABLE')
              return d
          def cf(method,path,data=None):
              st,d=request('cf',method,path,data)
              require(st in (200,201,202) and d.get('success') is True,'CLOUDFLARE_API_DENIED_'+method+'_'+str(st))
              return d['result']
          def cloudflare_path():
              accounts=cf('GET','accounts?per_page=50')
              hits=[]
              for a in accounts:
                  aid=a.get('id')
                  if not re.fullmatch('[a-f0-9]{32}',str(aid)):continue
                  st,d=request('cf','GET','accounts/'+aid+'/pages/projects/hive-alveare')
                  if st==200 and d.get('success') and (d.get('result') or {}).get('name')=='hive-alveare':hits.append((aid,d['result']))
              require(len(hits)==1,'CLOUDFLARE_HIVE_PROJECT_UNIQUE_DENY')
              return 'accounts/'+hits[0][0]+'/pages/projects/hive-alveare'
          def project(path):return cf('GET',path)
          def invariant(p,command):
              source=p.get('source') or {};sc=source.get('config') or {};build=p.get('build_config') or {};cfg=p.get('deployment_configs') or {}
              require(source.get('type')=='github' and sc.get('repo_name')=='hive-alveare' and sc.get('production_branch')=='main','SOURCE_IDENTITY_DENIED')
              require(build.get('root_dir')=='cloudflare' and build.get('destination_dir')=='public','BUILD_IDENTITY_DENIED')
              require(build.get('build_command')==command,'BUILD_COMMAND_DRIFT_DENIED')
              require('HIVE_DATA_API_URL' in ((cfg.get('production') or {}).get('env_vars') or {}),'PRODUCTION_NEON_MISSING')
              require('HIVE_DATA_API_URL' not in ((cfg.get('preview') or {}).get('env_vars') or {}),'PREVIEW_SHARED_DB_DENIED')
          def health():
              for ep in ['runtime-health','queen-state']:
                  with open(os.environ['RUNNER_TEMP']+'/s9-prod-health-'+ep+'.json','w') as f:
                      p=subprocess.run(['curl','-sS','--max-time','22','-o',f.name,'-w','%{http_code}',
                        '-H','Cf-Access-Client-Id: '+os.environ['CF_ACCESS_CLIENT_ID'],
                        '-H','Cf-Access-Client-Secret: '+os.environ['CF_ACCESS_CLIENT_SECRET'],
                        '-H','Accept: application/json','https://hive-alveare.pages.dev/api/'+ep],
                        capture_output=True,text=True,timeout=25)
                      require(p.returncode==0 and p.stdout.strip()=='200','PROTECTED_HEALTH_HTTP_NOT_200_'+ep)
                  obj=json.load(open(os.environ['RUNNER_TEMP']+'/s9-prod-health-'+ep+'.json'))
                  require(obj.get('ok') is True,'PROTECTED_PRODUCTION_HEALTH_DENIED_'+ep)
              print('S9_2_PROTECTED_PRODUCTION_RUNTIME_HEALTH=PASS',flush=True)
          def run():
              op=sys.argv[1]
              if op=='verify':
                  require(datetime.now(timezone.utc)<DEADLINE,'SIGNED_OWNER_LEASE_EXPIRED')
                  require(gh('repos/giovannifidel-collab/hive-alveare/branches/main')['commit']['sha']==BASE,'HIVE_MAIN_BASE_MOVED')
                  pr=gh('repos/giovannifidel-collab/hive-alveare/pulls/92')
                  require(pr['state']=='open' and pr['draft'] is True and pr['merged'] is False and pr['base']['sha']==BASE and pr['head']['sha']==CAND,'PR92_SOURCE_CHANGED')
                  owner=gh('repos/giovannifidel-collab/pfarma-ci/actions/runs/43405119995')
                  require(owner['conclusion']=='success' and owner['run_attempt']==1 and owner['actor']['login']=='giovannifidel-collab' and owner['head_sha']=='1bac510668b353298f8f4b36f50868f39825098e','OWNER_OIDC_CI_NOT_VALID')
                  evidence=gh('repos/giovannifidel-collab/pfarma-ci/actions/runs/43406087354')
                  require(evidence['conclusion']=='success','EXACT_GIT_PREVIEW_NOT_PROVEN')
                  path=cloudflare_path(); p=project(path)
                  invariant(p,p.get('build_config',{}).get('build_command'))
                  require((p.get('build_config') or {}).get('build_command') in ('',None),'BUILD_COMMAND_NOT_BASELINE')
                  original=p.get('canonical_deployment') or {}
                  require(original.get('id')==ROLLBACK and (original.get('latest_stage') or {}).get('status')=='success','ROLLBACK_TARGET_CHANGED')
                  health()
                  write_state({'path':path,'build_command_original':(p.get('build_config') or {}).get('build_command'),'ready':True,'patched':False,'merged':False,'rollback_id':ROLLBACK,'owner_run':43405119995})
                  print('S9_2_SIGNED_SOURCE_AND_ROLLBACK_PREFLIGHT=PASS',flush=True)
              elif op=='apply':
                  s=read_state();require(s.get('ready') is True and s.get('patched') is False,'NO_VALID_PREFLIGHT')
                  require(datetime.now(timezone.utc)<DEADLINE,'SIGNED_LEASE_EXPIRED_BEFORE_BUILD')
                  p=project(s['path']);invariant(p,s['build_command_original'])
                  s['patched']=True;write_state(s)
                  cf('PATCH',s['path'],{'build_config':{'build_command':COMPAT}})
                  invariant(project(s['path']),COMPAT)
                  print('S9_2_TEMP_GLOBAL_BUILD_COMMAND_READY_FOR_MANUAL_MERGE=PASS',flush=True)
              elif op=='wait':
                  s=read_state();require(s.get('patched') is True,'BUILD_COMMAND_NOT_SET')
                  merge=None
                  for _ in range(50):
                      pr=gh('repos/giovannifidel-collab/hive-alveare/pulls/92')
                      if pr.get('merged') is True:
                          merge=pr.get('merge_commit_sha')
                          require(bool(re.fullmatch('[a-f0-9]{40}',str(merge))),'MERGE_SHA_INVALID')
                          require(gh('repos/giovannifidel-collab/hive-alveare/branches/main')['commit']['sha']==merge,'MERGED_MAIN_NOT_EXACT')
                          s['merged']=True;s['merge_sha']=merge;write_state(s)
                          print('S9_2_MANUAL_GITHUB_PR92_MERGE_SHA='+merge,flush=True)
                          break
                      require(datetime.now(timezone.utc)<DEADLINE,'OWNER_LEASE_EXPIRED_BEFORE_MERGE')
                      time.sleep(4)
                  require(merge is not None,'SEPARATE_MANUAL_MERGE_DECISION_NOT_RECEIVED')
                  got=None;status='pending'
                  for _ in range(55):
                      st,d=request('cf','GET',s['path']+'/deployments?env=production&per_page=25')
                      require(st==200 and d.get('success') is True,'PRODUCTION_DEPLOYMENTS_LIST_DENIED')
                      for dep in d['result'] or []:
                          m=((dep.get('deployment_trigger') or {}).get('metadata') or {})
                          if dep.get('environment')=='production' and m.get('commit_hash')==merge:
                              got=dep;break
                      if got:
                          status=(got.get('latest_stage') or {}).get('status') or 'pending'
                          if status in ('success','failure','canceled'):break
                      time.sleep(4)
                  print('S9_2_EXACT_GIT_CONNECTED_PRODUCTION_BUILD_STATUS='+status,flush=True)
                  need_rollback=(status!='success')
                  if status=='success':
                      try: health()
                      except Exception:need_rollback=True
                  if need_rollback:
                      print('S9_2_FAILED_RELEASE_ROLLBACK_REQUESTED=TRUE',flush=True)
                      cf('POST',s['path']+'/deployments/'+ROLLBACK+'/rollback')
                      cur=project(s['path']).get('canonical_deployment') or {}
                      require(cur.get('id')==ROLLBACK,'CRITICAL_PRODUCTION_ROLLBACK_NOT_VERIFIED')
                      health()
                      s['rolled_back']=True;write_state(s)
                      raise RuntimeError('PRODUCTION_RELEASE_FAILED_ROLLED_BACK')
                  s['released']=True;s['deployment_id']=got.get('id');s['release_sha']=merge;write_state(s)
                  print('S9_2_GIT_CONNECTED_PRODUCTION_RELEASE_LIVE_PASS=TRUE',flush=True)
                  print('S9_2_PRODUCTION_DEPLOYMENT_ID='+str(got.get('id')),flush=True)
              elif op=='restore':
                  s=read_state()
                  if not s.get('patched'):
                      print('S9_2_BUILD_COMMAND_NOT_PATCHED=NO_ROLLBACK_REQUIRED',flush=True);return
                  old=s.get('build_command_original') or ''
                  cf('PATCH',s['path'],{'build_config':{'build_command':old}})
                  invariant(project(s['path']),s.get('build_command_original'))
                  print('S9_2_TEMPORARY_GLOBAL_BUILD_COMMAND_ROLLBACK=VERIFIED',flush=True)
                  print('S9_2_PRODUCTION_DB_CONFIG_UNCHANGED=PASS',flush=True)
              else:raise RuntimeError('UNKNOWN_OPERATION')
          run()
          PY
          python "$RUNNER_TEMP/s9-2-controller.py" verify
      - name: Apply exact approved Pages temporary build command (await manual merge)
        shell: bash
        run: python "$RUNNER_TEMP/s9-2-controller.py" apply
      - name: Wait for distinct manual GitHub PR92 merge, verify production, revert on failure
        shell: bash
        run: python "$RUNNER_TEMP/s9-2-controller.py" wait
      - name: Always restore global Pages build configuration and verify
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/s9-2-controller.py"; then
            python "$RUNNER_TEMP/s9-2-controller.py" restore
          else
            echo S9_2_TEMP_BUILD_NOT_INSTALLED=TRUE
          fi
      - name: Upload guarded evidence without private environment values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s9-2-owner-signed-release-state-${{ github.run_id }}
          path: ${{ runner.temp }}/s9-prod-state.json
          if-no-files-found: warn
          retention-days: 7
