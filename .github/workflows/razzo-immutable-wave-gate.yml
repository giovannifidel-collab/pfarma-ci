name: RAZZO Immutable Wave Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'razzo/waves/**'
      - '.github/workflows/razzo-immutable-wave-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-giovanni:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - id: source
        shell: bash
        run: |
          sha="$(tr -d '\r\n' < razzo/waves/20260728-wave9/project-giovanni.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - run: test "$(git -C source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: source
        run: npm install --no-audit --no-fund
      - working-directory: source
        run: npx --yes tsc --noEmit
      - working-directory: source
        run: npm run test:factory
      - name: Photo AI safety regression
        working-directory: source
        run: node tools/test_photo_analysis_output_safety.cjs lib/photoAnalysisOutputSafety.ts
      - working-directory: source
        run: npm run factory:plan
      - working-directory: source
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci_placeholder'
        run: npm run build

  pfarma:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - id: source
        shell: bash
        run: |
          sha="$(tr -d '\r\n' < razzo/waves/20260728-wave9/pfarma.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - run: test "$(git -C source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - working-directory: source
        run: python -m compileall -q factory
      - working-directory: source
        run: python -m unittest factory.test_razzo_executor factory.test_continuous_loop factory.test_github_worker_runtime -v
      - working-directory: source
        run: python -m factory.plan

  family-cloud:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - id: source
        shell: bash
        run: |
          sha="$(tr -d '\r\n' < razzo/waves/20260728-wave9/family-cloud.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - run: test "$(git -C source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: source
        run: npm install --no-audit --no-fund
      - working-directory: source
        run: npm run typecheck
      - working-directory: source
        run: npm test
      - working-directory: source
        run: npm run factory:plan
