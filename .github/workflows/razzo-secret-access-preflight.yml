name: RAZZO Secret Access Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/razzo-secret-access-preflight.yml'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_GIOVANNI_SOURCE_TOKEN }}
      PFARMA_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify secret presence and private read access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p razzo/runtime-preflight
          project_present=false
          pfarma_present=false
          project_access=false
          pfarma_access=false
          family_access=false

          if test -n "${PROJECT_TOKEN:-}"; then
            project_present=true
            if git -c credential.helper= ls-remote "https://x-access-token:${PROJECT_TOKEN}@github.com/giovannifidel-collab/project-giovanni.git" HEAD >/dev/null 2>&1; then
              project_access=true
            fi
          fi

          if test -n "${PFARMA_TOKEN:-}"; then
            pfarma_present=true
            if git -c credential.helper= ls-remote "https://x-access-token:${PFARMA_TOKEN}@github.com/giovannifidel-collab/pfarma-cloud.git" HEAD >/dev/null 2>&1; then
              pfarma_access=true
            fi
            if git -c credential.helper= ls-remote "https://x-access-token:${PFARMA_TOKEN}@github.com/giovannifidel-collab/family-cloud.git" HEAD >/dev/null 2>&1; then
              family_access=true
            fi
          fi

          jq -n \
            --arg runId "${GITHUB_RUN_ID}" \
            --argjson projectTokenPresent "$project_present" \
            --argjson pfarmaTokenPresent "$pfarma_present" \
            --argjson projectGiovanniRead "$project_access" \
            --argjson pfarmaCloudRead "$pfarma_access" \
            --argjson familyCloudRead "$family_access" \
            '{schema:"razzo.secret-access-preflight.v1",runId:$runId,projectTokenPresent:$projectTokenPresent,pfarmaTokenPresent:$pfarmaTokenPresent,access:{projectGiovanni:$projectGiovanniRead,pfarmaCloud:$pfarmaCloudRead,familyCloud:$familyCloudRead},ready:($projectGiovanniRead and $pfarmaCloudRead and $familyCloudRead)}' \
            > "razzo/runtime-preflight/${GITHUB_RUN_ID}.json"

      - name: Persist sanitized preflight result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAZZO Super Factory'
          git config user.email 'actions@users.noreply.github.com'
          git add razzo/runtime-preflight
          git commit -m "RAZZO preflight: private repository access run ${GITHUB_RUN_ID}"
          git push
