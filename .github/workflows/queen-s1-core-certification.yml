name: Queen S1 Core Certification
# promotion-final-head-trigger

on:
  push:
    branches:
      - main
      - convergence/queen-s1-promote-v1
      - convergence/queen-s1-single-ingress-v1
      - convergence/queen-s1-final-pin-v1
      - convergence/queen-s1-world-retry-v1
    paths:
      - .github/workflows/queen-s1-core-certification.yml
      - .github/workflows/queen-s1-event-ingress.yml
      - .github/workflows/hive-world-sync.yml
      - .github/workflows/hive-queen-s1-site-deploy.yml
      - .github/workflows/hive-queen-event-ingress.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queen-s1-core-certification
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      PRIVATE_REPO: giovannifidel-collab/hive-alveare
      PRIVATE_REF: 73778e4d040e6ae361401003441f6a9be2c793f5
      S0_PARENT: c41ed6706927cd65e1dd509f0135895c1bc28f76
    steps:
      - name: Checkout public certification branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact private S1 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_REF }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: queen-private
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact S1 source and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          cd queen-private
          test "$(git rev-parse HEAD)" = "$PRIVATE_REF"
          git cat-file -e "${S0_PARENT}^{commit}"
          mapfile -t changed < <(git diff --name-only "${S0_PARENT}...HEAD")
          test "${#changed[@]}" -gt 0
          printf '%s\n' "${changed[@]}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/queen-cognitive-core.yml|              .github/workflows/queen-runtime.yml|              ops/queen/cognitive/cognitive-core.mjs|              ops/queen/cognitive/cognitive-engine.mjs|              ops/queen/core/*|              ops/queen/runtime/config.json|              ops/queen/runtime/queen-runtime.mjs|              cloudflare/functions/_lib/queen-runtime.js) ;;
              *) echo "S1_UNEXPECTED_DIFF=$f"; exit 1 ;;
            esac
          done
          echo "S1_BOUNDED_DIFF=PASS"

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          cd queen-private
          node --check ops/queen/cognitive/cognitive-engine.mjs
          node --check ops/queen/cognitive/cognitive-core.mjs
          node --check ops/queen/core/event-router.mjs
          node --check ops/queen/core/validate-s1-core.mjs
          node --check ops/queen/runtime/queen-runtime.mjs
          node --check cloudflare/functions/_lib/queen-runtime.js
          echo "S1_SYNTAX=PASS"

      - name: Run canonical self-tests
        shell: bash
        run: |
          set -euo pipefail
          cd queen-private
          node ops/queen/cognitive/cognitive-core.mjs --self-test
          node ops/queen/runtime/queen-runtime.mjs --self-test
          node ops/queen/core/validate-s1-core.mjs

      - name: Verify no mutable vNext runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          cd queen-private
          if grep -R "queen-universal-fabric-vnext"               ops/queen/cognitive/cognitive-core.mjs               ops/queen/cognitive/cognitive-engine.mjs               ops/queen/core/CORE_MANIFEST.v1.json               ops/queen/core/event-router.mjs               ops/queen/runtime/queen-runtime.mjs               cloudflare/functions/_lib/queen-runtime.js; then
            echo "S1_MUTABLE_VNEXT_DEPENDENCY=FAIL"
            exit 1
          fi
          echo "S1_MUTABLE_VNEXT_DEPENDENCY=NONE"

      - name: Verify event-driven public wiring
        shell: bash
        run: |
          set -euo pipefail
          INGRESS='.github/workflows/queen-s1-event-ingress.yml'
          WORLD='.github/workflows/hive-world-sync.yml'

          grep -Fq "PRIVATE_REF: $PRIVATE_REF" "$INGRESS"
          grep -Fq 'repository_dispatch:' "$INGRESS"
          grep -Fq 'world-state-changed' "$INGRESS"
          grep -Fq 'steps.durable.outputs.complete' "$INGRESS"
          grep -Fq 'SCHEDULE_DEPENDENCY=false' "$INGRESS"
          if grep -Eq '^[[:space:]]+schedule:' "$INGRESS"; then
            echo 'S1_EVENT_INGRESS_SCHEDULE_DEPENDENCY=FAIL'
            exit 1
          fi

          grep -Fq 'state_fingerprint' "$WORLD"
          grep -Fq 'WORLD_SEMANTIC_CHANGE=false' "$WORLD"
          grep -Fq "github.ref == 'refs/heads/main'" "$WORLD"
          grep -Fq 'world-state-changed' "$WORLD"
          grep -Fq 'steps.publish.outputs.changed' "$WORLD"

          grep -Fq "cron: '17 */6 * * *'" queen-private/.github/workflows/queen-cognitive-core.yml
          grep -Fq "cron: '47 */6 * * *'" queen-private/.github/workflows/queen-runtime.yml

          echo 'S1_EVENT_INGRESS_WIRING=PASS'
          echo 'S1_WORLD_SEMANTIC_WAKE_WIRING=PASS'
          echo 'S1_CRON_FALLBACK_WIRING=PASS'
          DEPLOY='.github/workflows/hive-queen-s1-site-deploy.yml'
          test -f "$DEPLOY"
          grep -Fq "PRIVATE_SHA: 73778e4d040e6ae361401003441f6a9be2c793f5" "$DEPLOY"
          grep -Fq 'PROJECT_MUTATION_PERFORMED=false' "$DEPLOY"
          if grep -Fq 'hive-field-execution-dispatch' "$DEPLOY"; then echo 'S1_DEPLOY_PROJECT_MUTATION_GUARD=FAIL'; exit 1; fi
          echo 'S1_DEPLOY_WORKFLOW_WIRING=PASS'
          LEGACY='.github/workflows/hive-queen-event-ingress.yml'
          CANONICAL='.github/workflows/queen-s1-event-ingress.yml'
          test -f "$LEGACY" -a -f "$CANONICAL"
          if grep -Fq 'repository_dispatch:' "$LEGACY"; then echo 'S1_LEGACY_EVENT_INGRESS_STILL_AUTOMATIC=FAIL'; exit 1; fi
          grep -Fq 'repository_dispatch:' "$CANONICAL"
          grep -Fq 'verification-result' "$CANONICAL"
          grep -Fq 'verifier-result' "$CANONICAL"
          echo 'S1_SINGLE_AUTOMATIC_EVENT_INGRESS=PASS'
          grep -Fq 'retry_hop:' "$WORLD"
          grep -Fq 'WORLD_SYNC_RETRY_DISPATCHED' "$WORLD"
          grep -Fq 'HOP >= 3' "$WORLD"
          grep -Fq 'actions: write' "$WORLD"
          grep -Fq 'cancel-in-progress: false' "$WORLD"
          echo 'S1_WORLD_RETRY_BOUNDED=PASS'

      - name: Recheck preserved live proof anchors
        shell: bash
        env:
          PUBLIC_REPO: giovannifidel-collab/pfarma-ci
        run: |
          set -euo pipefail
          for RUN_ID in 36455265225 36609073295 36609555696 36609610520 36609785526 37522287227; do
            CONCLUSION="$(gh api "repos/$PUBLIC_REPO/actions/runs/$RUN_ID" --jq '.conclusion')"
            test "$CONCLUSION" = 'success' || { echo "S1_HISTORICAL_PROOF_FAILED=$RUN_ID:$CONCLUSION"; exit 1; }
            echo "S1_PRESERVED_PROOF=$RUN_ID:success"
          done
          echo 'S1_PRESERVED_LIVE_PROOFS=PASS'

      - name: Confirm final S1 private state
        shell: bash
        run: |
          node - <<'NODE'
          const s=require('./queen-private/ops/queen/core/S1_STATE.json');
          if(s.status!=='PASS_READY_FOR_S2') process.exit(1);
          if(s.promotion?.production_promoted!==true) process.exit(2);
          console.log('S1_FINAL_STATE=PASS_READY_FOR_S2');
          NODE

      - name: Certification markers
        shell: bash
        run: |
          {
            echo "QUEEN_S1_CORE_CERTIFICATION=PASS"
            echo "S1_PRIVATE_SHA=$PRIVATE_REF"
            echo "S1_RUNTIME_PATH_SINGLE_PLANNER=true"
            echo "S1_V1_AGENT_FABRIC_REBUILT=false"
            echo "S1_PROJECT_MUTATION=false"
            echo "S1_EVENT_DRIVEN_PRIMARY=true"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "S1_PRODUCTION_PROMOTED=true"
            else
              echo "S1_PRODUCTION_PROMOTED=true"
            fi
            echo "S1_NEXT_GATE=S2_SCHOOL_MEMORY"
          } | tee -a "$GITHUB_STEP_SUMMARY"
