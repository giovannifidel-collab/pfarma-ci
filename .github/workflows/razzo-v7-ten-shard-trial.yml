name: RAZZO V7 Ten-Shard Free Product Trial

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan or execute deterministic free product delivery"
        required: true
        type: choice
        options: [plan-only, execute-trial]
        default: plan-only

permissions:
  contents: read
  actions: read

concurrency:
  group: razzo-v7-ten-shard-free-trial
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    outputs:
      discovery_matrix: ${{ steps.plan.outputs.discovery_matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify exact control-plane SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run deterministic contracts
        run: |
          python -m py_compile razzo/v7/deterministic_discovery.py razzo/v7/free_executor.py
          python -m unittest razzo.v7.test_actionability razzo.v7.test_product_discovery razzo.v7.test_contract_materializer razzo.v7.test_dispatcher_pool razzo.v7.test_trial_runtime -v
      - id: plan
        env:
          PFARMA_SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          python -m razzo.v7.trial_runtime plan --run-id "${{ github.run_id }}" --mode "${{ inputs.mode }}" --output "$RUNNER_TEMP/topology.json"
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-v7-free-topology-${{ github.run_id }}
          path: ${{ runner.temp }}/topology.json

  discovery:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.discovery_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: photo-ai-private
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.exact_input_sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify discovery lease
        working-directory: product-source
        run: test "$(git rev-parse HEAD)" = "${{ matrix.exact_input_sha }}"
      - name: Run deterministic free discovery
        run: |
          python -m razzo.v7.deterministic_discovery --project-id "${{ matrix.project_id }}" --product-root product-source --output "$RUNNER_TEMP/discovery-output.json"
      - name: Validate discovered contracts
        env:
          PROJECT_JSON: ${{ matrix.project_json }}
        run: |
          mkdir -p "$RUNNER_TEMP/discovery-result"
          python -m razzo.v7.contract_materializer \
            --raw-output "$RUNNER_TEMP/discovery-output.json" \
            --project-json "$PROJECT_JSON" \
            --exact-sha "${{ matrix.exact_input_sha }}" \
            --issue-number "${{ matrix.issue_number }}" \
            --issue-title "Deterministic free repository discovery" \
            --product-root product-source \
            --output "$RUNNER_TEMP/discovery-result/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-v7-free-discovery-${{ matrix.shard_id }}
          path: ${{ runner.temp }}/discovery-result/result.json
      - name: Purge product source
        if: always()
        run: rm -rf product-source "$RUNNER_TEMP/discovery-output.json"

  materialize:
    needs: discovery
    runs-on: ubuntu-latest
    outputs:
      worker_matrix: ${{ steps.aggregate.outputs.worker_matrix }}
      worker_count: ${{ steps.aggregate.outputs.worker_count }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: razzo-v7-free-discovery-*
          path: discovery-results
      - id: aggregate
        run: |
          python -m razzo.v7.trial_runtime aggregate --discovery-root discovery-results --run-id "${{ github.run_id }}" --mode "${{ inputs.mode }}" --output "$RUNNER_TEMP/materialized-plan.json"
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-v7-free-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/materialized-plan.json

  workers:
    needs: materialize
    if: ${{ inputs.mode == 'execute-trial' && needs.materialize.outputs.worker_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.materialize.outputs.worker_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: photo-ai-private
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product-source/package-lock.json
      - name: Verify signed lease
        env:
          CONTRACT_JSON: ${{ toJSON(matrix) }}
        run: |
          python - <<'PY'
          import json, os
          from razzo.v7.dispatcher_pool import verify_dispatcher_lease
          item=json.loads(os.environ['CONTRACT_JSON'])
          verify_dispatcher_lease(item['dispatcher_id'], [item], item['lease_digest'], item['shard_id'], '${{ github.run_id }}')
          PY
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.exact_input_sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product-source
          persist-credentials: false
          fetch-depth: 1
      - id: executor
        name: Apply deterministic free product recipe
        continue-on-error: true
        env:
          CONTRACT_JSON: ${{ toJSON(matrix) }}
        run: |
          python -m razzo.v7.free_executor --contract-json "$CONTRACT_JSON" --product-root product-source --output "$RUNNER_TEMP/executor.json"
      - id: diff
        name: Enforce changed-file boundaries
        if: ${{ steps.executor.outcome == 'success' }}
        working-directory: product-source
        env:
          ALLOWED_JSON: ${{ toJSON(matrix.allowed_surfaces) }}
        run: |
          git status --porcelain | sed -E 's/^.. //' > "$RUNNER_TEMP/changed-files.txt"
          test -s "$RUNNER_TEMP/changed-files.txt" || { echo 'has_changes=false' >> "$GITHUB_OUTPUT"; exit 0; }
          python - <<'PY'
          import fnmatch,json,os
          from pathlib import Path
          changed=[x.strip() for x in Path(os.environ['RUNNER_TEMP'],'changed-files.txt').read_text().splitlines() if x.strip()]
          allowed=[str(x).strip().rstrip('/') for x in json.loads(os.environ['ALLOWED_JSON'])]
          forbidden=('.github/workflows/','infra/','migrations/','secrets/','factory/policy','factory/task-graph','factory/task_graph')
          for path in changed:
              assert not path.startswith(forbidden), f'forbidden path: {path}'
              assert any(fnmatch.fnmatch(path,r) if any(c in r for c in '*?[') else path==r or path.startswith(r+'/') for r in allowed), f'outside contract: {path}'
          PY
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"
      - id: tests
        name: Run registry-controlled tests
        if: ${{ steps.diff.outputs.has_changes == 'true' }}
        working-directory: product-source
        env:
          FACTORY_TEST: ${{ matrix.factory_test }}
          FACTORY_PLAN: ${{ matrix.factory_plan }}
        run: |
          set -euo pipefail
          test -n "$FACTORY_TEST$FACTORY_PLAN"
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi
          [ -z "$FACTORY_TEST" ] || bash -lc "$FACTORY_TEST"
          [ -z "$FACTORY_PLAN" ] || bash -lc "$FACTORY_PLAN"
          echo 'executed=true' >> "$GITHUB_OUTPUT"
          echo 'passed=true' >> "$GITHUB_OUTPUT"
      - id: base
        name: Verify expected integration head
        if: ${{ steps.tests.outcome == 'success' }}
        working-directory: product-source
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          head=$(git ls-remote "https://x-access-token:${SOURCE_TOKEN}@github.com/${{ matrix.repository }}.git" "refs/heads/${{ matrix.integration_lane }}" | awk '{print $1}')
          [ "$head" = "${{ matrix.exact_input_sha }}" ] && echo 'fresh=true' >> "$GITHUB_OUTPUT" || echo 'fresh=false' >> "$GITHUB_OUTPUT"
      - id: publish
        name: Commit, push and open product PR
        if: ${{ steps.base.outputs.fresh == 'true' }}
        working-directory: product-source
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          CONTRACT_JSON: ${{ toJSON(matrix) }}
        run: |
          branch="razzo/v7-free/${{ matrix.project_id }}/${{ matrix.shard_id }}-${GITHUB_RUN_ID}"
          export BRANCH="$branch"
          git config user.name 'RAZZO V7 Free Executor'
          git config user.email 'razzo-v7@users.noreply.github.com'
          git switch -c "$branch"
          git add -A && git commit -m "RAZZO V7 FREE: ${{ matrix.product_objective }}"
          sha=$(git rev-parse HEAD)
          git push "https://x-access-token:${SOURCE_TOKEN}@github.com/${{ matrix.repository }}.git" "HEAD:${branch}"
          payload=$(python - <<'PY'
          import json,os
          c=json.loads(os.environ['CONTRACT_JSON'])
          print(json.dumps({'title':'RAZZO V7 FREE: '+c['product_objective'],'head':os.environ['BRANCH'],'base':c['integration_lane'],'body':f"Deterministic free delivery for work item `{c['work_item_id']}` from exact SHA `{c['exact_input_sha']}`. Registry tests passed."}))
          PY
          )
          response=$(curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ matrix.repository }}/pulls" -d "$payload")
          echo "candidate_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(python -c 'import json,sys; print(json.load(sys.stdin)["number"])' <<< "$response")" >> "$GITHUB_OUTPUT"
      - name: Write truthful receipt
        if: always()
        env:
          CONTRACT_JSON: ${{ toJSON(matrix) }}
        run: |
          mkdir -p "$RUNNER_TEMP/receipt"
          python -m razzo.v7.trial_runtime receipt --run-id "${{ github.run_id }}" --codex-outcome "${{ steps.executor.outcome }}" --diff-outcome "${{ steps.diff.outcome }}" --has-changes "${{ steps.diff.outputs.has_changes }}" --tests-outcome "${{ steps.tests.outcome }}" --tests-executed "${{ steps.tests.outputs.executed }}" --tests-passed "${{ steps.tests.outputs.passed }}" --fresh "${{ steps.base.outputs.fresh }}" --pr-number "${{ steps.publish.outputs.pr_number }}" --candidate-sha "${{ steps.publish.outputs.candidate_sha }}" --output "$RUNNER_TEMP/receipt/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razzo-v7-free-receipt-${{ matrix.shard_id }}
          path: ${{ runner.temp }}/receipt/receipt.json
      - name: Purge product source
        if: always()
        run: rm -rf product-source "$RUNNER_TEMP/executor.json" "$RUNNER_TEMP/changed-files.txt"

  verify:
    needs: [materialize, workers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.mode == 'execute-trial' && needs.materialize.outputs.worker_count != '0' }}
        with:
          pattern: razzo-v7-free-receipt-*
          path: receipts
      - name: Classify truthful result
        run: python -m razzo.v7.trial_runtime verify --receipts-root receipts --expected-count "${{ needs.materialize.outputs.worker_count || 0 }}" --mode "${{ inputs.mode }}" --run-id "${{ github.run_id }}" --output "$RUNNER_TEMP/summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-v7-free-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/summary.json
