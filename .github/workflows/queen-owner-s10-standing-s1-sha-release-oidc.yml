name: Queen Owner S10 Standing Safe S1 SHA Fix Exact OIDC Approval (NO AUTO MERGE)
on:
  push:
    branches: [audit/owner-s10-standing-safe-s1-one-release-20261119]
    paths: [.github/workflows/queen-owner-s10-standing-s1-sha-release-oidc.yml]
  workflow_dispatch:
    inputs:
      approve_exact_pr1305_one_s1_source_release:
        type: boolean
        required: true
        default: false
        description: "Owner signs EXACT source-only PR1305 to fix trusted HIVE S1 source SHA, one merge and one NEW L0 read-only postflight; no auto merge"
permissions: {contents: read, actions: read, id-token: write}
concurrency:
  group: queen-owner-s10-standing-s1-sha-exact-pr1305
  cancel-in-progress: false
jobs:
  attest-exact-source-only-no-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: pfarma-ci-trusted
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      APPROVE: ${{ inputs.approve_exact_pr1305_one_s1_source_release }}
      HIVE_SHA: 88000e9ff70ffc044f424d469645573e01738a8b
      PR1305_HEAD: 48500c507491632d5397a3639b79fdc454bad7cc
      OLD_STANDING_BLOB: b9163f893a6c0dd4093268b2f69b14670c59c342
      NEW_STANDING_BLOB: 6f4b7c3373349de9fdecfbfd5a22f71df3cbe578
      S1_INGRESS_BLOB: a0b75a09ab2ff8e37a49d6c4ebfcd2b3c1322ffe
      POLICY_BLOB: 90f4fb35b8610f7738c79af0019cf1cb2582f746
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Validate immutable canonical S1, current signed HIVE source and candidate 3-file diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -n "$GH_TOKEN"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_TRIGGERING_ACTOR" = giovannifidel-collab
            test "$GITHUB_REF" = refs/heads/main
            test "$APPROVE" = true
          else
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/audit/owner-s10-standing-safe-s1-one-release-20261119
          fi
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = "$HIVE_SHA"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')" = "$HIVE_SHA"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/queen-s1-event-ingress.yml --jq .sha)" = "$S1_INGRESS_BLOB"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/ops/queen/s9/relay-standing-safe-observer.mjs --jq .sha)" = "$OLD_STANDING_BLOB"
          test "$(gh api 'repos/giovannifidel-collab/pfarma-ci/contents/ops/queen/s9/relay-standing-safe-observer.mjs?ref=fix/s10-standing-safe-trusted-source-ref-20261119' --jq .sha)" = "$NEW_STANDING_BLOB"
          gh api repos/giovannifidel-collab/pfarma-ci/pulls/1305 |
            jq -e --arg h "$PR1305_HEAD" '.state=="open" and .merged==false and .head.sha==$h and .base.ref=="main"' >/dev/null
          gh api 'repos/giovannifidel-collab/pfarma-ci/pulls/1305/files?per_page=30' |
            jq -e 'length==3 and all(.[].filename;
              .=="ops/queen/s9/relay-standing-safe-observer.mjs" or
              .=="ops/queen/s9/tests/relay-standing-safe-observer.test.mjs" or
              .==".github/workflows/queen-s10-standing-s1-canonical-sha-source-ci.yml")' >/dev/null
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/44582419632 |
            jq -e --arg h "$PR1305_HEAD" '.status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha==$h' >/dev/null
          echo 'S10_OWNER_EXACT_PR1305_NEW_AND_OLD_S1_SOURCE_SHA_ATTESTED=PASS'
          echo 'S10_OWNER_NO_PRODUCTION_MUTATION_BY_ATTESTER=TRUE'
      - name: Source branch checks embedded RS256 signer syntax only
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/queen-owner-s10-standing-s1-sha-release-oidc.yml').read_text()
          anchor="          node --input-type=module <<'JS'\n"
          a=s.index(anchor)+len(anchor)
          b=s.index("\n          JS",a)
          code='\n'.join(x[10:] if x.startswith('          ') else x for x in s[a:b].splitlines())
          Path('/tmp/s10-owner-s1-sha-signer.mjs').write_text(code+'\n')
          PY
          node --check /tmp/s10-owner-s1-sha-signer.mjs
          echo 'S10_OWNER_S1_SHA_SIGNER_RSA_JS_SYNTAX=PASS'
      - name: Verify Owner RS256 GitHub OIDC and issue one 15-minute exact PR1305 source receipt
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {createPublicKey,verify,createHash} from 'node:crypto';
          const e=process.env;
          const deny=x=>{throw Error('S10_S1_SHA_OWNER_OIDC_DENY_'+x)};
          const audience='hive-queen-owner-s10-standing-s1-exact-pr1305-v1';
          if(e.APPROVE!=='true'||!e.ACTIONS_ID_TOKEN_REQUEST_URL||!e.ACTIONS_ID_TOKEN_REQUEST_TOKEN)deny('MISSING_MANUAL_APPROVAL');
          const url=e.ACTIONS_ID_TOKEN_REQUEST_URL+
           (e.ACTIONS_ID_TOKEN_REQUEST_URL.includes('?')?'&':'?')+
           'audience='+encodeURIComponent(audience);
          const result=await fetch(url,{headers:{Authorization:'Bearer '+e.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!result.ok)deny('UNAVAILABLE_OIDC');
          const parts=(await result.json()).value?.split('.')||[];
          if(parts.length!==3)deny('INVALID_JWT');
          const dec=v=>Buffer.from(v.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-v.length%4)%4),'base64');
          const header=JSON.parse(dec(parts[0]).toString());
          const claims=JSON.parse(dec(parts[1]).toString());
          if(header.alg!=='RS256'||!header.kid||header.jwk||header.jku||header.x5u||header.crit)deny('INVALID_HEADER');
          const must={
            iss:'https://token.actions.githubusercontent.com',
            aud:audience,
            repository:'giovannifidel-collab/pfarma-ci',
            repository_id:'1308677897',
            repository_owner_id:'305755860',
            actor:'giovannifidel-collab',
            actor_id:'305755860',
            event_name:'workflow_dispatch',
            environment:'pfarma-ci-trusted',
            workflow_ref:'giovannifidel-collab/pfarma-ci/.github/workflows/queen-owner-s10-standing-s1-sha-release-oidc.yml@refs/heads/main',
            ref:'refs/heads/main',
            runner_environment:'github-hosted'
          };
          for(const [k,v] of Object.entries(must)){
            if(String(claims[k])!==v)deny('BAD_CLAIM_'+k);
          }
          const now=Date.now();
          if(claims.sha!==e.GITHUB_SHA||Number(claims.run_id)!==Number(e.GITHUB_RUN_ID)||
            Number(claims.run_attempt)!==1||
            !Number.isSafeInteger(claims.exp)||!Number.isSafeInteger(claims.iat)||
            claims.exp<=claims.iat||claims.exp-claims.iat>900||
            claims.exp*1000<=now||claims.iat*1000>now+30000||now-claims.iat*1000>300000)deny('EXPIRED_OR_RUN');
          const jwks=await fetch('https://token.actions.githubusercontent.com/.well-known/jwks');
          if(!jwks.ok)deny('JWKS');
          const key=(await jwks.json()).keys?.find(k=>k.kid===header.kid&&k.kty==='RSA'&&k.use==='sig'&&(!k.alg||k.alg==='RS256'));
          if(!key||!verify('RSA-SHA256',Buffer.from(parts[0]+'.'+parts[1]),createPublicKey({key,format:'jwk'}),dec(parts[2])))deny('BAD_SIGNATURE');
          if(e.HIVE_SHA!=='88000e9ff70ffc044f424d469645573e01738a8b'||
             e.PR1305_HEAD!=='48500c507491632d5397a3639b79fdc454bad7cc'||
             e.POLICY_BLOB!=='90f4fb35b8610f7738c79af0019cf1cb2582f746')deny('SOURCE_POLICY');
          const receipt={
            schema:'queen.s10.exact-owner-safe-s1-source-repair.v1',
            owner:'giovannifidel-collab',
            owner_oidc_run_id:Number(e.GITHUB_RUN_ID),
            hive_main_sha:e.HIVE_SHA,
            original_canonical_s1_blob:e.S1_INGRESS_BLOB,
            relay_candidate_pr:1305,
            relay_candidate_head:e.PR1305_HEAD,
            old_standing_blob:e.OLD_STANDING_BLOB,
            new_standing_blob:e.NEW_STANDING_BLOB,
            standing_policy_blob:e.POLICY_BLOB,
            authority:'HIVE_ONLY_L0_READ_ONLY_WORLD_OBSERVE',
            merges_max:1,
            allow_one_NEW_safe_world_observation_after_release:true,
            replay_failed_old_mission:false,
            no_auto_merge:true,no_auto_deploy:true,
            no_second_event_loop:true,
            no_cloudflare_change:true,
            no_neon_write:true,no_project_write:true,
            no_school_training:true,no_paid_provider:true,
            additional_cost_usd:0,
            issued_at:new Date(now).toISOString(),
            expires_at:new Date(now+900000).toISOString()
          };
          const digest=createHash('sha256').update(JSON.stringify(receipt)).digest('hex');
          console.log('S10_OWNER_PR1305_EXACT_OIDC_RS256_SIGNATURE=PASS');
          console.log('S10_OWNER_PR1305_SIGNED_RECEIPT='+JSON.stringify({...receipt,receipt_sha256:digest}));
          console.log('S10_OWNER_PR1305_RELEASE_IS_SOURCE_ONLY_NO_AUTO_MERGE=TRUE');
          JS