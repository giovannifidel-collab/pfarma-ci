name: Project Giovanni Visual Premium Final Certification

on:
  pull_request:
    paths:
      - 'project-giovanni-source-ref.txt'
      - '.github/workflows/pg-p07-final-product-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    steps:
      - name: Checkout public control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve exact candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n ' < project-giovanni-source-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact private product
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.GITHUB_PRODUCT_SOURCE_TOKEN || secrets.PROJECT_GIOVANNI_SOURCE_TOKEN || secrets.PFARMA_SOURCE_TOKEN }}
          path: product
          persist-credentials: false
      - name: Attest exact SHA
        run: test "$(git -C product rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: product
        run: npm install --no-audit --no-fund
      - name: Run terminal product contract
        working-directory: product
        run: node --test factory/pg-p07-final-certification.test.mjs
      - name: Start exact candidate
        working-directory: product
        shell: bash
        env:
          PG_VISUAL_QA: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'pg-visual-premium-public-placeholder'
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/pg-premium-next.log 2>&1 &
          echo $! > /tmp/pg-premium-next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null && curl -fsS http://127.0.0.1:3000/progress-intelligence >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pg-premium-next.log
          exit 1
      - name: Warm response smoke
        shell: bash
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:3000/ http://127.0.0.1:3000/progress-intelligence; do
            curl -fsS "$url" >/dev/null
            ms=$(curl -fsS -o /dev/null -w '%{time_total}' "$url" | awk '{printf "%d", $1*1000}')
            echo "$url warm response: ${ms}ms"
            test "$ms" -lt 5000
          done
      - name: Install Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium
      - name: Capture premium home and progress at desktop tablet mobile
        run: |
          mkdir -p visual-premium
          for route in home progress; do
            if [ "$route" = home ]; then url='http://127.0.0.1:3000/'; else url='http://127.0.0.1:3000/progress-intelligence'; fi
            npx -y playwright@1.55.0 screenshot --browser=chromium --wait-for-timeout=1600 --full-page --viewport-size="1440,1100" "$url" "visual-premium/${route}-desktop.png"
            npx -y playwright@1.55.0 screenshot --browser=chromium --wait-for-timeout=1600 --full-page --viewport-size="820,1180" "$url" "visual-premium/${route}-tablet.png"
            npx -y playwright@1.55.0 screenshot --browser=chromium --wait-for-timeout=1600 --full-page --viewport-size="390,844" "$url" "visual-premium/${route}-mobile.png"
          done
          test "$(find visual-premium -name '*.png' -size +10k | wc -l)" -eq 6
      - name: Upload premium visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: project-giovanni-visual-premium-${{ steps.source.outputs.sha }}
          path: visual-premium/*.png
          if-no-files-found: error
          retention-days: 90
      - name: Stop candidate
        if: always()
        run: test ! -f /tmp/pg-premium-next.pid || kill "$(cat /tmp/pg-premium-next.pid)" || true
