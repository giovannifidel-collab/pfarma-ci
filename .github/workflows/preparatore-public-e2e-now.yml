name: Preparatore Public E2E Now

on:
  push:
    paths:
      - '.github/workflows/preparatore-public-e2e-now.yml'

permissions:
  contents: read
  actions: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: photo-ai-private
    steps:
      - name: Resolve private source token
        shell: bash
        env:
          GIO_TOKEN: ${{ secrets.PROJECT_GIOVANNI_SOURCE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          token="${GIO_TOKEN:-${FALLBACK_TOKEN:-}}"
          test -n "$token"
          echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Checkout trusted Project Giovanni source
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: main
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          path: worker
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locate and run production E2E
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_PHOTO_AI_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          GITHUB_PHOTO_AI_REPOSITORY: giovannifidel-collab/pfarma-ci
          PREPARATORE_E2E_BASE_URL: https://project-giovanni.vercel.app
          APP_BASE_URL: https://project-giovanni.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          echo 'Available Preparatore E2E candidates:'
          find scripts factory -maxdepth 3 -type f \( -iname '*preparatore*e2e*.mjs' -o -iname '*preparatore*production*.mjs' \) -print || true
          candidate="$(find scripts factory -maxdepth 3 -type f \( -iname '*preparatore*e2e*.mjs' -o -iname '*preparatore*production*.mjs' \) | head -n 1)"
          test -n "$candidate"
          echo "Running $candidate"
          node "$candidate"
