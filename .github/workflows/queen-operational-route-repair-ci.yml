name: Queen operational route repair independent source CI
on:
  push:
    branches: [fix/queen-operational-route-ci-20261128]
    paths: ['.github/workflows/queen-operational-route-repair-ci.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: 61b60206c544933632171274b128f5acd7ebb771
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: private-hive
          fetch-depth: 0
      - name: Verify exact scope and run networkless tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-hive rev-parse HEAD)" = 61b60206c544933632171274b128f5acd7ebb771
          git -C private-hive diff --name-only 190514172c449a5bfa91b96af6c3794ac27a8fea HEAD | sort | diff -u <(printf '%s\n' cloudflare/functions/_lib/family-cloud-execution.js cloudflare/functions/api/queen-command.js ops/queen/s14/family-cloud-execution.test.mjs) -
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 90 --memory 512m --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=64m --mount "type=bind,source=$GITHUB_WORKSPACE/private-hive,target=/project,readonly" --workdir /project node:22-alpine node --test ops/queen/s14/family-cloud-execution.test.mjs ops/queen/s14/family-cloud-preflight.test.mjs ops/queen/s14/queen-operational-route.test.mjs ops/queen/s14/queen-informational-model-repair.test.mjs ops/queen/s14/s14-functional-proof.test.mjs
          echo QUEEN_OPERATIONAL_ROUTE_SOURCE_CI=PASS
      - name: Enumerate remaining retired-model references for later review only
        shell: bash
        run: |
          git -C private-hive grep -l -F '@cf/meta/llama-3.1-8b-instruct-fp8' -- cloudflare/functions ops/queen || true
      - name: Clean private source
        if: always()
        run: rm -rf private-hive
