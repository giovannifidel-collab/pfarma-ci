name: HIVE Queen 20x Stability Gate

on:
  push:
    branches: [queen-universal-fabric-vnext]
    paths:
      - '.github/workflows/hive-queen-stability-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 30
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
      HIVE_BASE_URL: ${{ secrets.HIVE_BASE_URL }}
    steps:
      - name: Run 20 consecutive real Queen cycles
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HIVE_BASE_URL:-https://hive-alveare.pages.dev}"; BASE="${BASE%/}"
          headers=(-H 'Content-Type: application/json')
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            headers+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          if [[ -n "${HIVE_RUNTIME_BEARER_TOKEN:-}" ]]; then headers+=(-H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN"); fi

          state_code="$(curl -sS --max-time 30 -o /tmp/state -w '%{http_code}' "${headers[@]}" "$BASE/api/queen-state")"
          test "$state_code" = '200'
          jq -e '.ok == true' /tmp/state >/dev/null

          prompts=(
            'Verifica lo stato operativo HIVE usando soltanto il World Model fornito e restituisci un riepilogo conciso. Non eseguire azioni esterne.'
            'Controlla il World Model HIVE e indica in modo conciso eventuali blind spot o limiti di visibilità, senza inventare dati.'
            'Analizza lo stato HIVE disponibile e indica il prossimo controllo operativo sensato basandoti soltanto sulle evidenze fornite.'
            'Verifica coerenza e disponibilità delle informazioni operative HIVE nel World Model e riassumi ciò che è effettivamente noto.'
            'Fornisci un controllo sintetico dello stato HIVE distinguendo fatti osservati da ciò che non è verificabile nel World Model.'
          )

          passes=0
          for i in $(seq 1 20); do
            idx=$(( (i-1) % ${#prompts[@]} ))
            msg="${prompts[$idx]}"
            body="$(jq -nc --arg m "$msg" --arg s "stability-gate-$i" '{message:$m,project_slug:"hive",source:$s}')"
            code="$(curl -sS --max-time 120 -o "/tmp/queen-$i" -w '%{http_code}' -X POST "${headers[@]}" "$BASE/api/queen-command" -d "$body")"
            if [[ "$code" != '200' ]]; then
              echo "CYCLE=$i HTTP=$code FAIL"
              jq '{ok,error,task_id,verification}' "/tmp/queen-$i" 2>/dev/null || true
              exit 20
            fi
            jq -e '.ok == true and .mode == "queen-vnext-aligned" and .verification.verified == true and .verification.independence_group_pass == true and .verification.evidence_grounded == true and .verification.score >= 0.70 and .paid_fallback == false and (.school.event_id != null) and (.world.event_id != null) and (.cognitive.event_id != null)' "/tmp/queen-$i" >/dev/null
            score="$(jq -r '.verification.score' "/tmp/queen-$i")"
            state="$(jq -r '.cognitive.state' "/tmp/queen-$i")"
            passes=$((passes+1))
            echo "CYCLE=$i PASS score=$score cognitive=$state"
            sleep 1
          done

          test "$passes" = '20'
          echo "QUEEN_STABILITY_CONSECUTIVE_PASS=$passes"
          echo 'QUEEN_20X_STABILITY_GATE=PASS'
