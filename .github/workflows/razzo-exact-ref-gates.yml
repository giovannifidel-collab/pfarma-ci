name: RAZZO Exact Ref Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'razzo/project-giovanni-ref.txt'
      - 'razzo/pfarma-ref.txt'
      - '.github/workflows/razzo-exact-ref-gates.yml'
  push:
    branches: [main]
    paths:
      - 'razzo/project-giovanni-ref.txt'
      - 'razzo/pfarma-ref.txt'
      - '.github/workflows/razzo-exact-ref-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: razzo-exact-ref-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-giovanni:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    steps:
      - name: Checkout public control plane
        uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Resolve exact Project Giovanni SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < razzo/project-giovanni-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require private-source token
        env: {TOKEN: "${{ secrets.PFARMA_SOURCE_TOKEN }}"}
        run: test -n "$TOKEN"
      - name: Checkout exact private Project Giovanni commit
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: project-giovanni
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: test "$(git -C project-giovanni rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: project-giovanni
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        working-directory: project-giovanni
        run: npx --yes tsc --noEmit
      - name: Factory tests
        working-directory: project-giovanni
        run: npm run test:factory
      - name: Factory planner smoke
        working-directory: project-giovanni
        run: npm run factory:plan
      - name: Build application with non-operational CI placeholders
        working-directory: project-giovanni
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci_placeholder'
        run: npm run build
      - if: always()
        run: rm -rf project-giovanni

  pfarma:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    steps:
      - name: Checkout public control plane
        uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Resolve exact PFarma SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < razzo/pfarma-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require private-source token
        env: {TOKEN: "${{ secrets.PFARMA_SOURCE_TOKEN }}"}
        run: test -n "$TOKEN"
      - name: Checkout exact private PFarma commit
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: pfarma-cloud
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: test "$(git -C pfarma-cloud rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile Factory
        working-directory: pfarma-cloud
        run: python -m compileall -q factory tools/test_razzo_executor.py
      - name: Compatibility wave tests
        working-directory: pfarma-cloud
        run: python tools/test_razzo_executor.py
      - name: Factory core regression tests
        working-directory: pfarma-cloud
        run: python -m unittest factory.test_razzo_executor factory.test_continuous_loop factory.test_github_worker_runtime -v
      - name: Inventory read-only regression
        working-directory: pfarma-cloud
        run: test ! -f tests/test_inventory_readonly_regression.py || PYTHONPATH=. python tests/test_inventory_readonly_regression.py
      - name: Lots-expiry regression
        working-directory: pfarma-cloud
        run: test ! -f tests/test_lot_expiry_regression.py || PYTHONPATH=. python tests/test_lot_expiry_regression.py
      - name: POS staging regression
        working-directory: pfarma-cloud
        run: test ! -f tests/test_pos_staging_regression.py || PYTHONPATH=. python tests/test_pos_staging_regression.py
      - name: Accounting staging regression
        working-directory: pfarma-cloud
        run: test ! -f tests/test_razzo_accounting_staging_regression.py || PYTHONPATH=. python tests/test_razzo_accounting_staging_regression.py
      - name: Supplier staging regression
        working-directory: pfarma-cloud
        run: test ! -f tests/test_razzo_supplier_staging_regression.py || PYTHONPATH=. python tests/test_razzo_supplier_staging_regression.py
      - name: Replenishment proposal regression
        working-directory: pfarma-cloud
        run: test ! -f tests/test_replenishment_proposal_preview.py || PYTHONPATH=. python tests/test_replenishment_proposal_preview.py
      - name: Replenishment proposal integrity regression
        working-directory: pfarma-cloud
        run: test ! -f tests/test_replenishment_proposal_integrity.py || PYTHONPATH=. python tests/test_replenishment_proposal_integrity.py
      - name: Replenishment proposal verification regression
        working-directory: pfarma-cloud
        run: test ! -f tests/test_replenishment_proposal_verification.py || PYTHONPATH=. python tests/test_replenishment_proposal_verification.py
      - name: Factory planner smoke
        working-directory: pfarma-cloud
        run: python -m factory.plan
      - if: always()
        run: rm -rf pfarma-cloud
