name: HIVE Queen Original Site Deploy

on:
  push:
    branches: [queen-universal-fabric-vnext]
    paths:
      - '.github/workflows/hive-queen-original-site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.HIVE_CF_AIG_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HIVE_CF_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
      HIVE_BASE_URL: ${{ secrets.HIVE_BASE_URL }}
      PRIVATE_SHA: f03c9cf434d59966cabfc2d16a36244aca3d09fa
    steps:
      - name: Preflight Cloudflare Pages authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          code="$(curl -sS -o /tmp/project -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/hive-alveare")"
          test "$code" = 200
          jq -e '.success == true and .result.name == "hive-alveare"' /tmp/project >/dev/null
          echo 'PAGES_PREFLIGHT=PASS'

      - name: Check out exact private HIVE authority source
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Queen + HIVE Field source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$PRIVATE_SHA"
          test -f private-source/cloudflare/functions/api/queen-command.js
          test -f private-source/cloudflare/functions/api/project-register.js
          test -f private-source/cloudflare/public/queen-intent-router.js
          test -f private-source/db/018_hive_field_cell.sql
          grep -q '/api/queen-command' private-source/cloudflare/public/queen-intent-router.js
          grep -q 'hive-field' private-source/cloudflare/public/queen-intent-router.js
          grep -q 'dispatcher avviato' private-source/cloudflare/public/queen-intent-router.js
          grep -q 'queen-intent-router.js' private-source/cloudflare/public/queen-loader.js
          grep -q '/projects?on_conflict=slug' private-source/cloudflare/functions/api/project-register.js
          grep -q 'deterministic-world-synth' private-source/cloudflare/functions/api/queen-command.js
          grep -q 'HIVE_GITHUB_DISPATCH_TOKEN' private-source/cloudflare/functions/api/queen-command.js
          grep -q 'hive_field_execute' private-source/cloudflare/functions/api/queen-command.js
          grep -q 'patchSafely' private-source/cloudflare/public/world-awareness.js
          grep -q 'observer?.disconnect' private-source/cloudflare/public/world-awareness.js
          echo 'QUEEN_NATURAL_INTENT_ROUTER=PASS'
          echo 'QUEEN_EXECUTION_DISPATCH_SOURCE=PASS'
          echo 'HIVE_FIELD_REGISTRY_SOURCE=PASS'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull Pages config and bind Workers AI
        working-directory: private-source/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          npx --yes wrangler@4 pages download config hive-alveare --force >/tmp/wrangler-download.log 2>&1
          config=''
          for f in wrangler.jsonc wrangler.json wrangler.toml; do [[ -f "$f" ]] && { config="$f"; break; }; done
          test -n "$config" || { cat /tmp/wrangler-download.log; exit 40; }
          if [[ "$config" == *.toml ]]; then
            grep -Eq '^\s*\[ai\]\s*$' "$config" || printf '\n[ai]\nbinding = "AI"\n' >> "$config"
            grep -Eq '^\s*\[env\.production\.ai\]\s*$' "$config" || printf '\n[env.production.ai]\nbinding = "AI"\n' >> "$config"
          else
            python3 -c 'from pathlib import Path; import sys,re; p=Path(sys.argv[1]); s=p.read_text(); i=s.find("{"); assert i>=0; s=s if re.search(r"(?m)^\s*[\"\x27]ai[\"\x27]\s*:",s) else s[:i+1]+"\n  \"ai\": {\"binding\": \"AI\"},"+s[i+1:]; p.write_text(s)' "$config"
          fi
          echo 'WORKERS_AI_BINDING_CONFIGURED=PASS'

      - name: Bind Queen GitHub dispatcher secret
        working-directory: private-source/cloudflare
        shell: bash
        env:
          HIVE_GITHUB_DISPATCH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HIVE_GITHUB_DISPATCH_TOKEN"
          printf '%s' "$HIVE_GITHUB_DISPATCH_TOKEN" | npx --yes wrangler@4 pages secret put HIVE_GITHUB_DISPATCH_TOKEN --project-name hive-alveare >/tmp/pages-secret.log 2>&1
          echo 'QUEEN_GITHUB_DISPATCH_SECRET=PASS'

      - name: Deploy Queen
        working-directory: private-source/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy public --project-name hive-alveare --branch main
          echo 'QUEEN_ORIGINAL_SITE_DEPLOY=PASS'

      - name: Wait for propagation
        run: sleep 15

      - name: Verify canonical runtime, Queen cycles and dispatcher handoff
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HIVE_BASE_URL:-https://hive-alveare.pages.dev}"; BASE="${BASE%/}"
          headers=(-H 'Content-Type: application/json')
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            headers+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          if [[ -n "${HIVE_RUNTIME_BEARER_TOKEN:-}" ]]; then headers+=(-H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN"); fi
          code="$(curl -sS --max-time 30 -o /tmp/state -w '%{http_code}' "${headers[@]}" "$BASE/api/queen-state")"
          test "$code" = 200
          jq -e '.ok == true and .state.canonical.source_lock.school_core_blob != null and .state.canonical.source_lock.cognitive_core_blob != null' /tmp/state >/dev/null
          prompts=(
            'Verifica lo stato operativo HIVE usando soltanto il World Model fornito. Non eseguire azioni esterne.'
            'Controlla il World Model HIVE e indica eventuali blind spot senza inventare dati.'
            'Distingui fatti osservati da ciò che non è verificabile nel World Model.'
          )
          for i in 1 2 3; do
            body="$(jq -nc --arg m "${prompts[$((i-1))]}" --arg s "post-deploy-gate-$i" '{message:$m,project_slug:"hive",source:$s}')"
            code="$(curl -sS --max-time 120 -o "/tmp/q$i" -w '%{http_code}' -X POST "${headers[@]}" "$BASE/api/queen-command" -d "$body")"
            test "$code" = 200
            jq -e '.ok == true and .mode == "queen-vnext-aligned" and .verification.verified == true and .verification.independence_group_pass == true and .verification.evidence_grounded == true and .paid_fallback == false' "/tmp/q$i" >/dev/null
            echo "POST_DEPLOY_CYCLE=$i PASS"
          done
          body="$(jq -nc --arg m 'Completa il collegamento operativo di HIVE Field verificando il dispatcher senza modificare applicazione.' '{message:$m,project_slug:"hive-field",source:"post-deploy-execution-gate"}')"
          code="$(curl -sS --max-time 120 -o /tmp/exec -w '%{http_code}' -X POST "${headers[@]}" "$BASE/api/queen-command" -d "$body")"
          echo "QUEEN_EXECUTION_HTTP=$code"
          if [[ "$code" != 200 ]]; then jq '{ok,error,task_id,verification,execution}' /tmp/exec 2>/dev/null || cat /tmp/exec; exit 1; fi
          if ! jq -e '.ok == true and .verification.verified == true and .execution.dispatched == true and .execution.status == "queued" and .execution.mode == "proof" and .paid_fallback == false' /tmp/exec >/dev/null; then jq '{ok,error,task_id,verification,execution}' /tmp/exec; exit 1; fi
          echo 'QUEEN_EXECUTION_DISPATCH_GATE=PASS'
          echo 'QUEEN_POST_DEPLOY_GATE=PASS'

      - name: Remove private source checkout
        if: always()
        run: rm -rf private-source
