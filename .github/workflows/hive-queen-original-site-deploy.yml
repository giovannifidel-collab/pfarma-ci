name: HIVE Queen Original Site Deploy

on:
  push:
    branches: [queen-universal-fabric-vnext]
    paths:
      - '.github/workflows/hive-queen-original-site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.HIVE_CF_AIG_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HIVE_CF_ACCOUNT_ID }}
      SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
      HIVE_BASE_URL: ${{ secrets.HIVE_BASE_URL }}
      PRIVATE_SHA: aee297f67bdd3879cdbb29c89b81ea41b8a2093b
    steps:
      - name: Preflight Cloudflare Pages authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          code="$(curl -sS -o /tmp/project -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/hive-alveare")"
          echo "PAGES_PREFLIGHT_HTTP=$code"
          test "$code" = '200'
          jq -e '.success == true and .result.name == "hive-alveare"' /tmp/project >/dev/null
          echo 'PAGES_PREFLIGHT=PASS'

      - name: Check out exact private HIVE authority source
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify authority source and stable Queen UI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$PRIVATE_SHA"
          test -f private-source/cloudflare/functions/api/queen-command.js
          test -f private-source/cloudflare/functions/_lib/queen-runtime.js
          test -f private-source/cloudflare/public/queen-brain.js
          test -f private-source/cloudflare/public/queen-ui-stability.js
          grep -q '/api/queen-command' private-source/cloudflare/public/queen-brain.js
          grep -q 'fetchLiveWorld' private-source/cloudflare/functions/api/queen-command.js
          grep -q 'deterministic-world-synth' private-source/cloudflare/functions/api/queen-command.js
          grep -q 'evidence_grounded:true' private-source/cloudflare/functions/api/queen-command.js
          grep -q 'COMPETENCY_MODEL' private-source/cloudflare/functions/_lib/queen-runtime.js
          grep -q 'CAPABILITY_MESH' private-source/cloudflare/functions/_lib/queen-runtime.js
          grep -q 'queen-ui-stability.js' private-source/cloudflare/public/queen-loader.js
          ! grep -q "import('./queen-top.js" private-source/cloudflare/public/runtime-health.js
          ! grep -q "import('./queen-brain.js" private-source/cloudflare/public/runtime-health.js
          echo 'QUEEN_UI_SINGLE_LOAD=PASS'
          echo 'QUEEN_DETERMINISTIC_WORLD_SYNTH_SOURCE=PASS'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull Pages config and bind Workers AI in production
        working-directory: private-source/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          npx --yes wrangler@4 pages download config hive-alveare --force >/tmp/wrangler-download.log 2>&1
          config=''
          for f in wrangler.jsonc wrangler.json wrangler.toml; do [[ -f "$f" ]] && { config="$f"; break; }; done
          test -n "$config" || { cat /tmp/wrangler-download.log; exit 40; }
          echo "WRANGLER_CONFIG=$config"
          if [[ "$config" == *.toml ]]; then
            grep -Eq '^\s*\[ai\]\s*$' "$config" || printf '\n[ai]\nbinding = "AI"\n' >> "$config"
            grep -Eq '^\s*\[env\.production\.ai\]\s*$' "$config" || printf '\n[env.production.ai]\nbinding = "AI"\n' >> "$config"
            grep -Eq '^\s*\[env\.production\.ai\]\s*$' "$config"
          else
            python3 -c 'from pathlib import Path; import sys,re; p=Path(sys.argv[1]); s=p.read_text(); i=s.find("{"); assert i>=0; s=s if re.search(r"(?m)^\s*[\"\x27]ai[\"\x27]\s*:",s) else s[:i+1]+"\n  \"ai\": {\"binding\": \"AI\"},"+s[i+1:]; p.write_text(s)' "$config"
            grep -Eq '"ai"\s*:' "$config"
          fi
          rm -f /tmp/wrangler-download.log
          echo 'WORKERS_AI_BINDING_CONFIGURED=PASS'

      - name: Deploy original HIVE Pages project
        working-directory: private-source/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy public --project-name hive-alveare --branch main
          echo 'QUEEN_ORIGINAL_SITE_DEPLOY=PASS'

      - name: Wait for propagation
        shell: bash
        run: sleep 15

      - name: Verify canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HIVE_BASE_URL:-https://hive-alveare.pages.dev}"; BASE="${BASE%/}"
          args=(-sS --max-time 30 -o /tmp/state -w '%{http_code}')
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then args+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"); fi
          if [[ -n "${HIVE_RUNTIME_BEARER_TOKEN:-}" ]]; then args+=(-H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN"); fi
          code="$(curl "${args[@]}" "$BASE/api/queen-state")"
          echo "QUEEN_STATE_HTTP=$code"
          test "$code" = '200'
          jq -e '.ok == true and .state.canonical.source_lock.school_core_blob != null and .state.canonical.source_lock.cognitive_core_blob != null' /tmp/state >/dev/null
          echo 'QUEEN_CANONICAL_RUNTIME=PASS'

      - name: Run 20 consecutive real Queen cycles
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HIVE_BASE_URL:-https://hive-alveare.pages.dev}"; BASE="${BASE%/}"
          headers=(-H 'Content-Type: application/json')
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            headers+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          if [[ -n "${HIVE_RUNTIME_BEARER_TOKEN:-}" ]]; then headers+=(-H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN"); fi

          prompts=(
            'Verifica lo stato operativo HIVE usando soltanto il World Model fornito e restituisci un riepilogo conciso. Non eseguire azioni esterne.'
            'Controlla il World Model HIVE e indica in modo conciso eventuali blind spot o limiti di visibilità, senza inventare dati.'
            'Analizza lo stato HIVE disponibile e indica il prossimo controllo operativo sensato basandoti soltanto sulle evidenze fornite.'
            'Verifica coerenza e disponibilità delle informazioni operative HIVE nel World Model e riassumi ciò che è effettivamente noto.'
            'Fornisci un controllo sintetico dello stato HIVE distinguendo fatti osservati da ciò che non è verificabile nel World Model.'
          )

          passes=0
          for i in $(seq 1 20); do
            idx=$(( (i-1) % ${#prompts[@]} ))
            msg="${prompts[$idx]}"
            body="$(jq -nc --arg m "$msg" --arg s "stability-gate-$i" '{message:$m,project_slug:"hive",source:$s}')"
            code="$(curl -sS --max-time 120 -o "/tmp/queen-$i" -w '%{http_code}' -X POST "${headers[@]}" "$BASE/api/queen-command" -d "$body")"
            if [[ "$code" != '200' ]]; then
              echo "CYCLE=$i HTTP=$code FAIL"
              jq '{ok,error,task_id,verification,route}' "/tmp/queen-$i" 2>/dev/null || true
              exit 20
            fi
            jq -e '.ok == true and .mode == "queen-vnext-aligned" and .route == "deterministic-world-synth" and .verification.verified == true and .verification.independence_group_pass == true and .verification.evidence_grounded == true and .verification.score >= 0.70 and .paid_fallback == false and (.school.event_id != null) and (.world.event_id != null) and (.cognitive.event_id != null)' "/tmp/queen-$i" >/dev/null
            score="$(jq -r '.verification.score' "/tmp/queen-$i")"
            state="$(jq -r '.cognitive.state' "/tmp/queen-$i")"
            passes=$((passes+1))
            echo "CYCLE=$i PASS score=$score cognitive=$state route=deterministic-world-synth"
            sleep 1
          done

          test "$passes" = '20'
          echo "QUEEN_STABILITY_CONSECUTIVE_PASS=$passes"
          echo 'QUEEN_20X_STABILITY_GATE=PASS'

      - name: Remove private source checkout
        if: always()
        shell: bash
        run: rm -rf private-source
