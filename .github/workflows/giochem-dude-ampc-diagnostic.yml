name: GIOCHEM DUD-E AMPC Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/giochem-dude-ampc-diagnostic.yml'

permissions:
  contents: read

env:
  GIOCHEM_OPENFE_DATA: /tmp/giochem-openfe

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve private source token
        shell: bash
        env:
          GIOCHEM_TOKEN: ${{ secrets.GIOCHEM_SOURCE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          token="${GIOCHEM_TOKEN:-${FALLBACK_TOKEN:-}}"
          test -n "$token"
          echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Checkout diagnostic source
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/giochem
          ref: 83cf7496231225d0c74f63f517fe31a54b1b02ce
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real receptor-preparation stack
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y autodock-vina
          python -m pip install --disable-pip-version-check --no-cache-dir -r scientific-api/requirements.txt
          mkdir -p "$GIOCHEM_OPENFE_DATA"
      - name: Verify AMPC translation and Meeko receptor PDBQT
        working-directory: private-source
        run: python scripts/test_dude_ampc_receptor_prep.py
      - name: Clean private source
        if: always()
        run: rm -rf private-source
