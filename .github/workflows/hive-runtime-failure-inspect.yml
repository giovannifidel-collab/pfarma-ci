name: HIVE Queen Runtime Failure Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hive-runtime-failure-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect latest private runtime failure without exposing secrets
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${SOURCE_TOKEN:-}" ]] || exit 2
          AUTH=(-H "Authorization: Bearer $SOURCE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          curl -fsS "${AUTH[@]}" \
            'https://api.github.com/repos/giovannifidel-collab/hive-alveare/actions/workflows/queen-runtime.yml/runs?per_page=1' \
            -o /tmp/runs.json
          RUN_ID="$(jq -r '.workflow_runs[0].id' /tmp/runs.json)"
          echo "LATEST_RUNTIME_RUN=$RUN_ID"

          curl -fsS "${AUTH[@]}" \
            "https://api.github.com/repos/giovannifidel-collab/hive-alveare/actions/runs/$RUN_ID/jobs" \
            -o /tmp/jobs.json
          JOB_ID="$(jq -r '.jobs[0].id' /tmp/jobs.json)"
          echo "LATEST_RUNTIME_JOB=$JOB_ID"

          curl -fsSL "${AUTH[@]}" \
            "https://api.github.com/repos/giovannifidel-collab/hive-alveare/actions/jobs/$JOB_ID/logs" \
            -o /tmp/job.log

          grep -Eai 'HIVE_RUNTIME|CF_ACCESS|Authentication|auth|HTTP_[0-9]+|HTTP [0-9]+|302|401|403|Neon Data API|error|failed|waiting_transport|runtime' /tmp/job.log \
            | sed -E 's/(Bearer|token|secret|client[_ -]?secret)[=: ]+[^ ]+/\1=[REDACTED]/Ig' \
            | tail -n 120 || true

          echo '=== RUNTIME FAILURE INSPECTION COMPLETE ==='
