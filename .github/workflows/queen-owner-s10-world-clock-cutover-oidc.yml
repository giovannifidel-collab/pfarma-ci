      - name: Stage one disabled Clock Worker with no Cron Trigger
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$S10_CLOCK_OWNER_SIGNED" = TRUE
          test "$(date -u +%s)" -lt "$S10_CLOCK_OWNER_EXPIRES"
