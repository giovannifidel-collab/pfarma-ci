          test "$(date -u +%s)" -lt "$S10_CLOCK_OWNER_EXPIRES"
          printf '%s' "$GH_WORLD_CLOCK_TOKEN" |
            npx --yes wrangler@4.139.0 secret put GH_WORLD_DISPATCH_TOKEN \
              --name "$WORKER_NAME" --config ops/queen/s10/world-clock/wrangler.disabled.jsonc >/dev/null
          echo 'S10_CLOCK_ENCRYPTED_DEDICATED_TOKEN_INSTALLED_NO_LOG=PASS'
      - name: Merge exactly the Owner-signed original World source cutover once
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
