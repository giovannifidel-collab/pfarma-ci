          echo 'S10_CLOCK_FINE_GRAINED_GITHUB_READ_AND_CLOUDFLARE_ACCOUNT=PASS'
      - name: Checkout exact unmerged signed World clock source and run no-secret tests
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
