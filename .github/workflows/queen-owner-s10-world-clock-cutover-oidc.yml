                 (grep -Fq 'WORLD_OBSERVATION_HEARTBEAT=RECORDED_NO_S1_WAKE' <<< "$logs" ||
                  grep -Fq 'WORLD_SEMANTIC_CHANGE=true' <<< "$logs" ||
                  grep -Fq 'WORLD_OBSERVATION_ALREADY_CURRENT=SKIP_NO_S1_WAKE' <<< "$logs"); then
                verified_times+=("$created")
              fi
            done
            if [ "${#verified_times[@]}" -ge 2 ]; then
              a="$(date -u -d "${verified_times[0]}" +%s)"
              b="$(date -u -d "${verified_times[1]}" +%s)"
              span="$((a>b?a-b:b-a))"
              if [ "$span" -ge 480 ]; then
                source="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-world-state.json --jq .content | tr -d '\n' | base64 -d)"
                GENERATED_AT="$(jq -r '.generated_at // empty' <<< "$source")"
                export GENERATED_AT
                python3 - <<'PY'
          import os,datetime
          ts=os.environ['GENERATED_AT']
          seen=datetime.datetime.fromisoformat(ts.replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-seen).total_seconds()
          if not 0<=age<=1800:raise SystemExit('S10_TRUE_WORLD_SOURCE_OVER_1800_SECONDS')
          print('S10_WORLD_TRUE_SOURCE_AGE_SECONDS='+str(round(age)))
          PY
                echo 'S10_G3_TWO_INDEPENDENT_CLOCK_MINUTE_WORLD_OBSERVATIONS=PASS'
                echo 'S10_G3_WORLD_FRESHNESS_AT_READONLY_POSTFLIGHT=PASS'
                echo 'S10_G3_CLOCK_POSTFLIGHT_NEVER_TRAINED_SCHOOL_OR_DISPATCHED_S1_DIRECTLY=TRUE'
                exit 0
              fi
            fi
            echo "S10_G3_WAITING_FOR_TWO_REAL_WORLD_RUNS poll=$attempt"
            sleep 35
          done
          echo 'S10_G3_NO_TWO_CONFIRMED_REAL_CLOCK_WORLD_RUNS_FAIL_CLOSED'
          exit 47
      - name: Attempt fail-safe rollback only for one signed partial cutover
        if: ${{ failure() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set +e
          test "$S10_CLOCK_OWNER_SIGNED" = TRUE || exit 0
          if [ "$S10_CLOCK_WORKER_STAGED" = TRUE ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx --yes wrangler@4.139.0 deploy --config ops/queen/s10/world-clock/wrangler.disabled.jsonc >/dev/null 2>&1
            echo 'S10_CLOCK_FAILURE_ROLLBACK_DISABLED_CLOUDFLARE=ATTEMPTED'
          fi
          if [ "$S10_CLOCK_MERGED" = TRUE ]; then
            current="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml --jq .sha)"
            if [ "$current" = "$EXPECTED_WORLD_NEW_BLOB" ]; then
              original="$(gh api 'repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml?ref=eaaf702e3548e12c5ec34c48fabb5d94264be5d3' --jq .content | tr -d '\n')"
              gh api --method PUT repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml \
                -f message='rollback(s10): restore original GitHub World cron after failed Owner clock cutover' \
                -f content="$original" -f sha="$current" >/dev/null
              echo 'S10_CLOCK_FAILURE_ROLLBACK_ORIGINAL_GITHUB_CRON=ATTEMPTED'
            else
              echo 'S10_CLOCK_FAILURE_ROLLBACK_SOURCE_DRIFT_FAIL_CLOSED'
            fi
          fi
          echo 'S10_CLOCK_FAILED_RELEASE_REQUIRES_OWNER_AUDIT_NO_TERMINAL_PASS'