          account="$(jq -r 'if .success and (.result|length)==1 then .result[0].id else empty end' <<< "$response")"
          [[ "$account" =~ ^[a-f0-9]{32}$ ]] || { echo S10_CLOCK_CF_ACCOUNT_AMBIGUOUS_DENY; exit 43; }
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
