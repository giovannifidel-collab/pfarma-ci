            -H "Authorization: Bearer $GH_WORLD_CLOCK_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/giovannifidel-collab/pfarma-ci/actions/workflows/hive-world-sync.yml)"
          test "$status" = 200 || { echo "S10_CLOCK_GITHUB_TOKEN_SCOPE_READ_HTTP=$status"; exit 42; }
          response="$(curl -sS --max-time 22 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
