          echo 'S10_CLOCK_WORKER_STAGED_WITH_CRON_DISABLED=PASS'
          echo 'S10_CLOCK_WORKER_STAGED=TRUE' >> "$GITHUB_ENV"
      - name: Upload ONE encrypted dedicated GitHub World token to disabled Cloudflare Worker
        if: github.event_name == 'workflow_dispatch'
