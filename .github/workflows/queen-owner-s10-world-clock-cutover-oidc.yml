name: Queen Owner S10 ONE Existing Pages and Worker Manual Redirect Recovery OIDC
on:
  push:
    branches: [release/s10-oidc-existing-pages-token-20261119, fix/s10-owner-broker-live-one-clock-20261120, fix/s10-owner-single-pages-clock-recovery-20261120, fix/s10-owner-pr1315-broker-transport-diagnostic-oidc-20261120, fix/s10-owner-dual-cloudflare-manual-redirect-oidc-20261120]
    paths: [.github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml]
  workflow_dispatch:
    inputs:
      approve_exact_hive112_relay1317_manual_redirect_recovery:
        description: 'OWNER fresh approval: HIVE PR112 + relay PR1317 manual redirect repair, one World clock and rollback; no new PAT'
        type: boolean
        required: true
        default: false
permissions: {contents: read, actions: read, id-token: write}
concurrency:
  group: queen-s10-owner-one-existing-pages-clock-cutover
  cancel-in-progress: false
jobs:
  source-only-ci:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Only the pre-existing Owner workflow file changed, no production mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only origin/main...HEAD)" = .github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml
          npx --yes prettier@3 --parser yaml .github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml').read_text()
          start="          node --input-type=module <<'JS'\\n".replace('\\n','\n')
          a=s.index(start)+len(start)
          b=s.index("\\n          JS".replace('\\n','\n'),a)
          js='\n'.join(x[10:] if x.startswith('          ') else x for x in s[a:b].splitlines())
          Path('/tmp/s10-owner-existing-pages-oidc.mjs').write_text(js+'\n')
          PY
          node --check /tmp/s10-owner-existing-pages-oidc.mjs
          grep -Fq 'S10_OWNER_OIDC_RS256_EXISTING_PAGES=PASS' .github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml
          grep -Fq 'S10_CLOCK_TWO_GENUINE_WORLD_OBSERVATIONS=PASS' .github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml
          grep -Fq 'CF_ACCESS_CLIENT_SECRET' .github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml
          ! grep -Fq 'S10_WORLD_CLOCK_GH_TOKEN' .github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml
          echo S10_OWNER_SINGLE_RELEASE_SOURCE_ONLY_NO_AUTO_DEPLOY=PASS
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 48
    environment: pfarma-ci-trusted
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_FALLBACK: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      OWNER_APPROVAL: ${{ inputs.approve_exact_hive112_relay1317_manual_redirect_recovery }}
      HIVE_BEFORE: d5d237db904f810aacad90a3ff86dade3bed5969
      HIVE_POINTER_BEFORE: 88000e9ff70ffc044f424d469645573e01738a8b
      BROKER_BLOB: 0b4e30beac8c45d9b6de3c6e501be3b8f3a366f3
      RELAY_BEFORE: 17484b93cf95266b874d2f8c9ce6667687c96e95
      REPAIR_PR_SHA: 8aa63eef16d605e9273af22967102e9cc173cc2e
      HIVE_REPAIR_PR_SHA: ba66f915fb40e7b3d3d5858e102a5b49663176d1
      NEW_BROKER_BLOB: 35d152ecdbda1504d89cd5f61b14cf2680564553
      NEW_WORKER_BLOB: 526e2a646f7625e541c3336c7c52af012618788d
      OLD_WORLD_BLOB: 398b478cebcdd979953aa8a014ef13fbf205c65b
      NEW_WORLD_BLOB: ece98197633f826b181a3c0ab73effcbf2608b4f
      OLD_POINTER_BLOB: b2ee2d50e3ef675efc704b9c19cbdbdf8de09a28
      ORIGINAL_S1_BLOB: a0b75a09ab2ff8e37a49d6c4ebfcd2b3c1322ffe
      WORKER_NAME: hive-queen-world-clock
    steps:
      - name: Checkout exact Owner signer, no persistent GitHub credentials
        uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify preceding signed release FAILED and rollback actually restored one original World cron
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_TRIGGERING_ACTOR" = giovannifidel-collab
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test "$OWNER_APPROVAL" = true
          test -n "$GH_TOKEN"
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/44779423425 |
            jq -e '.conclusion=="failure" and .status=="completed" and .run_attempt==1 and .head_sha=="c8093d9192f680fe74680ac48a18d54732e170ad"' >/dev/null
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = "$HIVE_BEFORE"
          test "$(gh api repos/giovannifidel-collab/hive-alveare/contents/cloudflare/functions/api/s10-world-clock-dispatch.js --jq .sha)" = "$BROKER_BLOB"
          # Only authentic World snapshot and previous rollback are allowed to drift on main.
          nowsha="$(gh api repos/giovannifidel-collab/pfarma-ci/branches/main --jq .commit.sha)"
          gh api "repos/giovannifidel-collab/pfarma-ci/compare/$RELAY_BEFORE...$nowsha" |
            jq -e '.status=="ahead" and
              (.files|map(.filename)|all(.=="hive-world-state.json" or
                .==".github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml" or
                .==".github/workflows/hive-world-sync.yml" or
                .=="bundle/pfarma-social.bundle.json" or
                .=="receipts/pfarma-social-ci.json"))' >/dev/null
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml --jq .sha)" = "$(git hash-object .github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml)"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml --jq .sha)" = "$OLD_WORLD_BLOB"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/queen-s1-event-ingress.yml --jq .sha)" = "$ORIGINAL_S1_BLOB"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .sha)" = "$OLD_POINTER_BLOB"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')" = "$HIVE_BEFORE"
          gh api repos/giovannifidel-collab/pfarma-ci/pulls/1317 |
            jq -e --arg h "$REPAIR_PR_SHA" '.state=="open" and .merged==false and .draft==false and .head.sha==$h and .base.ref=="main"' >/dev/null
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/44783275382 |
            jq -e --arg h "$REPAIR_PR_SHA" '.status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha==$h' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/pulls/112 |
            jq -e --arg h "$HIVE_REPAIR_PR_SHA" '.state=="open" and .merged==false and .draft==false and .head.sha==$h and .base.ref=="main"' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/actions/runs/44783141480 |
            jq -e --arg h "$HIVE_REPAIR_PR_SHA" '.status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha==$h' >/dev/null
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/ops/queen/s10/world-clock/worker.mjs --jq .sha)" = 637ec2da491824ce695659223f2ac1ae15866b89
          echo S10_EXACT_OWNER_HOTFIX_AND_PRIOR_ROLLBACK_GITHUB_SOURCE_PREFLIGHT=PASS
      - name: Verify GitHub-issued Owner OIDC RS256, no previous signature or unsigned release
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {createPublicKey,verify} from 'node:crypto';
          import {appendFileSync} from 'node:fs';
          const e=process.env;
          const reject=x=>{throw Error('S10_OWNER_OIDC_DENY_'+x)};
          const aud='hive-queen-s10-manual-redirect-pages112-worker1317-v5';
          if(e.OWNER_APPROVAL!=='true'||!e.ACTIONS_ID_TOKEN_REQUEST_URL||!e.ACTIONS_ID_TOKEN_REQUEST_TOKEN)reject('NO_APPROVAL');
          const link=e.ACTIONS_ID_TOKEN_REQUEST_URL+(e.ACTIONS_ID_TOKEN_REQUEST_URL.includes('?')?'&':'?')+'audience='+encodeURIComponent(aud);
          const response=await fetch(link,{headers:{Authorization:'Bearer '+e.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!response.ok)reject('ISSUER');
          const parts=(await response.json()).value?.split('.')||[];
          if(parts.length!==3)reject('PARTS');
          const dec=x=>Buffer.from(x.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-x.length%4)%4),'base64');
          const h=JSON.parse(dec(parts[0])),c=JSON.parse(dec(parts[1]));
          if(h.alg!=='RS256'||!h.kid||h.jwk||h.jku||h.x5u||h.crit)reject('HEADER');
          const claim={iss:'https://token.actions.githubusercontent.com',aud,
           repository:'giovannifidel-collab/pfarma-ci',repository_id:'1308677897',
           repository_owner_id:'305755860',actor:'giovannifidel-collab',actor_id:'305755860',
           event_name:'workflow_dispatch',environment:'pfarma-ci-trusted',ref:'refs/heads/main',
           runner_environment:'github-hosted',
           workflow_ref:'giovannifidel-collab/pfarma-ci/.github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml@refs/heads/main'};
          for(const [k,v] of Object.entries(claim))if(String(c[k])!==v)reject('CLAIM_'+k);
          const now=Date.now();
          if(c.sha!==e.GITHUB_SHA||Number(c.run_id)!==Number(e.GITHUB_RUN_ID)||Number(c.run_attempt)!==1||
             !Number.isSafeInteger(c.exp)||!Number.isSafeInteger(c.iat)||c.exp<=c.iat||
             c.exp-c.iat>900||c.exp*1000<=now||now-c.iat*1000>300000||c.iat*1000>now+30000)reject('TIME');
          const jwks=await fetch('https://token.actions.githubusercontent.com/.well-known/jwks');
          if(!jwks.ok)reject('JWKS');
          const k=(await jwks.json()).keys?.find(x=>x.kid===h.kid&&x.kty==='RSA'&&x.use==='sig'&&(!x.alg||x.alg==='RS256'));
          if(!k||!verify('RSA-SHA256',Buffer.from(parts[0]+'.'+parts[1]),createPublicKey({key:k,format:'jwk'}),dec(parts[2])))reject('SIGNATURE');
          appendFileSync(e.GITHUB_ENV,'S10_OWNER_SIGNED=TRUE\nS10_OWNER_EXPIRES='+String(Math.floor(now/1000)+900)+'\n');
          console.log('S10_OWNER_OIDC_RS256_EXISTING_PAGES=PASS');
          console.log('S10_OWNER_EXACT_HIVE112_RELAY1317_MANUAL_REDIRECT_NO_NEW_PAT=AUTHORIZED');
          JS
      - name: Verify existing Access service secrets, Pages binding and unique Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test "$S10_OWNER_SIGNED" = TRUE
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          test -n "$CF_PRIMARY$CF_FALLBACK"
          export CLOUDFLARE_API_TOKEN="${CF_PRIMARY:-$CF_FALLBACK}"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          account="$(curl -sS --fail --max-time 22 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts?per_page=50)"
          aid="$(jq -r 'if .success==true and (.result|length)==1 then .result[0].id else empty end' <<< "$account")"
          [[ "$aid" =~ ^[0-9a-f]{32}$ ]] || exit 42
          echo "CLOUDFLARE_ACCOUNT_ID=$aid" >> "$GITHUB_ENV"
          pages="$(curl -sS --fail --max-time 22 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$aid/pages/projects/hive-alveare")"
          jq -e '.success==true and .result.deployment_configs.production.env_vars.HIVE_GITHUB_DISPATCH_TOKEN.type=="secret_text"' <<< "$pages" >/dev/null
          echo S10_ORIGINAL_PAGES_TOKEN_AND_EXISTING_ACCESS_SERVICE_PAIR=PASS
      - name: Verify previous CF rollback with no live cron and existing two encrypted Access secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$S10_OWNER_SIGNED" = TRUE
          sched="$(curl -sS --fail --max-time 22 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules")"
          jq -e '.success==true and (((.result.schedules // .result)|length)==0)' <<< "$sched" >/dev/null
          enc="$(curl -sS --fail --max-time 22 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets")"
          jq -e '.success==true and ([.result[].name]|index("CF_ACCESS_CLIENT_ID")!=null and index("CF_ACCESS_CLIENT_SECRET")!=null)' <<< "$enc" >/dev/null
          echo S10_PREVIOUS_CF_WORKER_ROLLBACK_NO_CRON_AND_REUSED_ENCRYPTED_ACCESS=PASS
      - name: Checkout exactly approved Cloudflare Worker redirect PR1317 and rerun negative gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin refs/heads/fix/s10-worker-cloudflare-manual-redirect-20261120
          git checkout --detach "$REPAIR_PR_SHA"
          test "$(git rev-parse HEAD)" = "$REPAIR_PR_SHA"
          test "$(git hash-object ops/queen/s10/world-clock/worker.mjs)" = "$NEW_WORKER_BLOB"
          git show 6670ef862ef971785222a7a55b9834ca78c24f0e:.github/workflows/hive-world-sync.yml > .github/workflows/hive-world-sync.yml
          test "$(git hash-object .github/workflows/hive-world-sync.yml)" = "$NEW_WORLD_BLOB"
          echo S10_EPHEMERAL_ONLY_APPROVED_WORLD_SOURCE_NEGATIVE_TEST=PASS
          node --test ops/queen/s10/world-clock/tests/worker.test.mjs
          node --test ops/queen/s10/tests/world-observation-publication.test.mjs
          ! grep -Fq 'raw.githubusercontent.com' ops/queen/s10/world-clock/worker.mjs
          ! grep -Fq 'api.github.com' ops/queen/s10/world-clock/worker.mjs
          echo S10_PR1317_EXACT_MANUAL_REDIRECT_NEGATIVE_TESTS=PASS
      - name: Stage disabled Worker, upload ONLY existing encrypted Access service credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$S10_OWNER_SIGNED" = TRUE
          test "$(date -u +%s)" -lt "$S10_OWNER_EXPIRES"
          npx --yes wrangler@4.139.0 deploy --config ops/queen/s10/world-clock/wrangler.disabled.jsonc
          echo S10_WORKER_STAGED_DISABLED=TRUE >> "$GITHUB_ENV"
          printf '%s' "$CF_ACCESS_CLIENT_ID" | npx --yes wrangler@4.139.0 secret put CF_ACCESS_CLIENT_ID --name "$WORKER_NAME" --config ops/queen/s10/world-clock/wrangler.disabled.jsonc >/dev/null
          printf '%s' "$CF_ACCESS_CLIENT_SECRET" | npx --yes wrangler@4.139.0 secret put CF_ACCESS_CLIENT_SECRET --name "$WORKER_NAME" --config ops/queen/s10/world-clock/wrangler.disabled.jsonc >/dev/null
          echo S10_EXISTING_ACCESS_TWO_WORKER_SECRETS_ENCRYPTED_NO_NEW_PAT=PASS
      - name: Owner-sign merge exact HIVE Pages PR112 and VERIFY deployed original signed broker
        shell: bash
        run: |
          set -euo pipefail
          test "$S10_OWNER_SIGNED" = TRUE
          test "$(date -u +%s)" -lt "$S10_OWNER_EXPIRES"
          test "$S10_WORKER_STAGED_DISABLED" = TRUE
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = "$HIVE_BEFORE"
          test "$(gh api repos/giovannifidel-collab/hive-alveare/contents/cloudflare/functions/api/s10-world-clock-dispatch.js --jq .sha)" = "$BROKER_BLOB"
          gh api -X PUT repos/giovannifidel-collab/hive-alveare/pulls/112/merge             -f sha="$HIVE_REPAIR_PR_SHA" -f merge_method=merge             -f commit_title='release(s10): Cloudflare-supported manual redirects in original signed Pages broker' |
              jq -e '.merged==true' >/dev/null
          test "$(gh api repos/giovannifidel-collab/hive-alveare/contents/cloudflare/functions/api/s10-world-clock-dispatch.js --jq .sha)" = "$NEW_BROKER_BLOB"
          hive_sha="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)"
          [[ "$hive_sha" =~ ^[a-f0-9]{40}$ ]] || exit 51
          echo "S10_NEW_HIVE_SHA=$hive_sha" >> "$GITHUB_ENV"
          echo S10_OWNER_MERGED_EXACT_HIVE_PAGES_PR112=PASS
          # Reject stale prior Pages deployments, even if their endpoint replies 400.
          deployed=false
          for i in $(seq 1 48); do
            project="$(curl -sS --fail --max-time 22 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/hive-alveare")"
            if jq -e --arg sha "$hive_sha" '.success==true and .result.canonical_deployment.deployment_trigger.metadata.commit_hash==$sha and .result.canonical_deployment.latest_stage.status=="success"' <<< "$project" >/dev/null; then
              deployed=true; break
            fi
            sleep 10
          done
          test "$deployed" = true || { echo S10_NEW_PAGES_BROKER_PRODUCTION_DEPLOYMENT_UNVERIFIED=FAIL_CLOSED; exit 52; }
          echo S10_NEW_PAGES_BROKER_EXACT_PRODUCTION_SHA=PASS
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          url='https://hive-alveare.pages.dev/api/s10-world-clock-dispatch'
          h={'Content-Type':'application/json','User-Agent':'HIVE-S10-Owner-OIDC-Authenticated-Negative/1.0',
             'CF-Access-Client-Id':os.environ['CF_ACCESS_CLIENT_ID'],
             'CF-Access-Client-Secret':os.environ['CF_ACCESS_CLIENT_SECRET']}
          for _ in range(12):
            req=urllib.request.Request(url,data=b'{"clock_minute":"invalid"}',headers=h,method='POST')
            try:
              with urllib.request.urlopen(req,timeout=18) as res:code,body=res.status,res.read(1000)
            except urllib.error.HTTPError as e:code,body=e.code,e.read(1000)
            except urllib.error.URLError:code,body=0,b''
            try:valid=json.loads(body).get('error')=='EXACT_CLOCK_PAYLOAD_DENY'
            except (ValueError,AttributeError):valid=False
            if code==400 and valid:
              print('S10_NEW_PAGES_BROKER_ACCESS_AUTHENTICATED_NEGATIVE=PASS')
              break
            time.sleep(10)
          else:raise SystemExit('S10_NEW_PAGES_BROKER_AUTH_NEGATIVE_DENY')
          PY
          # Update only existing authoritative HIVE source pointer, after exact deployment.
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .sha)" = "$OLD_POINTER_BLOB"
          encoded="$(printf '%s\n' "$hive_sha" | base64 -w0)"
          gh api -X PUT repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt             -f message='release(s10): track verified original HIVE Pages broker main SHA'             -f content="$encoded" -f sha="$OLD_POINTER_BLOB" >/dev/null
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')" = "$hive_sha"
          echo S10_HIVE_SOURCE_POINTER_EXACT_NEW_BROKER=PASS
      - name: Merge only exact PR1317 and restore original World repo_dispatch without old GitHub Cron
        shell: bash
        run: |
          set -euo pipefail
          test "$S10_OWNER_SIGNED" = TRUE
          test "$(date -u +%s)" -lt "$S10_OWNER_EXPIRES"
          test "$S10_WORKER_STAGED_DISABLED" = TRUE
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml --jq .sha)" = "$OLD_WORLD_BLOB"
          gh api -X PUT repos/giovannifidel-collab/pfarma-ci/pulls/1317/merge \
            -f sha="$REPAIR_PR_SHA" -f merge_method=merge \
            -f commit_title='release(s10): exact Owner OIDC Cloudflare-supported manual redirect for one World clock' |
              jq -e '.merged==true' >/dev/null
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/ops/queen/s10/world-clock/worker.mjs --jq .sha)" = "$NEW_WORKER_BLOB"
          echo S10_PR1317_MERGED=TRUE >> "$GITHUB_ENV"
          # Sole old GH cron removed only AFTER disabled Worker hotfix staged.
          good="$(gh api 'repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml?ref=6670ef862ef971785222a7a55b9834ca78c24f0e' --jq .content | tr -d '\n')"
          test "$(printf '%s' "$good" | base64 -d | git hash-object --stdin)" = "$NEW_WORLD_BLOB"
          gh api -X PUT repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml \
            -f message='release(s10): switch World schedule from GitHub to the one signed Cloudflare Cron' \
            -f content="$good" -f sha="$OLD_WORLD_BLOB" >/dev/null
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml --jq .sha)" = "$NEW_WORLD_BLOB"
          echo S10_WORLD_CRON_OFF=TRUE >> "$GITHUB_ENV"
          echo S10_EXACT_HOTFIX_AND_SINGLE_WORLD_CRON_CUTOVER=PASS
      - name: Activate only ONE Cloudflare 1-minute Cron after original GitHub Cron is absent
        shell: bash
        run: |
          set -euo pipefail
          test "$S10_WORLD_CRON_OFF" = TRUE
          test "$(date -u +%s)" -lt "$S10_OWNER_EXPIRES"
          npx --yes wrangler@4.139.0 deploy --config ops/queen/s10/world-clock/wrangler.jsonc
          sched="$(curl -sS --fail --max-time 22 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules")"
          jq -e '.success==true and ((.result.schedules // .result)|length)==1 and ((.result.schedules // .result)[0].cron=="* * * * *")' <<< "$sched" >/dev/null
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml --jq .sha)" = "$NEW_WORLD_BLOB"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/queen-s1-event-ingress.yml --jq .sha)" = "$ORIGINAL_S1_BLOB"
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = "$S10_NEW_HIVE_SHA"
          test "$(gh api repos/giovannifidel-collab/hive-alveare/contents/cloudflare/functions/api/s10-world-clock-dispatch.js --jq .sha)" = "$NEW_BROKER_BLOB"
          echo "S10_CLOUDFLARE_ACTIVATED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo S10_PR1317_ONLY_ONE_CLOUDFLARE_CRON_ORIGINAL_S1_UNCHANGED=PASS
      - name: Certify TWO genuine separate scheduled clock -> Pages -> original World observations
        timeout-minutes: 27
        shell: bash
        run: |
          set -euo pipefail
          test -n "$S10_CLOUDFLARE_ACTIVATED_AT"
          # Capture real Worker transport classifications during this ONE signed
          # cutover; ephemeral runner files only, zero secret/body/JWT logging.
          export CLOUDFLARE_API_TOKEN="${CF_PRIMARY:-$CF_FALLBACK}"
          test -n "$CLOUDFLARE_API_TOKEN"
          logpath="$RUNNER_TEMP/s10-clock-decisions.jsonl"
          errpath="$RUNNER_TEMP/s10-clock-tail-stderr.txt"
          (timeout 1500s npx --yes wrangler@4.139.0 tail "$WORKER_NAME" --format json --search S10_WORLD_CLOCK_DECISION > "$logpath" 2> "$errpath") &
          tail_pid=$!
          s10_diag_exit() {
            ret=$?
            kill "$tail_pid" >/dev/null 2>&1 || true
            python3 - "$logpath" "$errpath" <<'PY'
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]).read_text(errors='replace') if pathlib.Path(sys.argv[1]).exists() else ''
          decisions=re.findall(r'S10_WORLD_CLOCK_DECISION=([A-Z0-9_]+)',raw)
          print('S10_CF_EPHEMERAL_TAIL_DECISION_COUNT='+str(len(decisions)))
          print('S10_CF_EPHEMERAL_TAIL_WORLD_DECISIONS='+','.join(decisions[-24:]))
          if not decisions and pathlib.Path(sys.argv[2]).exists():
              stderr=pathlib.Path(sys.argv[2]).read_text(errors='replace')
              print('S10_CF_EPHEMERAL_TAIL_NO_DECISIONS_WITH_ERROR='+str(bool(re.search('Error|unauthorized|permission',stderr,re.I))))
          print('S10_CF_TAIL_NO_SECRETS_NO_PERSISTENT_DEBUG_ENDPOINT=TRUE')
          PY
            return "$ret"
          }
          trap s10_diag_exit EXIT
          for poll in $(seq 1 44); do
            runs="$(gh api 'repos/giovannifidel-collab/pfarma-ci/actions/workflows/hive-world-sync.yml/runs?event=repository_dispatch&per_page=60')"
            mapfile -t ids < <(jq -r --arg after "$S10_CLOUDFLARE_ACTIVATED_AT" '.workflow_runs[] | select(.created_at >= $after and .status=="completed" and .conclusion=="success" and .run_attempt==1) | .id' <<< "$runs")
            times=()
            for id in "${ids[@]}"; do
              logs="$(gh run view "$id" --repo giovannifidel-collab/pfarma-ci --log 2>/dev/null || true)"
              if grep -Fq 'S10_CLOUDFLARE_CLOCK_TICK_METADATA_VALIDATED=PASS' <<< "$logs" &&
                 (grep -Fq 'WORLD_OBSERVATION_HEARTBEAT=RECORDED_NO_S1_WAKE' <<< "$logs" ||
                  grep -Fq 'WORLD_SEMANTIC_CHANGE=true' <<< "$logs" ||
                  grep -Fq 'WORLD_OBSERVATION_ALREADY_CURRENT=SKIP_NO_S1_WAKE' <<< "$logs"); then
                times+=("$(gh api "repos/giovannifidel-collab/pfarma-ci/actions/runs/$id" --jq .created_at)")
              fi
            done
            if [ "${#times[@]}" -ge 2 ]; then
              a="$(date -u -d "${times[0]}" +%s)"; b="$(date -u -d "${times[1]}" +%s)"
              span="$((a>b?a-b:b-a))"
              if [ "$span" -ge 480 ]; then
                source="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-world-state.json --jq .content | tr -d '\n' | base64 -d)"
                generated="$(jq -r '.generated_at // empty' <<< "$source")"
                test -n "$generated"
                age="$(($(date -u +%s)-$(date -u -d "$generated" +%s)))"
                test "$age" -ge 0 && test "$age" -le 1800 || exit 49
                echo "S10_TRUE_AUTHENTIC_WORLD_AGE_SECONDS=$age"
                echo S10_CLOCK_TWO_GENUINE_WORLD_OBSERVATIONS=PASS
                echo S10_CLOCK_LIVE_SOURCE_FRESHNESS_GATE=PASS
                exit 0
              fi
            fi
            if [ "$poll" -ge 12 ] && [ -f "$logpath" ]; then
              denies="$(grep -Eo 'S10_WORLD_CLOCK_DECISION=DENY_[A-Z0-9_]+' "$logpath" | wc -l || true)"
              if [ "${denies:-0}" -ge 5 ]; then
                echo "S10_CF_REPEATED_BROKER_DENIAL_FAIL_CLOSED_COUNT=$denies"
                exit 48
              fi
            fi
            echo "S10_G3_WAITING_FOR_REAL_WORLD_OBSERVATIONS_POLL=$poll"
            sleep 35
          done
          echo S10_WORLD_G3_NO_TWO_LIVE_CYCLES_FAIL_CLOSED
          exit 47
      - name: Signed rollback disable CF and VERIFY zero schedules before restoring old GitHub Cron
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          test "$S10_OWNER_SIGNED" = TRUE || exit 0
          if [ "$S10_WORKER_STAGED_DISABLED" = TRUE ]; then
            npx --yes wrangler@4.139.0 deploy --config ops/queen/s10/world-clock/wrangler.disabled.jsonc >/dev/null 2>&1
          fi
          cf_disabled=false
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            schedules="$(curl -sS --max-time 22 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules")"
            if jq -e '.success==true and (((.result.schedules // .result)|length)==0)' <<< "$schedules" >/dev/null 2>&1; then
              cf_disabled=true
              echo S10_RECOVERY_ROLLBACK_CF_CRON_ZERO_VERIFIED=PASS
            fi
          fi
          if [ "$cf_disabled" != true ]; then
            echo S10_RECOVERY_ROLLBACK_CF_NOT_VERIFIED_DONT_RESTORE_SECOND_CRON=FAIL_CLOSED
            exit 1
          fi
          if [ "$S10_WORLD_CRON_OFF" = TRUE ]; then
            current="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml --jq .sha)"
            if [ "$current" = "$NEW_WORLD_BLOB" ]; then
              original="$(gh api 'repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml?ref=12de4490d78dbdd3c101efc6daef594f78e9d980' --jq .content | tr -d '\n')"
              test "$(printf '%s' "$original" | base64 -d | git hash-object --stdin)" = "$OLD_WORLD_BLOB" || exit 1
              gh api -X PUT repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml \
                -f message='rollback(s10): restore prior GitHub World cadence after one-clock failed release' \
                -f content="$original" -f sha="$current" >/dev/null
              test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml --jq .sha)" = "$OLD_WORLD_BLOB" ||
                { echo S10_RECOVERY_ROLLBACK_GITHUB_CRON_UNVERIFIED=FAIL; exit 1; }
              echo S10_RECOVERY_ROLLBACK_ORIGINAL_GITHUB_CRON=PASS
            else
              echo S10_RECOVERY_ROLLBACK_WORLD_BLOB_DRIFT_DENY
              exit 1
            fi
          fi
          echo S10_RECOVERY_NO_TERMINAL_CLAIM_ON_FAILURE=TRUE
