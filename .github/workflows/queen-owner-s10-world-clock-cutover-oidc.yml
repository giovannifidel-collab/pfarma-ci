          test "$S10_CLOCK_WORKER_STAGED" = TRUE
          test "$(date -u +%s)" -lt "$S10_CLOCK_OWNER_EXPIRES"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml --jq .sha)" = "$EXPECTED_WORLD_OLD_BLOB"
          gh api repos/giovannifidel-collab/pfarma-ci/pulls/1307 |
