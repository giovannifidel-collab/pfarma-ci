name: Queen S9.4 Family PR874 exact signed merge postreadback (READ ONLY)
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-4-family-pr874-postmerge-independent.yml]
permissions: {contents: read}
jobs:
  independent-family-branch-only-postmerge:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 9
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      FAMILY_MERGE_SHA: f9edfc48dc48f76264d8c587aed765d950b18d81
    steps:
      - name: Read independently signed Owner mission and immutable exact branch merge
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/43965496615 \
            | jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1 and .event=="workflow_dispatch" and .actor.login=="giovannifidel-collab" and .head_sha=="e0d65ea1827121644a4dd7bf8226dd63489f02a8"' >/dev/null
          test "$(gh api repos/giovannifidel-collab/family-cloud/branches/agent/bootstrap-family-cloud --jq .commit.sha)" = "$FAMILY_MERGE_SHA"
          test "$(gh api repos/giovannifidel-collab/family-cloud/branches/main --jq .commit.sha)" = "b4e796f0202fd1e6ae89029674d69210e9bbbc8d"
          gh api repos/giovannifidel-collab/family-cloud/pulls/874 \
            | jq -e --arg sha "$FAMILY_MERGE_SHA" '.merged==true and .state=="closed" and .merge_commit_sha==$sha and .head.sha=="a0620f465576b29381f5f6c3d076ab1f7c786cea" and .base.ref=="agent/bootstrap-family-cloud"' >/dev/null
          gh api repos/giovannifidel-collab/family-cloud/pulls/874/files \
            | jq -e 'length==1 and .[0].filename=="tests/persistence-recovery.test.mjs" and .[0].status=="modified"' >/dev/null
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/43919820626 | jq -e '.conclusion=="success" and .run_attempt==1' >/dev/null
          echo S9_4_FAMILY_OWNER_SIGNED_SINGLE_TEST_MERGE=PASS
          echo S9_4_FAMILY_UNRELATED_MAIN_UNCHANGED=PASS
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: f9edfc48dc48f76264d8c587aed765d950b18d81
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run canonical Family tests on exact merged commit without changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FAMILY_MERGE_SHA"
          node --test tests/canonical-product-surface.test.mjs tests/persistence-recovery.test.mjs
          test -z "$(git status --porcelain --untracked-files=no)"
          echo S9_4_FAMILY_EXACT_POSTMERGE_FUNCTIONAL_TESTS=PASS
          echo S9_4_FAMILY_DEPLOYS=ZERO
          echo S9_4_DEFAULT_MAIN_BRANCH_MERGES=ZERO
          echo S9_4_SCHOOL_PROMOTIONS=ZERO
