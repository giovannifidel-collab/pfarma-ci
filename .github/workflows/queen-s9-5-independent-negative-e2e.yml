name: Queen S9.5 independent protected endpoint negative E2E - no dispatch
on:
  push:
    branches: [audit/s9-5-cloudflare-api-readonly-20261117]
    paths: [.github/workflows/queen-s9-5-independent-negative-e2e.yml]
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: pfarma-ci-trusted
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
    steps:
      - name: Assert exact integrated source and existing S1 is unique
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test -n "$GH_TOKEN"
          HIVE="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)"
          test "$HIVE" = 493d83892f7a2e37ec297b9309b47a4c83ba2e6b
          PTR="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\n')"
          test "$HIVE" = "$PTR"
          test -n "$HIVE_RUNTIME_BEARER_TOKEN"
          gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/queen-s1-event-ingress.yml --jq .content | tr -d '\n' | base64 -d | grep -q 'S9.5 pre-router receipt-only'
          echo 'S95_CANONICAL_SINGLE_S1_INTEGRATED=PASS'
      - name: Protected Pages negative and replay E2E; all calls no provider and no School
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,json,uuid
          assert all(os.environ.get(k) for k in ('CF_ACCESS_CLIENT_ID','CF_ACCESS_CLIENT_SECRET','HIVE_RUNTIME_BEARER_TOKEN')),'S95_MISSING_TEST_AUTH'
          base='https://hive-alveare.pages.dev/api/queen-s9-reconcile'
          access=['-H','Cf-Access-Client-Id: '+os.environ['CF_ACCESS_CLIENT_ID'],
                  '-H','Cf-Access-Client-Secret: '+os.environ['CF_ACCESS_CLIENT_SECRET']]
          def probe(method,body=None,bearer=True):
              cmd=['curl','--silent','--show-error','--max-time','25','-X',method,*access,
                   '-H','Accept: application/json','-H','Content-Type: application/json']
              if bearer:cmd+=['-H','Authorization: Bearer '+os.environ['HIVE_RUNTIME_BEARER_TOKEN']]
              if body is not None:cmd+=['--data-binary',json.dumps(body)]
              cmd+=['-w','\n%{http_code}',base]
              x=subprocess.run(cmd,capture_output=True,text=True,timeout=30)
              assert x.returncode==0,'S95_NETWORK_UNAVAILABLE'
              text,status=x.stdout.rsplit('\n',1)
              try:j=json.loads(text)
              except:j={}
              return status,j
          s,r=probe('GET')
          assert s=='405' and r.get('decision')=='METHOD_DENY','S95_GET_METHOD_DENY_FAILED_'+s
          print('S95_PROTECTED_ENDPOINT_GET_METHOD_DENY=PASS')
          s,r=probe('POST',{'probe':'missing_bearer'},False)
          assert s=='403' and r.get('decision')=='SIGNED_RELAY_RUNTIME_TOKEN_REQUIRED','S95_BEARER_DENY_FAILED_'+s
          print('S95_PROTECTED_ENDPOINT_MISSING_BEARER=DENY_PASS')
          s,r=probe('POST',{'kind':'S95_fake'})
          assert s=='400' and r.get('decision')=='UNTRUSTED_CLAIM_FIELDS','S95_UNTRUSTED_PAYLOAD_DENY_FAILED_'+s
          print('S95_PROTECTED_ENDPOINT_BAD_PAYLOAD=DENY_PASS')
          req={
           'mission_id':str(uuid.uuid4()),
           'source_sha':'493d83892f7a2e37ec297b9309b47a4c83ba2e6b',
           'receipt_sha256':'b'*64,
           'provider_ci_run_id':1,'independent_ci_run_id':2,'existing_event_id':1233,
           'no_new_provider_dispatch':True,'can_train_school':False,'paid_fallback':False}
          for idx in range(2):
              s,r=probe('POST',req)
              assert s=='409' and r.get('decision')=='NEON_RECEIPT_OR_CAS_DENIED','S95_UNKNOWN_MISSION_DENY_FAILED_'+s+':'+str(r.get('decision'))
          print('S95_REAL_PROD_PRIVATE_NEON_UNKNOWN_MISSION_FAIL_CLOSED=PASS')
          print('S95_REPEAT_UNKNOWN_RECEIPT_NO_REPLAY=PASS')
          print('S95_NO_PROVIDER_DISPATCH_OR_SCHOOL_WRITE=TRUE')
          PY