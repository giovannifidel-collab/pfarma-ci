           hive_pr:115,hive_pr_head_sha:'91e488fe1d0943548facc895a5493b902d726718',
           hive_independent_source_ci:44917410374,
           relay_independent_project_baseline_ci:44917513612,
           relay_readonly_workflow_pr:1328,
           project_source_locks:[
            {id:'project-giovanni',repo:'giovannifidel-collab/project-giovanni',sha:'4f67bda2e1bf63db12c1d9d7311b57f12b7bc707'},
            {id:'hive-field',repo:'giovannifidel-collab/hive-field',sha:'2b51de88dec2e4e4ae01102fac2a3b95a9f0b5fd'}
           ],
           authority:'HIVE_SOURCE_ONLY_NO_PRODUCT_PR',
           no_project_writes:true,no_new_s1:true,no_new_s2:true,no_new_scheduler:true,
           no_auto_merge:true,no_auto_deploy:true,no_school_training:true,
           no_paid_fallback:true,max_incremental_cost_usd:0,
           no_neon_write_by_signer:true,no_project_owner_missions_issued:true,
           requires_separate_per_project_owner_oidc_mission:true,
           requires_live_project_AI_draft_and_tests_before_S12_completion:true,
           issued_at:new Date(now).toISOString(),expires_at:new Date(now+45*60*1000).toISOString()
          };
          const digest=createHash('sha256').update(JSON.stringify(receipt)).digest('hex');
          console.log('S12_OWNER_SIGNED_EXACT_SOURCE_RELEASE='+JSON.stringify({...receipt,sha256:digest}));
          console.log('S12_OWNER_SIGNER_NO_RELEASE_OR_NEON_WRITE=TRUE');
          JS
