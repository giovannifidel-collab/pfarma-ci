name: Queen Owner S12 One Exact HIVE Source Release OIDC — NO Product Writes
on:
  push:
    branches: [s12/owner-exact-hive-source-release-oidc-20261121, s12/owner-pr117-source-only-oidc-20261121, s12/owner-pr118-trusted-runtime-oidc-20261121, s12/fix-pr118-owner-signer-source-20261121]
    paths: ['.github/workflows/queen-owner-s12-exact-source-oidc.yml']
  workflow_dispatch:
    inputs:
      approve_exact_s12_hive_source_pr115_only:
        description: 'Authorize ONE exact HIVE PR115 source merge; S12 not certified, no project writes, model calls, releases, School training, new scheduler, or paid fallback'
        required: false
        type: boolean
        default: false
      approve_exact_s12_hive_model_bridge_pr117_only:
        description: 'Owner authorizes exact HIVE PR117 source-only bounded Workers AI bridge; no model call, project writes, merge, deploy, S1, School or paid fallback'
        required: false
        type: boolean
        default: false
      approve_exact_s12_hive_trusted_runtime_pr118_only:
        description: 'Owner authorizes exact HIVE PR118 trusted runtime source and tests only; NO AI invocation or private project write, merge, deploy or paid fallback'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
concurrency:
  group: queen-owner-s12-hive-source-exact
  cancel-in-progress: false
jobs:
  independent-source-only-ci:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0,persist-credentials: false}
      - name: Verify signer source one-file isolation and RSA JS static syntax only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only origin/main...HEAD)" = .github/workflows/queen-owner-s12-exact-source-oidc.yml
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/queen-owner-s12-exact-source-oidc.yml').read_text()
          marker="          node --input-type=module <<'JS'\n"
          a=s.index(marker)+len(marker)
          b=s.index("\n          JS",a)
          code="\n".join(line[10:] if line.startswith("          ") else line for line in s[a:b].splitlines())
          Path('/tmp/queen-s12-exact-owner-js.mjs').write_text(code+"\n")
          PY
          node --check /tmp/queen-s12-exact-owner-js.mjs
          grep -Fq 'S12_OWNER_OIDC_RS256_ONE_SOURCE_RELEASE=PASS' .github/workflows/queen-owner-s12-exact-source-oidc.yml
          grep -Fq 'S12_OWNER_SIGNER_NO_RELEASE_OR_NEON_WRITE=TRUE' .github/workflows/queen-owner-s12-exact-source-oidc.yml
          grep -Fq 'no_project_writes:true' .github/workflows/queen-owner-s12-exact-source-oidc.yml
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/queen-owner-s12-exact-source-oidc.yml').read_text()
          marker="          node --input-type=module <<'JS'\n"
          a=s.rindex(marker)+len(marker)
          b=s.index("\n          JS",a)
          code="\n".join(x[10:] if x.startswith('          ') else x for x in s[a:b].splitlines())
          Path('/tmp/s12-pr117-owner-signer.mjs').write_text(code+"\n")
          PY
          node --check /tmp/s12-pr117-owner-signer.mjs
          grep -Fq 'S12_OWNER_OIDC_RS256_MODEL_BRIDGE_SOURCE=PASS' .github/workflows/queen-owner-s12-exact-source-oidc.yml
          grep -Fq 'S12_OWNER_SIGNER_PR117_NO_MUTATIONS=TRUE' .github/workflows/queen-owner-s12-exact-source-oidc.yml
          grep -Fq 'S12_OWNER_OIDC_RS256_TRUSTED_RUNTIME_SOURCE=PASS' .github/workflows/queen-owner-s12-exact-source-oidc.yml
          grep -Fq 'S12_OWNER_SIGNER_PR118_NO_MUTATIONS=TRUE' .github/workflows/queen-owner-s12-exact-source-oidc.yml
          grep -Fq 'repos/giovannifidel-collab/hive-alveare/pulls/118' .github/workflows/queen-owner-s12-exact-source-oidc.yml
          grep -Fq 'APPROVE_LEGACY_PR117' .github/workflows/queen-owner-s12-exact-source-oidc.yml
          echo S12_OWNER_SIGNER_ISOLATED_NO_PRIVILEGES_IN_CI=PASS
  one-source-owner-rs256:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_exact_s12_hive_source_pr115_only == true
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 7
    permissions: {contents: read, actions: read, id-token: write}
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      OWNER_APPROVE: ${{ inputs.approve_exact_s12_hive_source_pr115_only }}
    steps:
      - name: Verify live exact HIVE source and two authentic private project heads
        shell: bash
        run: |
          set -euo pipefail
          test "$OWNER_APPROVE" = true
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_TRIGGERING_ACTOR" = giovannifidel-collab
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -n "$GH_TOKEN"
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = 4843357722b322a3cbece897567426cca83d6a22
          ptr="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')"
          test "$ptr" = 4843357722b322a3cbece897567426cca83d6a22
          gh api repos/giovannifidel-collab/hive-alveare/pulls/115 |
            jq -e '.state=="open" and .draft==true and .head.sha=="91e488fe1d0943548facc895a5493b902d726718" and .base.sha=="4843357722b322a3cbece897567426cca83d6a22" and .changed_files==4' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/actions/runs/44917410374 |
            jq -e '.status=="completed" and .conclusion=="success" and .head_sha=="91e488fe1d0943548facc895a5493b902d726718" and .run_attempt==1' >/dev/null
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/44917513612 |
            jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1' >/dev/null
          gh api repos/giovannifidel-collab/pfarma-ci/pulls/1328 |
            jq -e '.state=="closed" and .merged==true and .merge_commit_sha=="65d14ccfcc53d52b218556a0fe6879d3a57174e6"' >/dev/null
          test "$(gh api repos/giovannifidel-collab/project-giovanni/branches/main --jq .commit.sha)" = 4f67bda2e1bf63db12c1d9d7311b57f12b7bc707
          test "$(gh api repos/giovannifidel-collab/hive-field/branches/main --jq .commit.sha)" = 2b51de88dec2e4e4ae01102fac2a3b95a9f0b5fd
          gh api repos/giovannifidel-collab/hive-alveare/issues/114 |
            jq -e '.state=="closed" and .state_reason=="completed"' >/dev/null
          echo S12_OWNER_EXACT_SOURCE_AND_DUAL_PRIVATE_HEAD=PASS
          echo S12_NO_PROJECT_WRITE_PERMITTED_BY_THIS_SOURCE_GRANT=TRUE
      - name: Verify fresh owner GitHub RS256 OIDC and issue one expiring exact source release permission
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {createPublicKey,verify,createHash} from 'node:crypto';
          const e=process.env;
          const deny=x=>{throw Error('S12_OWNER_AUTH_DENY_'+x)};
          const aud='hive-queen-s12-one-exact-source-release-not-product-authorization-v1';
          if(e.OWNER_APPROVE!=='true'||!e.ACTIONS_ID_TOKEN_REQUEST_URL||!e.ACTIONS_ID_TOKEN_REQUEST_TOKEN)deny('NO_OWNER');
          const tokenUrl=e.ACTIONS_ID_TOKEN_REQUEST_URL+(e.ACTIONS_ID_TOKEN_REQUEST_URL.includes('?')?'&':'?')+'audience='+encodeURIComponent(aud);
          const response=await fetch(tokenUrl,{headers:{Authorization:'Bearer '+e.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!response.ok)deny('TOKEN_ISSUER');
          const parts=(await response.json()).value?.split('.')||[];
          if(parts.length!==3)deny('JWT_PARTS');
          const dec=x=>Buffer.from(x.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-x.length%4)%4),'base64');
          const h=JSON.parse(dec(parts[0])),c=JSON.parse(dec(parts[1]));
          if(h.alg!=='RS256'||!h.kid||h.jwk||h.jku||h.x5u||h.crit)deny('JWT_HEADER');
          const claims={
           iss:'https://token.actions.githubusercontent.com',aud,
           repository:'giovannifidel-collab/pfarma-ci',repository_id:'1308677897',
           repository_owner_id:'305755860',actor:'giovannifidel-collab',actor_id:'305755860',
           event_name:'workflow_dispatch',environment:'pfarma-ci-trusted',
           ref:'refs/heads/main',runner_environment:'github-hosted',
           workflow_ref:'giovannifidel-collab/pfarma-ci/.github/workflows/queen-owner-s12-exact-source-oidc.yml@refs/heads/main'
          };
          for(const [k,v] of Object.entries(claims))if(String(c[k])!==v)deny('CLAIM_'+k);
          const now=Date.now();
          if(c.sha!==e.GITHUB_SHA||Number(c.run_id)!==Number(e.GITHUB_RUN_ID)||Number(c.run_attempt)!==1||
           !Number.isSafeInteger(c.exp)||!Number.isSafeInteger(c.iat)||c.exp<=c.iat||
           c.exp-c.iat>900||c.exp*1000<=now||now-c.iat*1000>300000||c.iat*1000>now+30000)deny('TIME');
          const jwks=await fetch('https://token.actions.githubusercontent.com/.well-known/jwks');
          if(!jwks.ok)deny('JWKS');
          const key=(await jwks.json()).keys?.find(x=>x.kid===h.kid&&x.kty==='RSA'&&x.use==='sig'&&(!x.alg||x.alg==='RS256'));
          if(!key||!verify('RSA-SHA256',Buffer.from(parts[0]+'.'+parts[1]),createPublicKey({key,format:'jwk'}),dec(parts[2])))deny('JWT_SIGNATURE');
          console.log('S12_OWNER_OIDC_RS256_ONE_SOURCE_RELEASE=PASS');
          const receipt={
           schema:'queen.s12.exact-owner-source-release-authorization.v1',
           stage:'S12',decision:'OWNER_AUTHORIZES_EXACT_HIVE_PR115_SOURCE_ONLY_NOT_PROJECT_WRITES',
