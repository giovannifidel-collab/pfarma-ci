name: Queen Owner S10 World Clock Exact One-Cutover OIDC Approval (NO AUTO DEPLOY)
on:
  push:
    branches: [audit/s10-owner-world-clock-release-signer-20261119]
    paths: [.github/workflows/queen-owner-s10-world-clock-one-cutover-oidc.yml]
  workflow_dispatch:
    inputs:
      approve_exact_pr1307_single_cloudflare_clock_cutover:
        type: boolean
        required: true
        default: false
        description: "Owner signs exact PR1307: replace old GitHub World schedule with ONE Cloudflare minute clock, dedicated GitHub credential, staged disable, rollback and new E2E; zero paid fallback"
permissions: {contents: read, actions: read, id-token: write}
concurrency:
  group: queen-owner-s10-world-clock-pr1307-single-release
  cancel-in-progress: false
jobs:
  sign-exact-world-clock-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: pfarma-ci-trusted
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_FALLBACK: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
      S10_DEDICATED_GH_PAT: ${{ secrets.S10_WORLD_CLOCK_GH_TOKEN }}
      APPROVAL: ${{ inputs.approve_exact_pr1307_single_cloudflare_clock_cutover }}
      EXACT_HIVE_MAIN: 88000e9ff70ffc044f424d469645573e01738a8b
      EXACT_CANDIDATE_PR: "1307"
      EXACT_PR_HEAD: 1b1efa300bd0ee83ce2356c829088128fe9bf274
      EXACT_OLD_WORLD_BLOB: 398b478cebcdd979953aa8a014ef13fbf205c65b
      EXACT_S1_BLOB: a0b75a09ab2ff8e37a49d6c4ebfcd2b3c1322ffe
      EXACT_CANDIDATE_WORKER_BLOB: f7247e0403ece58c73accc252ccca5afdef27c36
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Owner source-bound negative preflight, all existing original World/S1 intact
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -n "$GH_TOKEN"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_TRIGGERING_ACTOR" = giovannifidel-collab
            test "$GITHUB_REF" = refs/heads/main
            test "$APPROVAL" = true
            test -n "$CF_PRIMARY$CF_FALLBACK"
            test -n "$S10_DEDICATED_GH_PAT"
            test "\${#S10_DEDICATED_GH_PAT}" -ge 16
          else
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/audit/s10-owner-world-clock-release-signer-20261119
          fi
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = "$EXACT_HIVE_MAIN"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')" = "$EXACT_HIVE_MAIN"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/hive-world-sync.yml --jq .sha)" = "$EXACT_OLD_WORLD_BLOB"
          test "$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/queen-s1-event-ingress.yml --jq .sha)" = "$EXACT_S1_BLOB"
          test "$(gh api 'repos/giovannifidel-collab/pfarma-ci/contents/ops/queen/s10/world-clock/worker.mjs?ref=fix/s10-cloudflare-world-clock-cutover-20261119' --jq .sha)" = "$EXACT_CANDIDATE_WORKER_BLOB"
          gh api repos/giovannifidel-collab/pfarma-ci/pulls/1307 |
            jq -e --arg sha "$EXACT_PR_HEAD" '.state=="open" and .merged==false and .head.sha==$sha and .base.ref=="main"' >/dev/null
          gh api 'repos/giovannifidel-collab/pfarma-ci/pulls/1307/files?per_page=50' |
            jq -e 'length==10 and all(.[].filename;
              .==".github/workflows/hive-world-sync.yml" or
              .==".github/workflows/queen-s10-s1-heartbeat-source-ci.yml" or
              .==".github/workflows/queen-s10-world-clock-source-ci.yml" or
              .==".github/workflows/queen-s10-world-heartbeat-source-ci.yml" or
              .=="ops/queen/s10/tests/world-observation-publication.test.mjs" or
              .=="ops/queen/s10/world-clock/README.md" or
              .=="ops/queen/s10/world-clock/tests/worker.test.mjs" or
              .=="ops/queen/s10/world-clock/worker.mjs" or
              .=="ops/queen/s10/world-clock/wrangler.jsonc" or
              .=="ops/queen/s10/world-clock/wrangler.disabled.jsonc")' >/dev/null
          for run in 44619898417 44620080422; do
            gh api "repos/giovannifidel-collab/pfarma-ci/actions/runs/$run" |
              jq -e --arg sha "$EXACT_PR_HEAD" '.status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha==$sha' >/dev/null
          done
          echo S10_OWNER_PR1307_EXACT_HIVE_S1_WORLD_SOURCE_AND_CI=PASS
          echo S10_OWNER_SOURCE_PREFLIGHT_NO_AUTO_DEPLOY_NO_WORLD_MUTATION=TRUE
      - name: Verify new signer JS syntax on source branch only
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/queen-owner-s10-world-clock-one-cutover-oidc.yml').read_text()
          a=src.index("          node --input-type=module <<'JS'\n")+len("          node --input-type=module <<'JS'\n")
          b=src.index("\n          JS",a)
          js='\n'.join(x[10:] if x.startswith('          ') else x for x in src[a:b].splitlines())
          Path('/tmp/s10-signature-source.mjs').write_text(js+'\n')
          PY
          node --check /tmp/s10-signature-source.mjs
          echo S10_OWNER_WORLD_CLOCK_SIGNER_JS_SYNTAX=PASS
      - name: Cryptographically verify exact Owner RS256 OIDC and sign SINGLE source cutover lease
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {createPublicKey,verify,createHash} from 'node:crypto';
          const e=process.env;
          const deny=x=>{throw Error('S10_OWNER_WORLD_CLOCK_DENIED_'+x)};
          const audience='queen-owner-s10-exact-pr1307-one-clock-cutover-v1';
          if(e.APPROVAL!=='true'||!e.ACTIONS_ID_TOKEN_REQUEST_URL||!e.ACTIONS_ID_TOKEN_REQUEST_TOKEN)deny('UNAUTHENTICATED');
          const url=e.ACTIONS_ID_TOKEN_REQUEST_URL+(e.ACTIONS_ID_TOKEN_REQUEST_URL.includes('?')?'&':'?')+'audience='+encodeURIComponent(audience);
          const result=await fetch(url,{headers:{Authorization:'Bearer '+e.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!result.ok)deny('OIDC_ISSUER');
          const parts=(await result.json()).value?.split('.')||[];
          if(parts.length!==3)deny('JWT_PARTS');
          const dec=v=>Buffer.from(v.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-v.length%4)%4),'base64');
          const header=JSON.parse(dec(parts[0]).toString());
          const c=JSON.parse(dec(parts[1]).toString());
          if(header.alg!=='RS256'||!header.kid||header.jwk||header.jku||header.x5u||header.crit)deny('HEADER');
          const expected={
            iss:'https://token.actions.githubusercontent.com',
            aud:audience,
            repository:'giovannifidel-collab/pfarma-ci',
            repository_id:'1308677897',
            repository_owner_id:'305755860',
            actor:'giovannifidel-collab',
            actor_id:'305755860',
            event_name:'workflow_dispatch',
            environment:'pfarma-ci-trusted',
            workflow_ref:'giovannifidel-collab/pfarma-ci/.github/workflows/queen-owner-s10-world-clock-one-cutover-oidc.yml@refs/heads/main',
            ref:'refs/heads/main',
            runner_environment:'github-hosted'
          };
          for(const [k,v] of Object.entries(expected))if(String(c[k])!==v)deny('CLAIM_'+k);
          const now=Date.now();
          if(c.sha!==e.GITHUB_SHA||Number(c.run_id)!==Number(e.GITHUB_RUN_ID)||
            Number(c.run_attempt)!==1||
            !Number.isSafeInteger(c.exp)||!Number.isSafeInteger(c.iat)||
            c.exp<=c.iat||c.exp-c.iat>900||c.exp*1000<=now||
            c.iat*1000>now+30000||now-c.iat*1000>300000)deny('TIME_RUN');
          const jwks=await fetch('https://token.actions.githubusercontent.com/.well-known/jwks');
          if(!jwks.ok)deny('JWKS');
          const key=(await jwks.json()).keys?.find(k=>k.kid===header.kid&&k.kty==='RSA'&&k.use==='sig'&&(!k.alg||k.alg==='RS256'));
          if(!key||!verify('RSA-SHA256',Buffer.from(parts[0]+'.'+parts[1]),createPublicKey({key,format:'jwk'}),dec(parts[2])))deny('BAD_SIGNATURE');
          const lease={
            schema:'queen.owner.s10.world-clock.one-release-oidc.v1',
            owner:'giovannifidel-collab',oidc_run:Number(e.GITHUB_RUN_ID),
            hive_sha:e.EXACT_HIVE_MAIN,pr:1307,pr_head:e.EXACT_PR_HEAD,
            original_world_blob:e.EXACT_OLD_WORLD_BLOB,original_s1_blob:e.EXACT_S1_BLOB,
            approved_worker_blob:e.EXACT_CANDIDATE_WORKER_BLOB,
            file_count:10,scope:'HIVE_SINGLE_WORLD_TIME_SOURCE_ONLY',
            one_GitHub_original_world_workflow:true,
            one_existing_S1:true,new_S1_allowed:false,
            new_world_source_write_allowed:false,
            cloudflare_worker:'hive-queen-world-clock',
            scheduled_cron:'* * * * *',
            allow_stage_disabled_worker:true,
            allow_install_encrypted_dedicated_secret:true,
            allow_merge_exact_candidate_once:true,
            allow_activate_one_worker_after_old_GitHub_schedule_removed:true,
            allow_disable_worker_on_failure:true,
            no_paid_fallback:true,additional_cost_usd:0,
            no_model_calls:true,no_neon_writes:true,
            no_cross_project_writes:true,no_school_training:true,
            no_unrestricted_owner_delegation:true,
            owner_releases_must_be_exact:true,
            s10_terminal_certified:false,
            issued_at:new Date(now).toISOString(),
            expires_at:new Date(now+15*60000).toISOString()
          };
          const digest=createHash('sha256').update(JSON.stringify(lease)).digest('hex');
          console.log('S10_OWNER_PR1307_WORLD_CLOCK_RS256_SIGNATURE=PASS');
          console.log('S10_OWNER_PR1307_WORLD_CLOCK_SIGNED_RECEIPT='+JSON.stringify({...lease,receipt_sha256:digest}));
          console.log('S10_OWNER_SIGNER_NO_AUTO_DEPLOY_NO_AUTO_MERGE=TRUE');
          JS