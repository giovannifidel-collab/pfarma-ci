name: RAZZO Current Macrocycle Verifier
on:
  pull_request:
    branches: [main]
    paths:
      - 'razzo/project-giovanni-ref.txt'
      - 'razzo/pfarma-ref.txt'
      - 'family-cloud-ref.txt'
      - '.github/workflows/razzo-macrocycle-current-verifier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-giovanni-mc18:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: echo "sha=$(tr -d '\r\n' < razzo/project-giovanni-ref.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product
      - run: test "$(git -C product rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: product
        run: npm install --no-audit --no-fund && npx --yes tsc --noEmit && node --test factory/mc18-backup-portability.test.mjs && npm run test:factory --if-present && npm run factory:plan --if-present
  pfarma-mc13:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: echo "sha=$(tr -d '\r\n' < razzo/pfarma-ref.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product
      - run: test "$(git -C product rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - working-directory: product
        run: python -m compileall -q backend tests/test_accounting_ledger_mc13.py && PYTHONPATH=. python tests/test_accounting_ledger_mc13.py
  family-cloud-mc14:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: echo "sha=$(tr -d '\r\n' < family-cloud-ref.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product
      - run: test "$(git -C product rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: product
        run: npm install --no-audit --no-fund && npm run typecheck && npm test -- --runInBand
