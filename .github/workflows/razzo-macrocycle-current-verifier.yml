name: RAZZO Current Macrocycle Verifier
on:
  pull_request:
    branches: [main]
    paths:
      - 'razzo/project-giovanni-ref.txt'
      - 'razzo/pfarma-ref.txt'
      - 'family-cloud-ref.txt'
      - '.github/workflows/razzo-macrocycle-current-verifier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changed-refs:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.detect.outputs.project }}
      pfarma: ${{ steps.detect.outputs.pfarma }}
      family: ${{ steps.detect.outputs.family }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          project=false
          pfarma=false
          family=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            project=true
            pfarma=true
            family=true
          else
            git diff --name-only HEAD^1 HEAD^2 > /tmp/changed-files.txt
            grep -qx 'razzo/project-giovanni-ref.txt' /tmp/changed-files.txt && project=true || true
            grep -qx 'razzo/pfarma-ref.txt' /tmp/changed-files.txt && pfarma=true || true
            grep -qx 'family-cloud-ref.txt' /tmp/changed-files.txt && family=true || true
            if grep -qx '.github/workflows/razzo-macrocycle-current-verifier.yml' /tmp/changed-files.txt; then
              project=true
              pfarma=true
              family=true
            fi
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "pfarma=$pfarma" >> "$GITHUB_OUTPUT"
          echo "family=$family" >> "$GITHUB_OUTPUT"

  project-giovanni-ref:
    needs: changed-refs
    if: needs.changed-refs.outputs.project == 'true'
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: echo "sha=$(tr -d '\r\n' < razzo/project-giovanni-ref.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product
      - run: test "$(git -C product rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: product
        run: npm install --no-audit --no-fund && npx --yes tsc --noEmit && npm run test:factory --if-present && npm run factory:plan --if-present

  pfarma-ref:
    needs: changed-refs
    if: needs.changed-refs.outputs.pfarma == 'true'
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: echo "sha=$(tr -d '\r\n' < razzo/pfarma-ref.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product
      - run: test "$(git -C product rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - working-directory: product
        run: python -m compileall -q backend factory && python -m unittest factory.test_razzo_executor factory.test_continuous_loop factory.test_github_worker_runtime -v

  family-cloud-ref:
    needs: changed-refs
    if: needs.changed-refs.outputs.family == 'true'
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: echo "sha=$(tr -d '\r\n' < family-cloud-ref.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: product
      - run: test "$(git -C product rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: product
        run: npm install --no-audit --no-fund && npm run typecheck && npm test -- --runInBand
