name: Family Cloud Private Source Hosted CI
# validation-wave: total-final

on:
  push:
    branches: [main]
    paths:
      - 'family-cloud-ref.txt'
      - '.github/workflows/family-cloud-private-source-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-cloud-ref.txt'
      - '.github/workflows/family-cloud-private-source-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-cloud-private-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < family-cloud-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
      - shell: bash
        run: test "$(git -C private-source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: private-source
        run: npm install --no-audit --no-fund
      - working-directory: private-source
        run: npm run typecheck
      - working-directory: private-source
        run: npm test
      - working-directory: private-source
        run: npm run factory:plan
      - name: Runtime API smoke
        shell: bash
        run: |
          set -euo pipefail
          export FAMILY_CLOUD_DATA_ROOT="$RUNNER_TEMP/family-cloud-final"
          (cd private-source && npm run dev) > "$RUNNER_TEMP/family-cloud-dev.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/family-cloud-dev.log"' EXIT
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/healthz >/dev/null && break; sleep .25; done
          curl -fsS http://127.0.0.1:4173/ | grep -q 'Family Cloud'
          curl -fsS http://127.0.0.1:4173/auth.html | grep -q 'Account'
          curl -fsS http://127.0.0.1:4173/household.html >/dev/null
          curl -fsS http://127.0.0.1:4173/nodes.html >/dev/null
          curl -fsS http://127.0.0.1:4173/trash.html >/dev/null
      - if: always()
        shell: bash
        run: rm -rf private-source

  quality-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        shell: pwsh
        run: |
          $sha = (Get-Content family-cloud-ref.txt -Raw).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'invalid Family Cloud SHA' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - shell: pwsh
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: if ([string]::IsNullOrWhiteSpace($env:SOURCE_TOKEN)) { throw 'missing source token' }
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
      - shell: pwsh
        run: |
          $actual = git -C private-source rev-parse HEAD
          if ($actual.Trim() -ne '${{ steps.source.outputs.sha }}') { throw 'exact SHA mismatch' }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: private-source
        run: npm install --no-audit --no-fund
      - working-directory: private-source
        run: npm run typecheck
      - working-directory: private-source
        run: npm test
      - if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force private-source -ErrorAction SilentlyContinue
