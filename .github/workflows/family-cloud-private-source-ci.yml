name: Family Cloud Private Source Hosted CI
# validation-wave: dynamic-squads

on:
  push:
    branches: [main]
    paths:
      - 'family-cloud-ref.txt'
      - '.github/workflows/family-cloud-private-source-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-cloud-ref.txt'
      - '.github/workflows/family-cloud-private-source-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-cloud-private-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    steps:
      - name: Check out public CI control repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate requested Family Cloud SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -f family-cloud-ref.txt
          sha="$(tr -d '\r\n' < family-cloud-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'family-cloud-ref.txt is not a canonical commit SHA.' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Fail closed unless private-source token is configured
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"

      - name: Check out exact private Family Cloud commit
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact private commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C private-source rev-parse HEAD)"
          test "$actual" = '${{ steps.source.outputs.sha }}'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: private-source
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: private-source
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ../family-cloud-typecheck.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-cloud-typecheck-${{ steps.source.outputs.sha }}
          path: family-cloud-typecheck.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Tests
        working-directory: private-source
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../family-cloud-tests.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-cloud-tests-${{ steps.source.outputs.sha }}
          path: family-cloud-tests.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Factory planner smoke
        working-directory: private-source
        shell: bash
        run: |
          set -o pipefail
          npm run factory:plan 2>&1 | tee ../family-cloud-factory-plan.log

      - name: Upload planner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-cloud-factory-plan-${{ steps.source.outputs.sha }}
          path: family-cloud-factory-plan.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Real runtime and browser render gate
        shell: bash
        env:
          FAMILY_CLOUD_REF: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          driver="$(command -v chromedriver || true)"
          ffmpeg="$(command -v ffmpeg || true)"
          if [[ -z "$chrome" || -z "$driver" || -z "$ffmpeg" ]]; then
            sudo apt-get update -y
            packages=()
            if [[ -z "$chrome" || -z "$driver" ]]; then packages+=(chromium chromium-driver); fi
            if [[ -z "$ffmpeg" ]]; then packages+=(ffmpeg); fi
            sudo apt-get install -y "${packages[@]}"
            chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
            driver="$(command -v chromedriver)"
            ffmpeg="$(command -v ffmpeg)"
          fi
          test -x "$chrome"
          test -x "$driver"
          test -x "$ffmpeg"
          rm -rf family-cloud-visual-artifacts
          mkdir -p family-cloud-visual-artifacts
          export FAMILY_CLOUD_DATA_ROOT="$RUNNER_TEMP/family-cloud-visual-data"
          (cd private-source && npm run dev) > family-cloud-runtime.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/healthz >/dev/null; then ready=1; break; fi
            sleep .25
          done
          test "$ready" = 1
          set -o pipefail
          CHROMEDRIVER_BIN="$driver" VISUAL_OUT="$PWD/family-cloud-visual-artifacts" python3 scripts/family-cloud-visual-smoke.py 2>&1 | tee family-cloud-visual-artifacts/visual-smoke.log
          cleanup
          trap - EXIT

      - name: Upload real-render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-cloud-real-render-${{ steps.source.outputs.sha }}
          path: |
            family-cloud-visual-artifacts
            family-cloud-runtime.log
          if-no-files-found: error
          retention-days: 1

      - name: Remove private source checkout
        if: always()
        shell: bash
        run: rm -rf private-source
