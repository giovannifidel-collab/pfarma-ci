name: Family Cloud Private Source Hosted CI
# verification-only diagnostics for exact-sha candidate

on:
  push:
    branches: [main]
    paths:
      - 'family-cloud-ref.txt'
      - '.github/workflows/family-cloud-private-source-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-cloud-ref.txt'
      - '.github/workflows/family-cloud-private-source-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-cloud-private-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    steps:
      - name: Check out public CI control repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate requested Family Cloud SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -f family-cloud-ref.txt
          sha="$(tr -d '\r\n' < family-cloud-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'family-cloud-ref.txt is not a canonical commit SHA.' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Fail closed unless private-source token is configured
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"
      - name: Check out exact private Family Cloud commit
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact private commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C private-source rev-parse HEAD)"
          test "$actual" = '${{ steps.source.outputs.sha }}'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: private-source
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: private-source
        run: npm run typecheck
      - name: Tests with focused failure annotation
        working-directory: private-source
        shell: bash
        run: |
          set +e
          npm test > ../family-cloud-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            failure="$(grep -n -B 8 -A 35 '^not ok ' ../family-cloud-tests.log | head -n 180)"
            if [ -z "$failure" ]; then failure="$(grep -n -B 5 -A 20 -E 'failureType:|ERR_|AssertionError|Error:' ../family-cloud-tests.log | head -n 180)"; fi
            if [ -z "$failure" ]; then failure="$(head -n 180 ../family-cloud-tests.log)"; fi
            summary="$(printf '%s' "$failure" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Family Cloud failing tests::$summary"
            exit "$status"
          fi
      - name: Factory planner smoke
        working-directory: private-source
        run: npm run factory:plan
      - name: Remove private source checkout
        if: always()
        run: rm -rf private-source
