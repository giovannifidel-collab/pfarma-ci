name: Queen S9 Cloudflare Access Exact Preview Policy Preflight - GET ONLY
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-access-policy-preflight.yml]
permissions: {contents: read}
jobs:
  access-policy-preflight:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 5
    env:
      ACCESS_TOKEN: ${{ secrets.HIVE_CF_ACCESS_POLICY_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Verify exact existing service token and production vs preview policy authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.error,re
          token=os.getenv('ACCESS_TOKEN')
          ci=os.getenv('CF_ACCESS_CLIENT_ID')
          sec=os.getenv('CF_ACCESS_CLIENT_SECRET')
          if not token or not ci or not sec:raise SystemExit('S9_ACCESS_PREFLIGHT_SECRETS_MISSING')
          def get(path):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers={'Authorization':'Bearer '+token},method='GET')
            try:
              with urllib.request.urlopen(req,timeout=20) as h:return h.status,json.load(h)
            except urllib.error.HTTPError as e:return e.code,{}
            except Exception:return 0,{}
          n,r=get('/accounts?per_page=50')
          if n!=200 or r.get('success') is not True:raise SystemExit('S9_ACCESS_PREFLIGHT_NO_ACCOUNT')
          apps_found=[]
          for a in r.get('result') or []:
            aid=a.get('id','')
            if not re.fullmatch('[a-f0-9]{32}',str(aid)):continue
            s,apps=get('/accounts/'+aid+'/access/apps?per_page=100')
            if s!=200 or apps.get('success') is not True:continue
            for obj in apps.get('result') or []:
              if obj.get('domain') in ('hive-alveare.pages.dev','*.hive-alveare.pages.dev') and obj.get('type')=='self_hosted':
                apps_found.append((aid,obj))
          if len(apps_found)!=2 or len(set(aid for aid,_ in apps_found))!=1 or len(set(a['domain'] for _,a in apps_found))!=2:
            raise SystemExit('S9_ACCESS_PREFLIGHT_NOT_EXACTLY_TWO_APPS')
          account=apps_found[0][0]
          st,tokens=get('/accounts/'+account+'/access/service_tokens?per_page=100')
          matches=[t for t in tokens.get('result') or [] if t.get('client_id')==ci] if st==200 else []
          if len(matches)!=1:raise SystemExit('S9_ACCESS_PREFLIGHT_SERVICE_TOKEN_NOT_UNIQUE')
          tok=matches[0]['id']
          print('S9_ACCESS_CI_TOKEN_PRESENT=TRUE')
          print('S9_ACCESS_APP_DOMAINS=EXACT_PROD_AND_WILDCARD_PREVIEW')
          for _,app in apps_found:
            name=app['domain']
            appid=app['id']
            st2,p=get('/accounts/'+account+'/access/apps/'+appid+'/policies?per_page=100')
            if st2!=200 or p.get('success') is not True:raise SystemExit('S9_ACCESS_PREFLIGHT_POLICIES_UNREADABLE')
            arr=p.get('result') or []
            indicators=[]
            for pol in arr:
              if not isinstance(pol,dict):continue
              incl=pol.get('include') or []
              matches_token=any(isinstance(i,dict) and (i.get('service_token') or {}).get('token_id')==tok for i in incl)
              any_token=any(isinstance(i,dict) and 'any_valid_service_token' in i for i in incl)
              indicators.append({'decision':pol.get('decision'),'include_ci_token':matches_token,
                  'include_any_token':any_token,'include_rule_count':len(incl),
                  'has_require':bool(pol.get('require')),'has_exclude':bool(pol.get('exclude'))})
            print('S9_ACCESS_POLICY_PREFLIGHT_'+('PREVIEW' if name.startswith('*') else 'PROD')+'='+json.dumps(indicators,separators=(',',':')))
          print('S9_ACCESS_PREFLIGHT_READ_ONLY=PASS')
          PY
