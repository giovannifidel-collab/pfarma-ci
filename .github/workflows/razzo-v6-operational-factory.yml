name: RAZZO V6 Legacy Regression (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: razzo-v6-legacy-regression
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run V6 unit regression only
        run: python -m unittest razzo.v6.test_runtime -v
      - name: State legacy boundary
        run: |
          echo "V6 is retained only for manual regression compatibility."
          echo "It cannot dispatch proof waves, claim product progress, publish, or trigger continuation."
