name: RAZZO V7 Safe Contract CI

on:
  pull_request:
    paths:
      - 'razzo/v7/actionability.py'
      - 'razzo/v7/product_discovery.py'
      - 'razzo/v7/dispatcher_pool.py'
      - 'razzo/v7/test_actionability.py'
      - 'razzo/v7/test_product_discovery.py'
      - 'razzo/v7/test_dispatcher_pool.py'
      - 'razzo/v7/shards.json'
      - 'razzo/v7/one-shot-plan-trigger.txt'
      - '.github/workflows/razzo-v7-product-worker-fabric.yml'
      - '.github/workflows/razzo-v7-safe-contract-ci.yml'
      - '.github/workflows/razzo-v7-elastic-fabric.yml'
      - '.github/workflows/razzo-v7-elastic-autoscaler.yml'
      - '.github/workflows/razzo-v6-operational-factory.yml'

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: razzo-v7-safe-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile V7 Python modules
        run: |
          python -m py_compile \
            razzo/v7/actionability.py \
            razzo/v7/product_discovery.py \
            razzo/v7/dispatcher_pool.py
      - name: Run safe-factory unit contracts
        run: |
          python -m unittest razzo.v7.test_actionability -v
          python -m unittest razzo.v7.test_product_discovery -v
          python -m unittest razzo.v7.test_dispatcher_pool -v
      - name: Validate shard registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('razzo/v7/shards.json').read_text())
          shards = payload.get('shards', [])
          ids = [entry['shard_id'] for entry in shards]
          assert ids and len(ids) == len(set(ids))
          assert all(entry.get('enabled') in {True, False} for entry in shards)
          assert any(entry.get('supported_lane') == 'product' and entry.get('enabled') for entry in shards)
          PY
      - name: Verify recovery workflows are manual-only
        run: |
          python - <<'PY'
          from pathlib import Path
          legacy = [
              '.github/workflows/razzo-v7-elastic-fabric.yml',
              '.github/workflows/razzo-v7-elastic-autoscaler.yml',
              '.github/workflows/razzo-v6-operational-factory.yml',
          ]
          for path in legacy:
              text = Path(path).read_text()
              assert 'workflow_dispatch:' in text
              assert 'pull_request:' not in text
              assert '\n  push:' not in text
              assert '\n  schedule:' not in text
          safe = Path('.github/workflows/razzo-v7-product-worker-fabric.yml').read_text()
          assert 'workflow_dispatch:' in safe
          assert 'pull_request:' not in safe
          assert '\n  push:' not in safe
          assert '\n  schedule:' not in safe
          assert 'cancel-in-progress: true' in safe
          assert 'git push origin HEAD:main' not in safe
          assert 'bash -lc "$command"' not in safe
          PY

  one-shot-plan-dispatch:
    needs: contracts
    if: >-
      github.event.pull_request.head.ref == 'razzo/v7-one-shot-plan-trigger' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Enable, dispatch and report safe factory plan-only run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          ref_file="$RUNNER_TEMP/main-ref.json"
          curl --fail-with-body --silent --show-error \
            "${headers[@]}" \
            "${api}/git/ref/heads/main" \
            -o "$ref_file"
          CONTROL_SHA="$(python - "$ref_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              print(json.load(handle)['object']['sha'])
          PY
          )"

          curl --fail-with-body --silent --show-error \
            -X PUT "${headers[@]}" \
            "${api}/actions/workflows/razzo-v7-product-worker-fabric.yml/enable"

          payload='{"ref":"main","inputs":{"mode":"plan-only","max_workers":"3"}}'
          curl --fail-with-body --silent --show-error \
            -X POST "${headers[@]}" \
            "${api}/actions/workflows/razzo-v7-product-worker-fabric.yml/dispatches" \
            -d "${payload}"

          run_json=''
          runs_file="$RUNNER_TEMP/safe-factory-runs.json"
          for attempt in $(seq 1 30); do
            curl --fail-with-body --silent --show-error \
              "${headers[@]}" \
              "${api}/actions/workflows/razzo-v7-product-worker-fabric.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              -o "$runs_file"
            run_json="$(python - "$runs_file" "$CONTROL_SHA" <<'PY'
          import json, sys
          path, sha = sys.argv[1], sys.argv[2]
          with open(path, encoding='utf-8') as handle:
              payload = json.load(handle)
          for run in payload.get('workflow_runs', []):
              if run.get('head_sha') == sha and run.get('event') == 'workflow_dispatch':
                  print(json.dumps({
                      'run_id': run['id'],
                      'run_number': run['run_number'],
                      'html_url': run['html_url'],
                      'status': run['status'],
                      'head_sha': run['head_sha'],
                  }))
                  break
          PY
            )"
            if [ -n "$run_json" ]; then
              break
            fi
            sleep 2
          done

          test -n "$run_json"
          export RUN_JSON="$run_json"
          comment_payload="$(python - <<'PY'
          import json, os
          run = json.loads(os.environ['RUN_JSON'])
          body = (
              'RAZZO V7 one-shot dispatch verified.\n\n'
              f"- Safe Product Factory run ID: `{run['run_id']}`\n"
              f"- Run number: `{run['run_number']}`\n"
              f"- Exact control SHA: `{run['head_sha']}`\n"
              '- Mode: `plan-only`\n'
              '- Max workers: `3`\n'
              f"- URL: {run['html_url']}\n"
          )
          print(json.dumps({'body': body}))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            -X POST "${headers[@]}" \
            "${api}/issues/${PR_NUMBER}/comments" \
            -d "$comment_payload" >/dev/null
