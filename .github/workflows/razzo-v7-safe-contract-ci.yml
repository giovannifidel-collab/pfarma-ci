name: RAZZO V7 Safe Contract CI

on:
  pull_request:
    paths:
      - 'razzo/v7/**'
      - '.github/workflows/razzo-v7-ten-shard-trial.yml'
      - '.github/workflows/razzo-v7-safe-contract-ci.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: razzo-v7-safe-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate deterministic free fabric
        run: |
          python -m py_compile razzo/v7/deterministic_discovery.py razzo/v7/free_executor.py razzo/v7/contract_materializer.py razzo/v7/trial_runtime.py
          python -m unittest razzo.v7.test_actionability razzo.v7.test_product_discovery razzo.v7.test_contract_materializer razzo.v7.test_dispatcher_pool razzo.v7.test_trial_runtime -v
          python - <<'PY'
          from pathlib import Path
          trial=Path('.github/workflows/razzo-v7-ten-shard-trial.yml').read_text()
          assert 'workflow_dispatch:' in trial
          assert 'cancel-in-progress: true' in trial
          assert 'max-parallel: 3' in trial and 'max-parallel: 5' in trial
          assert 'deterministic_discovery' in trial
          assert 'free_executor' in trial
          assert 'codex exec' not in trial
          assert 'Install pinned Codex CLI' not in trial
          assert 'Restore Codex authentication' not in trial
          assert 'git push origin HEAD:main' not in trial
          PY

  report-once:
    if: ${{ github.event.pull_request.head.ref == 'razzo/v7-run-free-wave-once' }}
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - name: Report corrected free execute trial
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "${api}/actions/workflows/razzo-v7-ten-shard-trial.yml/runs?event=workflow_dispatch&branch=main&per_page=5" \
            -o "$RUNNER_TEMP/runs.json"
          python - "$RUNNER_TEMP/runs.json" <<'PY'
          import json,sys
          runs=json.load(open(sys.argv[1])).get('workflow_runs',[])
          if not runs:
              raise SystemExit('No dispatched free wave found')
          run=runs[0]
          print(json.dumps({'run_id':run['id'],'run_number':run['run_number'],'status':run['status'],'conclusion':run.get('conclusion'),'head_sha':run['head_sha'],'url':run['html_url']}))
          PY
