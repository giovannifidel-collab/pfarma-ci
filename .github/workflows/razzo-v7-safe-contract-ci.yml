name: RAZZO V7 Safe Contract CI

on:
  pull_request:
    paths:
      - '.github/workflows/razzo-v7-safe-contract-ci.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: razzo-v7-ten-shard-retry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event.pull_request.head.ref == 'razzo/v7-ten-shard-retry-trigger' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch bounded execute trial on current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          ref_file="$RUNNER_TEMP/main-ref.json"
          curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/git/ref/heads/main" -o "$ref_file"
          CONTROL_SHA="$(python - "$ref_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              print(json.load(handle)['object']['sha'])
          PY
          )"
          payload='{"ref":"main","inputs":{"mode":"execute-trial"}}'
          curl --fail-with-body --silent --show-error \
            -X POST "${headers[@]}" \
            "${api}/actions/workflows/razzo-v7-ten-shard-trial.yml/dispatches" \
            -d "$payload"
          runs_file="$RUNNER_TEMP/runs.json"
          for attempt in $(seq 1 30); do
            curl --fail-with-body --silent --show-error "${headers[@]}" \
              "${api}/actions/workflows/razzo-v7-ten-shard-trial.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              -o "$runs_file"
            result="$(python - "$runs_file" "$CONTROL_SHA" <<'PY'
          import json, sys
          path, sha = sys.argv[1], sys.argv[2]
          with open(path, encoding='utf-8') as handle:
              payload = json.load(handle)
          for run in payload.get('workflow_runs', []):
              if run.get('head_sha') == sha and run.get('event') == 'workflow_dispatch':
                  print(json.dumps({'run_id': run['id'], 'run_number': run['run_number'], 'head_sha': run['head_sha'], 'url': run['html_url']}))
                  break
          PY
            )"
            if [ -n "$result" ]; then
              echo "TEN_SHARD_RETRY=$result"
              exit 0
            fi
            sleep 2
          done
          echo 'dispatched run was not observed' >&2
          exit 1
