name: RAZZO V7 Safe Contract CI

on:
  pull_request:
    paths:
      - 'razzo/v7/**'
      - '.github/workflows/razzo-v7-ten-shard-trial.yml'
      - '.github/workflows/razzo-v7-safe-contract-ci.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: razzo-v7-safe-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate deterministic free fabric
        run: |
          python -m py_compile razzo/v7/deterministic_discovery.py razzo/v7/free_executor.py razzo/v7/contract_materializer.py razzo/v7/trial_runtime.py
          python -m unittest razzo.v7.test_actionability razzo.v7.test_product_discovery razzo.v7.test_contract_materializer razzo.v7.test_dispatcher_pool razzo.v7.test_trial_runtime -v
          python - <<'PY'
          from pathlib import Path
          trial=Path('.github/workflows/razzo-v7-ten-shard-trial.yml').read_text()
          assert 'workflow_dispatch:' in trial
          assert 'cancel-in-progress: true' in trial
          assert 'max-parallel: 3' in trial and 'max-parallel: 5' in trial
          assert 'deterministic_discovery' in trial
          assert 'free_executor' in trial
          assert 'codex exec' not in trial
          assert 'cache-dependency-path: product-source/package-lock.json' not in trial
          assert trial.index('Checkout exact product source') < trial.index('actions/setup-node@v4')
          PY

  watch-once:
    if: ${{ github.event.pull_request.head.ref == 'razzo/v7-final-free-wave-proof' }}
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for final free wave and report jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: '30672227777'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          for i in $(seq 1 100); do
            curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/actions/runs/${RUN_ID}" -o "$RUNNER_TEMP/run.json"
            status=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/run.json")
            echo "poll=$i status=$status"
            [ "$status" = completed ] && break
            sleep 10
          done
          python - "$RUNNER_TEMP/run.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          print('RUN_RESULT='+json.dumps({k:r.get(k) for k in ('id','run_number','status','conclusion','head_sha','html_url')}))
          if r.get('status')!='completed': raise SystemExit('target run did not complete')
          PY
          curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/actions/runs/${RUN_ID}/jobs?per_page=100" -o "$RUNNER_TEMP/jobs.json"
          python - "$RUNNER_TEMP/jobs.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          rows=[]
          for j in data.get('jobs',[]):
              rows.append({'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion'),'steps':[{'name':s['name'],'conclusion':s.get('conclusion')} for s in j.get('steps',[])]})
          print('JOBS_RESULT='+json.dumps(rows))
          PY
          curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/actions/runs/${RUN_ID}/artifacts?per_page=100" -o "$RUNNER_TEMP/artifacts.json"
          python - "$RUNNER_TEMP/artifacts.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          print('ARTIFACTS_RESULT='+json.dumps([{'id':a['id'],'name':a['name'],'expired':a['expired']} for a in data.get('artifacts',[])]))
          PY
