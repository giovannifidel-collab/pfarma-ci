name: RAZZO V7 Safe Contract CI

on:
  pull_request:
    paths:
      - 'razzo/v7/actionability.py'
      - 'razzo/v7/product_discovery.py'
      - 'razzo/v7/contract_materializer.py'
      - 'razzo/v7/trial_runtime.py'
      - 'razzo/v7/test_trial_runtime.py'
      - 'razzo/v7/dispatcher_pool.py'
      - 'razzo/v7/test_actionability.py'
      - 'razzo/v7/test_product_discovery.py'
      - 'razzo/v7/test_contract_materializer.py'
      - 'razzo/v7/test_dispatcher_pool.py'
      - 'razzo/v7/shards.json'
      - '.github/workflows/razzo-v7-product-worker-fabric.yml'
      - '.github/workflows/razzo-v7-ten-shard-trial.yml'
      - '.github/workflows/razzo-v7-safe-contract-ci.yml'
      - '.github/workflows/razzo-v7-elastic-fabric.yml'
      - '.github/workflows/razzo-v7-elastic-autoscaler.yml'
      - '.github/workflows/razzo-v6-operational-factory.yml'

permissions:
  contents: write

concurrency:
  group: razzo-v7-safe-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-runtime:
    if: github.event.pull_request.head.ref == 'razzo/v7-remove-legacy-landlock' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
      - name: Remove incompatible legacy Landlock wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('razzo/v7/trial_runtime.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import shlex\n', '').replace('import shutil\n', '')
          start = text.find('\ndef install_codex_worker_wrapper(')
          end = text.find('\n\ndef command_worker_prompt(', start)
          if start != -1 and end != -1:
              text = text[:start] + text[end:]
          text = text.replace('    install_codex_worker_wrapper(contract)\n', '')
          text = text.replace('        or Path(os.environ["RUNNER_TEMP"], "razzo-codex-environment-blocked").exists()\n', '')
          path.write_text(text, encoding='utf-8')
          Path('razzo/v7/test_trial_runtime.py').write_text(
              'import inspect\nimport unittest\n\nimport razzo.v7.trial_runtime as runtime\n\n\nclass TrialRuntimeSandboxTests(unittest.TestCase):\n    def test_product_worker_does_not_enable_legacy_landlock(self):\n        source = inspect.getsource(runtime)\n        self.assertNotIn("use_legacy_landlock", source)\n        self.assertNotIn("install_codex_worker_wrapper", source)\n\n\nif __name__ == "__main__":\n    unittest.main()\n',
              encoding='utf-8',
          )
          PY
          python -m py_compile razzo/v7/trial_runtime.py
          python -m unittest razzo.v7.test_trial_runtime -v
      - name: Commit runtime fix once
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add razzo/v7/trial_runtime.py razzo/v7/test_trial_runtime.py
          git commit -m 'fix: use standard Codex workspace sandbox'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  contracts:
    needs: patch-runtime
    if: always() && (needs.patch-runtime.result == 'success' || needs.patch-runtime.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile V7 Python modules
        run: |
          python -m py_compile \
            razzo/v7/actionability.py \
            razzo/v7/product_discovery.py \
            razzo/v7/contract_materializer.py \
            razzo/v7/trial_runtime.py \
            razzo/v7/dispatcher_pool.py
      - name: Run safe-factory unit contracts
        run: |
          python -m unittest razzo.v7.test_actionability -v
          python -m unittest razzo.v7.test_product_discovery -v
          python -m unittest razzo.v7.test_contract_materializer -v
          python -m unittest razzo.v7.test_dispatcher_pool -v
          python -m unittest razzo.v7.test_trial_runtime -v
      - name: Validate exact ten-shard topology
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          payload = json.loads(Path('razzo/v7/shards.json').read_text())
          shards = payload.get('shards', [])
          ids = [entry['shard_id'] for entry in shards]
          assert len(ids) == 10 and len(ids) == len(set(ids))
          assert all(entry.get('enabled') is True for entry in shards)
          assert all(entry.get('health') == 'healthy' for entry in shards)
          topology = Counter(entry.get('supported_lane') for entry in shards)
          assert topology == {'discovery': 3, 'product': 5, 'verify': 1, 'integration': 1}
          declared = payload.get('topology', {})
          assert declared.get('logical_shard_capacity') == 10
          assert all(declared.get(lane) == count for lane, count in topology.items())
          PY
      - name: Verify workflows are manual-only and bounded
        run: |
          python - <<'PY'
          from pathlib import Path
          manual = [
              '.github/workflows/razzo-v7-elastic-fabric.yml',
              '.github/workflows/razzo-v7-elastic-autoscaler.yml',
              '.github/workflows/razzo-v6-operational-factory.yml',
              '.github/workflows/razzo-v7-product-worker-fabric.yml',
              '.github/workflows/razzo-v7-ten-shard-trial.yml',
          ]
          for path in manual:
              text = Path(path).read_text()
              assert 'workflow_dispatch:' in text
              assert 'pull_request:' not in text
              assert '\n  push:' not in text
              assert '\n  schedule:' not in text
              assert 'cancel-in-progress: true' in text
          trial = Path('.github/workflows/razzo-v7-ten-shard-trial.yml').read_text()
          runtime = Path('razzo/v7/trial_runtime.py').read_text()
          assert 'execute-trial' in trial
          assert 'max-parallel: 3' in trial
          assert 'max-parallel: 5' in trial
          assert 'git push origin HEAD:main' not in trial
          assert 'bash -lc "$command"' not in trial
          assert 'auto_merge": False' in runtime
          assert 'use_legacy_landlock' not in runtime
          PY
