name: Queen S9.4 owner attestation independent configuration smoke READ ONLY
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-4-owner-attestation-smoke.yml]
permissions: {contents: read}
jobs:
  validate-project-scope-and-yaml:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
    steps:
      - name: Parse actual owner workflow YAML and verify security scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/queen-s9-4-six-project-owner-attestation.yml --jq .content \
            | tr -d '\n' | base64 -d > "$RUNNER_TEMP/s9-4-owner.yml"
          ruby -r yaml -e 'YAML.parse_file(ARGV[0]); puts "S9_4_OWNER_WORKFLOW_YAML_PARSE=PASS"' "$RUNNER_TEMP/s9-4-owner.yml"
          grep -q 'id-token: write' "$RUNNER_TEMP/s9-4-owner.yml"
          grep -q 'hive-queen-s9-4-six-scoped-draft-approval-v1' "$RUNNER_TEMP/s9-4-owner.yml"
          grep -q 'approve_s9_4_six_project_draft_canaries' "$RUNNER_TEMP/s9-4-owner.yml"
          grep -q 'OIDC_SIGNATURE_DENIED' "$RUNNER_TEMP/s9-4-owner.yml"
          grep -q 'deny_projects:' "$RUNNER_TEMP/s9-4-owner.yml"
          echo S9_4_OWNER_AUTHENTICATION_CONTRACT=PASS
      - name: Recheck all six exact prospective authority boundaries before signed owner request
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = 'eb9c169219c697fab500b909d34b42bdf43d16f2'
          gh api repos/giovannifidel-collab/hive-alveare/pulls/93 | jq -e '.state=="open" and .draft==true and .merged==false and .head.sha=="853ef0933eb89620664685bc01a9f241093c6411"' >/dev/null
          while IFS='|' read -r id repo branch sha; do
            got="$(gh api "repos/$repo/branches/$branch" --jq .commit.sha)"
            test "$got" = "$sha" || { echo "::error::S9.4 source drift $id"; exit 45; }
            echo "S9_4_EXACT_SOURCE_$id=PASS"
          done <<'PROJECTS'
          project-giovanni|giovannifidel-collab/project-giovanni|main|4f67bda2e1bf63db12c1d9d7311b57f12b7bc707
          hive-field|giovannifidel-collab/hive-field|main|6816df638304a6decb05b9b4bd6543d8600f5e7c
          giochem|giovannifidel-collab/giochem|main|8d8922171bfdc3554cb7786d08b3594ec681f59a
          pfarma-cloud|giovannifidel-collab/pfarma-cloud|main|1d460184944355ed2d4b375bfe03b35a70c7aa41
          family-cloud|giovannifidel-collab/family-cloud|agent/bootstrap-family-cloud|17b242eca13d7c73607e0bc52c64146750020cb7
          gio-os|giovannifidel-collab/gio-OS|main|31103989996a664dff385896143dccd03072cdf6
          PROJECTS
          echo S9_4_SIX_CANARY_SOURCE_LOCKS=PASS
          echo S9_4_CANARY_OWNER_OIDC_NOT_YET_CREATED=TRUE
          echo S9_4_EXTERNAL_PROJECT_WRITES=0
