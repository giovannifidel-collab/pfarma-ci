name: PFarma Migration Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pfarma-migration-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: pfarma-ci-trusted
    steps:
      - name: Diagnose exact migration aggregate quietly
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          sha='aad3b72c9f191d3843c7601b0f7f13b9905e956d'
          test -n "$SOURCE_TOKEN"
          mkdir source && cd source
          git init -q
          git remote add origin https://github.com/giovannifidel-collab/pfarma-cloud.git
          auth="$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$sha"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$sha"
          set +e
          python tests/test_razzo_migration_dry_run_policy.py > ../migration.log 2>&1
          status=$?
          set -e
          echo '===== MIGRATION DIAGNOSTIC ====='
          cat ../migration.log
          echo '===== END DIAGNOSTIC ====='
          exit "$status"
