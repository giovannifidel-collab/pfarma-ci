name: Queen S10 World Clock Cloudflare Account and Dedicated Token Read-only Preflight
# Recheck dedicated secret after final Owner installer 2026-11-19
on:
  push:
    branches: [audit/s10-world-clock-account-credential-preflight-20261119]
    paths: [.github/workflows/queen-s10-world-clock-prod-readiness-readonly.yml]
permissions: {contents: read}
jobs:
  inventory-safe-no-action:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: pfarma-ci-trusted
    env:
      CF_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_FALLBACK: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
      S10_GH_CLOCK_PAT: ${{ secrets.S10_WORLD_CLOCK_GH_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: S10 historical second-cutover Cloudflare logs and cron metrics READ ONLY
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,datetime,re,urllib.request,urllib.error
          token=os.environ.get('CF_PRIMARY') or os.environ.get('CF_FALLBACK') or ''
          assert len(token)>15,'NO_EXISTING_CF_TOKEN'
          api='https://api.cloudflare.com/client/v4'
          def call(path,body=None):
            headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'HIVE-S10-second-failure-readonly/1.0'}
            if body is not None: headers['Content-Type']='application/json'
            req=urllib.request.Request(api+path,headers=headers,data=(json.dumps(body).encode() if body is not None else None))
            try:
              with urllib.request.urlopen(req,timeout=25) as r:return json.load(r),r.status
            except urllib.error.HTTPError as e:return {'errors':[{'code':e.code}]},e.code
            except urllib.error.URLError:return {'errors':[{'code':'network'}]},0
          a,code=call('/accounts?per_page=50')
          ids=[v.get('id') for v in a.get('result',[]) if isinstance(v,dict)]
          assert a.get('success') and len(ids)==1,'ACCOUNT_UNVERIFIED'
          aid=ids[0]
          s,sc=call('/accounts/'+aid+'/workers/scripts/hive-queen-world-clock/schedules')
          obj=s.get('result') or {}
          scs=obj.get('schedules',[]) if isinstance(obj,dict) else obj
          print('S10_HISTORICAL_LIVE_ROLLBACK_SCHEDULES='+str([x.get('cron') for x in (scs if isinstance(scs,list) else [])]))
          start='2026-11-20T15:48:57Z'
          end='2026-11-20T16:14:56Z'
          query='query($accountTag:string,$scriptName:string,$start:string,$end:string){viewer{accounts(filter:{accountTag:$accountTag}){workersInvocationsAdaptive(limit:150,filter:{scriptName:$scriptName,datetime_geq:$start,datetime_leq:$end}){sum{requests errors subrequests}dimensions{datetime status scriptName}}}}}'
          g,gcode=call('/graphql',{'query':query,'variables':{'accountTag':aid,'scriptName':'hive-queen-world-clock','start':start,'end':end}})
          try:
            rows=g['data']['viewer']['accounts'][0]['workersInvocationsAdaptive']
            print('S10_SECOND_CUTOVER_REAL_CRON_REQUESTS='+str(sum((x.get('sum') or {}).get('requests',0) for x in rows)))
            print('S10_SECOND_CUTOVER_REAL_CRON_ERRORS='+str(sum((x.get('sum') or {}).get('errors',0) for x in rows)))
            print('S10_SECOND_CUTOVER_REAL_CRON_ROWS='+str(len(rows)))
          except (KeyError,IndexError,TypeError):
            print('S10_SECOND_CUTOVER_GRAPHQL_HTTP='+str(gcode))
          startms=int(datetime.datetime.fromisoformat(start.replace('Z','+00:00')).timestamp()*1000)
          endms=int(datetime.datetime.fromisoformat(end.replace('Z','+00:00')).timestamp()*1000)
          for label,params in [
              ('service',{'datasets':['cloudflare-workers'],'filters':[{'key':'$metadata.service','operation':'eq','type':'string','value':'hive-queen-world-clock'}]}),
              ('keyword',{'datasets':['cloudflare-workers'],'needle':{'value':'S10_WORLD_CLOCK_DECISION','isRegex':False,'matchCase':True}})]:
            req={'queryId':'s10-second-cutover-readonly-'+label,'timeframe':{'from':startms,'to':endms},
                 'dry':True,'view':'events','limit':100,'parameters':params}
            q,qcode=call('/accounts/'+aid+'/workers/observability/telemetry/query',req)
            d=q.get('result') or {}
            events=d.get('events',[]) if isinstance(d,dict) else []
            print('S10_SECOND_CUTOVER_LOG_QUERY_'+label.upper()+'_HTTP='+str(qcode))
            print('S10_SECOND_CUTOVER_LOG_QUERY_'+label.upper()+'_EVENTS='+str(len(events)))
            print('S10_SECOND_CUTOVER_LOG_QUERY_'+label.upper()+'_ERROR_CODES='+str([str(e.get('code',''))[:30] for e in q.get('errors',[]) if isinstance(e,dict)][:3]))
            decisions=[]
            for event in events:
              line=json.dumps(event,default=str,separators=(',',':'))
              decisions.extend(re.findall('S10_WORLD_CLOCK_DECISION=([A-Z0-9_]+)',line))
            print('S10_SECOND_CUTOVER_LOG_QUERY_'+label.upper()+'_DECISIONS='+','.join(decisions[-30:]))
          print('S10_SECOND_CUTOVER_READ_ONLY_NO_CLOCK_NO_MUTATION=TRUE')
          PY
      - name: Inspect Cloudflare Worker availability and exact dedicated GitHub credential presence - GET ONLY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,re,urllib.request,urllib.error
          token=os.environ.get('CF_PRIMARY') or os.environ.get('CF_FALLBACK')
          print('S10_DEDICATED_GITHUB_WORLD_DISPATCH_TOKEN_PRESENT='+str(len(os.environ.get('S10_GH_CLOCK_PAT') or '')>=16).lower())
          if not token:
            print('S10_CLOUDFLARE_WORKER_API_TOKEN_PRESENT=false')
            raise SystemExit(3)
          print('S10_CLOUDFLARE_WORKER_API_TOKEN_PRESENT=true')
          root='https://api.cloudflare.com/client/v4'
          def read(path):
            req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'},method='GET')
            try:
              with urllib.request.urlopen(req,timeout=20) as resp:result=json.load(resp)
              if not result.get('success'):return {'_error':'api_failed'}
              return result.get('result')
            except urllib.error.HTTPError as e:return {'_error':'http_'+str(e.code)}
          accounts=read('/accounts?per_page=50')
          assert isinstance(accounts,list),'S10_CLOUDFLARE_ACCOUNT_INVENTORY_READ_DENIED'
          print('S10_CLOUDFLARE_ACCOUNT_COUNT='+str(len(accounts)))
          for account in accounts:
            aid=str(account.get('id') or '')
            if not re.fullmatch('[a-f0-9]{32}',aid):continue
            workers=read('/accounts/'+aid+'/workers/scripts?per_page=100')
            if isinstance(workers,list):
              hits=[str(x.get('id') or x.get('script')) for x in workers if re.search('hive|queen|world',str(x.get('id') or x.get('script') or ''),re.I)]
              print('S10_CF_HIVE_RELATED_WORKERS_COUNT='+str(len(hits)))
              print('S10_CF_REPLACEMENT_WORLD_CLOCK_ALREADY_EXISTS='+str('hive-queen-world-clock' in hits).lower())
              if 'hive-queen-world-clock' in hits:
                schedules=read('/accounts/'+aid+'/workers/scripts/hive-queen-world-clock/schedules')
                s=schedules.get('schedules') if isinstance(schedules,dict) else schedules
                if isinstance(s,list):
                  print('S10_EXISTING_WORLD_CLOCK_SCHEDULES='+json.dumps([x.get('cron') for x in s if isinstance(x,dict)]))
                else:print('S10_EXISTING_WORLD_CLOCK_SCHEDULES_NOT_VERIFIED')
            elif isinstance(workers,dict):
              print('S10_CF_WORKER_SCRIPT_READ_STATUS='+str(workers.get('_error')))
            subscriptions=read('/accounts/'+aid+'/subscriptions')
            if isinstance(subscriptions,list):
              plans=[str((x.get('rate_plan') or {}).get('id') or (x.get('rate_plan') or {}).get('public_name') or 'unknown') for x in subscriptions if isinstance(x,dict)]
              print('S10_CF_SUBSCRIPTIONS_REPORTED='+json.dumps(plans))
            else:
              print('S10_CF_ACCOUNT_PLAN_NOT_CERTIFIED_BY_AVAILABLE_API=TRUE')
          print('S10_CLOUDFLARE_AND_TOKEN_PREFLIGHT_READ_ONLY=PASS')
          print('S10_NO_DEPLOY_NO_CREDENTIAL_EXPOSURE_NO_PRODUCT_MUTATION=TRUE')
          PY

      - name: Inspect existing Cloudflare Pages dispatch credential metadata - names only, read only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ.get('CF_PRIMARY') or os.environ.get('CF_FALLBACK')
          root='https://api.cloudflare.com/client/v4'
          def read(path):
            req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'},method='GET')
            try:
              with urllib.request.urlopen(req,timeout=22) as response:
                data=json.load(response)
              return data.get('result') if data.get('success') else None
            except (urllib.error.HTTPError,urllib.error.URLError,ValueError):
              return None
          accounts=read('/accounts?per_page=50')
          assert isinstance(accounts,list) and len(accounts)==1,'S10_CLOUDFLARE_ACCOUNT_AMBIGUOUS_DENY'
          aid=accounts[0]['id']
          project=read('/accounts/'+aid+'/pages/projects/hive-alveare')
          print('S10_EXISTING_HIVE_PAGES_PROJECT_METADATA_READABLE='+str(isinstance(project,dict)).lower())
          if isinstance(project,dict):
            for name,block in [('production',(project.get('deployment_configs') or {}).get('production') or {}),('preview',(project.get('deployment_configs') or {}).get('preview') or {})]:
              vars=block.get('env_vars') or {}
              found=vars.get('HIVE_GITHUB_DISPATCH_TOKEN')
              print('S10_EXISTING_HIVE_PAGES_'+name.upper()+'_DISPATCH_BINDING_PRESENT='+str(isinstance(found,dict)).lower())
              if isinstance(found,dict):
                print('S10_EXISTING_HIVE_PAGES_'+name.upper()+'_DISPATCH_BINDING_TYPE='+str(found.get('type','unknown')))
          scripts=read('/accounts/'+aid+'/workers/scripts?per_page=100')
          if isinstance(scripts,list):
            for s in scripts:
              wid=str(s.get('id') or s.get('script') or '')
              if wid not in ('hive-kimi-relay','hive-queen-world-clock'):
                continue
              secrets=read('/accounts/'+aid+'/workers/scripts/'+wid+'/secrets')
              if isinstance(secrets,list):
                available=any(x.get('name')=='HIVE_GITHUB_DISPATCH_TOKEN' for x in secrets if isinstance(x,dict))
                print('S10_EXISTING_'+wid.replace('-','_').upper()+'_DISPATCH_SECRET_PRESENT='+str(available).lower())
          print('S10_DISPATCH_CREDENTIAL_METADATA_READ_ONLY_NO_VALUES_EXPOSED=PASS')
          PY

      - name: Reuse existing Cloudflare Access service pair presence only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          a=bool(os.environ.get('CF_ACCESS_CLIENT_ID'))
          b=bool(os.environ.get('CF_ACCESS_CLIENT_SECRET'))
          print('S10_EXISTING_ACCESS_SERVICE_PAIR_PRESENT='+str(a and b).lower())
          print('S10_ACCESS_SERVICE_PAIR_PARTIAL_DENY='+str(a!=b).lower())
          print('S10_NO_SECRET_VALUES_EXPOSED=TRUE')
          PY

      - name: Verify existing Pages Access path and binding names - read only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          cf=os.environ.get('CF_PRIMARY') or os.environ.get('CF_FALLBACK')
          aid=os.environ.get('CF_ACCESS_CLIENT_ID') or ''
          ase=os.environ.get('CF_ACCESS_CLIENT_SECRET') or ''
          rq=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts?per_page=50',headers={'Authorization':'Bearer '+cf})
          with urllib.request.urlopen(rq,timeout=22) as r: data=json.load(r)
          assert data.get('success') and len(data.get('result') or [])==1
          acc=data['result'][0]['id']
          rq=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+acc+'/pages/projects/hive-alveare',headers={'Authorization':'Bearer '+cf})
          with urllib.request.urlopen(rq,timeout=22) as r: data=json.load(r)
          assert data.get('success')
          env=((data.get('result') or {}).get('deployment_configs') or {}).get('production',{}).get('env_vars') or {}
          print('S10_PAGES_AUTH_RELATED_BINDING_NAMES='+','.join(sorted(k for k in env if ('ACCESS' in k or 'DISPATCH' in k or 'WORLD' in k))))
          url='https://hive-alveare.pages.dev/api/world-state'
          for mode,headers in [('without_access',{'accept':'application/json'}),('service_access',{'accept':'application/json','CF-Access-Client-Id':aid,'CF-Access-Client-Secret':ase})]:
            req=urllib.request.Request(url,headers=headers,method='GET')
            try:
              with urllib.request.urlopen(req,timeout=20) as r: code=r.status
            except urllib.error.HTTPError as e: code=e.code
            except urllib.error.URLError: code=0
            print('S10_PAGES_WORLD_STATE_HTTP_'+mode.upper()+'='+str(code))
          print('S10_NO_PAGES_MUTATION_NO_SECRET_VALUES_EXPOSED=TRUE')
          PY

      - name: Inspect existing Cloudflare Pages domains and Access applications - read only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ.get('CF_PRIMARY') or os.environ.get('CF_FALLBACK')
          root='https://api.cloudflare.com/client/v4'
          def read(path):
            req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=22) as r: j=json.load(r)
              return j.get('result') if j.get('success') else {'err':'api_rejected'}
            except urllib.error.HTTPError as e: return {'err': 'http_'+str(e.code)}
            except urllib.error.URLError: return {'err':'network'}
          accounts=read('/accounts?per_page=50')
          assert isinstance(accounts,list) and len(accounts)==1
          account=accounts[0]['id']
          page=read('/accounts/'+account+'/pages/projects/hive-alveare')
          if isinstance(page,dict):
            print('S10_HIVE_PAGES_SUBDOMAIN='+str(page.get('subdomain') or 'unavailable'))
            print('S10_HIVE_PAGES_CUSTOM_DOMAINS='+','.join(page.get('domains') or []))
            print('S10_HIVE_PAGES_CANONICAL_DEPLOYMENT='+str((page.get('canonical_deployment') or {}).get('url') or 'unavailable'))
          apps=read('/accounts/'+account+'/access/apps?per_page=100')
          if isinstance(apps,list):
            for a in apps:
              if not isinstance(a,dict):continue
              domain=str(a.get('domain') or '')
              if 'hive' in domain or 'pages.dev' in domain:
                print('S10_EXISTING_ACCESS_APPLICATION_DOMAIN='+domain)
                print('S10_EXISTING_ACCESS_APPLICATION_TYPE='+str(a.get('type') or 'unknown'))
                print('S10_EXISTING_ACCESS_APPLICATION_AUD_PRESENT='+str(bool(a.get('aud'))).lower())
          else:
            print('S10_ACCESS_APP_READ_STATE='+str(apps.get('err') if isinstance(apps,dict) else 'not_available'))
          print('S10_ACCESS_AND_PAGES_DOMAIN_METADATA_ONLY=PASS')
          PY

      - name: Verify Cloudflare Pages with descriptive User-Agent and existing Service Access - GET only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.request,urllib.error
          target='https://hive-alveare.pages.dev/api/world-state'
          ua='HIVE-S10-World-Clock-Audit/1.0'
          for name,h in [('anonymous',{}),('service',{'CF-Access-Client-Id':os.environ.get('CF_ACCESS_CLIENT_ID',''),'CF-Access-Client-Secret':os.environ.get('CF_ACCESS_CLIENT_SECRET','')})]:
            req=urllib.request.Request(target,headers={**h,'User-Agent':ua,'Accept':'application/json','Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=22) as res:
                code=res.status
                typ=res.headers.get('content-type','')
                sample=res.read(80)
            except urllib.error.HTTPError as e:
              code=e.code
              typ=e.headers.get('content-type','')
              sample=e.read(80)
            except urllib.error.URLError:
              code=0
              typ=''
              sample=b''
            print('S10_PAGES_DESCRIPTIVE_UA_'+name.upper()+'_STATUS='+str(code))
            print('S10_PAGES_DESCRIPTIVE_UA_'+name.upper()+'_CTYPE_JSON='+str('json' in typ).lower())
            print('S10_PAGES_DESCRIPTIVE_UA_'+name.upper()+'_CF1010='+str(b'1010' in sample).lower())
          print('S10_CLOUDFLARE_ACCESS_TEST_READONLY=PASS')
          PY

      - name: Check existing Access identity metadata without disclosing credentials or JWT
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,hashlib,urllib.request,urllib.error
          url='https://hive-alveare.pages.dev/cdn-cgi/access/get-identity'
          headers={'User-Agent':'HIVE-S10-Access-Identity-Audit/1.0','accept':'application/json',
                   'CF-Access-Client-Id':os.environ.get('CF_ACCESS_CLIENT_ID',''),
                   'CF-Access-Client-Secret':os.environ.get('CF_ACCESS_CLIENT_SECRET','')}
          req=urllib.request.Request(url,headers=headers)
          try:
            with urllib.request.urlopen(req,timeout=22) as r:
              code=r.status
              body=r.read(120000)
          except urllib.error.HTTPError as e:
            code=e.code
            body=e.read(3000)
          print('S10_ACCESS_IDENTITY_METADATA_HTTP='+str(code))
          if code==200:
            try:
              obj=json.loads(body)
              print('S10_ACCESS_IDENTITY_HAS_AUD='+str(bool(obj.get('aud'))).lower())
              print('S10_ACCESS_IDENTITY_AUD='+str(obj.get('aud') or 'unavailable'))
              print('S10_ACCESS_IDENTITY_HAS_SERVICE_ID='+str(bool(obj.get('service_token_id'))).lower())
              print('S10_ACCESS_IDENTITY_SERVICE_ID_MATCHES_EXISTING='+str(obj.get('service_token_id')==os.environ.get('CF_ACCESS_CLIENT_ID')).lower())
              print('S10_ACCESS_IDENTITY_TYPE='+str(obj.get('type') or 'unknown'))
            except (ValueError,AttributeError): print('S10_ACCESS_IDENTITY_JSON_PARSE=UNAVAILABLE')
          print('S10_EXISTING_ACCESS_CLIENT_ID_SHA256='+hashlib.sha256(os.environ.get('CF_ACCESS_CLIENT_ID','').encode()).hexdigest())
          print('S10_ACCESS_IDENTITY_NO_SECRET_VALUES=PASS')
          PY

      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify exact Owner World-only drift fix without approval or deploy
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          CANDIDATE: d890c48f9e1af8415f7be7e7df41fc702d1c64fd
          KNOWN_BEFORE: 12de4490d78dbdd3c101efc6daef594f78e9d980
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/giovannifidel-collab/pfarma-ci/compare/$KNOWN_BEFORE...main" |
            jq -e '.status=="ahead" and
              ((.files|map(.filename)|all(. == ".github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml" or . == "hive-world-state.json"))) and
              ((.files|map(.filename)|index(".github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml")) != null)' >/dev/null
          git fetch -q origin "$CANDIDATE"
          git show "$CANDIDATE:.github/workflows/queen-owner-s10-world-clock-cutover-oidc.yml" > /tmp/s10-owner-world-fix.yml
          npx --yes prettier@3 --parser yaml /tmp/s10-owner-world-fix.yml > /dev/null
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/s10-owner-world-fix.yml').read_text()
          start="          node --input-type=module <<'JS'"+chr(10)
          a=s.index(start)+len(start)
          b=s.index(chr(10)+"          JS",a)
          js=chr(10).join(x[10:] if x.startswith('          ') else x for x in s[a:b].splitlines())
          Path('/tmp/s10-owner-fix-signer.mjs').write_text(js+chr(10))
          assert 'S10_WORLD_ONLY_BACKGROUND_MAIN_DRIFT_EXACT_SCOPE=PASS' in s
          assert 'HIVE_PR105: 0e34b7965639b9a32c6abb90bb5b7b98317dabe7' in s
          assert 'RELAY_PR1307: 6670ef862ef971785222a7a55b9834ca78c24f0e' in s
          assert "tr -d '\\n' | base64 -d" in s
          print('S10_OWNER_WORLD_RECONCILIATION_EXACT_SOURCE=PASS')
          PY
          node --check /tmp/s10-owner-fix-signer.mjs
          echo S10_WORLD_ONLY_DRIFT_REAL_MAIN_PRECHECK=PASS
          echo S10_NO_DEPLOY_NO_OWNER_APPROVAL_NO_NEW_SECRET=TRUE

      - name: Probe Pages broker authenticated NEGATIVE ONLY after Owner PR merge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          url='https://hive-alveare.pages.dev/api/s10-world-clock-dispatch'
          headers={
            'User-Agent':'HIVE-S10-Authenticated-Negative-Audit/1.0',
            'Accept':'application/json','Content-Type':'application/json',
            'CF-Access-Client-Id':os.environ.get('CF_ACCESS_CLIENT_ID',''),
            'CF-Access-Client-Secret':os.environ.get('CF_ACCESS_CLIENT_SECRET','')}
          payload=b'{"clock_minute":"INVALID_ALWAYS_REJECTED"}'
          req=urllib.request.Request(url,data=payload,headers=headers,method='POST')
          try:
            with urllib.request.urlopen(req,timeout=22) as res:code,raw=res.status,res.read(1000)
          except urllib.error.HTTPError as e:code,raw=e.code,e.read(1000)
          except urllib.error.URLError:code,raw=0,b''
          try:res=json.loads(raw)
          except (ValueError,UnicodeError):res={}
          error=res.get('error') if isinstance(res,dict) else None
          reason=res.get('reason') if isinstance(res,dict) else None
          print('S10_EXISTING_PAGES_BROKER_NEGATIVE_REASON='+str(reason))
          print('S10_EXISTING_PAGES_JWT_SAME_ORIGIN_REDIRECT_PROBE=YES')
          print('S10_EXISTING_PAGES_BROKER_NEGATIVE_HTTP='+str(code))
          print('S10_EXISTING_PAGES_BROKER_NEGATIVE_ERROR='+str(error))
          print('S10_EXISTING_PAGES_BROKER_NEGATIVE_AUTHENTICATED='+str(code==400 and error=='EXACT_CLOCK_PAYLOAD_DENY').lower())
          print('S10_EXISTING_PAGES_BROKER_NO_GITHUB_DISPATCH_NO_WORLD_CHANGE=TRUE')
          PY

      - name: Rehearse exact newest S10 Owner OIDC preflight without release - GET ONLY
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
