      - name: Cloudflare GraphQL - scheduled minute Worker real invocation metrics (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,datetime,urllib.request,urllib.error
          token=os.environ.get('CF_PRIMARY') or os.environ.get('CF_FALLBACK')
          root='https://api.cloudflare.com/client/v4'
          def req(url,body=None):
            headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'HIVE-S10-Worker-Metrics-ReadOnly/1.0'}
            if body is not None:headers['Content-Type']='application/json'
            r=urllib.request.Request(url,headers=headers,data=json.dumps(body).encode() if body is not None else None)
            try:
              with urllib.request.urlopen(r,timeout=30) as x: return json.load(x)
            except urllib.error.HTTPError as e:return {'http_error':e.code,'message':e.read(800).decode(errors='replace')}
            except urllib.error.URLError:return {'network_error':True}
          aa=req(root+'/accounts?per_page=50')
          ids=[x['id'] for x in aa.get('result',[]) if isinstance(x,dict) and 'id' in x]
          assert aa.get('success') and len(ids)==1,'S10_ACCOUNT_NOT_UNIQUE_DENY'
          aid=ids[0]
          s=req(root+'/accounts/'+aid+'/workers/scripts/hive-queen-world-clock/schedules')
          obj=s.get('result') or {}
          schedules=obj.get('schedules',[]) if isinstance(obj,dict) else obj
          print('S10_CF_REAL_CLOCK_SCHEDULES='+json.dumps(schedules,separators=(',',':'))[:700])
          start=(datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(minutes=50)).strftime('%Y-%m-%dT%H:%M:%SZ')
          end=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          query='query($accountTag:string,$scriptName:string,$start:string,$end:string){viewer{accounts(filter:{accountTag:$accountTag}){workersInvocationsAdaptive(limit:200,filter:{scriptName:$scriptName,datetime_geq:$start,datetime_leq:$end}){sum{requests errors subrequests}dimensions{datetime status scriptName}}}}}'
          g=req(root+'/graphql',{'query':query,'variables':{'accountTag':aid,'scriptName':'hive-queen-world-clock','start':start,'end':end}})
          if g.get('errors'):
            print('S10_CF_GRAPHQL_ERRORS='+json.dumps([e.get('message','')[:160] for e in g.get('errors',[])])[:700])
          try:
            rows=g['data']['viewer']['accounts'][0]['workersInvocationsAdaptive']
            print('S10_CF_WORKER_INVOCATION_ROWS='+str(len(rows)))
            print('S10_CF_WORKER_INVOCATION_REQUEST_SUM='+str(sum((x.get('sum') or {}).get('requests',0) for x in rows)))
            print('S10_CF_WORKER_INVOCATION_ERROR_SUM='+str(sum((x.get('sum') or {}).get('errors',0) for x in rows)))
            for x in sorted(rows,key=lambda x:(x.get('dimensions') or {}).get('datetime',''))[-15:]:
              d=x.get('dimensions') or {};v=x.get('sum') or {}
              print('S10_CF_WORKER_INVOCATION='+str(d.get('datetime'))+';'+str(d.get('status'))+';requests='+str(v.get('requests'))+';errors='+str(v.get('errors')))
          except (KeyError,TypeError,IndexError):
            print('S10_CF_WORKER_METRICS_UNAVAILABLE='+str(g.get('http_error') or g.get('network_error') or 'query_rejected'))
          print('S10_CF_WORKER_INVOCATION_CHECK_NO_PRODUCTION_WRITES=TRUE')
          PY

      - name: Workers Observability event logs read-only - S10 CLOCK DECISIONS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,datetime,urllib.request,urllib.error
          token=os.environ.get('CF_PRIMARY') or os.environ.get('CF_FALLBACK')
          api='https://api.cloudflare.com/client/v4'
          def call(url,body=None):
            headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'HIVE-S10-Signed-Cron-Logs-Readonly/1.0'}
            if body is not None:headers['Content-Type']='application/json'
            request=urllib.request.Request(url,headers=headers,data=(json.dumps(body).encode() if body is not None else None))
            try:
              with urllib.request.urlopen(request,timeout=28) as resp:return json.load(resp)
            except urllib.error.HTTPError as e:return {'http_error':e.code,'error_brief':e.read(500).decode(errors='replace')[:160]}
            except urllib.error.URLError:return {'network_error':True}
          a=call(api+'/accounts?per_page=50')
          accounts=a.get('result',[])
          assert a.get('success') and len(accounts)==1
          acc=accounts[0]['id']
          now=datetime.datetime.now(datetime.timezone.utc)
          t1=int((now-datetime.timedelta(minutes=30)).timestamp()*1000)
          t2=int(now.timestamp()*1000)
          payload={'queryId':'s10-readonly-cron-decision-diagnostic','timeframe':{'from':t1,'to':t2},'dry':True,'view':'events','limit':100,
             'parameters':{'datasets':['cloudflare-workers'],'needle':{'value':'S10_WORLD_CLOCK_DECISION','isRegex':False,'matchCase':True},
               'filters':[{'key':'$metadata.service','operation':'eq','type':'string','value':'hive-queen-world-clock'}]}}
          z=call(api+'/accounts/'+acc+'/workers/observability/telemetry/query',payload)
          print('S10_CF_OBSERVABILITY_HTTP='+str(z.get('http_error','200_if_response_returned')))
          if not z.get('success'):
            print('S10_CF_OBSERVABILITY_QUERY_STATUS='+','.join((e.get('message','')[:90] for e in z.get('errors',[]) if isinstance(e,dict)))[:250])
          result=z.get('result') or {}
          events=result.get('events') or []
          print('S10_CF_CRON_DECISION_LOG_ROWS='+str(len(events)))
          for event in events[-60:]:
            msg=json.dumps(event.get('message') or event.get('logs') or event.get('event') or event,separators=(',',':'))
            for word in ['S10_WORLD_CLOCK_DECISION=']:
              start=msg.find(word)
              if start>=0:
                decision=''.join(c for c in msg[start+len(word):start+len(word)+100] if c.isalnum() or c in '_-')
                print('S10_CF_CRON_DECISION='+decision[:90])
          print('S10_CF_OBSERVABILITY_DIAG_NO_SECRETS_AND_READ_ONLY=TRUE')
          PY


