name: Queen S9.6 Independent Post-Production Scoped Exit Check
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-6-postprod-independent-certification.yml]
permissions: {contents: read}
jobs:
  scoped-exit:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Verify exact source, Owner run and all positive/negative CI
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = 'eb9c169219c697fab500b909d34b42bdf43d16f2'
          ptr="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\n')"
          test "$ptr" = 'eb9c169219c697fab500b909d34b42bdf43d16f2'
          gh api repos/giovannifidel-collab/hive-alveare/pulls/92 | jq -e '.merged==true and .merge_commit_sha=="eb9c169219c697fab500b909d34b42bdf43d16f2"' >/dev/null
          for pr in 89 90 91; do
            gh api "repos/giovannifidel-collab/hive-alveare/pulls/$pr" | jq -e '.state=="closed" and .merged==false' >/dev/null
          done
          for run in 43405119995 43406087354 43406742619 43407353778 43381880192 43382903175 43383170987 43383190862 43388499218 43388823023 43389333929 43390580494; do
            gh api "repos/giovannifidel-collab/pfarma-ci/actions/runs/$run" | jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1' >/dev/null
          done
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/43383707152 | jq -e '.conclusion=="failure" and .run_attempt==1' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/actions/runs/43391387125 | jq -e '.conclusion=="success" and .head_sha=="d9d8d7c8de1ab59dbde628a3605844fe7676d71d"' >/dev/null
          echo S9_6_AUTHORITATIVE_CI_PROOF_CHAIN=PASS
      - name: Read only protected live Cloudflare and S2 state
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in runtime-health queen-state queen-s9-readiness; do
            http="$(curl -sS --max-time 26 -o "$RUNNER_TEMP/$endpoint.json" -w '%{http_code}' \
              -H "Cf-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "Cf-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H 'Accept: application/json' \
              "https://hive-alveare.pages.dev/api/$endpoint")"
            test "$http" = '200'
          done
          jq -e '.ok==true' "$RUNNER_TEMP/runtime-health.json" >/dev/null
          jq -e '.ok==true and .state.cognitive.value.paid_fallback==false' "$RUNNER_TEMP/queen-state.json" >/dev/null
          jq -e '.stage=="S9.1" and .read_only==true and .can_dispatch==false and .can_merge==false and .can_deploy==false and .can_train_school==false and .paid_fallback==false' "$RUNNER_TEMP/queen-s9-readiness.json" >/dev/null
          echo S9_6_CLOUDFLARE_POSTPROD_S1_S2_READBACK=PASS
          echo S9_6_S92_EXACT_SIGNED_PRODUCTION_RELEASE=PASS
          echo S9_6_S93_ONE_HIVE_OWNER_APPROVED_MISSION=PASS
          echo S9_6_S94_FRESH_TEN_PROJECT_READONLY_ONLY=PASS
          echo S9_6_S95_REAL_FAULT_AND_ONE_SIGNED_ISOLATED_REPLACEMENT=PASS
          echo S9_6_SCOPED_INDEPENDENT_ACCEPTANCE=PASS
          echo S9_6_UNATTENDED_FAILOVER_CERTIFIED=FALSE
          echo S9_6_CROSS_PROJECT_WRITE_AUTHORIZED=FALSE
          echo S9_6_GLOBAL_AUTONOMY_CERTIFIED=FALSE
