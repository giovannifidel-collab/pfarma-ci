name: RAZZO V7 One-Shot Plan Launcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/razzo-v7-one-shot-plan-launcher.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: razzo-v7-one-shot-plan-launcher
  cancel-in-progress: true

jobs:
  dispatch:
    if: ${{ github.event.head_commit.message == 'RAZZO V7: one-shot plan-only launcher' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch safe factory in plan-only mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"mode":"plan-only","max_workers":"3"}}'
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/razzo-v7-product-worker-fabric.yml/dispatches" \
            -d "${payload}"
          echo "Dispatched RAZZO V7 Safe Product Factory with mode=plan-only and max_workers=3."
