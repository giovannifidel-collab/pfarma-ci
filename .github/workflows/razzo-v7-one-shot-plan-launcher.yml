name: RAZZO V7 One-Shot Plan Launcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/razzo-v7-one-shot-plan-launcher.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: razzo-v7-one-shot-plan-launcher
  cancel-in-progress: true

jobs:
  dispatch:
    if: ${{ github.event.head_commit.message == 'RAZZO V7: one-shot plan launcher with receipt' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch, identify and record safe factory plan-only run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          payload='{"ref":"main","inputs":{"mode":"plan-only","max_workers":"3"}}'
          curl --fail-with-body --silent --show-error \
            -X POST "${headers[@]}" \
            "${api}/actions/workflows/razzo-v7-product-worker-fabric.yml/dispatches" \
            -d "${payload}"

          run_json=''
          for attempt in $(seq 1 30); do
            response="$(curl --fail-with-body --silent --show-error \
              "${headers[@]}" \
              "${api}/actions/workflows/razzo-v7-product-worker-fabric.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            export RESPONSE="$response" CONTROL_SHA
            run_json="$(python - <<'PY'
          import json, os
          payload = json.loads(os.environ['RESPONSE'])
          sha = os.environ['CONTROL_SHA']
          for run in payload.get('workflow_runs', []):
              if run.get('head_sha') == sha and run.get('event') == 'workflow_dispatch':
                  print(json.dumps({
                      'run_id': run['id'],
                      'run_number': run['run_number'],
                      'html_url': run['html_url'],
                      'status': run['status'],
                      'head_sha': run['head_sha'],
                      'mode': 'plan-only',
                      'max_workers': 3,
                  }))
                  break
          PY
            )"
            if [ -n "$run_json" ]; then
              break
            fi
            sleep 2
          done

          test -n "$run_json"
          export RUN_JSON="$run_json"
          contents_payload="$(python - <<'PY'
          import base64, json, os
          receipt = json.loads(os.environ['RUN_JSON'])
          receipt['launcher_run_id'] = os.environ.get('GITHUB_RUN_ID')
          receipt['recorded_by'] = 'RAZZO V7 one-shot launcher'
          content = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          print(json.dumps({
              'message': 'RAZZO V7: record one-shot plan-only dispatch',
              'content': base64.b64encode(content.encode()).decode(),
              'branch': 'main',
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            -X PUT "${headers[@]}" \
            "${api}/contents/razzo/v7/one-shot-dispatch-receipt.json" \
            -d "$contents_payload" >/dev/null
          echo "$run_json"
