name: Queen S9 Standing Single Canonical S1 Source and Read-only E2E - NO DEPLOY
on:
  push:
    branches:
      - audit/queen-standing-single-s1-consumer-20261118
    paths:
      - .github/workflows/queen-s1-event-ingress.yml
      - .github/workflows/queen-s9-standing-consumer-source-ci.yml
      - ops/queen/s9/relay-standing-safe-observer.mjs
      - ops/queen/s9/tests/relay-standing-safe-observer.test.mjs
permissions: {contents: read}
concurrency:
  group: queen-standing-single-s1-source-only
  cancel-in-progress: false
jobs:
  certify-existing-s1-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: pfarma-ci-trusted
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
    steps:
      - name: Checkout exact source-only candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exactly one old S1 and known HIVE private authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_REF" = refs/heads/audit/queen-standing-single-s1-consumer-20261118
          test -n "$GH_TOKEN"
          PRIVATE_MAIN="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)"
          PTR="$(sed -n '1p' hive-source-ref.txt)"
          test "$PRIVATE_MAIN" = "29bb723e9dba1654ea782d97c3f6517dd20ea6dc"
          test "$PTR" = "$PRIVATE_MAIN"
          grep -Fq 'S9.5 pre-router receipt-only' .github/workflows/queen-s1-event-ingress.yml
          grep -Fq 'S9 standing signed Owner HIVE-only safe observation' .github/workflows/queen-s1-event-ingress.yml
          grep -Fq 'node queen-private/ops/queen/core/event-router.mjs' .github/workflows/queen-s1-event-ingress.yml
          if grep -Fq 'repository_dispatch:' .github/workflows/hive-queen-event-ingress.yml; then
            echo 'S9_STANDING_SECOND_S1_DENIED'; exit 30
          fi
          test "$(grep -c '^  repository_dispatch:' .github/workflows/queen-s1-event-ingress.yml)" = 1
          echo 'STANDING_SINGLE_CANONICAL_S1_AND_HIVE_SOURCE=PASS'
      - name: Enforce bounded source-only diff and no cross-project workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main --no-tags
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          test "${#files[@]}" -eq 4
          for file in "${files[@]}"; do
            case "$file" in
              .github/workflows/queen-s1-event-ingress.yml|.github/workflows/queen-s9-standing-consumer-source-ci.yml|ops/queen/s9/relay-standing-safe-observer.mjs|ops/queen/s9/tests/relay-standing-safe-observer.test.mjs) ;;
              *) echo "STANDING_UNAUTHORIZED_DIFF=$file"; exit 33 ;;
            esac
          done
          echo 'STANDING_RELAY_FOUR_SOURCE_PATHS_ONLY=PASS'
      - name: Run all standing scope and non-mutation regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/queen/s9/relay-standing-safe-observer.mjs
          node --check ops/queen/s9/tests/relay-standing-safe-observer.test.mjs
          node --test ops/queen/s9/tests/relay-standing-safe-observer.test.mjs
          echo 'STANDING_RELAY_SELFTEST_SCOPE_FAIL_CLOSED=PASS'
          echo 'STANDING_NO_PROVIDER_DISPATCH=TRUE'
          echo 'STANDING_NO_SCHOOL_NO_PROJECT_WRITES_NO_PAID_FALLBACK=TRUE'
      - name: Recheck immutable owner and standing scope source
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/giovannifidel-collab/hive-alveare/contents/ops/queen/s9/OWNER_STANDING_DELEGATION_PROPOSAL.v1.json --jq .sha)" = 90f4fb35b8610f7738c79af0019cf1cb2582f746
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/44301260541 |
            jq -e '.conclusion=="success" and .run_attempt==1' >/dev/null
          echo 'STANDING_PROVEN_OWNER_NEON_CLOUDFLARE_L0_L2=PASS'
          echo 'STANDING_RELEASE_REQUIRES_NEW_OWNER_OIDC=TRUE'
