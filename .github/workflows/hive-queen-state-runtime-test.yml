name: HIVE Queen State Runtime Test

on:
  push:
    branches:
      - queen-universal-fabric-vnext
    paths:
      - ".github/workflows/hive-queen-state-runtime-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 5
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
      HIVE_BASE_URL: ${{ secrets.HIVE_BASE_URL }}
    steps:
      - name: Read back durable Queen state
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HIVE_BASE_URL:-https://hive-alveare.pages.dev}"
          BASE="${BASE%/}"
          args=(-sS --max-time 25 -o /tmp/body -w '%{http_code}')
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            args+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          if [[ -n "${HIVE_RUNTIME_BEARER_TOKEN:-}" ]]; then
            args+=(-H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN")
          fi
          CODE="$(curl "${args[@]}" "$BASE/api/queen-state")"
          test "$CODE" = '200' || { echo "QUEEN_STATE_HTTP=$CODE"; exit 3; }
          jq -e '
            .ok == true and
            .state.school.value.verified == true and
            (.state.school.value.score >= 0.7) and
            .state.school.value.event_id != null and
            .state.world.value.freshness == "fresh" and
            .state.world.value.event_id != null and
            .state.cognitive.value.state == "LISTENING" and
            .state.cognitive.value.decision == "await_event" and
            .state.cognitive.value.paid_fallback == false and
            .state.cognitive.value.event_id != null and
            (.state.school.value.correlation_id == .state.world.value.correlation_id) and
            (.state.world.value.correlation_id == .state.cognitive.value.correlation_id)
          ' /tmp/body >/dev/null
          echo 'QUEEN_DURABLE_READBACK=PASS'
          jq '{
            school:{verified:.state.school.value.verified,score:.state.school.value.score,event_id:.state.school.value.event_id},
            world:{freshness:.state.world.value.freshness,event_id:.state.world.value.event_id},
            cognitive:{state:.state.cognitive.value.state,decision:.state.cognitive.value.decision,event_id:.state.cognitive.value.event_id,paid_fallback:.state.cognitive.value.paid_fallback},
            correlation:.state.cognitive.value.correlation_id
          }' /tmp/body
