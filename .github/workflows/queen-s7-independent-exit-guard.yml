name: Queen S7 Independent Live Exit Guard - Read Only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/queen-s7-independent-exit-guard.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/queen-s7-independent-exit-guard.yml']
permissions: {contents: read}
concurrency:
  group: queen-s7-independent-live-exit-guard
  cancel-in-progress: false
jobs:
  test-deny-by-default:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 10
    env:
      PRIVATE_AUDIT_SHA: ec3ef0c6d771344542c26364b826a5f26630584e
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: ${{ env.PRIVATE_AUDIT_SHA }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: queen-source
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify SHA and Queen S0-S7 source constraints
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C queen-source rev-parse HEAD)" = "$PRIVATE_AUDIT_SHA"
          for x in governance/validate-s0-truth.mjs core/validate-s1-core.mjs memory/validate-s2-school-memory.mjs delegation/validate-s3-delegation.mjs razzo/validate-s4-closeout.mjs compute/validate-s5-closeout.mjs autopilot/validate-s6-closeout.mjs compute/s7/validate-s7-readiness.mjs; do
            node "queen-source/ops/queen/$x"
          done
          node --test queen-source/ops/queen/compute/s7/tests/*.test.mjs
          echo 'S7_INDEPENDENT_GUARD_AND_S0_S6_REGRESSION=PASS'
          echo 'S7_NOT_HIVE_CERTIFIED_YET'
      - name: Reject false completion from provider-only receipts
        shell: bash
        run: |
          set -euo pipefail
          cd queen-source
          node --input-type=module -e "
            import {evaluateS7Exit} from './ops/queen/compute/s7/evaluate-s7-exit.mjs';
            import s7 from './ops/queen/compute/s7/S7_STATE.json' with {type:'json'};
            import s6 from './ops/queen/autopilot/S6_STATE.json' with {type:'json'};
            import s5 from './ops/queen/compute/S5_STATE.json' with {type:'json'};
            import s4 from './ops/queen/razzo/S4_STATE.json' with {type:'json'};
            const r=evaluateS7Exit({s4,s5,s6,s7,receipts:{nodes:[]}});
            if(r.ok||r.status!=='S7_EXIT_DENIED')process.exit(41);
            console.log('S7_FALSE_COMPLETION_REJECTED=PASS');
          "
      - name: Cleanup
        if: always()
        run: rm -rf queen-source
