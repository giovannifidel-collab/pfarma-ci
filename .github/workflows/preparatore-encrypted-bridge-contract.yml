name: Preparatore PLUS Public Encrypted Bridge Contract
on:
  pull_request:
    paths:
      - '.github/workflows/preparatore-v2-dispatch-bridge.yml'
      - 'tools/download_preparatore_encrypted_worker.py'
      - 'tools/test_preparatore_encrypted_bridge.py'
      - 'scripts/requeue-preparatore-public-jobs.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'cryptography==46.0.4'
      - run: python -m unittest discover -s tools -p 'test_preparatore_encrypted_bridge.py' -v
      - run: python tools/test_public_ci_bundle.py
