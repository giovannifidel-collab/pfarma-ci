name: HIVE Runtime Auth History Private

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hive-runtime-auth-history-private.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trace private HIVE auth configuration without exposing values
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${SOURCE_TOKEN:-}" ]] || { echo 'PFARMA_SOURCE_TOKEN=EMPTY'; exit 2; }

          for NAME in hive-alveare hive-interface; do
            echo "=== REPOSITORY=$NAME ==="
            DIR="/tmp/$NAME"
            rm -rf "$DIR"
            git clone --quiet --filter=blob:none \
              "https://x-access-token:${SOURCE_TOKEN}@github.com/giovannifidel-collab/${NAME}.git" "$DIR"
            cd "$DIR"
            echo "HEAD=$(git rev-parse HEAD)"

            for MARKER in CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET HIVE_RUNTIME_BEARER_TOKEN; do
              echo "MARKER=$MARKER"
              mapfile -t MATCHES < <(git log --format='%H' -S"$MARKER" -- . 2>/dev/null | head -n 15)
              echo "HISTORY_MATCHES=${#MATCHES[@]}"
              for C in "${MATCHES[@]}"; do
                echo "COMMIT=$C"
                git show --pretty='' --name-only "$C" -- 2>/dev/null | sed '/^$/d;s/^/PATH=/' | head -n 20
              done
            done

            echo 'CURRENT_TREE_FILES_WITH_MARKERS:'
            git grep -l -E 'CF_ACCESS_CLIENT_ID|CF_ACCESS_CLIENT_SECRET|HIVE_RUNTIME_BEARER_TOKEN' HEAD -- 2>/dev/null | sed 's/^/PATH=/' | head -n 50 || true
            cd /
          done

          echo '=== PRIVATE AUTH HISTORY TRACE COMPLETE ==='
