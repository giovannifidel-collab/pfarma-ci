name: Queen S1 Event Ingress

on:
  push:
    branches:
      - main
      - convergence/queen-s1-promote-v1
      - convergence/queen-s1-single-ingress-v1
    paths:
      - '.github/workflows/queen-s1-event-ingress.yml'
  repository_dispatch:
    types:
      - queen-task
      - fabric-result
      - verifier-result
      - verification-result
      - school-verified
      - world-state-changed
      - queen-cycle
  workflow_dispatch:
    inputs:
      event_json:
        description: 'Canonical hive.event.v1 envelope; optional for self-test'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: queen-s1-event-ingress-${{ github.event.client_payload.correlation_id || github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pfarma-ci-trusted
    env:
      PRIVATE_REPO: giovannifidel-collab/hive-alveare
      PRIVATE_REF: c73eb935cb5a9559a4dea43b46b464da8341ef23
      DISPATCH_ACTION: ${{ github.event.action }}
      CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
      MANUAL_EVENT_JSON: ${{ inputs.event_json }}
    steps:
      - name: Checkout public relay
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact private Queen Core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_REF }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: queen-private
          fetch-depth: 1
          persist-credentials: false

      - name: Build canonical event envelope
        id: event
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${MANUAL_EVENT_JSON:-}" ]; then
            EVENT_JSON="$MANUAL_EVENT_JSON"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            case "$DISPATCH_ACTION" in
              queen-task) TYPE='queen.task.requested' ;;
              fabric-result) TYPE='fabric.result.ready' ;;
              verifier-result|verification-result) TYPE='verification.result.ready' ;;
              school-verified) TYPE='school.experience.verified' ;;
              world-state-changed) TYPE='world.state.changed' ;;
              queen-cycle) TYPE='queen.cycle.continue' ;;
              *) echo "S1_UNSUPPORTED_DISPATCH_ACTION=$DISPATCH_ACTION"; exit 20 ;;
            esac

            EVENT_JSON="$(jq -cn               --arg id "${{ github.run_id }}-${{ github.run_attempt }}"               --arg type "$TYPE"               --arg source "github.repository_dispatch"               --arg occurred_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"               --argjson client "$CLIENT_PAYLOAD"               '{
                version:"1",
                id:$id,
                type:$type,
                source:$source,
                occurred_at:$occurred_at,
                correlation_id:($client.correlation_id // $id),
                hop:($client.hop // 0),
                max_hops:($client.max_hops // 8),
                payload:($client.data // {})
              }')"
          else
            EVENT_JSON="$(jq -cn               --arg id "s1-selftest-${{ github.run_id }}-${{ github.run_attempt }}"               --arg occurred_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"               '{
                version:"1",
                id:$id,
                type:"queen.cycle.continue",
                source:"queen.s1.ingress.selftest",
                occurred_at:$occurred_at,
                correlation_id:$id,
                hop:0,
                max_hops:8,
                payload:{self_test:true}
              }')"
          fi

          jq -e '
            .version=="1" and
            (.id|type=="string") and
            (.correlation_id|type=="string") and
            (.hop|type=="number") and
            (.max_hops|type=="number") and
            (.payload|type=="object")
          ' <<<"$EVENT_JSON" >/dev/null

          {
            echo 'json<<EOF'
            echo "$EVENT_JSON"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Route through exact private canonical event router
        id: route
        shell: bash
        env:
          HIVE_EVENT_JSON: ${{ steps.event.outputs.json }}
        run: |
          set -euo pipefail
          RESULT="$(node queen-private/ops/queen/core/event-router.mjs)"
          jq -e '.accepted == true and (.action|type=="string")' <<<"$RESULT" >/dev/null
          echo "$RESULT" | jq .
          {
            echo 'json<<EOF'
            echo "$RESULT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Enforce router-only boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const result=JSON.parse(process.env.ROUTE);
          if ('execution_result' in result) throw new Error('Ingress may not fabricate execution');
          if ('verified' in result) throw new Error('Ingress may not fabricate verification');
          if ('project_write' in result) throw new Error('Ingress may not write projects');
          if (result.next_event && result.continue_allowed !== true && result.next_hop !== null) {
            throw new Error('bounded continuation mismatch');
          }
          console.log('S1_ROUTER_ONLY_BOUNDARY=PASS');
          NODE
        env:
          ROUTE: ${{ steps.route.outputs.json }}

      - name: Execute durable action only after repository_dispatch
        if: github.event_name == 'repository_dispatch'
        id: durable
        shell: bash
        env:
          ROUTE: ${{ steps.route.outputs.json }}
          EVENT_JSON: ${{ steps.event.outputs.json }}
          HIVE_BASE_URL: ${{ secrets.HIVE_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          ACTION="$(jq -r '.action' <<<"$ROUTE")"
          CORRELATION="$(jq -r '.correlation_id // .id' <<<"$EVENT_JSON")"
          DATA="$(jq -c '.payload // {}' <<<"$EVENT_JSON")"

          case "$ACTION" in
            school.record_verified_experience|world.update|queen.cognitive_cycle)
              BASE="${HIVE_BASE_URL:-https://hive-alveare.pages.dev}"
              BASE="${BASE%/}"
              BODY="$(jq -cn                 --arg action "$ACTION"                 --arg correlation_id "$CORRELATION"                 --argjson data "$DATA"                 '{action:$action,correlation_id:$correlation_id,data:$data}')"
              args=(-sS --max-time 30 -o /tmp/queen-durable-body -w '%{http_code}' -X POST -H 'Content-Type: application/json')
              if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
                args+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
              fi
              if [[ -n "${HIVE_RUNTIME_BEARER_TOKEN:-}" ]]; then
                args+=(-H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN")
              fi
              CODE="$(curl "${args[@]}" "$BASE/api/queen-state" -d "$BODY")"
              test "$CODE" = '200' || { echo "S1_DURABLE_ACTION_HTTP=$CODE"; cat /tmp/queen-durable-body || true; exit 30; }
              jq -e '.ok == true' /tmp/queen-durable-body >/dev/null
              echo "S1_DURABLE_ACTION=$ACTION"
              ;;
            queen.evaluate_goals|queen.replan)
              # The canonical cognitive cycle performs goal evaluation/replanning.
              # This deterministic transition is complete once routed; the next
              # queen-cycle event performs the actual cognitive work.
              echo "S1_INTERNAL_TRANSITION=$ACTION"
              ;;
            fabric.execute|verification.execute)
              echo "S1_ACTION_NOT_YET_CANONICAL=$ACTION"
              echo "S1_FAIL_CLOSED=delegation/verification execution belongs to later convergence gates"
              exit 40
              ;;
            *)
              echo "S1_UNSUPPORTED_ACTION=$ACTION"
              exit 41
              ;;
          esac
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch next event only after completed action
        if: github.event_name == 'repository_dispatch' && steps.durable.outputs.complete == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE: ${{ steps.route.outputs.json }}
          EVENT_JSON: ${{ steps.event.outputs.json }}
        run: |
          set -euo pipefail
          NEXT="$(jq -r '.next_event // empty' <<<"$ROUTE")"
          CONTINUE="$(jq -r '.continue_allowed // false' <<<"$ROUTE")"
          NEXT_HOP="$(jq -r '.next_hop // empty' <<<"$ROUTE")"
          MAX_HOPS="$(jq -r '.max_hops' <<<"$ROUTE")"
          CORRELATION="$(jq -r '.correlation_id' <<<"$ROUTE")"
          DATA="$(jq -c '.payload // {}' <<<"$EVENT_JSON")"

          if [ -z "$NEXT" ]; then
            echo "S1_EVENT_CHAIN=COMPLETE"
            exit 0
          fi
          test "$CONTINUE" = 'true' || { echo "S1_EVENT_CHAIN=CHECKPOINT_REQUIRED"; exit 0; }
          test -n "$NEXT_HOP"
          test "$NEXT_HOP" -le "$MAX_HOPS"

          case "$NEXT" in
            fabric.result.ready) EVENT_TYPE='fabric-result' ;;
            verification.result.ready) EVENT_TYPE='verifier-result' ;;
            school.experience.verified) EVENT_TYPE='school-verified' ;;
            world.state.changed) EVENT_TYPE='world-state-changed' ;;
            queen.cycle.continue) EVENT_TYPE='queen-cycle' ;;
            *) echo "S1_UNROUTABLE_NEXT_EVENT=$NEXT"; exit 50 ;;
          esac

          BODY="$(jq -cn             --arg event_type "$EVENT_TYPE"             --arg correlation_id "$CORRELATION"             --argjson hop "$NEXT_HOP"             --argjson max_hops "$MAX_HOPS"             --argjson data "$DATA"             '{event_type:$event_type,client_payload:{schema:"hive.event.v1",correlation_id:$correlation_id,hop:$hop,max_hops:$max_hops,data:$data}}')"

          HTTP="$(curl -sS -o /tmp/s1-next-dispatch -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches"             -d "$BODY")"
          test "$HTTP" = '204' || { echo "S1_NEXT_DISPATCH_FAILED_HTTP=$HTTP"; exit 51; }
          echo "S1_NEXT_EVENT=$EVENT_TYPE"
          echo "S1_NEXT_HOP=$NEXT_HOP"
          echo "S1_NEXT_DISPATCH=PASS"

      - name: S1 ingress proof
        shell: bash
        run: |
          {
            echo "QUEEN_S1_EVENT_INGRESS=PASS"
            echo "PRIVATE_SOURCE_SHA=$PRIVATE_REF"
            echo "SCHEDULE_DEPENDENCY=false"
            echo "PROJECT_MUTATION=false"
            echo "NEXT_EVENT_IS_DECLARATIVE_ONLY=true"
          } | tee -a "$GITHUB_STEP_SUMMARY"
