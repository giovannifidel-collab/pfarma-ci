name: HIVE Secret Scope Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hive-secret-scope-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Locate existing runtime auth names without exposing values
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${SOURCE_TOKEN:-}" ]] || { echo 'PFARMA_SOURCE_TOKEN=EMPTY'; exit 2; }
          echo 'PFARMA_SOURCE_TOKEN=AVAILABLE'

          api(){
            local url="$1"
            curl -sS \
              -H "Authorization: Bearer $SOURCE_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$url"
          }

          for REPO in giovannifidel-collab/pfarma-ci giovannifidel-collab/hive-alveare giovannifidel-collab/hive-interface; do
            echo "=== REPO=$REPO ==="

            S="$(api "https://api.github.com/repos/$REPO/actions/secrets" || true)"
            printf '%s' "$S" | jq -r '.secrets[]?.name | select(test("CF_ACCESS|HIVE_RUNTIME|CLOUDFLARE|HIVE_BASE")) | "REPO_SECRET_NAME=" + .' 2>/dev/null || true

            V="$(api "https://api.github.com/repos/$REPO/actions/variables" || true)"
            printf '%s' "$V" | jq -r '.variables[]?.name | select(test("CF_ACCESS|HIVE_RUNTIME|CLOUDFLARE|HIVE_BASE")) | "REPO_VARIABLE_NAME=" + .' 2>/dev/null || true

            E="$(api "https://api.github.com/repos/$REPO/environments" || true)"
            printf '%s' "$E" | jq -r '.environments[]?.name' 2>/dev/null | while IFS= read -r ENVNAME; do
              [[ -n "$ENVNAME" ]] || continue
              echo "ENVIRONMENT=$ENVNAME"
              ENC="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$ENVNAME")"

              ES="$(api "https://api.github.com/repos/$REPO/environments/$ENC/secrets" || true)"
              printf '%s' "$ES" | jq -r '.secrets[]?.name | select(test("CF_ACCESS|HIVE_RUNTIME|CLOUDFLARE|HIVE_BASE")) | "ENV_SECRET_NAME=" + .' 2>/dev/null || true

              EV="$(api "https://api.github.com/repos/$REPO/environments/$ENC/variables" || true)"
              printf '%s' "$EV" | jq -r '.variables[]?.name | select(test("CF_ACCESS|HIVE_RUNTIME|CLOUDFLARE|HIVE_BASE")) | "ENV_VARIABLE_NAME=" + .' 2>/dev/null || true
            done
          done

          echo '=== SECRET SCOPE DISCOVERY COMPLETE ==='
