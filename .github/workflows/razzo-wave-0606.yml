name: RAZZO Wave 0606 Exact Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'razzo/wave-0606-project-ref.txt'
      - 'razzo/wave-0606-pfarma-ref.txt'
      - 'razzo/wave-0606-family-ref.txt'
      - '.github/workflows/razzo-wave-0606.yml'
permissions:
  contents: read
jobs:
  project-download-verification:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: ref
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < razzo/wave-0606-project-ref.txt)"; [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1; echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - env: {TOKEN: "${{ secrets.PFARMA_SOURCE_TOKEN }}"}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with: {repository: giovannifidel-collab/project-giovanni, ref: '${{ steps.ref.outputs.sha }}', token: '${{ secrets.PFARMA_SOURCE_TOKEN }}', path: project, fetch-depth: 1, persist-credentials: false}
      - run: test "$(git -C project rev-parse HEAD)" = '${{ steps.ref.outputs.sha }}'
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: project
        run: npm install --no-audit --no-fund
      - working-directory: project
        run: npx --yes tsc --noEmit
      - name: PG-H-008 focused regression
        working-directory: project
        run: node --experimental-strip-types --test factory/history-export-download-verification.test.mjs
      - id: diagnose
        name: Diagnose Factory files
        working-directory: project
        shell: bash
        run: |
          set -u
          failed=""
          for f in factory/*.test.mjs; do
            if ! node --experimental-strip-types --test "$f" >/dev/null 2>&1; then
              failed="$f"
              break
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: "Factory failing file ${{ steps.diagnose.outputs.failed }}"
        if: steps.diagnose.outputs.failed != ''
        run: exit 1
      - name: Factory suite
        if: steps.diagnose.outputs.failed == ''
        working-directory: project
        run: npm run test:factory
      - working-directory: project
        run: npm run factory:plan
      - working-directory: project
        env: {NEXT_TELEMETRY_DISABLED: '1', NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co', NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci_placeholder'}
        run: npm run build
      - if: always()
        run: rm -rf project
  pfarma-checkpoint-regression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: ref
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < razzo/wave-0606-pfarma-ref.txt)"; [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1; echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - env: {TOKEN: "${{ secrets.PFARMA_SOURCE_TOKEN }}"}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with: {repository: giovannifidel-collab/pfarma-cloud, ref: '${{ steps.ref.outputs.sha }}', token: '${{ secrets.PFARMA_SOURCE_TOKEN }}', path: pfarma, fetch-depth: 1, persist-credentials: false}
      - run: test "$(git -C pfarma rev-parse HEAD)" = '${{ steps.ref.outputs.sha }}'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - working-directory: pfarma
        run: python -m compileall -q factory api/warehouse_allocation_service.py tests/test_cart_warehouse_routing_preview.py tests/test_cart_replenishment_preview.py
      - working-directory: pfarma
        run: python -m unittest factory.test_razzo_executor factory.test_continuous_loop factory.test_github_worker_runtime -v
      - working-directory: pfarma
        run: PYTHONPATH=. python tests/test_cart_warehouse_routing_preview.py && PYTHONPATH=. python tests/test_cart_replenishment_preview.py
      - working-directory: pfarma
        run: python -m factory.plan
      - if: always()
        run: rm -rf pfarma
  family-target-selection:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: ref
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < razzo/wave-0606-family-ref.txt)"; [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1; echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - env: {TOKEN: "${{ secrets.PFARMA_SOURCE_TOKEN }}"}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with: {repository: giovannifidel-collab/family-cloud, ref: '${{ steps.ref.outputs.sha }}', token: '${{ secrets.PFARMA_SOURCE_TOKEN }}', path: family, fetch-depth: 1, persist-credentials: false}
      - run: test "$(git -C family rev-parse HEAD)" = '${{ steps.ref.outputs.sha }}'
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: family
        run: npm install --no-audit --no-fund
      - working-directory: family
        run: npm run typecheck
      - working-directory: family
        run: npm test
      - working-directory: family
        run: npm run factory:plan
      - if: always()
        run: rm -rf family
