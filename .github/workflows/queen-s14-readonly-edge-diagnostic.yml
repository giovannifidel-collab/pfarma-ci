name: Queen S14 — Read-only edge diagnostic (zero inference)
on:
  push:
    branches: [s14/readonly-edge-diagnostic-20261127]
    paths: ['.github/workflows/queen-s14-readonly-edge-diagnostic.yml']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 4
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Read production binding and authenticated status only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,re
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          def read(url,headers):
              req=urllib.request.Request(url,headers=headers,method='GET')
              try:
                  with opener.open(req,timeout=15) as r:
                      try: return r.status,json.load(r)
                      except Exception: return r.status,{}
              except urllib.error.HTTPError as e: return e.code,{}
              except Exception: return 0,{}
          token=os.environ.get('CF_TOKEN','')
          h={'Authorization':'Bearer '+token,'Accept':'application/json'}
          api='https://api.cloudflare.com/client/v4'
          c,a=read(api+'/accounts?per_page=100',h)
          print('S14_ACCOUNTS_HTTP='+str(c))
          matches=[]
          for account in a.get('result',[]):
              aid=str(account.get('id',''))
              if not re.fullmatch('[a-f0-9]{32}',aid):continue
              code,j=read(api+'/accounts/'+aid+'/pages/projects/hive-alveare',h)
              if code==200 and j.get('result',{}).get('name')=='hive-alveare':
                  matches.append(j['result'])
          print('S14_UNIQUE_PAGES_PROJECT='+str(len(matches)==1))
          if len(matches)==1:
              prod=matches[0].get('deployment_configs',{}).get('production',{}) or {}
              ai=prod.get('ai_bindings',{}) or {}
              print('S14_PRODUCTION_AI_BINDING_CONFIGURED='+str('AI' in ai))
              dep=matches[0].get('canonical_deployment') or {}
              print('S14_CANONICAL_DEPLOYMENT_PRESENT='+str(bool(dep)))
              print('S14_CANONICAL_SHA_MATCH='+str((dep.get('deployment_trigger',{}).get('metadata') or {}).get('commit_hash')=='f924e9b168996617af5ea5573ce4f7f49f112731'))
          access={'CF-Access-Client-Id':os.environ.get('CF_ACCESS_CLIENT_ID',''),'CF-Access-Client-Secret':os.environ.get('CF_ACCESS_CLIENT_SECRET',''),'Accept':'application/json'}
          if not all(access.values()):raise SystemExit('S14_ACCESS_CREDENTIAL_MISSING')
          host='https://hive-alveare.pages.dev'
          for label,path in [('BINDING','/api/queen-s8-workers-ai'),('QUEEN_GET','/api/queen'),('WORLD','/api/world-state'),('CONSOLE','/')]:
              code,j=read(host+path,access)
              print('S14_'+label+'_HTTP='+str(code))
              if label=='BINDING' and code==200:
                  print('S14_LIVE_AI_BINDING_PRESENT='+str(j.get('binding_present') is True))
                  print('S14_LIVE_MODEL_INVOKED='+str(j.get('model_invoked') is True))
                  print('S14_LIVE_COST_CERTIFIED='+str(j.get('free_plan_certified') is True))
          print('S14_ZERO_INFERENCE_REQUESTS=TRUE')
          print('S14_ZERO_RUNTIME_WRITES=TRUE')
          PY
      - name: Compare exact canonical curl transport, no redirects or inference
        shell: bash
        run: |
          set -euo pipefail
          headers=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          for pair in 'BINDING|/api/queen-s8-workers-ai' 'QUEEN_GET|/api/queen' 'WORLD|/api/world-state' 'CONSOLE|/'; do
            label="${pair%%|*}"
            path="${pair#*|}"
            code="$(curl --silent --show-error --max-time 25 "${headers[@]}" -D "$RUNNER_TEMP/s14-h" -o "$RUNNER_TEMP/s14-b" -w '%{http_code}' "https://hive-alveare.pages.dev$path" || true)"
            echo "S14_CURL_${label}_HTTP=$code"
            if grep -qi '^cf-mitigated: *challenge' "$RUNNER_TEMP/s14-h"; then echo "S14_CURL_${label}_CHALLENGE=TRUE"; fi
            if [ "$label" = BINDING ] && [ "$code" = 200 ]; then
              jq -r '"S14_CURL_LIVE_AI_BINDING_PRESENT="+(.binding_present|tostring),"S14_CURL_LIVE_MODEL_INVOKED="+(.model_invoked|tostring),"S14_CURL_LIVE_COST_CERTIFIED="+(.free_plan_certified|tostring)' "$RUNNER_TEMP/s14-b"
            fi
            rm -f "$RUNNER_TEMP/s14-h" "$RUNNER_TEMP/s14-b"
          done
          echo S14_CURL_ZERO_INFERENCE=TRUE
      - name: Reproduce Node fetch transport with GET only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const headers={'CF-Access-Client-Id':process.env.CF_ACCESS_CLIENT_ID,'CF-Access-Client-Secret':process.env.CF_ACCESS_CLIENT_SECRET,'content-type':'application/json'};
          for(const [label,path] of [['BINDING','/api/queen-s8-workers-ai'],['QUEEN','/api/queen'],['WORLD','/api/world-state']]){
            try{
              const r=await fetch('https://hive-alveare.pages.dev'+path,{headers,method:'GET',redirect:'manual',signal:AbortSignal.timeout(20000)});
              console.log('S14_NODE_'+label+'_HTTP='+r.status);
              if(label==='BINDING'&&r.ok){
                const j=await r.json();
                console.log('S14_NODE_BINDING_PRESENT='+(j.binding_present===true));
              }
            }catch{console.log('S14_NODE_'+label+'_TRANSPORT_ERROR');}
          }
          console.log('S14_NODE_ZERO_INFERENCE=TRUE');
          JS
      - name: Confirm empty message rejection before model invocation on exact source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const headers={'CF-Access-Client-Id':process.env.CF_ACCESS_CLIENT_ID,'CF-Access-Client-Secret':process.env.CF_ACCESS_CLIENT_SECRET,'content-type':'application/json'};
          // Canonical queen.js returns 400 for empty message before inspecting AI or calling it.
          const r=await fetch('https://hive-alveare.pages.dev/api/queen',{method:'POST',headers,body:JSON.stringify({message:''}),redirect:'manual',signal:AbortSignal.timeout(20000)});
          const data=await r.json().catch(()=>null);
          console.log('S14_NODE_EMPTY_POST_HTTP='+r.status);
          console.log('S14_NODE_EMPTY_POST_VALIDATION_REACHED='+(r.status===400&&data?.error==='message required'));
          if(r.status===401)console.log('S14_NODE_EMPTY_POST_AUTH_DENY=TRUE');
          console.log('S14_NO_NONEMPTY_MODEL_PROMPT_SENT=TRUE');
          JS
      - name: Check exact Queen repair source in isolated mock-only tests
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: c78f1b1b7c81233f99d94111733bbd49e071b301
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: private-hive
          fetch-depth: 0
      - name: Verify exact repair scope and run isolated tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-hive rev-parse HEAD)" = c78f1b1b7c81233f99d94111733bbd49e071b301
          git -C private-hive diff --name-only f924e9b168996617af5ea5573ce4f7f49f112731 HEAD | sort | diff -u <(printf '%s\n' cloudflare/functions/api/queen.js ops/queen/s14/queen-informational-model-repair.test.mjs) -
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 90 --memory 384m --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=32m --mount "type=bind,source=$GITHUB_WORKSPACE/private-hive,target=/project,readonly" --workdir /project node:22-alpine node --test ops/queen/s14/queen-informational-model-repair.test.mjs
          echo S14_REPAIR_SOURCE_MOCK_TESTS=PASS
      - name: Clean exact private checkout
        if: always()
        run: rm -rf private-hive
