name: RAZZO High Throughput Factory V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'razzo/runtime_v6/high_throughput.py'
      - 'razzo/runtime_v6/high_throughput_runtime.py'
      - 'razzo/runtime_v6/high_throughput.json'
      - 'razzo/runtime_v6/test_high_throughput.py'
      - '.github/workflows/razzo-high-throughput-factory-v2.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [proof, product]
        default: proof
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: razzo-high-throughput-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "value=proof" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "value=product" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.mode || 'proof' }}" >> "$GITHUB_OUTPUT"
          fi
      - run: python -m unittest -v razzo.runtime_v6.test_high_throughput
      - run: python -m razzo.runtime_v6.high_throughput_runtime preflight --mode proof

  proof-wave:
    needs: preflight
    if: needs.preflight.outputs.mode == 'proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m razzo.runtime_v6.high_throughput_runtime cycle --mode proof --output razzo-proof
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-high-throughput-proof-v2
          path: razzo-proof

  product-wave:
    needs: preflight
    if: needs.preflight.outputs.mode == 'product'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      RAZZO_FACTORY_TOKEN: ${{ secrets.RAZZO_FACTORY_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RAZZO_BUILDER_COMMAND: codex exec --full-auto
      RUNNER_ENVIRONMENT: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore persistent online repository cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/razzo/repos
          key: razzo-repo-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            razzo-repo-cache-${{ runner.os }}-
      - name: Prepare online workspaces
        run: |
          mkdir -p /home/runner/.cache/razzo/repos
          mkdir -p /home/runner/work/_razzo-workspaces
      - name: Install Codex CLI online
        run: npm install --global @openai/codex
      - name: Verify online credentials and coding executor
        shell: bash
        run: |
          test -n "$RAZZO_FACTORY_TOKEN" || { echo 'Missing RAZZO_FACTORY_TOKEN'; exit 2; }
          test -n "$OPENAI_API_KEY" || { echo 'Missing OPENAI_API_KEY'; exit 2; }
          command -v codex
          command -v gh
          codex --version
          python -m razzo.runtime_v6.high_throughput_runtime preflight --mode product
      - name: Four-generation incremental online product cycle
        run: python -m razzo.runtime_v6.high_throughput_runtime cycle --mode product --output razzo-product
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razzo-high-throughput-product-receipts-v2
          path: razzo-product
