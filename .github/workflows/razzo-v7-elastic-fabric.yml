name: RAZZO V7 Legacy Elastic Fabric Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: razzo-v7-legacy-fabric-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run legacy fabric unit contracts only
        run: python -m unittest razzo.v7.test_autoscaler razzo.v7.test_fabric -v
      - name: State diagnostic boundary
        run: |
          echo "Legacy elastic fabric is manual diagnostics only."
          echo "No synthetic worker matrix, sleep-based proof, product credit, publication or continuation is permitted."
