name: RAZZO High Throughput Factory

on:
  pull_request:
    branches: [main]
    paths:
      - 'razzo/runtime_v6/high_throughput.py'
      - 'razzo/runtime_v6/high_throughput.json'
      - 'razzo/runtime_v6/test_high_throughput.py'
      - '.github/workflows/razzo-high-throughput-factory.yml'
      - 'scripts/install_razzo_runner.py'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [proof, product]
        default: proof
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: razzo-high-throughput-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: mode
        run: echo "value=${{ github.event_name == 'pull_request' && 'proof' || inputs.mode || 'proof' }}" >> "$GITHUB_OUTPUT"
      - run: python -m unittest -v razzo.runtime_v6.test_high_throughput
      - run: python -m razzo.runtime_v6.high_throughput preflight --mode proof

  proof-wave:
    needs: preflight
    if: needs.preflight.outputs.mode == 'proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m razzo.runtime_v6.high_throughput cycle --mode proof --output razzo-proof
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-high-throughput-proof
          path: razzo-proof

  product-wave:
    needs: preflight
    if: needs.preflight.outputs.mode == 'product'
    runs-on: [self-hosted, linux, x64, razzo-persistent]
    permissions:
      contents: read
    env:
      RAZZO_FACTORY_TOKEN: ${{ secrets.RAZZO_FACTORY_TOKEN }}
      RAZZO_BUILDER_COMMAND: ${{ vars.RAZZO_BUILDER_COMMAND }}
      RUNNER_ENVIRONMENT: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed unless real writer, coding executor and persistent runner exist
        run: python -m razzo.runtime_v6.high_throughput preflight --mode product
      - name: Four-generation incremental product cycle
        run: python -m razzo.runtime_v6.high_throughput cycle --mode product --output razzo-product
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razzo-high-throughput-product-receipts
          path: razzo-product
