name: Project Giovanni RAZZO Continuous Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'project-giovanni-continuous-ref.txt'
      - '.github/workflows/project-continuous-probe.yml'

permissions:
  contents: read

concurrency:
  group: project-continuous-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  factory:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfarma-ci-trusted
    steps:
      - name: Checkout public control repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve exact private source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < project-giovanni-continuous-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require private-source token
        shell: bash
        env:
          GIO_TOKEN: ${{ secrets.PROJECT_GIOVANNI_SOURCE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          token="${GIO_TOKEN:-${FALLBACK_TOKEN:-}}"
          test -n "$token"
          echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Checkout exact Project Giovanni commit
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: test "$(git -C private-source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: private-source
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        working-directory: private-source
        run: npx --yes tsc --noEmit
      - name: Executor tests
        working-directory: private-source
        run: node --test factory/executor.test.mjs
      - name: Continuous-loop tests
        working-directory: private-source
        run: node --test factory/continuous-loop.test.mjs
      - name: Factory planner smoke
        working-directory: private-source
        run: npm run factory:plan
