name: Queen S9.4 Family Single-Test Owner Draft Independent Acceptance
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-4-family-pr874-independent-acceptance.yml]
permissions: {contents: read}
jobs:
  independently-verify-owner-signed-test-only-draft:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      OWNER_CI: '43919266993'
      EXPECTED_BASE: 17b242eca13d7c73607e0bc52c64146750020cb7
      EXPECTED_HEAD: a0620f465576b29381f5f6c3d076ab1f7c786cea
    steps:
      - name: Check exact Owner source, draft PR and one allowed file
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/43919266993 \
            | jq -e '.conclusion=="success" and .status=="completed" and .run_attempt==1 and .event=="workflow_dispatch" and .actor.login=="giovannifidel-collab"' >/dev/null
          test "$(gh api repos/giovannifidel-collab/family-cloud/branches/agent/bootstrap-family-cloud --jq .commit.sha)" = "$EXPECTED_BASE"
          test "$(gh api repos/giovannifidel-collab/family-cloud/branches/main --jq .commit.sha)" = b4e796f0202fd1e6ae89029674d69210e9bbbc8d
          gh api repos/giovannifidel-collab/family-cloud/pulls/874 | jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" \
           '.state=="open" and .draft==true and .merged==false and .base.ref=="agent/bootstrap-family-cloud" and .base.sha==$base and .head.sha==$head and .changed_files==1 and .deletions==2' >/dev/null
          gh api repos/giovannifidel-collab/family-cloud/pulls/874/files?per_page=10 \
           | jq -e 'length==1 and .[0].filename=="tests/persistence-recovery.test.mjs" and .[0].status=="modified" and .[0].deletions==2' >/dev/null
          echo S9_4_FAMILY_EXACT_OWNER_ONE_FILE_DRAFT_SOURCE=PASS
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: a0620f465576b29381f5f6c3d076ab1f7c786cea
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Independently execute project-owned functional tests on actual PR HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node --test tests/canonical-product-surface.test.mjs tests/persistence-recovery.test.mjs
          test -z "$(git status --porcelain --untracked-files=no)"
          echo S9_4_FAMILY_PROPOSED_TEST_ONLY_PATCH_TESTS=PASS
          echo S9_4_FAMILY_BRANCH_RECONCILIATION=NOT_AUTHORIZED
          echo S9_4_FAMILY_PRODUCT_SOURCE_WRITES=0
          echo S9_4_FAMILY_MERGE_AND_DEPLOY=0
