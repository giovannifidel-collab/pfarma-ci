name: Queen Owner S12 — Two Private Drafts Terminal Neon CAS Consent (NO Writes)
on:
  push:
    branches: [s12/owner-dual-terminal-source-20261123]
    paths: ['.github/workflows/queen-owner-s12-dual-terminal-oidc.yml']
  workflow_dispatch:
    inputs:
      approve_s12_dual_private_draft_terminal_neon_cas:
        description: 'Owner: one terminal Neon CAS only after two genuine private draft PRs, isolated tests, independent Neon receipts; no merge, deploy, School training or paid fallback'
        type: boolean
        required: true
        default: false
permissions: {contents: read, actions: read}
concurrency:
  group: queen-owner-s12-one-dual-project-terminal
  cancel-in-progress: false
jobs:
  signer-source-only-ci:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify one isolated source-only signer, OIDC syntax and deny-on-missing proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only origin/main...HEAD)" = .github/workflows/queen-owner-s12-dual-terminal-oidc.yml
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/queen-owner-s12-dual-terminal-oidc.yml').read_text()
          marker="          node --input-type=module <<'JS'\n"
          i=s.index(marker)+len(marker)
          j=s.index("\n          JS",i)
          code="\n".join(x[10:] if x.startswith('          ') else x for x in s[i:j].splitlines())
          Path('/tmp/s12-owner-dual-terminal.mjs').write_text(code+"\n")
          PY
          node --check /tmp/s12-owner-dual-terminal.mjs
          grep -Fq 'S12_TERMINAL_OWNER_RS256=PASS' .github/workflows/queen-owner-s12-dual-terminal-oidc.yml
          grep -Fq 'S12_TERMINAL_SIGNER_NO_WRITES=TRUE' .github/workflows/queen-owner-s12-dual-terminal-oidc.yml
          grep -Fq 'approve_s12_dual_private_draft_terminal_neon_cas' .github/workflows/queen-owner-s12-dual-terminal-oidc.yml
          grep -Fq 'gh api "repos/$repo/pulls?state=open&per_page=100"' .github/workflows/queen-owner-s12-dual-terminal-oidc.yml
          grep -Fq 'ONE_INDEPENDENT_NEON_TERMINAL_CAS_ONLY_AFTER_TWO_VERIFIED_DRAFTS' .github/workflows/queen-owner-s12-dual-terminal-oidc.yml
          echo S12_OWNER_DUAL_TERMINAL_SOURCE_ONLY_CI=PASS
  owner-terminal-sign-only:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_s12_dual_private_draft_terminal_neon_cas == true
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 9
    permissions: {contents: read, actions: read, id-token: write}
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      OWNER_APPROVAL: ${{ inputs.approve_s12_dual_private_draft_terminal_neon_cas }}
    steps:
      - name: Read exact current HIVE, World, unchanged project baselines and TWO unmerged private draft PRs
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$OWNER_APPROVAL" = true
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_TRIGGERING_ACTOR" = giovannifidel-collab
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -n "$GH_TOKEN"
          hive="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)"
          ptr="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\\n' | base64 -d | tr -d '\\r\\n')"
          test "$hive" = "$ptr"
          gh api repos/giovannifidel-collab/hive-alveare/pulls/121 |
            jq -e --arg sha "$hive" '.state=="closed" and .merged==true and .merge_commit_sha==$sha and .head.sha=="1d3f8b77c0517841e2efe856bb5e098555729230" and .changed_files==3' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/issues/114 |
            jq -e '.state=="closed" and .state_reason=="completed"' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/issues/116 |
            jq -e '.state=="open"' >/dev/null
          world="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-world-state.json --jq .content | tr -d '\\n' | base64 -d)"
          jq -e '.policy=="authoritative-source-first" and (.generated_at|type=="string")' <<<"$world" >/dev/null
          verify_one() {
            local repo="$1" branch="$2" sha="$3" file="$4" output="$5"
            test "$(gh api "repos/$repo/branches/main" --jq .commit.sha)" = "$sha"
            local prs number current changed
            prs="$(gh api "repos/$repo/pulls?state=open&per_page=100")"
            number="$(jq -r --arg b "$branch" '[.[] | select(.state=="open" and .draft==true and .head.ref==$b and .base.ref=="main")] | if length==1 then .[0].number else empty end' <<<"$prs")"
            test -n "$number" && test "$number" -gt 0
            current="$(gh api "repos/$repo/pulls/$number")"
            jq -e --arg repo "$repo" --arg b "$branch" --arg sha "$sha" '.state=="open" and .draft==true and .merged==false and .base.ref=="main" and .base.sha==$sha and .head.ref==$b and .head.repo.full_name==$repo and .changed_files==1' <<<"$current" >/dev/null
            changed="$(gh api "repos/$repo/pulls/$number/files?per_page=100")"
            jq -e --arg file "$file" 'length==1 and .[0].filename==$file and .[0].status=="modified"' <<<"$changed" >/dev/null
            echo "$output=$number" >> "$GITHUB_OUTPUT"
            echo "${output}_head=$(jq -r .head.sha <<<"$current")" >> "$GITHUB_OUTPUT"
          }
          verify_one giovannifidel-collab/project-giovanni queen/s12/a2f6327b-9303-423a-91e2-33ce5dbadd31 4f67bda2e1bf63db12c1d9d7311b57f12b7bc707 factory/continuous-loop.mjs project_g_pr
          verify_one giovannifidel-collab/hive-field queen/s12/10d37847-331f-4fd1-895e-0b3517c0da21 2b51de88dec2e4e4ae01102fac2a3b95a9f0b5fd src/data-v2-adapter.js field_pr
          echo "hive_sha=$hive" >> "$GITHUB_OUTPUT"
          echo S12_TERMINAL_TWO_EXACT_PRIVATE_DRAFTS_GITHUB_READBACK=PASS
          echo S12_TERMINAL_NEON_RECEIPTS_AND_COST_STILL_REQUIRE_INDEPENDENT_READBACK=TRUE
      - name: Verify fresh GitHub Owner RS256 OIDC and sign ONE conditional terminal CAS without executing it
        shell: bash
        env:
          S12_HIVE_SHA: ${{ steps.evidence.outputs.hive_sha }}
          S12_PROJECT_G_PR: ${{ steps.evidence.outputs.project_g_pr }}
          S12_PROJECT_G_HEAD: ${{ steps.evidence.outputs.project_g_pr_head }}
          S12_FIELD_PR: ${{ steps.evidence.outputs.field_pr }}
          S12_FIELD_HEAD: ${{ steps.evidence.outputs.field_pr_head }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {createPublicKey,verify,createHash} from 'node:crypto';
          const e=process.env;
          const deny=x=>{throw Error('S12_TERMINAL_OWNER_DENY_'+x)};
          const aud='hive-queen-s12-one-dual-project-terminal-neon-cas-v1';
          if(e.OWNER_APPROVAL!=='true'||!e.ACTIONS_ID_TOKEN_REQUEST_URL||!e.ACTIONS_ID_TOKEN_REQUEST_TOKEN)deny('NO_OWNER');
          const tokenUrl=e.ACTIONS_ID_TOKEN_REQUEST_URL+(e.ACTIONS_ID_TOKEN_REQUEST_URL.includes('?')?'&':'?')+'audience='+encodeURIComponent(aud);
          const response=await fetch(tokenUrl,{headers:{Authorization:'Bearer '+e.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!response.ok)deny('ISSUER');
          const parts=(await response.json()).value?.split('.')||[];
          if(parts.length!==3)deny('JWT_PARTS');
          const dec=x=>Buffer.from(x.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-x.length%4)%4),'base64');
          const h=JSON.parse(dec(parts[0])),c=JSON.parse(dec(parts[1]));
          if(h.alg!=='RS256'||!h.kid||h.jwk||h.jku||h.x5u||h.crit)deny('HEADER');
          const expected={iss:'https://token.actions.githubusercontent.com',aud,
           repository:'giovannifidel-collab/pfarma-ci',repository_id:'1308677897',
           repository_owner_id:'305755860',actor:'giovannifidel-collab',actor_id:'305755860',
           event_name:'workflow_dispatch',environment:'pfarma-ci-trusted',ref:'refs/heads/main',
           runner_environment:'github-hosted',
           workflow_ref:'giovannifidel-collab/pfarma-ci/.github/workflows/queen-owner-s12-dual-terminal-oidc.yml@refs/heads/main'};
          for(const [k,v]of Object.entries(expected))if(String(c[k])!==v)deny('CLAIM_'+k);
          const now=Date.now();
          if(c.sha!==e.GITHUB_SHA||Number(c.run_id)!==Number(e.GITHUB_RUN_ID)||Number(c.run_attempt)!==1||
           !Number.isSafeInteger(c.exp)||!Number.isSafeInteger(c.iat)||c.exp<=c.iat||
           c.exp-c.iat>900||c.exp*1000<=now||now-c.iat*1000>300000||c.iat*1000>now+30000)deny('TIME');
          const jwks=await fetch('https://token.actions.githubusercontent.com/.well-known/jwks');
          if(!jwks.ok)deny('JWKS');
          const key=(await jwks.json()).keys?.find(x=>x.kid===h.kid&&x.kty==='RSA'&&x.use==='sig'&&(!x.alg||x.alg==='RS256'));
          if(!key||!verify('RSA-SHA256',Buffer.from(parts[0]+'.'+parts[1]),createPublicKey({key,format:'jwk'}),dec(parts[2])))deny('SIGNATURE');
          console.log('S12_TERMINAL_OWNER_RS256=PASS');
          const receipt={
           schema:'queen.s12.independent-dual-project-terminal-owner-acceptance.v1',
           stage:'S12',decision:'OWNER_AUTHORIZES_ONE_INDEPENDENT_NEON_TERMINAL_CAS_ONLY_AFTER_TWO_VERIFIED_DRAFTS',
           owner:'giovannifidel-collab',run_id:Number(e.GITHUB_RUN_ID),run_attempt:1,
           relay_signer_main_sha:e.GITHUB_SHA,hive_main_sha:e.S12_HIVE_SHA,
           project_g_pr:Number(e.S12_PROJECT_G_PR),project_g_head:e.S12_PROJECT_G_HEAD,
           field_pr:Number(e.S12_FIELD_PR),field_head:e.S12_FIELD_HEAD,
           mission_g:'a2f6327b-9303-423a-91e2-33ce5dbadd31',
           mission_field:'10d37847-331f-4fd1-895e-0b3517c0da21',
           s11_terminal_neon_event:1546,s12_tracker_issue:116,
           permitted_neon_event_type:'queen.s12.dual_project.owner_signed.certified',
           permitted_terminal_events:1,permitted_terminal_meta_cas:1,
           requires_independent_neon_project_receipts:true,
           requires_independent_neon_cost_and_world_school_memory_readback:true,
           both_project_main_sha_unchanged:true,both_draft_pr_unmerged:true,
           no_project_writes:true,no_model_invocation_by_signer:true,
           no_neon_write_by_signer:true,no_new_event_loop:true,no_new_scheduler:true,
           no_paid_fallback:true,no_auto_merge:true,no_auto_deploy:true,no_school_training:true,
           issued_at:new Date(now).toISOString(),expires_at:new Date(now+45*60*1000).toISOString()
          };
          const digest=createHash('sha256').update(JSON.stringify(receipt)).digest('hex');
          console.log('S12_OWNER_SIGNED_DUAL_PROJECT_TERMINAL_CAS='+JSON.stringify({...receipt,sha256:digest}));
          console.log('S12_TERMINAL_SIGNER_NO_WRITES=TRUE');
          JS
