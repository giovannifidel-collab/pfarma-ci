name: RAZZO Runtime Product Worker 2016 290

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/razzo-runtime-product-worker-2016-290.yml'

permissions:
  contents: read

jobs:
  pfarma-2016:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: agent/razzo-2016-suppress-empty-product-links
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Implement and test PFarma #2016
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/inventory_dashboard_page.py'); s=p.read_text()
          old='''    return (\n        "<tr data-quantity-authority='{authority}'><td><strong>{name}</strong><small>{product_id}</small><small>{supplier} · {category}</small>{authority_badge}</td><td>{ean}</td><td>{minsan}</td>"\n        "<td{quantity_description}>{physical}</td><td{quantity_description}>{available}</td><td{quantity_description}>{reserved}</td><td{quantity_description}>{on_order}</td><td>{location}</td>"\n        "<td>{lot}</td><td>{expiry}</td><td>€ {price}</td><td>€ {purchase_cost}</td><td>{margin}%</td><td><a class='action' href='{href}'>Apri scheda</a></td></tr>"\n    ).format(\n'''
          new='''    product_id_value = str(item.get("product_id") or "").strip()\n    product_action = (\n        f"<a class='action' href='{escape(_product_href(item), quote=True)}'>Apri scheda</a>"\n        if product_id_value\n        else "<span class='muted'>Scheda non disponibile</span>"\n    )\n    return (\n        "<tr data-quantity-authority='{authority}'><td><strong>{name}</strong><small>{product_id}</small><small>{supplier} · {category}</small>{authority_badge}</td><td>{ean}</td><td>{minsan}</td>"\n        "<td{quantity_description}>{physical}</td><td{quantity_description}>{available}</td><td{quantity_description}>{reserved}</td><td{quantity_description}>{on_order}</td><td>{location}</td>"\n        "<td>{lot}</td><td>{expiry}</td><td>€ {price}</td><td>€ {purchase_cost}</td><td>{margin}%</td><td>{product_action}</td></tr>"\n    ).format(\n'''
          if old in s:
              s=s.replace(old,new,1).replace('        href=escape(_product_href(item), quote=True),\n','        product_action=product_action,\n',1); p.write_text(s)
          elif 'product_action=product_action' not in s: raise SystemExit('missing PFarma anchor')
          Path('tests/test_inventory_dashboard_missing_product_link.py').write_text('''from web.inventory_dashboard_page import _product_row\n\ndef test_missing_product_id_has_no_product_link():\n    h=_product_row({"name":"Senza id","product_id":None},False); assert "Scheda non disponibile" in h; assert "Apri scheda" not in h; assert "href='/products/'" not in h\n\ndef test_valid_product_id_keeps_encoded_link():\n    h=_product_row({"name":"Con id","product_id":"ABC 123"},False); assert "Apri scheda" in h; assert "href='/products/ABC%20123'" in h\n\ndef test_whitespace_product_id_has_no_product_link():\n    h=_product_row({"name":"Blank","product_id":"   "},False); assert "Scheda non disponibile" in h; assert "Apri scheda" not in h\n''')
          PY
          python -m pytest -q tests/test_inventory_dashboard_missing_product_link.py tests/test_inventory_dashboard_primary_zero_monetary_rendering.py
      - name: Persist PFarma candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/razzo-2016-worker.yml .razzo-dispatch-2016 || true
          git add web/inventory_dashboard_page.py tests/test_inventory_dashboard_missing_product_link.py
          git commit -m 'RAZZO #2016 suppress empty product links'
          git push origin HEAD:agent/razzo-2016-suppress-empty-product-links

  family-290:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: agent/razzo-290-scope-cancel-to-canonical-panel
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Implement and test Family #290
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/alternate-name-cancel-focus-return.js'); s=p.read_text()
          old='''  const cancel = target.closest('[data-alternate-name-cancel="true"]');\n  if (cancel) {\n'''; new='''  const cancel = target.closest('[data-alternate-name-cancel="true"]');\n  const cancelPanel = currentSavedViewPanel();\n  if (cancel && cancelPanel instanceof HTMLElement && cancelPanel.contains(cancel)) {\n'''
          if old in s: p.write_text(s.replace(old,new,1))
          elif 'const cancelPanel = currentSavedViewPanel();' not in s: raise SystemExit('missing Family anchor')
          Path('factory/workout-alternate-name-cancel-canonical-panel.test.mjs').write_text('''import assert from "node:assert/strict"; import fs from "node:fs"; import test from "node:test";\nconst source=fs.readFileSync(new URL("../web/alternate-name-cancel-focus-return.js",import.meta.url),"utf8");\ntest("cancel is scoped to canonical panel",()=>{assert.match(source,/const cancelPanel = currentSavedViewPanel\\(\\);/); assert.match(source,/cancelPanel\\.contains\\(cancel\\)/);});\ntest("rollback behavior remains",()=>{assert.match(source,/setCancelExitHintDescription\\(cancel, false\\)/); assert.match(source,/focusRollbackDestination\\(\\)/);});\n''')
          PY
          node --test factory/workout-alternate-name-cancel-canonical-panel.test.mjs
      - name: Persist Family candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/razzo-290-worker.yml .razzo-dispatch-290 || true
          git add web/alternate-name-cancel-focus-return.js factory/workout-alternate-name-cancel-canonical-panel.test.mjs
          git commit -m 'RAZZO #290 scope cancel to canonical panel'
          git push origin HEAD:agent/razzo-290-scope-cancel-to-canonical-panel
