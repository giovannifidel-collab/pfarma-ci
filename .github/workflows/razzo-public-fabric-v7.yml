name: RAZZO Closure Certification Fabric

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/razzo-public-fabric-v7.yml'

permissions:
  contents: read

jobs:
  family-cloud-mc04-postmerge:
    name: FC MC-04 post-merge exact-SHA replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: f4f97661fb25485f6c33895b75a5cd5e9b066645
          token: ${{ secrets.RAZZO_FABRIC_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact integrated SHA
        run: test "$(git rev-parse HEAD)" = 'f4f97661fb25485f6c33895b75a5cd5e9b066645'
      - name: Independent post-merge assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DurableMediaStore' scripts/dev-server.mjs
          grep -q "throw new Error('unauthorized')" scripts/dev-server.mjs
          grep -q 'idempotency_conflict' src/durable-media-store.mjs
          grep -q 'media_not_found' src/durable-media-store.mjs
          grep -q 'withFilesystemLock' src/durable-media-store.mjs
          grep -q "storage: 'durable-filesystem'" scripts/dev-server.mjs
          grep -q "fcMc04: 'enabled'" scripts/dev-server.mjs
          test -f src/durable-media-store.d.mts
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Product CI + Robot post-merge replay
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
