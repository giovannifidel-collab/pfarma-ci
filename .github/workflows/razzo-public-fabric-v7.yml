name: RAZZO Closure Certification Fabric

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/razzo-public-fabric-v7.yml'

permissions:
  contents: read

jobs:
  family-cloud-mc04-candidate:
    name: FC MC-04 closure candidate exact-SHA review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: daccc0aaee4ceb20d09ef680b45afc497e14a5ee
          token: ${{ secrets.RAZZO_FABRIC_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = 'daccc0aaee4ceb20d09ef680b45afc497e14a5ee'
      - name: Independent review assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DurableMediaStore' scripts/dev-server.mjs
          grep -q 'authentication_required' scripts/dev-server.mjs
          grep -q 'idempotency_conflict' scripts/dev-server.mjs
          grep -q 'media_not_found' scripts/dev-server.mjs
          grep -q 'withFilesystemLock' src/durable-media-store.mjs
          grep -q 'storage: "durable-filesystem"' tests/testable-alpha-runtime.test.ts
          grep -q 'fcMc04: "enabled"' tests/testable-alpha-runtime.test.ts
          test -f src/durable-media-store.d.mts
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Product CI + Robot upload/restart/reopen replay
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
