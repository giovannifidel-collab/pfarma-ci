name: RAZZO Public Execution Fabric V7

on:
  pull_request:
    branches: [main]
    paths:
      - 'razzo/public_fabric/**'
      - '.github/workflows/razzo-public-fabric-v7.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [proof, dispatch]
        default: proof
  repository_dispatch:
    types: [razzo-receipt]
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: razzo-public-fabric-v7-${{ github.ref }}-${{ github.event.client_payload.workItemId || github.run_id }}
  cancel-in-progress: false

jobs:
  proof:
    if: github.event_name == 'pull_request' || inputs.mode == 'proof' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v razzo.public_fabric.test_runtime
      - run: python -m razzo.public_fabric.runtime proof --output razzo-public-proof
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-public-fabric-v7-proof
          path: razzo-public-proof

  dispatch:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dispatch'
    runs-on: ubuntu-latest
    env:
      RAZZO_FABRIC_TOKEN: ${{ secrets.RAZZO_FABRIC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact portfolio refs
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          p=json.load(open('razzo/projects.json'))
          refs={}
          for x in p['projects']:
            if not x.get('enabled', True): continue
            lane=x.get('integrationLane','main')
            out=subprocess.check_output(['git','ls-remote',f"https://github.com/{x['repository']}.git",f'refs/heads/{lane}'], text=True).split()
            if not out: raise SystemExit(f"missing lane {x['repository']}:{lane}")
            refs[x['id']]=out[0]
          json.dump(refs, open('exact-refs.json','w'), indent=2)
          PY
      - run: python -m razzo.public_fabric.runtime dispatch --exact-refs exact-refs.json --output razzo-dispatch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razzo-public-fabric-v7-dispatch
          path: razzo-dispatch

  collect-receipt:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'razzo-receipt'
    runs-on: ubuntu-latest
    steps:
      - name: Validate and persist sanitized receipt
        env:
          RECEIPT: ${{ toJson(github.event.client_payload) }}
        run: |
          mkdir -p receipt
          python - <<'PY'
          import json, os, pathlib
          r=json.loads(os.environ['RECEIPT'])
          required={'cycleId','generation','workItemId','shard','status','startedEpoch','endedEpoch','exactInputSha'}
          missing=sorted(required-set(r))
          if missing: raise SystemExit(f'missing receipt fields: {missing}')
          allowed={k:r[k] for k in r if k in required|{'projectId','repository','collisionDomain','attempt','durationSeconds','observedSha','commands','error'}}
          pathlib.Path('receipt/receipt.json').write_text(json.dumps(allowed, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-receipt-${{ github.event.client_payload.cycleId }}-${{ github.event.client_payload.workItemId }}
          path: receipt/receipt.json
