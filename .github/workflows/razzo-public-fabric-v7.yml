name: RAZZO Public Execution Fabric V7

on:
  pull_request:
    branches: [main]
    paths:
      - 'razzo/public_fabric/**'
      - '.github/workflows/razzo-public-fabric-v7.yml'
  push:
    branches: [main]
    paths:
      - 'razzo/public_fabric/trigger.json'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [proof, dispatch]
        default: proof
  repository_dispatch:
    types: [razzo-receipt]
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: razzo-public-fabric-v7-${{ github.ref }}-${{ github.event.client_payload.workItemId || github.run_id }}
  cancel-in-progress: false

env:
  RAZZO_LIVE_ISSUE: '753'

jobs:
  proof:
    if: github.event_name == 'pull_request' || inputs.mode == 'proof' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v razzo.public_fabric.test_runtime
      - run: python -m razzo.public_fabric.runtime proof --output razzo-public-proof
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-public-fabric-v7-proof
          path: razzo-public-proof

  dispatch:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'dispatch') || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RAZZO_FABRIC_TOKEN: ${{ secrets.RAZZO_FABRIC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish dispatch start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          cat > /tmp/razzo-start.md <<EOF
          \`PUBLIC_FABRIC_DISPATCH_STARTED\`

          - workflow run: \`${RUN_ID}\`;
          - attempt: \`${RUN_ATTEMPT}\`;
          - trigger SHA: \`${TRIGGER_SHA}\`;
          - requested fan-out: \`12\` active public shards;
          - hard maximum: \`24\`;
          - mode: \`dispatch\`;
          - secrets or product source published: \`0\`.
          EOF
          gh api "repos/${GITHUB_REPOSITORY}/issues/${RAZZO_LIVE_ISSUE}/comments" -F body=@/tmp/razzo-start.md

      - name: Resolve exact portfolio refs
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ.get('RAZZO_FABRIC_TOKEN', '').strip()
          if not token:
              raise SystemExit('RAZZO_FABRIC_TOKEN is missing')

          portfolio = json.load(open('razzo/projects.json', encoding='utf-8'))
          refs = {}
          for project in portfolio['projects']:
              if not project.get('enabled', True):
                  continue
              lane = project.get('integrationLane', 'main')
              ref = urllib.parse.quote(f'heads/{lane}', safe='/')
              url = f"https://api.github.com/repos/{project['repository']}/git/ref/{ref}"
              request = urllib.request.Request(url)
              request.add_header('Authorization', f'Bearer {token}')
              request.add_header('Accept', 'application/vnd.github+json')
              request.add_header('X-GitHub-Api-Version', '2022-11-28')
              with urllib.request.urlopen(request, timeout=45) as response:
                  payload = json.load(response)
              refs[project['id']] = payload['object']['sha']

          json.dump(refs, open('exact-refs.json', 'w', encoding='utf-8'), indent=2)
          PY

      - name: Dispatch public shard leases
        run: python -m razzo.public_fabric.runtime dispatch --exact-refs exact-refs.json --output razzo-dispatch

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razzo-public-fabric-v7-dispatch
          path: razzo-dispatch

      - name: Publish dispatch terminal state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          leases_path = Path('razzo-dispatch/dispatched-leases.json')
          status = os.environ['JOB_STATUS']
          run_id = os.environ['RUN_ID']
          if leases_path.exists():
              leases = json.loads(leases_path.read_text(encoding='utf-8'))
              cycle = leases[0]['cycleId'] if leases else 'unknown'
              projects = sorted({item['projectId'] for item in leases})
              shards = [item['shard'] for item in leases]
              body = (
                  '`PUBLIC_FABRIC_DISPATCH_TERMINAL`\n\n'
                  f'- workflow run: `{run_id}`;\n'
                  f'- job status: `{status}`;\n'
                  f'- cycle ID: `{cycle}`;\n'
                  f'- leases dispatched: `{len(leases)}`;\n'
                  f'- projects: `{", ".join(projects)}`;\n'
                  f'- public shards: `{", ".join(shards)}`;\n'
                  '- exact-SHA resolution: `completed`;\n'
                  '- next expected events: sanitized `PUBLIC_FABRIC_SHARD_RECEIPT` comments.\n'
              )
          else:
              body = (
                  '`PUBLIC_FABRIC_DISPATCH_TERMINAL`\n\n'
                  f'- workflow run: `{run_id}`;\n'
                  f'- job status: `{status}`;\n'
                  '- leases dispatched: `0 or unknown`;\n'
                  '- state: dispatch artifact was not produced; inspect this run before retrying.\n'
              )
          Path('/tmp/razzo-terminal.md').write_text(body, encoding='utf-8')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${RAZZO_LIVE_ISSUE}/comments" -F body=@/tmp/razzo-terminal.md

  collect-receipt:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'razzo-receipt'
    runs-on: ubuntu-latest
    steps:
      - name: Validate and persist sanitized receipt
        env:
          RECEIPT_ENVELOPE: ${{ toJson(github.event.client_payload) }}
        run: |
          mkdir -p receipt
          python - <<'PY'
          import json, os, pathlib
          envelope = json.loads(os.environ['RECEIPT_ENVELOPE'])
          receipt = envelope.get('receipt', envelope)
          if not isinstance(receipt, dict):
              raise SystemExit('invalid receipt envelope')
          required = {'cycleId', 'generation', 'workItemId', 'shard', 'status', 'startedEpoch', 'endedEpoch', 'exactInputSha'}
          missing = sorted(required - set(receipt))
          if missing:
              raise SystemExit(f'missing receipt fields: {missing}')
          allowed_keys = required | {'projectId', 'repository', 'collisionDomain', 'attempt', 'durationSeconds', 'observedSha', 'commands', 'error'}
          allowed = {key: receipt[key] for key in receipt if key in allowed_keys}
          pathlib.Path('receipt/receipt.json').write_text(json.dumps(allowed, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: razzo-receipt-${{ github.event.client_payload.workItemId }}
          path: receipt/receipt.json

      - name: Publish sanitized shard receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path('receipt/receipt.json').read_text(encoding='utf-8'))
          body = (
              '`PUBLIC_FABRIC_SHARD_RECEIPT`\n\n'
              f'- cycle ID: `{r["cycleId"]}`;\n'
              f'- generation: `{r["generation"]}`;\n'
              f'- work item: `{r["workItemId"]}`;\n'
              f'- shard: `{r["shard"]}`;\n'
              f'- project: `{r.get("projectId", "unknown")}`;\n'
              f'- repository: `{r.get("repository", "unknown")}`;\n'
              f'- status: `{r["status"]}`;\n'
              f'- exact input SHA: `{r["exactInputSha"]}`;\n'
              f'- observed SHA: `{r.get("observedSha", "not-reported")}`;\n'
              f'- duration seconds: `{r.get("durationSeconds", r["endedEpoch"] - r["startedEpoch"])}`;\n'
              f'- error: `{r.get("error", "none")}`.\n'
          )
          Path('/tmp/razzo-receipt.md').write_text(body, encoding='utf-8')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${RAZZO_LIVE_ISSUE}/comments" -F body=@/tmp/razzo-receipt.md
