name: RAZZO Closure Certification Fabric

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/razzo-public-fabric-v7.yml'

permissions:
  contents: read

jobs:
  pfarma-mc04:
    name: PF MC-04 cumulative closure corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: 60777d2723cdd5acbe8f384bfcfbda64fcd7bdb7
          token: ${{ secrets.RAZZO_FABRIC_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact integrated SHA
        run: test "$(git rev-parse HEAD)" = '60777d2723cdd5acbe8f384bfcfbda64fcd7bdb7'
      - name: Independent review assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CREATE TABLE IF NOT EXISTS users' api/operational_store.py
          grep -q 'CREATE TABLE IF NOT EXISTS products' api/operational_store.py
          grep -q 'CREATE TABLE IF NOT EXISTS stock_movements' api/operational_store.py
          grep -q 'CREATE TABLE IF NOT EXISTS audit_events' api/operational_store.py
          grep -q 'audit_events_no_update' api/operational_store.py
          grep -q 'audit_events_no_delete' api/operational_store.py
          grep -q 'idempotency_key conflicts' api/operational_store.py
      - name: Delta and cumulative operational Robot
        run: |
          python -m py_compile api/operational_store.py tests/test_operational_store.py tests/test_operational_store_restore_sidecars.py factory/razzo_executor.py factory/test_razzo_executor.py
          python -m unittest -v tests.test_operational_store tests.test_operational_store_restore_sidecars factory.test_razzo_executor

  family-cloud-mc04-candidate:
    name: FC MC-04 closure candidate exact-SHA review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: 04d9796f718c5354f4978b56d618e04dccfa134b
          token: ${{ secrets.RAZZO_FABRIC_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = '04d9796f718c5354f4978b56d618e04dccfa134b'
      - name: Independent review assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DurableMediaStore' scripts/dev-server.mjs
          grep -q 'authentication_required' scripts/dev-server.mjs
          grep -q 'idempotency_conflict' scripts/dev-server.mjs
          grep -q 'media_not_found' scripts/dev-server.mjs
          grep -q 'withFilesystemLock' src/durable-media-store.mjs
          grep -q 'storage: "durable-filesystem"' tests/testable-alpha-runtime.test.ts
          grep -q 'fcMc04: "enabled"' tests/testable-alpha-runtime.test.ts
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Product CI + Robot upload/restart/reopen replay
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
