name: RAZZO Family Cloud Minimal CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/razzo-public-fabric-v7.yml'
      - 'razzo/public_fabric/trigger.json'

permissions:
  contents: read

concurrency:
  group: razzo-family-cloud-minimal-ci
  cancel-in-progress: false

jobs:
  family-cloud-ci:
    name: Family Cloud checkout install test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Family Cloud candidate
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: a52fa1507067ec03d2c787e5dad9fd6d37a03f83
          token: ${{ secrets.RAZZO_FABRIC_TOKEN }}
          fetch-depth: 1

      - name: Verify exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "a52fa1507067ec03d2c787e5dad9fd6d37a03f83"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-save --ignore-scripts --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck
