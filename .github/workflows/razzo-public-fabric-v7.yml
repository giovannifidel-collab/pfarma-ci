name: RAZZO Closure Certification Fabric

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/razzo-public-fabric-v7.yml'

permissions:
  contents: read

jobs:
  family-cloud-mc05-candidate:
    name: FC MC-05 candidate exact-SHA certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/family-cloud
          ref: 5f73a5dc1d0b6ec794c3271570c906b216fd9d67
          token: ${{ secrets.RAZZO_FABRIC_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = '5f73a5dc1d0b6ec794c3271570c906b216fd9d67'
      - name: Independent MC-05 assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'verifiedObjectBytes' src/durable-media-store.mjs
          grep -q 'media_object_corrupt' src/durable-media-store.mjs
          grep -q 'CapacityManagedMediaStore' src/capacity-managed-media-store.mjs
          grep -q 'media_capacity_exceeded' src/capacity-managed-media-store.mjs
          grep -q 'withCapacityLock' src/capacity-managed-media-store.mjs
          grep -q 'storedBytesFor' src/capacity-managed-media-store.mjs
          test -f tests/durable-media-capacity.test.ts
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Product CI + Robot capacity journey
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
