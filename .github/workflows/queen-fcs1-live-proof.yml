name: Queen Family Cloud console real bounded proof
on:
  push:
    branches: [family-cloud/queen-fcs1-live-proof-20261128]
    paths: ['.github/workflows/queen-fcs1-live-proof.yml']
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    environment: pfarma-ci-trusted
    timeout-minutes: 4
    steps:
      - name: Verify exact canonical deployment
        env:
          GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/giovannifidel-collab/hive-alveare/branches/main | jq -e '.commit.sha=="31863c109c60e0a4d95d16d15b2b595ae174b222"' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/commits/31863c109c60e0a4d95d16d15b2b595ae174b222/check-runs | jq -e '.check_runs|any(.name=="Cloudflare Pages" and .conclusion=="success")' >/dev/null
      - name: One exact console command no target writes
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          umask 077
          code="$(curl -sS --max-time 105 -o /tmp/queen-fc-receipt.json -w '%{http_code}' -X POST 'https://hive-alveare.pages.dev/api/queen-command' -H 'Content-Type: application/json' -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN" --data '{"message":"Verifica Family Cloud FC-S1","project_slug":"family-cloud","source":"queen-fcs1-live-proof"}')"
          echo "QUEEN_FCS1_HTTP=$code"
          jq -c '{ok,task_id,route,execution:{run_id:.execution.run_id,execution_verified:.execution.execution_verified,project_writes:.execution.project_writes},error_class:(if (.error|type)=="string" then (.error|split(":")[0]|if test("^[a-zA-Z0-9_ -]{1,80}$") then . else "redacted" end) else null end)}' /tmp/queen-fc-receipt.json
          test "$code" = 200
          jq -e '.ok==true and .route=="family-cloud-fcs1-execution" and .execution.execution_verified==true and .execution.project_writes==false and .execution.production_release==false' /tmp/queen-fc-receipt.json >/dev/null
          echo QUEEN_FCS1_LIVE_PROOF=PASS
      - name: Cleanup
        if: always()
        run: rm -f /tmp/queen-fc-receipt.json
