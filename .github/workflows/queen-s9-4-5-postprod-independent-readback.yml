name: Queen S9.4+S9.5 Independent Durable Production Postrelease Proof (READ ONLY)
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-4-5-postprod-independent-readback.yml]
permissions: {contents: read}
jobs:
  independently-recheck-live-prod:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 9
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      EXACT_MAIN: 6d20e61a023748bff36175f1f643c9f5781b3b9f
      DEPLOYMENT: 9b59bf3f-50f1-4810-ad63-fe913a822015
    steps:
      - name: Check exact Owner, source CI, independent merge, source pointer and bounded controller
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$CF_TOKEN"
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = "$EXACT_MAIN"
          pr="$(gh api repos/giovannifidel-collab/hive-alveare/pulls/95)"
          jq -e --arg sha "$EXACT_MAIN" '.merged==true and .merge_commit_sha==$sha and .head.sha=="765c3bf53f4fb5ba346473826f852a881f86c089"' <<< "$pr" >/dev/null
          ptr="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\n')"
          test "$ptr" = "$EXACT_MAIN"
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/43904759752 | jq -e '.status=="completed" and .conclusion=="success" and .event=="workflow_dispatch" and .run_attempt==1 and .actor.login=="giovannifidel-collab" and .head_sha=="cf099302c12cc8b4559cfb927712af7c8ee94a56"' >/dev/null
          gh api repos/giovannifidel-collab/pfarma-ci/actions/runs/43905355845 | jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/actions/runs/43607312049 | jq -e '.status=="completed" and .conclusion=="success" and .head_sha=="765c3bf53f4fb5ba346473826f852a881f86c089"' >/dev/null
          echo S9_4_5_OWNER_MERGE_PRODUCTION_AND_POINTER_INDEPENDENT=PASS
      - name: Check Cloudflare exact canonical Git-connected release and durable Pages build config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,re
          base='https://api.cloudflare.com/client/v4'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Accept':'application/json'},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=24) as f:return f.status,json.load(f)
              except urllib.error.HTTPError as e:return e.code,{}
          st,data=get('/accounts?per_page=50')
          assert st==200 and data.get('success') is True,'CF_ACCOUNTS_UNREADABLE'
          found=[]
          for account in data['result'] or []:
              aid=account.get('id')
              if not re.fullmatch('[a-f0-9]{32}',str(aid)):continue
              st,result=get('/accounts/'+aid+'/pages/projects/hive-alveare')
              if st==200 and result.get('success') is True and (result.get('result') or {}).get('name')=='hive-alveare':found.append((aid,result['result']))
          assert len(found)==1,'CF_HIVE_PROJECT_NOT_UNIQUE'
          aid,p=found[0]
          sc=((p.get('source') or {}).get('config') or {})
          b=p.get('build_config') or {}
          assert (p.get('source') or {}).get('type')=='github' and sc.get('repo_name')=='hive-alveare' and sc.get('production_branch')=='main','CF_SOURCE_IDENTITY_DRIFT'
          assert b.get('root_dir')=='cloudflare' and b.get('destination_dir')=='public','CF_PAGES_BUILD_ROOT_DRIFT'
          expected='QUEEN_S9_EPHEMERAL_BUILD=1 node ../ops/queen/s9/pages-legacy-import-adapter.mjs --apply-ephemeral'
          assert b.get('build_command')==expected,'PERMANENT_CLOUDFLARE_BUILD_NOT_INSTALLED'
          cfg=p.get('deployment_configs') or {}
          assert 'HIVE_DATA_API_URL' in (((cfg.get('production') or {}).get('env_vars') or {})),'PRODUCTION_NEON_LOST'
          assert 'HIVE_DATA_API_URL' not in (((cfg.get('preview') or {}).get('env_vars') or {})),'PREVIEW_DATABASE_ISOLATION_BROKEN'
          canonical=p.get('canonical_deployment') or {}
          assert canonical.get('id')==os.environ['DEPLOYMENT'],'WRONG_CANONICAL_DEPLOYMENT'
          assert canonical.get('environment')=='production' and (canonical.get('latest_stage') or {}).get('status')=='success','PRODUCTION_DEPLOY_NOT_SUCCESSFUL'
          metadata=((canonical.get('deployment_trigger') or {}).get('metadata') or {})
          assert metadata.get('commit_hash')==os.environ['EXACT_MAIN'] and metadata.get('branch')=='main','PRODUCTION_SOURCE_SHA_NOT_EXACT'
          print('S9_4_5_CLOUDFLARE_EXACT_PRODUCTION_DEPLOYMENT=PASS')
          print('S9_4_5_CLOUDFLARE_DURABLE_BUILD_COMMAND=PASS')
          print('S9_4_5_PROD_NEON_BINDING_PRESERVED_PREVIEW_ISOLATED=PASS')
          PY
      - name: Read independently all three protected live endpoints; no dispatch, no School promotions
        shell: bash
        run: |
          set -euo pipefail
          for ep in runtime-health queen-state queen-s9-readiness; do
            code="$(curl --max-time 25 -sS -o "$RUNNER_TEMP/$ep.json" -w '%{http_code}' \
              -H "Cf-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "Cf-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
              "https://hive-alveare.pages.dev/api/$ep")"
            test "$code" = "200"
            jq -e '.ok==true' "$RUNNER_TEMP/$ep.json" >/dev/null
            echo "S9_4_5_PROTECTED_$ep=PASS"
          done
          jq -e '.stage=="S9.1" and .read_only==true and .can_dispatch==false and .can_merge==false and .can_deploy==false and .can_train_school==false and .paid_fallback==false' "$RUNNER_TEMP/queen-s9-readiness.json" >/dev/null
          echo S9_4_5_S9_READINESS_DEFAULT_DENY=PASS
          echo S9_4_5_LIVE_PROJECT_PRODUCT_WRITES=ZERO_FROM_THIS_AUDIT
          echo S9_4_5_UNATTENDED_PROVIDER_REDELIVERY_PROVEN=FALSE
          echo S9_4_5_GENERAL_CROSS_PROJECT_AUTONOMY_CERTIFIED=FALSE
