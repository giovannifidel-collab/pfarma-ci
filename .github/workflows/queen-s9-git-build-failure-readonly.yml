name: Queen S9.2 Exact Git Connected Build Failure Diagnosis - GET ONLY
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-git-build-failure-readonly.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 7
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read exact SHA Pages build stages and redacted error diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,re,urllib.request,urllib.error
          base='https://api.cloudflare.com/client/v4'
          def get(path):
              req=urllib.request.Request(base+path,method='GET',headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  try:return e.code,json.load(e)
                  except:return e.code,{}
          st,acs=get('/accounts?per_page=50')
          assert st==200 and acs.get('success') is True
          hits=[]
          for a in acs.get('result') or []:
              aid=a.get('id','')
              if not re.fullmatch('[a-f0-9]{32}',str(aid)):continue
              s,p=get('/accounts/'+aid+'/pages/projects/hive-alveare')
              if s==200 and p.get('success') is True:hits.append((aid,p['result']))
          assert len(hits)==1,'CF_EXACT_HIVE_PROJECT_AMBIGUOUS'
          aid,project=hits[0]
          cfg=project.get('deployment_configs') or {}
          assert 'HIVE_DATA_API_URL' not in ((cfg.get('preview') or {}).get('env_vars') or {}),'S9_PREVIEW_BINDING_NOT_ROLLED_BACK'
          assert 'HIVE_DATA_API_URL' in ((cfg.get('production') or {}).get('env_vars') or {}),'PRODUCTION_CONFIG_CHANGED'
          print('S9_PRODUCTION_PREVIEW_ROLLBACK_READBACK=PASS')
          path='/accounts/'+aid+'/pages/projects/hive-alveare/deployments'
          st,ds=get(path+'?env=preview&per_page=20&page=1')
          assert st==200 and ds.get('success') is True,'PAGE_DEPLOYMENTS_DENIED'
          sha='0f8e99f59b88b337ba2150171033ff8c9a51fab4'
          exact=[d for d in (ds.get('result') or []) if ((d.get('deployment_trigger') or {}).get('metadata') or {}).get('commit_hash')==sha]
          print('S9_NEW_GIT_PR90_EXACT_DEPLOYMENT_COUNT='+str(len(exact)))
          assert len(exact)==1,'EXACT_PR90_REDEPLOY_NOT_UNIQUE'
          d=exact[0]
          print('S9_NEW_GIT_SOURCE_TYPE='+str((d.get('source') or {}).get('type')))
          print('S9_NEW_GIT_LATEST_STAGE='+json.dumps(d.get('latest_stage'),separators=(',',':')))
          print('S9_NEW_GIT_ALL_STAGES='+json.dumps(d.get('stages'),separators=(',',':')))
          did=d.get('id')
          st,logs=get(path+'/'+did+'/history/logs')
          print('S9_PAGES_BUILD_LOGS_HTTP='+str(st))
          if st==200 and logs.get('success') is True:
              rows=((logs.get('result') or {}).get('data') or [])
              important=[]
              for row in rows:
                  msg=str(row.get('line',''))
                  if re.search(r'(?i)(error|failed|warning|fatal|unsupported|npm ERR|Cannot|command not found|wrangler)',msg):
                      important.append(msg)
              for msg in important[-16:]:
                  safe=re.sub(r'(?i)(bearer|token|secret|password|api[_-]?key)\s*[:=]\s*\S+',r'\1=[REDACTED]',msg)
                  safe=re.sub(r'https?://\S+','[URL]',safe)
                  print('S9_PAGES_BUILD_DIAGNOSTIC='+safe[:210])
              print('S9_BUILD_DIAGNOSTIC_ERROR_LINES='+str(len(important)))
          else:
              print('S9_BUILD_LOGS_UNAVAILABLE_HTTP='+str(st))
          print('S9_PAGES_BUILD_READ_ONLY_DIAGNOSIS=PASS')
          PY
