name: HIVE Queen S2 Live School Memory Proof

on:
  push:
    branches:
      - convergence/queen-s2-school-memory-v1
    paths:
      - '.github/workflows/hive-queen-s2-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.HIVE_CF_AIG_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HIVE_CF_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
      HIVE_BASE_URL: ${{ secrets.HIVE_BASE_URL }}
      PRIVATE_SHA: 2adbb4fd34418275d598a6de245c46837a5ff512
      EXPECTED_SCHOOL_CORE_BLOB: 89e5ecc52a5b337fd6d22170c5ef410ea45d422e
      EXPECTED_LEARNING_POLICY_BLOB: 999045f6d5e7b300f828daaf2329df0e4b10695f
      EXPECTED_MEMORY_CONTRACT_BLOB: 726666c4badada838b45574f3d77f2ec95df95b2
      EXPECTED_MEMORY_ENGINE_BLOB: b9a58842e99639d7f12d0fee87cef3c0cb2307fa
    steps:
      - name: Preflight Cloudflare Pages authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          code="$(curl -sS -o /tmp/project -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/hive-alveare")"
          test "$code" = 200
          jq -e '.success == true and .result.name == "hive-alveare"' /tmp/project >/dev/null
          echo 'S2_PAGES_PREFLIGHT=PASS'

      - name: Check out exact private S2 source
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact S2 source and behavior
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$PRIVATE_SHA"
          node private-source/ops/queen/memory/validate-s2-school-memory.mjs
          node --check private-source/cloudflare/functions/_lib/queen-runtime.js
          node --check private-source/cloudflare/functions/api/queen-command.js
          for blob in "$EXPECTED_SCHOOL_CORE_BLOB" "$EXPECTED_LEARNING_POLICY_BLOB" "$EXPECTED_MEMORY_CONTRACT_BLOB" "$EXPECTED_MEMORY_ENGINE_BLOB"; do
            grep -Fq "$blob" private-source/cloudflare/functions/_lib/queen-runtime.js
          done
          echo 'QUEEN_S2_SOURCE=PASS'

      - name: Pull Pages config and bind Workers AI
        working-directory: private-source/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          npx --yes wrangler@4 pages download config hive-alveare --force >/tmp/wrangler-download.log 2>&1
          config=''
          for f in wrangler.jsonc wrangler.json wrangler.toml; do [[ -f "$f" ]] && { config="$f"; break; }; done
          test -n "$config" || { cat /tmp/wrangler-download.log; exit 40; }
          if [[ "$config" == *.toml ]]; then
            grep -Eq '^\s*\[ai\]\s*$' "$config" || printf '\n[ai]\nbinding = "AI"\n' >> "$config"
            grep -Eq '^\s*\[env\.production\.ai\]\s*$' "$config" || printf '\n[env.production.ai]\nbinding = "AI"\n' >> "$config"
          else
            python3 -c 'from pathlib import Path; import sys,re; p=Path(sys.argv[1]); s=p.read_text(); i=s.find("{"); assert i>=0; s=s if re.search(r"(?m)^\s*["\x27]ai["\x27]\s*:",s) else s[:i+1]+"\n  \"ai\": {\"binding\": \"AI\"},"+s[i+1:]; p.write_text(s)' "$config"
          fi
          echo 'S2_WORKERS_AI_BINDING=PASS'

      - name: Preserve Queen GitHub dispatcher secret
        working-directory: private-source/cloudflare
        shell: bash
        env:
          HIVE_GITHUB_DISPATCH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$HIVE_GITHUB_DISPATCH_TOKEN" | npx --yes wrangler@4 pages secret put HIVE_GITHUB_DISPATCH_TOKEN --project-name hive-alveare >/tmp/pages-secret.log 2>&1
          echo 'S2_DISPATCH_SECRET=PASS'

      - name: Deploy Queen S2
        working-directory: private-source/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy public --project-name hive-alveare --branch main
          echo 'QUEEN_S2_DEPLOY=PASS'

      - name: Wait for propagation
        run: sleep 15

      - name: Live School and memory proof
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HIVE_BASE_URL:-https://hive-alveare.pages.dev}"; BASE="${BASE%/}"
          headers=(-H 'content-type: application/json')
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            headers+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          if [[ -n "${HIVE_RUNTIME_BEARER_TOKEN:-}" ]]; then
            headers+=(-H "Authorization: Bearer $HIVE_RUNTIME_BEARER_TOKEN")
          fi

          code="$(curl -sS --max-time 30 -o /tmp/state0 -w '%{http_code}' "${headers[@]}" "$BASE/api/queen-state")"
          test "$code" = 200
          jq -e --arg sc "$EXPECTED_SCHOOL_CORE_BLOB" --arg lp "$EXPECTED_LEARNING_POLICY_BLOB" --arg mc "$EXPECTED_MEMORY_CONTRACT_BLOB" --arg me "$EXPECTED_MEMORY_ENGINE_BLOB" '
            .ok == true
            and .state.canonical.memory_version == "1.0.0-s2"
            and .state.canonical.source_lock.school_core_blob == $sc
            and .state.canonical.source_lock.learning_policy_blob == $lp
            and .state.canonical.source_lock.memory_contract_blob == $mc
            and .state.canonical.source_lock.memory_engine_blob == $me
          ' /tmp/state0 >/dev/null
          before="$(jq -r '.state.school.value.mastery.reasoning // 0' /tmp/state0)"

          payload1='{"project_slug":"hive","source":"queen-s2-live-proof","message":"Spiega il principio architetturale truth-before-completion applicato a HIVE usando solo il contesto disponibile. Non effettuare alcuna azione esterna."}'
          code="$(curl -sS --max-time 90 -o /tmp/q1 -w '%{http_code}' "${headers[@]}" -X POST --data "$payload1" "$BASE/api/queen-command")"
          test "$code" = 200 || { cat /tmp/q1; exit 51; }
          jq -e '
            .ok == true
            and .execution == null
            and .school.mastery_eligible == false
            and .school.learning_status == "verified_provisional_uncertified_teacher"
            and (.memory.event_id != null)
          ' /tmp/q1 >/dev/null
          after1="$(jq -r '.school.mastery // 0' /tmp/q1)"
          test "$before" = "$after1"

          payload2='{"project_slug":"hive","source":"queen-s2-live-proof","message":"Rivaluta il principio truth-before-completion per HIVE tenendo conto del contesto disponibile, senza effettuare azioni esterne."}'
          code="$(curl -sS --max-time 90 -o /tmp/q2 -w '%{http_code}' "${headers[@]}" -X POST --data "$payload2" "$BASE/api/queen-command")"
          test "$code" = 200 || { cat /tmp/q2; exit 52; }
          jq -e '
            .ok == true
            and .execution == null
            and .school.mastery_eligible == false
            and (.memory.retrieved_episodes >= 1)
            and (.memory.event_id != null)
          ' /tmp/q2 >/dev/null
          after2="$(jq -r '.school.mastery // 0' /tmp/q2)"
          test "$before" = "$after2"

          code="$(curl -sS --max-time 30 -o /tmp/state2 -w '%{http_code}' "${headers[@]}" "$BASE/api/queen-state")"
          test "$code" = 200
          jq -e '
            .ok == true
            and .state.memory.value.memory_version == "1.0.0-s2"
            and (.state.memory.value.counters.verified_outcomes >= 2)
            and (.state.school.value.counters.provisional_experiences >= 2)
          ' /tmp/state2 >/dev/null

          echo 'S2_UNCERTIFIED_TEACHER_MASTERY_BLOCK=PASS'
          echo 'S2_DURABLE_MEMORY_PERSISTENCE=PASS'
          echo 'S2_MEMORY_RETRIEVAL_BEFORE_REASONING=PASS'
          echo 'PROJECT_MUTATION_PERFORMED=false'
          echo 'QUEEN_S2_LIVE_PROOF=PASS'

      - name: Remove private source checkout
        if: always()
        run: rm -rf private-source
