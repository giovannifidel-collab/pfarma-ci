name: Project Giovanni Preparatore · Final Perfection Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-giovanni-perfection-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: photo-ai-private
    steps:
      - name: Resolve private source token
        shell: bash
        env:
          GIO_TOKEN: ${{ secrets.PROJECT_GIOVANNI_SOURCE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          token="${GIO_TOKEN:-${FALLBACK_TOKEN:-}}"
          test -n "$token"
          echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: main
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove semantic, baseline, joint and chronological invariants
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { normalizeSucceededResult } from './scripts/preparatore-v2-result-contract.mjs';
          import { optimizeOutcomeResult } from './scripts/preparatore-outcome-engine.mjs';
          import { auditPlanDelta } from './scripts/preparatore-plan-delta-audit.mjs';

          const reps=(sets,min,max,rir=2)=>({mode:'reps',sets,repsMin:min,repsMax:max,reserveReps:rir});
          const timed=(sets,seconds)=>({mode:'time',sets,secondsMin:seconds,secondsMax:seconds});
          const ex=(name,sets,min,max,rest,focus='Spinta')=>({name,prescription:`${sets} x ${min}-${max} · 2 RIR`,restSeconds:rest,focus,target:reps(sets,min,max,2)});
          const tx=(name,sets,seconds,rest,focus)=>({name,prescription:`${sets} x ${seconds} s`,restSeconds:rest,focus,target:timed(sets,seconds)});
          const raw={model:'Codex',persisted:false,automaticPlanChange:false,analysis:{analysisConfidence:'medium',imageQuality:{front:'usable',side:'usable',back:'usable'},summary:'test',limitations:['foto non standardizzate'],visualFindings:[],bodyCompositionEstimate:{available:false,rangeMin:null,rangeMax:null,confidence:'low',basis:'non misurabile',uncertaintyFactors:['luce']},priorities:[{area:'Core',confidence:'medium',observation:'Ridurre adiposità addominale e fianchi',trainingImplication:'dimagrimento complessivo'},{area:'Core',confidence:'medium',observation:'Controllo del tronco',trainingImplication:'stabilità'},{area:'Braccia',confidence:'high',observation:'Braccia prioritarie',trainingImplication:'più stimolo'},{area:'V-taper',confidence:'medium',observation:'V-taper',trainingImplication:'dorsali'}]},plan:{summary:'test',rationale:['storico reale','foto usate come segnale','progressione'],safetyNote:'senza dolore',days:[{day:1,title:'Upper',durationMinutes:30,emphasis:'Spinta',warmupMinutes:4,exercises:[ex('Curl con elastico sotto i piedi',2,10,15,35,'Tirata'),ex('Estensione tricipiti sopra la testa con elastico sotto i piedi',2,10,15,35,'Spinta'),ex('Rematore con elastico sotto i piedi',4,10,15,50,'Tirata')]}]}};
          const normalized=normalizeSucceededResult(raw);
          assert.equal(normalized.analysis.priorities[0].area,'Ricomposizione');
          assert.equal(new Set(normalized.analysis.priorities.map(p=>p.area)).size,normalized.analysis.priorities.length);
          console.log('SEMANTIC_PRIORITY_DEDUP=PASS');

          const active={summary:'baseline',rationale:['storico','foto','progressione'],safetyNote:'safe',days:[
            {day:1,title:'Upper A',durationMinutes:30,emphasis:'Spinta',warmupMinutes:4,exercises:[ex('Curl con elastico sotto i piedi',2,10,15,35,'Tirata'),ex('Estensione tricipiti sopra la testa con elastico sotto i piedi',2,10,15,35,'Spinta'),ex('Rematore con elastico sotto i piedi',4,10,15,50,'Tirata')]},
            {day:2,title:'Upper B',durationMinutes:30,emphasis:'Spinta',warmupMinutes:4,exercises:[ex('Curl con elastico sotto i piedi',2,10,15,35,'Tirata'),ex('Estensione tricipiti sopra la testa con elastico sotto i piedi',2,10,15,35,'Spinta'),ex('Push-up a terra',3,8,12,50,'Spinta')]},
            {day:3,title:'Gambe',durationMinutes:30,emphasis:'Gambe',warmupMinutes:4,exercises:[ex('Squat a corpo libero controllato',3,8,12,50,'Gambe'),ex('Glute bridge',3,12,15,50,'Gambe'),tx('Side plank',2,30,35,'Core')]}
          ]};
          const candidate=structuredClone(active);
          candidate.days[0].exercises[0].target.sets=3; candidate.days[0].exercises[0].prescription='3 x 10-15 · 2 RIR';
          candidate.days[0].exercises[1].target.sets=3; candidate.days[0].exercises[1].prescription='3 x 10-15 · 2 RIR';
          const high={aggregates:{completionRate:100,averageRpe:6.6,averageRecovery:3.8,painSessions:0,reducedOrInterruptedSessions:0,recoveryTrend:'improving',rpeTrend:'stable'},exerciseProgression:[{exerciseName:'Squat a corpo libero controllato',direction:'improving',latestAverageValue:14,planTargetComparable:true}]};
          const optimized=optimizeOutcomeResult({...normalized,plan:candidate},{profile:{priorities:'Braccia V-taper',limitations:'La gamba sinistra può indolenzirsi se sovraccaricata.'},trainingContext:high,activePlanContext:{plan:active}}).result;
          const rationale=optimized.plan.rationale.join(' ');
          assert.match(rationale,/bicipiti 4→6/i);
          assert.match(rationale,/tricipiti 4→6/i);
          assert.match(rationale,/tempo, ROM confortevole|controllo del tempo/i);
          assert.match(rationale,/carico solo/i);
          console.log('BASELINE_TRUE_DELTA=PASS');
          console.log('JOINT_TOLERANT_PROGRESSION=PASS');

          const cardio={summary:'cardio',rationale:['storico performance','foto segnale secondario','progressione'],safetyNote:'safe',days:[{day:1,title:'Cardio',durationMinutes:30,emphasis:'Cardio',warmupMinutes:4,timeBudget:{warmup:4,work:21,transitions:3,finisher:2,total:30},exercises:[tx('Intervalli su cyclette',4,90,35,'Cardio'),tx('Camminata sostenuta su tapis roulant',4,120,35,'Cardio'),ex('Glute bridge',3,12,15,45,'Gambe'),tx('Hollow hold',3,25,30,'Core')],finisher:'Finisher di 2 minuti: marcia attiva.'}]};
          const timeAudit=auditPlanDelta(active,cardio,{profile:{priorities:'ricomposizione'},trainingContext:high,analysis:normalized.analysis});
          assert.ok(timeAudit.metrics.timeChecks[0].totalSeconds>1800 || !timeAudit.metrics.timeChecks[0].workBudgetFeasible);
          assert.ok(timeAudit.reasons.some(r=>/Timing cronologico/i.test(r)));
          console.log('CHRONOLOGICAL_TIME_AUDIT=PASS');
          console.log('FINAL_PERFECTION_PROOF=PASS');
          NODE
