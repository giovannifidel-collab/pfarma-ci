name: HIVE Cloudflare Access Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Discover Cloudflare accounts and Access state
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          test -n "${CF_TOKEN:-}"
          AUTH="Authorization: Bearer $CF_TOKEN"

          curl -sS \
            -H "$AUTH" \
            https://api.cloudflare.com/client/v4/accounts \
            -o /tmp/accounts.json

          echo "ACCOUNTS_HTTP_RESULT=$(jq -r '.success' /tmp/accounts.json)"
          echo "ACCOUNT_COUNT=$(jq '.result | length' /tmp/accounts.json)"

          jq -r '.result[] | [.id,.name] | @tsv' /tmp/accounts.json |
          while IFS=$'\t' read -r ID NAME; do

            echo "=== ACCOUNT ==="
            echo "ACCOUNT_ID=$ID"
            echo "ACCOUNT_NAME=$NAME"

            ST_HTTP="$(
              curl -sS \
                -H "$AUTH" \
                -o /tmp/st.json \
                -w '%{http_code}' \
                "https://api.cloudflare.com/client/v4/accounts/$ID/access/service_tokens"
            )"

            echo "SERVICE_TOKENS_HTTP=$ST_HTTP"

            if [[ "$ST_HTTP" == 200 ]]; then
              echo "SERVICE_TOKEN_COUNT=$(jq '.result | length' /tmp/st.json)"

              jq -r '
                .result[]? |
                "SERVICE_TOKEN_NAME=" + (.name // "")
              ' /tmp/st.json

              jq -r '
                .result[]? |
                "SERVICE_TOKEN_CLIENT_ID=" + (.client_id // "")
              ' /tmp/st.json
            fi

            APPS_HTTP="$(
              curl -sS \
                -H "$AUTH" \
                -o /tmp/apps.json \
                -w '%{http_code}' \
                "https://api.cloudflare.com/client/v4/accounts/$ID/access/apps"
            )"

            echo "ACCESS_APPS_HTTP=$APPS_HTTP"

            if [[ "$APPS_HTTP" == 200 ]]; then
              echo "ACCESS_APP_COUNT=$(jq '.result | length' /tmp/apps.json)"

              jq -r '
                .result[]? |
                "ACCESS_APP_NAME=" + (.name // "") +
                " DOMAIN=" + (.domain // "") +
                " ID=" + (.id // "")
              ' /tmp/apps.json
            fi

          done

          echo '=== DISCOVERY COMPLETE ==='
