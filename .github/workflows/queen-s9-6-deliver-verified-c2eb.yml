name: Queen S9.6 deliver one independent verified receipt to existing canonical S1
on:
  push:
    branches: [audit/s9-6-owner-once-c2eb0f6b-20261118]
    paths: [.github/workflows/queen-s9-6-deliver-verified-c2eb.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: queen-s96-deliver-c2eb0f6b-9548-4a11-86be-03d43397c6dc
  cancel-in-progress: false
jobs:
  forward-one-receipt-only:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      DISPATCH_TOKEN: ${{ github.token }}
    steps:
      - name: Ensure original Owner/provider/independent runs and exactly one first delivery
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/audit/s9-6-owner-once-c2eb0f6b-20261118
          test -n "$GH_TOKEN" && test -n "$DISPATCH_TOKEN"
          test "$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)" = 493d83892f7a2e37ec297b9309b47a4c83ba2e6b
          PTR="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\n')"
          test "$PTR" = 493d83892f7a2e37ec297b9309b47a4c83ba2e6b
          for ID in 44258967298 44259485067 44259848686; do
            gh api "repos/giovannifidel-collab/pfarma-ci/actions/runs/$ID" | jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1' >/dev/null
          done
          RUNS="$(gh api 'repos/giovannifidel-collab/pfarma-ci/actions/workflows/queen-s9-6-deliver-verified-c2eb.yml/runs?event=push&per_page=20')"
          jq -e --argjson n "$GITHUB_RUN_ID" '.total_count==1 and .workflow_runs[0].id==$n and .workflow_runs[0].run_attempt==1' <<< "$RUNS" >/dev/null
          echo 'S96_EXACT_INDEPENDENT_SOURCE_OWNER_PROVIDER_AND_SINGLE_RECEIPT_DELIVERY=PASS'
      - name: Deliver trusted receipt verification subtype to pre-router of existing S1 only
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc '{
            event_type:"verification-result",
            client_payload:{
              schema:"hive.event.v1",
              correlation_id:"c2eb0f6b-9548-4a11-86be-03d43397c6dc",
              hop:0,max_hops:8,
              data:{
                kind:"queen.s9.5.verified_receipt_reconciliation",
                verified:true,
                mission_id:"c2eb0f6b-9548-4a11-86be-03d43397c6dc",
                exact_source_sha:"493d83892f7a2e37ec297b9309b47a4c83ba2e6b",
                receipt_sha256:"cd6023918d804cf139c0d49bbf28e7859f0f02188afc8890f7c42bf66702708f",
                owner_ci_run_id:44258967298,
                provider_ci_run_id:44259485067,
                independent_ci_run_id:44259848686,
                existing_event_id:1277,
                paid_fallback:false,can_train_school:false,no_new_provider_dispatch:true
              }
            }
          }')"
          code="$(curl -sS --max-time 25 -w '%{http_code}' -o "$RUNNER_TEMP/receipt-dispatch-response" -X POST -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -H "Authorization: Bearer $DISPATCH_TOKEN" --data-binary "$payload" 'https://api.github.com/repos/giovannifidel-collab/pfarma-ci/dispatches')"
          test "$code" = 204 || { echo "S96_RECEIPT_DELIVERY_DENY_HTTP=$code"; exit 33; }
          echo 'S96_ONE_VERIFIED_RECEIPT_TO_EXISTING_S1_HTTP=204'
          echo 'S96_NEW_PROVIDER_DISPATCHES=0'
          echo 'S96_SCHOOL_TRAINING_EVENTS=0'
