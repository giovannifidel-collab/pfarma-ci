name: Queen S12 — Current Cloudflare Worker AI Billing Plan READ ONLY
on:
  push:
    branches: [s12/fresh-zero-cost-readonly-billing-20261121]
    paths: ['.github/workflows/queen-s12-worker-ai-current-plan-readonly.yml']
permissions: {contents: read}
concurrency:
  group: queen-s12-cloudflare-billing-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  free-plan-current-account-observation:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 6
    env:
      CF_PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_FALLBACK_TOKEN: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Query live Cloudflare account and subscription tags with no model or writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          tokens=[('primary',os.getenv('CF_PRIMARY_TOKEN')),('fallback',os.getenv('CF_FALLBACK_TOKEN'))]
          tokens=[(n,t) for n,t in tokens if t]
          if not tokens:
              print('S12_CLOUDFLARE_BILLING=DENY_NO_READ_TOKEN')
              raise SystemExit(2)
          def get(token,path):
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r: return r.status,json.load(r)
              except urllib.error.HTTPError as e: return e.code,{}
              except (TimeoutError,OSError,ValueError): return 0,{}
          candidates=[]
          for label,token in tokens:
              code,acc=get(token,'/accounts?per_page=100')
              if code!=200 or acc.get('success') is not True:
                  print('S12_'+label.upper()+'_ACCOUNT_LOOKUP_STATUS='+str(code))
                  continue
              for a in acc.get('result',[]):
                  account_id=a.get('id','')
                  if not isinstance(account_id,str) or len(account_id)!=32: continue
                  code,page=get(token,'/accounts/'+account_id+'/pages/projects/hive-alveare')
                  if code!=200 or page.get('success') is not True or page.get('result',{}).get('name')!='hive-alveare': continue
                  code,subs=get(token,'/accounts/'+account_id+'/subscriptions')
                  if code!=200 or subs.get('success') is not True or not isinstance(subs.get('result'),list):
                      print('S12_'+label.upper()+'_SUBSCRIPTIONS_READ_STATUS='+str(code))
                      continue
                  plans=[]
                  for item in subs['result']:
                      rate=item.get('rate_plan') or {}
                      descriptor=' '.join(str(rate.get(k) or '') for k in ('id','public_name','name','scope')).lower()
                      if not any(q in descriptor for q in ('worker','ai')):continue
                      active=str(item.get('state','')).lower() not in ('cancelled','expired','failed')
                      plans.append((descriptor,active))
                  free=any('free' in n and active for n,active in plans)
                  paid=any(active and any(q in n for q in ('paid','enterprise','standard')) for n,active in plans)
                  candidates.append((account_id,free,paid))
          if not candidates:
              print('S12_CLOUDFLARE_BILLING=DENY_ALL_TOKENS_LACK_BILLING_READ')
              raise SystemExit(6)
          unique_ids={a for a,_,_ in candidates}
          free=all(f for _,f,_ in candidates)
          paid=any(p for _,_,p in candidates)
          print('S12_EXACT_HIVE_ACCOUNTS_READABLE='+str(len(unique_ids)))
          print('S12_WORKERS_FREE_ACTIVE='+str(free).upper())
          print('S12_WORKERS_PAID_SUBSCRIPTION_ACTIVE='+str(paid).upper())
          print('S12_AI_MODEL_CALLS=0')
          print('S12_PROJECT_WRITES=0')
          print('S12_NEON_MUTATIONS=0')
          print('S12_PLAN_NOT_QUOTA_OR_INFERENCE_AUTHORIZATION=TRUE')
          if len(unique_ids)!=1 or not free or paid:
              print('S12_FREE_BILLING=DENY_UNKNOWN_OR_PAID')
              raise SystemExit(7)
          print('S12_CURRENT_FREE_PLAN_OBSERVED=PASS')
          PY
