name: Queen S12 — Current Cloudflare Worker AI Billing Plan READ ONLY
on:
  push:
    branches: [s12/fresh-zero-cost-readonly-billing-20261121]
    paths: ['.github/workflows/queen-s12-worker-ai-current-plan-readonly.yml']
permissions: {contents: read}
concurrency:
  group: queen-s12-cloudflare-billing-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  free-plan-current-account-observation:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 6
    env:
      CF_PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_FALLBACK_TOKEN: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Query live Cloudflare account and subscription tags with no model or writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.getenv('CF_PRIMARY_TOKEN') or os.getenv('CF_FALLBACK_TOKEN')
          if not token:
              print('S12_CLOUDFLARE_BILLING=DENY_NO_READ_TOKEN')
              raise SystemExit(2)
          def fetch(path):
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,
                  headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      return r.status,json.load(r)
              except (urllib.error.HTTPError,TimeoutError,OSError,ValueError):
                  return 0,{}
          code,resp=fetch('/accounts?per_page=100')
          if code!=200 or resp.get('success') is not True:
              print('S12_CLOUDFLARE_BILLING=DENY_ACCOUNT_DISCOVERY')
              raise SystemExit(3)
          ids=[]
          for a in resp.get('result',[]):
              aid=a.get('id','')
              if not isinstance(aid,str) or len(aid)!=32:continue
              code,ret=fetch('/accounts/'+aid+'/pages/projects/hive-alveare')
              if code==200 and ret.get('success') is True and ret.get('result',{}).get('name')=='hive-alveare':
                  ids.append(aid)
          if len(ids)!=1:
              print('S12_CLOUDFLARE_BILLING=DENY_EXACT_HIVE_ACCOUNT')
              raise SystemExit(4)
          code,info=fetch('/accounts/'+ids[0]+'/subscriptions')
          if code!=200 or info.get('success') is not True or not isinstance(info.get('result'),list):
              print('S12_CLOUDFLARE_BILLING=DENY_SUBSCRIPTIONS_NOT_PROVEN')
              raise SystemExit(5)
          plans=[]
          for i in info['result']:
              p=i.get('rate_plan') or {}
              n=' '.join(str(p.get(k) or '') for k in ('id','public_name','name','scope')).lower()
              if not any(x in n for x in ('worker','ai')):continue
              active=str(i.get('state','')).lower() not in ('cancelled','expired','failed')
              plans.append((n,active))
          has_free=any('free' in n and active for n,active in plans)
          has_paid=any(active and any(q in n for q in ('paid','enterprise','standard')) for n,active in plans)
          print('S12_HIVE_ACCOUNT_EXACT=PASS')
          print('S12_WORKERS_FREE_ACTIVE='+str(has_free).upper())
          print('S12_WORKERS_PAID_SUBSCRIPTION_ACTIVE='+str(has_paid).upper())
          print('S12_AI_MODEL_CALLS=0')
          print('S12_PROJECT_WRITES=0')
          print('S12_NEON_MUTATIONS=0')
          print('S12_PLAN_NOT_QUOTA_OR_INFERENCE_AUTHORIZATION=TRUE')
          if not has_free or has_paid:
              print('S12_FREE_BILLING=DENY_PLAN_UNSAFE_OR_UNKNOWN')
              raise SystemExit(6)
          print('S12_CURRENT_FREE_PLAN_OBSERVED=PASS')
          PY
