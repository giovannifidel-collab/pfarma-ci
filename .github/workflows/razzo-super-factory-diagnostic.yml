name: RAZZO Super Factory Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/razzo-super-factory-diagnostic.yml'
      - 'project-giovanni-source-ref.txt'
      - 'source-ref.txt'
      - 'family-cloud-ref.txt'

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          pg=$(tr -d '\r\n' < project-giovanni-source-ref.txt)
          pf=$(tr -d '\r\n' < source-ref.txt)
          fc=$(tr -d '\r\n' < family-cloud-ref.txt)
          for sha in "$pg" "$pf" "$fc"; do [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; done
          matrix=$(jq -cn --arg pg "$pg" --arg pf "$pf" --arg fc "$fc" '{include:[
            {shardId:"razzo-shard-0001",workItemId:"PG-FACTORY",projectId:"project-giovanni",repository:"giovannifidel-collab/project-giovanni",exactInputSha:$pg,command:"npm-factory",credential:"project"},
            {shardId:"razzo-shard-0002",workItemId:"PG-BUILD",projectId:"project-giovanni",repository:"giovannifidel-collab/project-giovanni",exactInputSha:$pg,command:"npm-build",credential:"project"},
            {shardId:"razzo-shard-0003",workItemId:"PF-PYTHON",projectId:"pfarma-cloud",repository:"giovannifidel-collab/pfarma-cloud",exactInputSha:$pf,command:"python-tests",credential:"pfarma"},
            {shardId:"razzo-shard-0004",workItemId:"FC-TEST",projectId:"family-cloud",repository:"giovannifidel-collab/family-cloud",exactInputSha:$fc,command:"npm-test",credential:"pfarma"}
          ]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  execute:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: clock
        shell: bash
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: credential
        name: Resolve credential without disclosure
        shell: bash
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_GIOVANNI_SOURCE_TOKEN }}
          PFARMA_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          case '${{ matrix.credential }}' in
            project) token="${PROJECT_TOKEN:-${PFARMA_TOKEN:-}}" ;;
            pfarma) token="${PFARMA_TOKEN:-${PROJECT_TOKEN:-}}" ;;
            *) token='' ;;
          esac
          if [ -n "$token" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - id: access
        name: Probe exact-SHA repository access
        if: steps.credential.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ env.PRIVATE_SOURCE_TOKEN }}
        run: |
          set +e
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ matrix.repository }}/commits/${{ matrix.exactInputSha }}")
          set -e
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 200 ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout authoritative exact SHA
        if: steps.access.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.exactInputSha }}
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - id: verify
        name: Execute real product verification
        if: steps.access.outputs.available == 'true'
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ matrix.exactInputSha }}'
          git remote set-url origin REDACTED
          case '${{ matrix.command }}' in
            npm-factory|npm-build|npm-test)
              if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
              ;;
          esac
          case '${{ matrix.command }}' in
            npm-factory) npm run test:factory --if-present ;;
            npm-build) NEXT_TELEMETRY_DISABLED=1 npm run build ;;
            npm-test) npm test ;;
            python-tests)
              python -m compileall -q .
              if [ -f factory/test_razzo_executor.py ]; then python -m unittest factory.test_razzo_executor; else python -m unittest discover; fi
              ;;
            *) exit 64 ;;
          esac
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Write sanitized diagnostic receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          ended=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          credential='${{ steps.credential.outputs.available }}'
          access='${{ steps.access.outputs.available }}'
          http='${{ steps.access.outputs.http_code }}'
          verified='${{ steps.verify.outputs.passed }}'
          [ -n "$credential" ] || credential=false
          [ -n "$access" ] || access=false
          [ -n "$http" ] || http=not-run
          [ -n "$verified" ] || verified=false
          if [ "$verified" = true ]; then state=PRODUCT_EXACT_SHA_VERIFIED; conclusion=success
          elif [ "$credential" != true ]; then state=BLOCKED_SECRET_UNAVAILABLE; conclusion=failure
          elif [ "$access" != true ]; then state=BLOCKED_REPOSITORY_ACCESS; conclusion=failure
          else state=PRODUCT_VERIFICATION_FAILED; conclusion=failure
          fi
          digest=$(printf '%s' '${{ matrix.shardId }}|${{ matrix.workItemId }}|${{ matrix.projectId }}|${{ matrix.repository }}|${{ matrix.exactInputSha }}|${{ github.run_id }}|'$state | sha256sum | cut -d' ' -f1)
          jq -n \
            --arg state "$state" --arg conclusion "$conclusion" \
            --arg shardId '${{ matrix.shardId }}' --arg workItemId '${{ matrix.workItemId }}' \
            --arg projectId '${{ matrix.projectId }}' --arg repository '${{ matrix.repository }}' \
            --arg exactInputSha '${{ matrix.exactInputSha }}' --arg runId '${{ github.run_id }}' \
            --arg started '${{ steps.clock.outputs.started }}' --arg ended "$ended" \
            --arg credentialAvailable "$credential" --arg repositoryAccess "$access" \
            --arg accessHttpCode "$http" --arg digest "$digest" \
            '{schema:"razzo.diagnostic-receipt.v1",state:$state,conclusion:$conclusion,shardId:$shardId,workItemId:$workItemId,projectId:$projectId,repository:$repository,exactInputSha:$exactInputSha,runId:$runId,startedAt:$started,endedAt:$ended,credentialAvailable:($credentialAvailable=="true"),repositoryAccess:($repositoryAccess=="true"),accessHttpCode:$accessHttpCode,digest:$digest}' \
            > "receipts/${{ matrix.workItemId }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-${{ matrix.workItemId }}
          path: receipts/${{ matrix.workItemId }}.json
          retention-days: 7

      - name: Purge private checkout and credential
        if: always()
        shell: bash
        run: rm -rf product

  aggregate:
    needs: [prepare, execute]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: diagnostic-*
          path: collected
          merge-multiple: true
      - name: Persist sanitized aggregate evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path('collected').glob('*.json'))]
          assert len(rows)==4, f'expected 4 diagnostic receipts, found {len(rows)}'
          starts=sorted(r['startedAt'] for r in rows)
          ends=sorted(r['endedAt'] for r in rows)
          result={
            'schema':'razzo.diagnostic-aggregate.v1',
            'runId':rows[0]['runId'],
            'workItems':len(rows),
            'projects':len({r['projectId'] for r in rows}),
            'shards':len({r['shardId'] for r in rows}),
            'verified':sum(r['state']=='PRODUCT_EXACT_SHA_VERIFIED' for r in rows),
            'states':{s:sum(r['state']==s for r in rows) for s in sorted({r['state'] for r in rows})},
            'allCredentialAvailable':all(r['credentialAvailable'] for r in rows),
            'allRepositoryAccess':all(r['repositoryAccess'] for r in rows),
            'state':'OBJECTIVELY_VERIFIED' if all(r['state']=='PRODUCT_EXACT_SHA_VERIFIED' for r in rows) else 'DIAGNOSTIC_EVIDENCE',
            'receipts':rows,
          }
          out=Path('razzo/runtime-diagnostics')/str(rows[0]['runId'])
          out.mkdir(parents=True,exist_ok=True)
          (out/'aggregate.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          git config user.name 'RAZZO Super Factory'
          git config user.email 'actions@users.noreply.github.com'
          git add razzo/runtime-diagnostics
          git commit -m "RAZZO diagnostic: factory wave run ${{ github.run_id }}"
          git push
