name: RAZZO Project Giovanni Product Workstreams

on:
  pull_request:
    branches: [main]
    paths:
      - 'razzo/project-offline-ref.txt'
      - 'razzo/project-history-ref.txt'
      - '.github/workflows/razzo-project-product-workstreams.yml'
  push:
    branches: [main]
    paths:
      - 'razzo/project-offline-ref.txt'
      - 'razzo/project-history-ref.txt'
      - '.github/workflows/razzo-project-product-workstreams.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: offline-cache-guard
            ref_file: razzo/project-offline-ref.txt
          - lane: history-sync-contract
            ref_file: razzo/project-history-ref.txt
    name: ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    steps:
      - name: Checkout public control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve exact private SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < '${{ matrix.ref_file }}')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require private-source token
        env:
          TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: test -n "$TOKEN"
      - name: Checkout exact Project Giovanni candidate
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: project-giovanni
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: test "$(git -C project-giovanni rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: project-giovanni
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        working-directory: project-giovanni
        run: npx --yes tsc --noEmit
      - name: Factory and focused regressions
        working-directory: project-giovanni
        run: npm run test:factory
      - name: Factory planner smoke
        working-directory: project-giovanni
        run: npm run factory:plan
      - name: Build application with non-operational CI placeholders
        working-directory: project-giovanni
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci_placeholder'
        run: npm run build
      - name: Cleanup private source
        if: always()
        run: rm -rf project-giovanni
