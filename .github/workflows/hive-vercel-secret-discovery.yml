name: HIVE Vercel Secret Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hive-vercel-secret-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: pfarma-ci-trusted
    steps:
      - name: Discover Vercel secret names only
        shell: bash
        env:
          GH_ADMIN_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_ADMIN_TOKEN"
          api(){ curl -fsSL -H "Authorization: Bearer $GH_ADMIN_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$1"; }
          for REPO in             giovannifidel-collab/pfarma-ci             giovannifidel-collab/project-giovanni             giovannifidel-collab/pfarma-cloud             giovannifidel-collab/family-cloud             giovannifidel-collab/hive-field; do
            echo "=== $REPO ==="
            api "https://api.github.com/repos/$REPO/actions/secrets" | jq -r '.secrets[]?.name | select(test("VERCEL";"i")) | "REPO_SECRET=" + .' || true
            api "https://api.github.com/repos/$REPO/environments" | jq -r '.environments[]?.name' | while IFS= read -r E; do
              test -n "$E" || continue
              ENC="$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$E")"
              echo "ENV=$E"
              api "https://api.github.com/repos/$REPO/environments/$ENC/secrets" | jq -r '.secrets[]?.name | select(test("VERCEL";"i")) | "ENV_SECRET=" + .' || true
            done
          done
