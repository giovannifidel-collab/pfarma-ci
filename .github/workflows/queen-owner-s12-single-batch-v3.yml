name: Queen Owner S12 — One OIDC Batch V3 for Two Exact Private DRAFT PRs
on:
  push:
    branches: [s12/single-owner-two-project-batch-v3-20261123]
    paths: ['.github/workflows/queen-owner-s12-single-batch-v3.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/queen-owner-s12-single-batch-v3.yml']
  workflow_dispatch:
    inputs:
      approve_s12_two_projects_and_conditional_terminal:
        description: 'Owner: ONE free-only two-project V3 batch and ONE CONDITIONAL terminal acceptance, strictly after both private draft PRs, tests, Neon receipts and independent readback; no merge/deploy/School/paid'
        required: true
        type: boolean
        default: false
permissions: {contents: read}
concurrency:
  group: queen-owner-s12-single-batch-v3
  cancel-in-progress: false
jobs:
  source-only-ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Exact one workflow source, static OIDC and approval contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only origin/main...HEAD)" = '.github/workflows/queen-owner-s12-single-batch-v3.yml'
          grep -Fq 'approve_s12_two_projects_and_conditional_terminal' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'S12_BATCH_V3_OWNER_OIDC_AND_NEON_REGISTER=PASS' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'S12_BATCH_V3_OWNER_FREE_COST=PASS' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'S12_GENERATION: "3"' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'S12_BATCH_V3_ONE_PROJECT_EXACT_LEASE=PASS' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'S12_BATCH_V3_ONE_PRIVATE_DRAFT_RECEIPT=PASS' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'S12_OWNER_SIGNED_CONDITIONAL_TERMINAL_CAS=' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'conditional-owner-terminal-attestation:' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'S12_TERMINAL_SIGNER_NO_NEON_OR_PROJECT_WRITES=TRUE' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'environment: pfarma-ci-trusted' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'fail-fast: false' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'no_auto_merge' .github/workflows/queen-owner-s12-single-batch-v3.yml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          src=Path('.github/workflows/queen-owner-s12-single-batch-v3.yml').read_text()
          marker="          node --input-type=module <<'JS'\n"
          blocks=src.split(marker)
          assert len(blocks)==5, 'exactly four bounded JS OIDC scripts including terminal signer'
          for i,block in enumerate(blocks[1:]):
              assert '\n          JS' in block
              code=block.split('\n          JS',1)[0]
              code='\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
              r=subprocess.run(['node','--check','--input-type=module'],input=code,text=True,capture_output=True)
              assert r.returncode==0, 'isolated inline JS syntax '+str(i)
          PY
          echo S12_BATCH_V3_SOURCE_ONLY_CI=PASS
          echo S12_NO_OWNER_OR_NEON_WRITES_IN_SOURCE_CI=TRUE
  register-owner-batch:
    outputs:
      field_sha: ${{ steps.owner_register.outputs.field_sha }}
    if: github.event_name == 'workflow_dispatch' && inputs.approve_s12_two_projects_and_conditional_terminal == true && github.actor == 'giovannifidel-collab'
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 17
    permissions: {contents: read, id-token: write}
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Require authenticated Owner current S12 V3 HIVE source and both immutable project baselines
        id: locked_scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_TRIGGERING_ACTOR" = giovannifidel-collab
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test -n "$GH_TOKEN" && test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
          hive="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)"
          ptr="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')"
          test "$hive" = "$ptr"
          gh api repos/giovannifidel-collab/hive-alveare/pulls/126 | jq -e --arg sha "$hive" '.state=="closed" and .merged==true and .merge_commit_sha==$sha and .head.sha=="6c9596a47f5541a28e9ee44f2628c39b0dcdb213" and .changed_files==5' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/actions/runs/45203487596 |
            jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha=="6c9596a47f5541a28e9ee44f2628c39b0dcdb213"' >/dev/null
          test "$(gh api repos/giovannifidel-collab/project-giovanni/branches/main --jq .commit.sha)" = 4f67bda2e1bf63db12c1d9d7311b57f12b7bc707
          field_main="$(gh api repos/giovannifidel-collab/hive-field/branches/main --jq .commit.sha)"
          # Only these exact Git blobs are approved; unrelated UI changes are tolerated.
          test "${#field_main}" -eq 40
          field_blob="$(gh api "repos/giovannifidel-collab/hive-field/contents/src/data-v2-adapter.js?ref=$field_main" --jq .sha)"
          test_blob="$(gh api "repos/giovannifidel-collab/hive-field/contents/src/data-v2-adapter.test.mjs?ref=$field_main" --jq .sha)"
          [[ "$field_blob" =~ ^[a-f0-9]{40}$ ]] && [[ "$test_blob" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/giovannifidel-collab/hive-field/contents/src/data-v2-adapter.js?ref=$field_main" | jq -e '.type=="file" and .encoding=="base64" and .size>20 and .size<=16000' >/dev/null
          gh api "repos/giovannifidel-collab/hive-field/contents/src/data-v2-adapter.test.mjs?ref=$field_main" | jq -e '.type=="file" and .encoding=="base64" and .size>20 and .size<=16000' >/dev/null
          printf 'field_sha=%s\n' "$field_main" >> "$GITHUB_OUTPUT"
          echo S12_V3_FIELD_LIVE_BOUNDED_SOURCE_AND_TEST=PASS
          live="$(curl --fail --silent --show-error --max-time 20 -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" 'https://hive-alveare.pages.dev/api/queen-s12-batch-v3')"
          jq -e '.ok==true and .route=="single-batch-v3-owner-neon-gate" and .default_dispatch=="DENY" and .model_invoked==false' <<< "$live" >/dev/null
          echo S12_BATCH_V3_LOCKED_SOURCE_DEPLOYED=PASS
      - name: Checkout current Field baseline at exact immutable Git SHA
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-field
          ref: ${{ steps.locked_scope.outputs.field_sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: field-baseline
      - name: Run independent Field baseline in isolated networkless read-only Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C field-baseline rev-parse HEAD)" = "${{ steps.locked_scope.outputs.field_sha }}"
          root="$(pwd)/field-baseline"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 90 --memory 384m \
            --user 65534:65534 \
            --mount "type=bind,source=$root,target=/project,readonly" \
            --workdir /project node:22-alpine node --test src/data-v2-adapter.test.mjs \
            > "$RUNNER_TEMP/s12-owner-field-current-baseline.log" 2>&1
          grep -Eq '^# tests 1$' "$RUNNER_TEMP/s12-owner-field-current-baseline.log"
          grep -Eq '^# pass 1$' "$RUNNER_TEMP/s12-owner-field-current-baseline.log"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/s12-owner-field-current-baseline.log"
          echo S12_V3_CURRENT_FIELD_BASELINE_NETWORKLESS_PASS=TRUE
      - name: Clean Owner preflight private Field checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- field-baseline
          rm -f "$RUNNER_TEMP/s12-owner-field-current-baseline.log"
      - name: Independently verify Cloudflare Workers Free plan and current daily neurons
        shell: bash
        env:
          DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALT_DEPLOY: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
          BILLING: ${{ secrets.CF_BILLING_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,datetime
          deploy=os.getenv('DEPLOY') or os.getenv('ALT_DEPLOY')
          billing=os.getenv('BILLING')
          tokens=[('deploy',os.getenv('DEPLOY')),('fallback',os.getenv('ALT_DEPLOY')),('billing',billing)]
          if not deploy or not billing:
              print('S12_FREE_NEURONS=DENY_EXISTING_READ_TOKEN_MISSING');raise SystemExit(2)
          def call(path,token,payload=None):
              if not token:return 0,{}
              headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
              data=None
              if payload is not None:
                  headers['Content-Type']='application/json'
                  data=json.dumps(payload).encode()
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,
                  data=data,method='POST' if data else 'GET',headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=18) as res:return res.status,json.load(res)
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode('utf-8'))
                  except:return e.code,{}
              except Exception:return 0,{}
          code,accounts=call('/accounts?per_page=100',deploy)
          if code!=200 or accounts.get('success') is not True:
              print('S12_FREE_NEURONS=DENY_HIVE_ACCOUNT_NOT_VERIFIED');raise SystemExit(3)
          ids=[]
          for a in accounts.get('result',[]):
              account=str(a.get('id',''))
              if len(account)!=32:continue
              c,p=call('/accounts/'+account+'/pages/projects/hive-alveare',deploy)
              if c==200 and p.get('success') is True and p.get('result',{}).get('name')=='hive-alveare':
                  ids.append(account)
          if len(ids)!=1:
              print('S12_FREE_NEURONS=DENY_MULTIPLE_ACCOUNTS');raise SystemExit(4)
          aid=ids[0]
          code,subs=call('/accounts/'+aid+'/subscriptions',billing)
          if code!=200 or subs.get('success') is not True or not isinstance(subs.get('result'),list):
              print('S12_FREE_NEURONS=DENY_BILLING_READ_UNKNOWN');raise SystemExit(5)
          billed=[]
          for item in subs['result']:
              plan=item.get('rate_plan') or {}
              n=' '.join(str(plan.get(k) or '') for k in ('id','name','public_name','scope')).lower()
              if ('worker' in n or 'ai gateway' in n) and str(item.get('state','')).lower() not in ('expired','cancelled','failed'):
                  billed.append(n)
          paid=any(any(t in n for t in ('paid','standard','enterprise','bundled')) for n in billed)
          ambiguous=any(not any(t in n for t in ('free','paid','standard','enterprise','bundled')) for n in billed)
          if paid or ambiguous:
              print('S12_FREE_NEURONS=DENY_WORKERS_PLAN_UNVERIFIED');raise SystemExit(6)
          utc=datetime.datetime.now(datetime.timezone.utc)
          start=utc.replace(hour=0,minute=0,second=0,microsecond=0).isoformat(timespec='seconds').replace('+00:00','Z')
          end=utc.isoformat(timespec='seconds').replace('+00:00','Z')
          query='query($tag:String!,$start:Time!,$end:Time!){viewer{accounts(filter:{accountTag:$tag}){aiInferenceAdaptiveGroups(limit:100,filter:{datetime_geq:$start,datetime_leq:$end}){sum{totalNeurons}}}}}'
          request={'query':query,'variables':{'tag':aid,'start':start,'end':end}}
          metrics=None
          for label,t in tokens:
              if not t:continue
              status,result=call('/graphql',t,request)
              if status!=200 or result.get('errors'):
                  print('S12_'+label.upper()+'_ANALYTICS_READ='+('UNAUTHORIZED' if status in (401,403) else 'SCHEMA_OR_ACCESS_UNKNOWN'))
                  continue
              accs=((result.get('data') or {}).get('viewer') or {}).get('accounts') or []
              if len(accs)!=1:continue
              groups=accs[0].get('aiInferenceAdaptiveGroups')
              if not isinstance(groups,list):continue
              vals=[((g.get('sum') or {}).get('totalNeurons')) for g in groups]
              if any(not isinstance(x,(int,float)) or x<0 for x in vals):continue
              metrics=sum(vals)
              print('S12_ANALYTICS_TOKEN_REUSED='+label)
              break
          if metrics is None:
              print('S12_FREE_NEURONS=DENY_DAILY_USAGE_UNVERIFIED');raise SystemExit(7)
          print('S12_FREE_PLAN=VERIFIED')
          print('S12_AI_NEURONS_USED_SINCE_UTC_MIDNIGHT='+str(round(metrics,2)))
          print('S12_NO_MODEL_INFERENCE=TRUE')
          print('S12_NO_WRITES=TRUE')
          if metrics>5000:
              print('S12_FREE_NEURONS=DENY_NOT_ENOUGH_CERTIFIED_HEADROOM')
              raise SystemExit(8)
          print('S12_FREE_NEURONS=PASS_READONLY_PROVISIONAL_CAP')
          print('S12_COST_ATTESTATION_NOT_NEON_OWNER_PERMISSION=TRUE')
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'],'s12-independent-free-quota.json').write_text(json.dumps({'used_neurons':float(metrics),'free_plan_verified':True,'workers_paid_absent':True,'account_verified':True,'analytics_verified':True}))
          PY
      - name: Owner Github RS256 OIDC creates one batch and independent Neon cost proof
        id: owner_register
        env:
          S12_FIELD_PRETESTED_SHA: ${{ steps.locked_scope.outputs.field_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const e=process.env;
          const deny=x=>{throw Error('S12_BATCH_V3_DENY_'+x)};
          if(!e.ACTIONS_ID_TOKEN_REQUEST_URL||!e.ACTIONS_ID_TOKEN_REQUEST_TOKEN||
           !e.CF_ACCESS_CLIENT_ID||!e.CF_ACCESS_CLIENT_SECRET)deny('MISSING_OIDC_ACCESS');
          const aud='hive-queen-s12-single-batch-v3-v1';
          const t=await fetch(e.ACTIONS_ID_TOKEN_REQUEST_URL+
           (e.ACTIONS_ID_TOKEN_REQUEST_URL.includes('?')?'&':'?')+
           'audience='+encodeURIComponent(aud),
           {headers:{authorization:'Bearer '+e.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!t.ok)deny('OIDC_ISSUER');
          const oidc=(await t.json()).value;
          if(typeof oidc!=='string'||oidc.length<300)deny('OIDC_INVALID');
          const url='https://hive-alveare.pages.dev/api/queen-s12-batch-v3';
          const base={run_id:Number(e.GITHUB_RUN_ID),run_attempt:Number(e.GITHUB_RUN_ATTEMPT),
           public_sha:e.GITHUB_SHA};
          const send=async(action,extra={})=>{
           const r=await fetch(url,{method:'POST',redirect:'error',
            headers:{'CF-Access-Client-Id':e.CF_ACCESS_CLIENT_ID,
             'CF-Access-Client-Secret':e.CF_ACCESS_CLIENT_SECRET,
             'X-Queen-CI-OIDC':oidc,'content-type':'application/json'},
            body:JSON.stringify({action,...base,...extra})});
           const data=await r.json().catch(()=>null);
           if(!r.ok||data?.ok!==true)deny('NEON_'+action.toUpperCase()+'_FAILED');
           return data;
          };
          if(!/^[a-f0-9]{40}$/.test(e.S12_FIELD_PRETESTED_SHA||''))
            deny('FIELD_BASELINE_SHA_MISSING');
          const reg=await send('register',{field_source_sha:e.S12_FIELD_PRETESTED_SHA});
          if(reg.decision!=='OWNER_V3_ONE_BATCH_TWO_PROJECTS_NEON_REGISTERED'||
           reg.no_auto_merge!==true||reg.no_auto_deploy!==true||reg.no_school_training!==true)
           deny('REGISTER_WRONG_DECISION');
          if(!/^[a-f0-9]{40}$/.test(reg.field_source_sha))
           deny('FIELD_SIGNED_SNAPSHOT_INVALID');
          fs.appendFileSync(e.GITHUB_OUTPUT,'field_sha='+reg.field_source_sha+String.fromCharCode(10));
          console.log('S12_BATCH_V3_OWNER_OIDC_AND_NEON_REGISTER=PASS');
          const cost=JSON.parse(fs.readFileSync(e.RUNNER_TEMP+'/s12-independent-free-quota.json','utf8'));
          if(cost.free_plan_verified!==true||cost.workers_paid_absent!==true||
            cost.account_verified!==true||cost.analytics_verified!==true||
            !Number.isFinite(cost.used_neurons)||cost.used_neurons<0||cost.used_neurons>5000)
           deny('FREE_COST_INVALID');
          const result=await send('attest_cost',cost);
          if(result.decision!=='BATCH_TWO_PROJECTS_FREE_COST_ATTESTED')
           deny('COST_RECEIPT_INVALID');
          console.log('S12_BATCH_V3_OWNER_FREE_COST=PASS');
          console.log('S12_BATCH_V3_ONE_SIGNED_OWNER_ACTION_FOR_TWO_DRAFTS=TRUE');
          JS
  two-project-independent-drafts:
    if: github.event_name == 'workflow_dispatch'
    needs: register-owner-batch
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 22
    permissions: {contents: read, id-token: write}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: project-giovanni, repo: giovannifidel-collab/project-giovanni, sha: 4f67bda2e1bf63db12c1d9d7311b57f12b7bc707}
          - id: hive-field
            repo: giovannifidel-collab/hive-field
            sha: ${{ needs.register-owner-batch.outputs.field_sha }}
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      S12_PROJECT_ID: ${{ matrix.id }}
      S12_GENERATION: "3"
      S12_SOURCE_SHA: ${{ matrix.sha }}
    steps:
      - name: Verify exact HIVE pointer and private project HEAD for independent runner
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(gh api "repos/${{ matrix.repo }}/branches/main" --jq .commit.sha)" = "${{ matrix.sha }}"
          hive="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)"
          ptr="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')"
          test "$hive" = "$ptr"
          gh api repos/giovannifidel-collab/hive-alveare/pulls/126 |
            jq -e --arg sha "$hive" '.state=="closed" and .merged==true and .merge_commit_sha==$sha and .head.sha=="6c9596a47f5541a28e9ee44f2628c39b0dcdb213"' >/dev/null
          echo "hive_sha=$hive" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: ${{ steps.source.outputs.hive_sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: hive-source
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: project-source
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: V3 independent source/security tests before invoking any model
        shell: bash
        run: |
          set -euo pipefail
          node --check hive-source/ops/queen/s12/s12-trusted-project-draft.mjs
          node --test hive-source/ops/queen/s12/tests/s12-single-batch-v3.test.mjs
          echo S12_BATCH_V3_RUNNER_SECURITY_TESTS=PASS
      - name: Activate exact one-project V3 Neon lease under the same Owner OIDC batch
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const e=process.env,deny=x=>{throw Error('S12_BATCH_V3_DENY_'+x)};
          const req=e.ACTIONS_ID_TOKEN_REQUEST_URL,token=e.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(!req||!token||!e.CF_ACCESS_CLIENT_ID||!e.CF_ACCESS_CLIENT_SECRET)
           deny('OWNER_BATCH_OIDC_NOT_AVAILABLE');
          const r=await fetch(req+(req.includes('?')?'&':'?')+
           'audience='+encodeURIComponent('hive-queen-s12-single-batch-v3-v1'),
           {headers:{authorization:'Bearer '+token}});
          if(!r.ok)deny('OIDC_ISSUER');
          const oidc=(await r.json()).value;
          if(typeof oidc!=='string'||oidc.length<300)deny('OIDC_INVALID');
          const body={action:'activate',run_id:Number(e.GITHUB_RUN_ID),
           run_attempt:Number(e.GITHUB_RUN_ATTEMPT),public_sha:e.GITHUB_SHA,
           project_id:e.S12_PROJECT_ID};
          const response=await fetch('https://hive-alveare.pages.dev/api/queen-s12-batch-v3',{
           method:'POST',redirect:'error',headers:{
            'CF-Access-Client-Id':e.CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret':e.CF_ACCESS_CLIENT_SECRET,
            'X-Queen-CI-OIDC':oidc,'content-type':'application/json'},
           body:JSON.stringify(body)});
          const data=await response.json().catch(()=>null);
          if(!response.ok||data?.ok!==true||
            data.decision!=='V3_ONE_EXACT_PROJECT_LEASE_ACTIVATED'||
            data.project_id!==e.S12_PROJECT_ID||data.no_auto_merge!==true||
            data.no_auto_deploy!==true||data.no_school_training!==true)
           deny('ONE_PROJECT_ACTIVATION_NEON_DENIED');
          console.log('S12_BATCH_V3_ONE_PROJECT_EXACT_LEASE=PASS');
          JS
      - name: Actual single free coding-model proposal, baseline and candidate Docker, one private DRAFT PR
        shell: bash
        run: node hive-source/ops/queen/s12/s12-trusted-project-draft.mjs
      - name: Independently verify exact private DRAFT PR under same Owner OIDC and persist Neon provisional receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const e=process.env,deny=x=>{throw Error('S12_BATCH_V3_DENY_'+x)};
          const req=e.ACTIONS_ID_TOKEN_REQUEST_URL,secret=e.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(!req||!secret||!e.CF_ACCESS_CLIENT_ID||!e.CF_ACCESS_CLIENT_SECRET)
           deny('OIDC_ACCESS_NOT_AVAILABLE');
          const result=await fetch(req+(req.includes('?')?'&':'?')+
           'audience='+encodeURIComponent('hive-queen-s12-single-batch-v3-v1'),
           {headers:{authorization:'Bearer '+secret}});
          if(!result.ok)deny('OIDC_ISSUER');
          const oidc=(await result.json()).value;
          if(typeof oidc!=='string'||oidc.length<300)deny('OIDC_INVALID');
          const receipt=JSON.parse(fs.readFileSync(e.RUNNER_TEMP+'/s12-'+e.S12_PROJECT_ID+'-draft-receipt.json','utf8'));
          if(receipt.lease_generation!==3||receipt.project_id!==e.S12_PROJECT_ID||
             receipt.test_status!=='PASS_NETWORKLESS_READONLY'||receipt.auto_merge!==false||
             receipt.auto_deploy!==false||receipt.neon_terminal_certified!==false)
           deny('RUNNER_RECEIPT_INVALID');
          const body={action:'complete',run_id:Number(e.GITHUB_RUN_ID),
           run_attempt:Number(e.GITHUB_RUN_ATTEMPT),public_sha:e.GITHUB_SHA,
           project_id:e.S12_PROJECT_ID,draft_pr_number:receipt.draft_pr_number,
           proposal_sha256:receipt.content_sha256,tests_passed:true,test_count:receipt.test_count};
          const r=await fetch('https://hive-alveare.pages.dev/api/queen-s12-batch-v3',{
           method:'POST',redirect:'error',headers:{
            'CF-Access-Client-Id':e.CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret':e.CF_ACCESS_CLIENT_SECRET,
            'X-Queen-CI-OIDC':oidc,'content-type':'application/json'},
           body:JSON.stringify(body)});
          const x=await r.json().catch(()=>null);
          if(!r.ok||x?.ok!==true||x.decision!=='BATCH_V3_ONE_PRIVATE_DRAFT_VERIFIED_PENDING_TERMINAL')
           deny('INDEPENDENT_NEON_DRAFT_CAS_NOT_VERIFIED');
          console.log('S12_BATCH_V3_ONE_PRIVATE_DRAFT_RECEIPT=PASS');
          console.log('S12_OWNER_TERMINAL_SIGNATURE_REQUIRED=TRUE');
          JS
      - name: Clean all secret or private-source traces
        if: always()
        shell: bash
        run: |
          rm -rf -- project-source hive-source
          rm -f "$RUNNER_TEMP"/s12-*-draft-receipt.json "$RUNNER_TEMP"/s12-*-isolated-tests.log
          echo S12_NO_PRIVATE_SOURCE_ARTIFACTS=TRUE
  conditional-owner-terminal-attestation:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_s12_two_projects_and_conditional_terminal == true
    needs: [register-owner-batch, two-project-independent-drafts]
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 9
    permissions: {contents: read, id-token: write}
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      OWNER_APPROVAL: ${{ inputs.approve_s12_two_projects_and_conditional_terminal }}
      S12_APPROVED_FIELD_SHA: ${{ needs.register-owner-batch.outputs.field_sha }}
    steps:
      - name: Verify two independently tested unmerged private PRs and exact signed source baseline
        id: drafts
        shell: bash
        run: |
          set -euo pipefail
          test "$OWNER_APPROVAL" = true
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_TRIGGERING_ACTOR" = giovannifidel-collab
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$S12_APPROVED_FIELD_SHA" =~ ^[a-f0-9]{40}$ ]]
          hive="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)"
          ptr="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')"
          test "$hive" = "$ptr"
          gh api repos/giovannifidel-collab/hive-alveare/pulls/126 |
            jq -e --arg sha "$hive" '.state=="closed" and .merged==true and .merge_commit_sha==$sha and .head.sha=="6c9596a47f5541a28e9ee44f2628c39b0dcdb213" and .changed_files==5' >/dev/null
          verify_one() {
            local repo="$1" branch="$2" sha="$3" file="$4" output="$5"
            local prs number pr changed commit
            prs="$(gh api "repos/$repo/pulls?state=open&per_page=100")"
            number="$(jq -r --arg b "$branch" '[.[] | select(.draft==true and .state=="open" and .head.ref==$b and .base.ref=="main")] | if length==1 then .[0].number else empty end' <<< "$prs")"
            test -n "$number" && test "$number" -gt 0
            pr="$(gh api "repos/$repo/pulls/$number")"
            jq -e --arg repo "$repo" --arg b "$branch" '.state=="open" and .draft==true and .merged==false and .base.ref=="main" and .head.ref==$b and .head.repo.full_name==$repo and .changed_files==1' <<< "$pr" >/dev/null
            changed="$(gh api "repos/$repo/pulls/$number/files?per_page=100")"
            jq -e --arg file "$file" 'length==1 and .[0].filename==$file and .[0].status=="modified"' <<< "$changed" >/dev/null
            commit="$(gh api "repos/$repo/commits/$(jq -r .head.sha <<< "$pr")")"
            jq -e --arg sha "$sha" '.parents|length==1 and .[0].sha==$sha' <<< "$commit" >/dev/null
            printf '%s=%s\n' "$output" "$number" >> "$GITHUB_OUTPUT"
            printf '%s_head=%s\n' "$output" "$(jq -r .head.sha <<< "$pr")" >> "$GITHUB_OUTPUT"
          }
          verify_one giovannifidel-collab/project-giovanni queen/s12/a2f6327b-9303-423a-91e2-33ce5dbadd31 4f67bda2e1bf63db12c1d9d7311b57f12b7bc707 factory/continuous-loop.mjs project_g_pr
          verify_one giovannifidel-collab/hive-field queen/s12/10d37847-331f-4fd1-895e-0b3517c0da21 "$S12_APPROVED_FIELD_SHA" src/data-v2-adapter.js field_pr
          echo "hive_sha=$hive" >> "$GITHUB_OUTPUT"
          echo S12_TERMINAL_BOTH_PRIVATE_DRAFTS_GITHUB_READBACK=PASS
      - name: Verify new same-workflow GitHub Owner RS256 OIDC and sign exactly one conditional terminal Neon CAS
        env:
          S12_HIVE_SHA: ${{ steps.drafts.outputs.hive_sha }}
          S12_PROJECT_G_PR: ${{ steps.drafts.outputs.project_g_pr }}
          S12_PROJECT_G_HEAD: ${{ steps.drafts.outputs.project_g_pr_head }}
          S12_FIELD_PR: ${{ steps.drafts.outputs.field_pr }}
          S12_FIELD_HEAD: ${{ steps.drafts.outputs.field_pr_head }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {createPublicKey,verify,createHash} from 'node:crypto';
          const e=process.env,deny=x=>{throw Error('S12_CONDITIONAL_TERMINAL_DENY_'+x)};
          const aud='hive-queen-s12-single-batch-v3-v1';
          if(e.OWNER_APPROVAL!=='true'||!e.ACTIONS_ID_TOKEN_REQUEST_URL||
             !e.ACTIONS_ID_TOKEN_REQUEST_TOKEN)deny('OWNER_NOT_AUTHENTICATED');
          const req=e.ACTIONS_ID_TOKEN_REQUEST_URL+
           (e.ACTIONS_ID_TOKEN_REQUEST_URL.includes('?')?'&':'?')+
           'audience='+encodeURIComponent(aud);
          const res=await fetch(req,{headers:{authorization:'Bearer '+e.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!res.ok)deny('ISSUER');
          const parts=(await res.json()).value?.split('.')||[];
          if(parts.length!==3)deny('JWT_PARTS');
          const dec=x=>Buffer.from(x.replace(/-/g,'+').replace(/_/g,'/')+
           '='.repeat((4-x.length%4)%4),'base64');
          const h=JSON.parse(dec(parts[0])),c=JSON.parse(dec(parts[1]));
          if(h.alg!=='RS256'||!h.kid||h.jwk||h.jku||h.x5u||h.crit)deny('HEADER');
          const expected={iss:'https://token.actions.githubusercontent.com',aud,
           repository:'giovannifidel-collab/pfarma-ci',repository_id:'1308677897',
           repository_owner_id:'305755860',actor:'giovannifidel-collab',actor_id:'305755860',
           event_name:'workflow_dispatch',environment:'pfarma-ci-trusted',ref:'refs/heads/main',
           runner_environment:'github-hosted',
           workflow_ref:'giovannifidel-collab/pfarma-ci/.github/workflows/queen-owner-s12-single-batch-v3.yml@refs/heads/main'};
          for(const [k,v] of Object.entries(expected))if(String(c[k])!==v)deny('CLAIM_'+k);
          const now=Date.now();
          if(c.sha!==e.GITHUB_SHA||Number(c.run_id)!==Number(e.GITHUB_RUN_ID)||
             Number(c.run_attempt)!==1||!Number.isSafeInteger(c.exp)||!Number.isSafeInteger(c.iat)||
             c.exp<=c.iat||c.exp-c.iat>900||c.exp*1000<=now||
             now-c.iat*1000>300000||c.iat*1000>now+30000)deny('TIME');
          const keyRes=await fetch('https://token.actions.githubusercontent.com/.well-known/jwks');
          if(!keyRes.ok)deny('JWKS');
          const key=(await keyRes.json()).keys?.find(x=>x.kid===h.kid&&x.kty==='RSA'&&
            x.use==='sig'&&(!x.alg||x.alg==='RS256'));
          if(!key||!verify('RSA-SHA256',Buffer.from(parts[0]+'.'+parts[1]),
            createPublicKey({key,format:'jwk'}),dec(parts[2])))deny('SIGNATURE');
          console.log('S12_TERMINAL_OWNER_RS256_SAME_ONE_BATCH=PASS');
          const receipt={
           schema:'queen.s12.v3.one-owner-conditional-two-draft-terminal.v1',
           stage:'S12',decision:'OWNER_AUTHORIZES_ONE_CONDITIONAL_INDEPENDENT_NEON_TERMINAL_CAS_AFTER_TWO_V3_DRAFTS',
           owner:'giovannifidel-collab',run_id:Number(e.GITHUB_RUN_ID),run_attempt:1,
           relay_signer_main_sha:e.GITHUB_SHA,hive_main_sha:e.S12_HIVE_SHA,
           project_g_source_sha:'4f67bda2e1bf63db12c1d9d7311b57f12b7bc707',
           project_g_pr:Number(e.S12_PROJECT_G_PR),project_g_head:e.S12_PROJECT_G_HEAD,
           field_source_sha:e.S12_APPROVED_FIELD_SHA,
           field_pr:Number(e.S12_FIELD_PR),field_head:e.S12_FIELD_HEAD,
           project_g_mission_id:'a2f6327b-9303-423a-91e2-33ce5dbadd31',
           field_mission_id:'10d37847-331f-4fd1-895e-0b3517c0da21',
           s11_terminal_neon_event_id:1546,s12_tracker_issue:116,
           permitted_terminal_event_type:'queen.s12.dual_project.owner_signed.certified',
           max_terminal_events:1,max_terminal_meta_cas:1,
           requires_independent_neon_project_receipts:true,
           requires_independent_neon_cost_world_memory_school_readback:true,
           both_private_drafts_unmerged:true,one_file_each:true,
           both_own_model_calls_verified_by_neon_required:true,
           no_auto_merge:true,no_auto_deploy:true,no_school_training:true,
           no_paid_fallback:true,no_new_event_loop:true,no_new_scheduler:true,
           no_model_invocation_by_signer:true,no_neon_write_by_signer:true,
           terminal_certified:false,
           issued_at:new Date(now).toISOString(),expires_at:new Date(now+45*60*1000).toISOString()
          };
          const digest=createHash('sha256').update(JSON.stringify(receipt)).digest('hex');
          console.log('S12_OWNER_SIGNED_CONDITIONAL_TERMINAL_CAS='+JSON.stringify({...receipt,sha256:digest}));
          console.log('S12_TERMINAL_SIGNER_NO_NEON_OR_PROJECT_WRITES=TRUE');
          JS
