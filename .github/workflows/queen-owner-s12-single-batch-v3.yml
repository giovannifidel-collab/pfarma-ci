name: Queen Owner S12 — One OIDC Batch V3 for Two Exact Private DRAFT PRs
on:
  push:
    branches: [s12/single-owner-two-project-batch-v3-20261123]
    paths: ['.github/workflows/queen-owner-s12-single-batch-v3.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/queen-owner-s12-single-batch-v3.yml']
  workflow_dispatch:
    inputs:
      approve_exact_two_project_batch:
        description: 'Owner: one 30-minute free-only two-project V3 batch; two exact private DRAFT PRs, no main writes, deploy, merge or School; final terminal acceptance separate'
        required: true
        type: boolean
        default: false
permissions: {contents: read}
concurrency:
  group: queen-owner-s12-single-batch-v3
  cancel-in-progress: false
jobs:
  source-only-ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Exact one workflow source, static OIDC and approval contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only origin/main...HEAD)" = '.github/workflows/queen-owner-s12-single-batch-v3.yml'
          grep -Fq 'approve_exact_two_project_batch' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'S12_BATCH_V3_OWNER_OIDC_AND_NEON_REGISTER=PASS' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'S12_BATCH_V3_OWNER_FREE_COST=PASS' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'S12_GENERATION: "3"' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'S12_BATCH_V3_ONE_PRIVATE_DRAFT_RECEIPT=PASS' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'environment: pfarma-ci-trusted' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'fail-fast: false' .github/workflows/queen-owner-s12-single-batch-v3.yml
          grep -Fq 'no_auto_merge' .github/workflows/queen-owner-s12-single-batch-v3.yml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          src=Path('.github/workflows/queen-owner-s12-single-batch-v3.yml').read_text()
          marker="          node --input-type=module <<'JS'\n"
          blocks=src.split(marker)
          assert len(blocks)==3, 'exactly two JS signing scripts'
          for i,block in enumerate(blocks[1:]):
              assert '\n          JS' in block
              code=block.split('\n          JS',1)[0]
              code='\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
              r=subprocess.run(['node','--check','--input-type=module'],input=code,text=True,capture_output=True)
              assert r.returncode==0, 'isolated inline JS syntax '+str(i)
          PY
          echo S12_BATCH_V3_SOURCE_ONLY_CI=PASS
          echo S12_NO_OWNER_OR_NEON_WRITES_IN_SOURCE_CI=TRUE
  register-owner-batch:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_exact_two_project_batch == true && github.actor == 'giovannifidel-collab'
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 17
    permissions: {contents: read, id-token: write}
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Require authenticated Owner current S12 V3 HIVE source and both immutable project baselines
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_TRIGGERING_ACTOR" = giovannifidel-collab
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test -n "$GH_TOKEN" && test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
          hive="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)"
          ptr="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')"
          test "$hive" = "$ptr"
          gh api repos/giovannifidel-collab/hive-alveare/pulls/124 | jq -e --arg sha "$hive" '.state=="closed" and .merged==true and .merge_commit_sha==$sha and .head.sha=="0bc63615ed7bd24e3c0490500d8d791fb9917ba1" and .changed_files==6' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/actions/runs/45133331126 |
            jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha=="0bc63615ed7bd24e3c0490500d8d791fb9917ba1"' >/dev/null
          test "$(gh api repos/giovannifidel-collab/project-giovanni/branches/main --jq .commit.sha)" = 4f67bda2e1bf63db12c1d9d7311b57f12b7bc707
          test "$(gh api repos/giovannifidel-collab/hive-field/branches/main --jq .commit.sha)" = 2b51de88dec2e4e4ae01102fac2a3b95a9f0b5fd
          live="$(curl --fail --silent --show-error --max-time 20 -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" 'https://hive-alveare.pages.dev/api/queen-s12-batch-v3')"
          jq -e '.ok==true and .route=="single-batch-v3-owner-neon-gate" and .default_dispatch=="DENY" and .model_invoked==false' <<< "$live" >/dev/null
          echo S12_BATCH_V3_LOCKED_SOURCE_DEPLOYED=PASS
      - name: Independently verify Cloudflare Workers Free plan and current daily neurons
        shell: bash
        env:
          DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALT_DEPLOY: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
          BILLING: ${{ secrets.CF_BILLING_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,datetime
          deploy=os.getenv('DEPLOY') or os.getenv('ALT_DEPLOY')
          billing=os.getenv('BILLING')
          tokens=[('deploy',os.getenv('DEPLOY')),('fallback',os.getenv('ALT_DEPLOY')),('billing',billing)]
          if not deploy or not billing:
              print('S12_FREE_NEURONS=DENY_EXISTING_READ_TOKEN_MISSING');raise SystemExit(2)
          def call(path,token,payload=None):
              if not token:return 0,{}
              headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
              data=None
              if payload is not None:
                  headers['Content-Type']='application/json'
                  data=json.dumps(payload).encode()
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,
                  data=data,method='POST' if data else 'GET',headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=18) as res:return res.status,json.load(res)
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode('utf-8'))
                  except:return e.code,{}
              except Exception:return 0,{}
          code,accounts=call('/accounts?per_page=100',deploy)
          if code!=200 or accounts.get('success') is not True:
              print('S12_FREE_NEURONS=DENY_HIVE_ACCOUNT_NOT_VERIFIED');raise SystemExit(3)
          ids=[]
          for a in accounts.get('result',[]):
              account=str(a.get('id',''))
              if len(account)!=32:continue
              c,p=call('/accounts/'+account+'/pages/projects/hive-alveare',deploy)
              if c==200 and p.get('success') is True and p.get('result',{}).get('name')=='hive-alveare':
                  ids.append(account)
          if len(ids)!=1:
              print('S12_FREE_NEURONS=DENY_MULTIPLE_ACCOUNTS');raise SystemExit(4)
          aid=ids[0]
          code,subs=call('/accounts/'+aid+'/subscriptions',billing)
          if code!=200 or subs.get('success') is not True or not isinstance(subs.get('result'),list):
              print('S12_FREE_NEURONS=DENY_BILLING_READ_UNKNOWN');raise SystemExit(5)
          billed=[]
          for item in subs['result']:
              plan=item.get('rate_plan') or {}
              n=' '.join(str(plan.get(k) or '') for k in ('id','name','public_name','scope')).lower()
              if ('worker' in n or 'ai gateway' in n) and str(item.get('state','')).lower() not in ('expired','cancelled','failed'):
                  billed.append(n)
          paid=any(any(t in n for t in ('paid','standard','enterprise','bundled')) for n in billed)
          ambiguous=any(not any(t in n for t in ('free','paid','standard','enterprise','bundled')) for n in billed)
          if paid or ambiguous:
              print('S12_FREE_NEURONS=DENY_WORKERS_PLAN_UNVERIFIED');raise SystemExit(6)
          utc=datetime.datetime.now(datetime.timezone.utc)
          start=utc.replace(hour=0,minute=0,second=0,microsecond=0).isoformat(timespec='seconds').replace('+00:00','Z')
          end=utc.isoformat(timespec='seconds').replace('+00:00','Z')
          query='query($tag:String!,$start:Time!,$end:Time!){viewer{accounts(filter:{accountTag:$tag}){aiInferenceAdaptiveGroups(limit:100,filter:{datetime_geq:$start,datetime_leq:$end}){sum{totalNeurons}}}}}'
          request={'query':query,'variables':{'tag':aid,'start':start,'end':end}}
          metrics=None
          for label,t in tokens:
              if not t:continue
              status,result=call('/graphql',t,request)
              if status!=200 or result.get('errors'):
                  print('S12_'+label.upper()+'_ANALYTICS_READ='+('UNAUTHORIZED' if status in (401,403) else 'SCHEMA_OR_ACCESS_UNKNOWN'))
                  continue
              accs=((result.get('data') or {}).get('viewer') or {}).get('accounts') or []
              if len(accs)!=1:continue
              groups=accs[0].get('aiInferenceAdaptiveGroups')
              if not isinstance(groups,list):continue
              vals=[((g.get('sum') or {}).get('totalNeurons')) for g in groups]
              if any(not isinstance(x,(int,float)) or x<0 for x in vals):continue
              metrics=sum(vals)
              print('S12_ANALYTICS_TOKEN_REUSED='+label)
              break
          if metrics is None:
              print('S12_FREE_NEURONS=DENY_DAILY_USAGE_UNVERIFIED');raise SystemExit(7)
          print('S12_FREE_PLAN=VERIFIED')
          print('S12_AI_NEURONS_USED_SINCE_UTC_MIDNIGHT='+str(round(metrics,2)))
          print('S12_NO_MODEL_INFERENCE=TRUE')
          print('S12_NO_WRITES=TRUE')
          if metrics>5000:
              print('S12_FREE_NEURONS=DENY_NOT_ENOUGH_CERTIFIED_HEADROOM')
              raise SystemExit(8)
          print('S12_FREE_NEURONS=PASS_READONLY_PROVISIONAL_CAP')
          print('S12_COST_ATTESTATION_NOT_NEON_OWNER_PERMISSION=TRUE')
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'],'s12-independent-free-quota.json').write_text(json.dumps({'used_neurons':float(metrics),'free_plan_verified':True,'workers_paid_absent':True,'account_verified':True,'analytics_verified':True}))
          PY
      - name: Owner Github RS256 OIDC creates one batch and independent Neon cost proof
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const e=process.env;
          const deny=x=>{throw Error('S12_BATCH_V3_DENY_'+x)};
          if(!e.ACTIONS_ID_TOKEN_REQUEST_URL||!e.ACTIONS_ID_TOKEN_REQUEST_TOKEN||
           !e.CF_ACCESS_CLIENT_ID||!e.CF_ACCESS_CLIENT_SECRET)deny('MISSING_OIDC_ACCESS');
          const aud='hive-queen-s12-single-batch-v3-v1';
          const t=await fetch(e.ACTIONS_ID_TOKEN_REQUEST_URL+
           (e.ACTIONS_ID_TOKEN_REQUEST_URL.includes('?')?'&':'?')+
           'audience='+encodeURIComponent(aud),
           {headers:{authorization:'Bearer '+e.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!t.ok)deny('OIDC_ISSUER');
          const oidc=(await t.json()).value;
          if(typeof oidc!=='string'||oidc.length<300)deny('OIDC_INVALID');
          const url='https://hive-alveare.pages.dev/api/queen-s12-batch-v3';
          const base={run_id:Number(e.GITHUB_RUN_ID),run_attempt:Number(e.GITHUB_RUN_ATTEMPT),
           public_sha:e.GITHUB_SHA};
          const send=async(action,extra={})=>{
           const r=await fetch(url,{method:'POST',redirect:'error',
            headers:{'CF-Access-Client-Id':e.CF_ACCESS_CLIENT_ID,
             'CF-Access-Client-Secret':e.CF_ACCESS_CLIENT_SECRET,
             'X-Queen-CI-OIDC':oidc,'content-type':'application/json'},
            body:JSON.stringify({action,...base,...extra})});
           const data=await r.json().catch(()=>null);
           if(!r.ok||data?.ok!==true)deny('NEON_'+action.toUpperCase()+'_FAILED');
           return data;
          };
          const reg=await send('register');
          if(reg.decision!=='OWNER_V3_ONE_BATCH_TWO_PROJECTS_NEON_REGISTERED'||
           reg.no_auto_merge!==true||reg.no_auto_deploy!==true||reg.no_school_training!==true)
           deny('REGISTER_WRONG_DECISION');
          console.log('S12_BATCH_V3_OWNER_OIDC_AND_NEON_REGISTER=PASS');
          const cost=JSON.parse(fs.readFileSync(e.RUNNER_TEMP+'/s12-independent-free-quota.json','utf8'));
          if(cost.free_plan_verified!==true||cost.workers_paid_absent!==true||
            cost.account_verified!==true||cost.analytics_verified!==true||
            !Number.isFinite(cost.used_neurons)||cost.used_neurons<0||cost.used_neurons>5000)
           deny('FREE_COST_INVALID');
          const result=await send('attest_cost',cost);
          if(result.decision!=='BATCH_TWO_PROJECTS_FREE_COST_ATTESTED')
           deny('COST_RECEIPT_INVALID');
          console.log('S12_BATCH_V3_OWNER_FREE_COST=PASS');
          console.log('S12_BATCH_V3_ONE_SIGNED_OWNER_ACTION_FOR_TWO_DRAFTS=TRUE');
          JS
  two-project-independent-drafts:
    if: github.event_name == 'workflow_dispatch'
    needs: register-owner-batch
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 22
    permissions: {contents: read, id-token: write}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: project-giovanni, repo: giovannifidel-collab/project-giovanni, sha: 4f67bda2e1bf63db12c1d9d7311b57f12b7bc707}
          - {id: hive-field, repo: giovannifidel-collab/hive-field, sha: 2b51de88dec2e4e4ae01102fac2a3b95a9f0b5fd}
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      S12_PROJECT_ID: ${{ matrix.id }}
      S12_GENERATION: "3"
    steps:
      - name: Verify exact HIVE pointer and private project HEAD for independent runner
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = giovannifidel-collab
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(gh api "repos/${{ matrix.repo }}/branches/main" --jq .commit.sha)" = "${{ matrix.sha }}"
          hive="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)"
          ptr="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')"
          test "$hive" = "$ptr"
          gh api repos/giovannifidel-collab/hive-alveare/pulls/124 |
            jq -e --arg sha "$hive" '.state=="closed" and .merged==true and .merge_commit_sha==$sha and .head.sha=="0bc63615ed7bd24e3c0490500d8d791fb9917ba1"' >/dev/null
          echo "hive_sha=$hive" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: ${{ steps.source.outputs.hive_sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: hive-source
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: project-source
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: V3 independent source/security tests before invoking any model
        shell: bash
        run: |
          set -euo pipefail
          node --check hive-source/ops/queen/s12/s12-trusted-project-draft.mjs
          node --test hive-source/ops/queen/s12/tests/s12-single-batch-v3.test.mjs
          echo S12_BATCH_V3_RUNNER_SECURITY_TESTS=PASS
      - name: Actual single free coding-model proposal, baseline and candidate Docker, one private DRAFT PR
        shell: bash
        run: node hive-source/ops/queen/s12/s12-trusted-project-draft.mjs
      - name: Independently verify exact private DRAFT PR under same Owner OIDC and persist Neon provisional receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const e=process.env,deny=x=>{throw Error('S12_BATCH_V3_DENY_'+x)};
          const req=e.ACTIONS_ID_TOKEN_REQUEST_URL,secret=e.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(!req||!secret||!e.CF_ACCESS_CLIENT_ID||!e.CF_ACCESS_CLIENT_SECRET)
           deny('OIDC_ACCESS_NOT_AVAILABLE');
          const result=await fetch(req+(req.includes('?')?'&':'?')+
           'audience='+encodeURIComponent('hive-queen-s12-single-batch-v3-v1'),
           {headers:{authorization:'Bearer '+secret}});
          if(!result.ok)deny('OIDC_ISSUER');
          const oidc=(await result.json()).value;
          if(typeof oidc!=='string'||oidc.length<300)deny('OIDC_INVALID');
          const receipt=JSON.parse(fs.readFileSync(e.RUNNER_TEMP+'/s12-'+e.S12_PROJECT_ID+'-draft-receipt.json','utf8'));
          if(receipt.lease_generation!==3||receipt.project_id!==e.S12_PROJECT_ID||
             receipt.test_status!=='PASS_NETWORKLESS_READONLY'||receipt.auto_merge!==false||
             receipt.auto_deploy!==false||receipt.neon_terminal_certified!==false)
           deny('RUNNER_RECEIPT_INVALID');
          const body={action:'complete',run_id:Number(e.GITHUB_RUN_ID),
           run_attempt:Number(e.GITHUB_RUN_ATTEMPT),public_sha:e.GITHUB_SHA,
           project_id:e.S12_PROJECT_ID,draft_pr_number:receipt.draft_pr_number,
           proposal_sha256:receipt.content_sha256,tests_passed:true,test_count:receipt.test_count};
          const r=await fetch('https://hive-alveare.pages.dev/api/queen-s12-batch-v3',{
           method:'POST',redirect:'error',headers:{
            'CF-Access-Client-Id':e.CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret':e.CF_ACCESS_CLIENT_SECRET,
            'X-Queen-CI-OIDC':oidc,'content-type':'application/json'},
           body:JSON.stringify(body)});
          const x=await r.json().catch(()=>null);
          if(!r.ok||x?.ok!==true||x.decision!=='BATCH_V3_ONE_PRIVATE_DRAFT_VERIFIED_PENDING_TERMINAL')
           deny('INDEPENDENT_NEON_DRAFT_CAS_NOT_VERIFIED');
          console.log('S12_BATCH_V3_ONE_PRIVATE_DRAFT_RECEIPT=PASS');
          console.log('S12_OWNER_TERMINAL_SIGNATURE_REQUIRED=TRUE');
          JS
      - name: Clean all secret or private-source traces
        if: always()
        shell: bash
        run: |
          rm -rf -- project-source hive-source
          rm -f "$RUNNER_TEMP"/s12-*-draft-receipt.json "$RUNNER_TEMP"/s12-*-isolated-tests.log
          echo S12_NO_PRIVATE_SOURCE_ARTIFACTS=TRUE
