name: Queen Event-Driven AI Fabric

on:
  push:
    branches:
      - queen-universal-fabric-vnext
    paths:
      - "ops/queen-vnext/edge-fabric/**"
      - "ops/queen-vnext/AI_ROUTES.json"
      - ".github/workflows/queen-event-fabric.yml"
  repository_dispatch:
    types:
      - queen-intent
      - queen-school-cycle
      - queen-verify
  workflow_dispatch:
    inputs:
      task:
        description: "Task for hive.ai.general"
        required: false
        default: "Reply with exactly HIVE_EVENT_OK"
      model:
        description: "Workers AI @cf/ worker model"
        required: false
        default: "@cf/zai-org/glm-4.7-flash"

permissions:
  contents: read

concurrency:
  group: queen-event-fabric
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.HIVE_CF_AIG_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HIVE_CF_ACCOUNT_ID }}
      HIVE_VERIFIER_MODEL: "@cf/google/gemma-4-26b-a4b-it"
    steps:
      - name: Checkout public execution fabric
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate route mesh and independence policy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const mesh = JSON.parse(fs.readFileSync('ops/queen-vnext/AI_ROUTES.json', 'utf8'));
          if (mesh.capability !== 'hive.ai.general') throw new Error('single aggregate capability missing');
          if (mesh.policy?.paid_fallback !== false) throw new Error('paid fallback must remain disabled');
          if (mesh.policy?.scheduled_dependency !== false) throw new Error('scheduled dependency must remain disabled');
          const routes = mesh.routes || [];
          const ids = new Set(routes.map(r => r.id));
          if (ids.size !== routes.length) throw new Error('duplicate route ids');
          const worker = routes.find(r => r.model === '@cf/zai-org/glm-4.7-flash');
          const verifier = routes.find(r => r.model === '@cf/google/gemma-4-26b-a4b-it');
          if (!worker || !verifier) throw new Error('worker/verifier route missing');
          if (worker.independence_group === verifier.independence_group) throw new Error('worker and verifier are not independent');
          if (worker.cost_mode !== 'free-tier' || verifier.cost_mode !== 'free-tier') throw new Error('non-free route rejected');
          if (worker.certified !== false || verifier.certified !== false) throw new Error('candidate route self-certified');
          console.log('ROUTE_MESH=PASS');
          console.log(`WORKER_GROUP=${worker.independence_group}`);
          console.log(`VERIFIER_GROUP=${verifier.independence_group}`);
          NODE

      - name: Resolve event envelope
        shell: bash
        env:
          EVENT_TASK: ${{ github.event.client_payload.task }}
          EVENT_MODEL: ${{ github.event.client_payload.model }}
          EVENT_ID: ${{ github.event.client_payload.event_id }}
          MANUAL_TASK: ${{ inputs.task }}
          MANUAL_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'HIVE_CF_AIG_TOKEN missing'; exit 10; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'HIVE_CF_ACCOUNT_ID missing'; exit 11; }
          TASK="${EVENT_TASK:-${MANUAL_TASK:-Reply with exactly HIVE_EVENT_OK}}"
          MODEL="${EVENT_MODEL:-${MANUAL_MODEL:-@cf/zai-org/glm-4.7-flash}}"
          EVENT="${EVENT_ID:-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          printf 'HIVE_TASK<<EOF\n%s\nEOF\n' "$TASK" >> "$GITHUB_ENV"
          printf 'HIVE_MODEL=%s\n' "$MODEL" >> "$GITHUB_ENV"
          printf 'HIVE_EVENT_ID=%s\n' "$EVENT" >> "$GITHUB_ENV"

      - name: Start ephemeral Cloudflare AI binding runtime
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 dev \
            --remote \
            --port 8787 \
            --config ops/queen-vnext/edge-fabric/wrangler.jsonc \
            >/tmp/queen-wrangler.log 2>&1 &
          echo $! >/tmp/queen-wrangler.pid

          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/health >/tmp/queen-health.json 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/queen-wrangler.pid)" 2>/dev/null; then
              echo 'Wrangler exited before runtime became ready' >&2
              cat /tmp/queen-wrangler.log >&2 || true
              exit 20
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo 'Ephemeral Worker did not become ready' >&2
            cat /tmp/queen-wrangler.log >&2 || true
            exit 21
          fi
          node -e "const h=require('/tmp/queen-health.json'); if(h.status!=='ok'||h.event_driven!==true||h.scheduled_dependency!==false) process.exit(1)"
          echo 'EPHEMERAL_EVENT_RUNTIME=READY'

      - name: Execute worker event
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >/tmp/queen-event.json
          const payload = {
            task: process.env.HIVE_TASK,
            model: process.env.HIVE_MODEL,
            event_id: process.env.HIVE_EVENT_ID
          };
          process.stdout.write(JSON.stringify(payload));
          NODE

          HTTP="$(curl -sS \
            -o /tmp/queen-agent-result.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data-binary @/tmp/queen-event.json \
            http://127.0.0.1:8787/run)"
          echo "WORKER_HTTP=$HTTP"
          cat /tmp/queen-agent-result.json
          test "$HTTP" = 200 || { echo 'worker event failed' >&2; cat /tmp/queen-wrangler.log >&2 || true; exit 30; }

      - name: Verify normalized agent.run contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('/tmp/queen-agent-result.json', 'utf8'));
          if (result.status !== 'ok') throw new Error(`status=${result.status}`);
          if (typeof result.text !== 'string' || !result.text.trim()) throw new Error('text missing');
          const m = result.metadata || {};
          for (const key of ['capability','provider','model','model_family','independence_group','transport','route_id','event_id']) {
            if (!m[key]) throw new Error(`metadata.${key} missing`);
          }
          if (m.capability !== 'hive.ai.general') throw new Error('wrong capability');
          if (m.certified !== false) throw new Error('candidate route must not self-certify');
          if (m.transport !== 'cloudflare-worker-ai-binding') throw new Error('wrong transport');
          console.log('AGENT_RUN_CONTRACT=PASS');
          console.log(`EVENT_ID=${m.event_id}`);
          console.log(`MODEL=${m.model}`);
          console.log(`LATENCY_MS=${m.latency_ms}`);
          NODE

      - name: Execute independent verifier
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >/tmp/queen-verifier-event.json
          import fs from 'node:fs';
          const primary = JSON.parse(fs.readFileSync('/tmp/queen-agent-result.json', 'utf8'));
          const verifierTask = [
            'Act as an independent verifier.',
            'Evaluate whether the candidate answer correctly satisfies the original task.',
            'Reply with exactly VERIFIED if it is correct and sufficient.',
            'Otherwise reply with REJECTED followed by a short reason.',
            '',
            'ORIGINAL TASK:',
            process.env.HIVE_TASK,
            '',
            'CANDIDATE ANSWER:',
            primary.text
          ].join('\n');
          process.stdout.write(JSON.stringify({
            task: verifierTask,
            model: process.env.HIVE_VERIFIER_MODEL,
            event_id: `${process.env.HIVE_EVENT_ID}:verify`
          }));
          NODE

          HTTP="$(curl -sS \
            -o /tmp/queen-verifier-result.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data-binary @/tmp/queen-verifier-event.json \
            http://127.0.0.1:8787/run)"
          echo "VERIFIER_HTTP=$HTTP"
          cat /tmp/queen-verifier-result.json
          test "$HTTP" = 200 || { echo 'independent verifier failed' >&2; cat /tmp/queen-wrangler.log >&2 || true; exit 40; }

      - name: Enforce verifier independence and verdict
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const worker = JSON.parse(fs.readFileSync('/tmp/queen-agent-result.json', 'utf8'));
          const verifier = JSON.parse(fs.readFileSync('/tmp/queen-verifier-result.json', 'utf8'));
          if (verifier.status !== 'ok') throw new Error('verifier status not ok');
          if (worker.metadata.independence_group === verifier.metadata.independence_group) {
            throw new Error('self/same-family verification rejected');
          }
          const verdict = verifier.text.trim().toUpperCase();
          if (!verdict.startsWith('VERIFIED')) throw new Error(`verifier rejected result: ${verifier.text}`);
          console.log('INDEPENDENT_VERIFICATION=PASS');
          console.log(`WORKER_GROUP=${worker.metadata.independence_group}`);
          console.log(`VERIFIER_GROUP=${verifier.metadata.independence_group}`);
          NODE

      - name: Enforce deterministic smoke proof on code push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('/tmp/queen-agent-result.json', 'utf8'));
          const normalized = result.text.trim().replace(/^['\"]|['\"]$/g, '');
          if (normalized !== 'HIVE_EVENT_OK') {
            throw new Error(`unexpected smoke response: ${result.text}`);
          }
          console.log('EVENT_DRIVEN_LIVE_PROOF=PASS');
          NODE

      - name: Stop ephemeral runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/queen-wrangler.pid ]; then
            kill "$(cat /tmp/queen-wrangler.pid)" 2>/dev/null || true
          fi
