name: Queen S9.2 Owner-Approved Temporary Git Pages Build and Rollback
on:
  push:
    branches: [audit/s9-access-policy-owner-token-20261111]
    paths: [.github/workflows/queen-s9-owner-approved-temporary-git-build-20261112.yml]
permissions: {contents: read}
concurrency:
  group: queen-s9-owner-approved-temporary-pages-global-build
  cancel-in-progress: false
jobs:
  exact-git-preview:
    environment: pfarma-ci-trusted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Fail-closed exact source and historical successful source tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$CF_TOKEN" && test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
          private_main="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)"
          test "$private_main" = '296677c77946b91ca1c8f9da70d41d87b975c5e4'
          pointer="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\n')"
          test "$private_main" = "$pointer"
          gh api repos/giovannifidel-collab/hive-alveare/pulls/90 | jq -e '.draft==true and .state=="open" and .merged==false and .head.ref=="convergence/s9-pages-legacy-build-compat-20261108" and .head.sha=="0f8e99f59b88b337ba2150171033ff8c9a51fab4" and .base.sha=="296677c77946b91ca1c8f9da70d41d87b975c5e4"' >/dev/null
          gh api repos/giovannifidel-collab/hive-alveare/actions/runs/43198714595 | jq -e '.conclusion=="success" and .head_sha=="0f8e99f59b88b337ba2150171033ff8c9a51fab4"' >/dev/null
          echo S9_OWNER_TEMP_GIT_EXACT_SOURCE_AND_COMPAT_CI=PASS
      - name: Globally patch Pages build command only temporarily; isolated preview; rollback always
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,re,urllib.request,urllib.error,subprocess,tempfile,time,base64,sys
          CF='https://api.cloudflare.com/client/v4'
          GH='https://api.github.com/repos/giovannifidel-collab/hive-alveare'
          main='296677c77946b91ca1c8f9da70d41d87b975c5e4'
          old='0f8e99f59b88b337ba2150171033ff8c9a51fab4'
          branch='convergence/s9-pages-legacy-build-compat-20261108'
          url='https://ep-snowy-paper-bffsyw5d.apirest.c-5.us-west-2.aws.neon.tech/queen_s9_preview/rest/v1'
          CMD='QUEEN_S9_EPHEMERAL_BUILD=1 node ../ops/queen/s9/pages-legacy-import-adapter.mjs --apply-ephemeral'
          def need(t,m):
              if not t:raise RuntimeError(m)
          def call(base,path,token,method='GET',payload=None):
              headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'Queen-S9-Owner-Scoped-Preview'}
              body=None
              if payload is not None:
                  headers['Content-Type']='application/json'
                  body=json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(base+path,data=body,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  try:return e.code,json.load(e)
                  except:return e.code,{}
          def cfapi(method,path,payload=None):return call(CF,path,os.environ['CF_TOKEN'],method,payload)
          s,accounts=cfapi('GET','/accounts?per_page=50')
          need(s==200 and accounts.get('success') is True,'CF_ACCOUNT_READ_DENIED')
          matches=[]
          for a in accounts.get('result') or []:
              aid=str(a.get('id',''))
              if not re.fullmatch('[a-f0-9]{32}',aid):continue
              st,j=cfapi('GET','/accounts/'+aid+'/pages/projects/hive-alveare')
              if st==200 and j.get('success') is True and (j.get('result') or {}).get('name')=='hive-alveare':
                  matches.append((aid,j['result']))
          need(len(matches)==1,'CF_PAGES_PROJECT_AMBIGUOUS')
          acc,project=matches[0]
          path='/accounts/'+acc+'/pages/projects/hive-alveare'
          def read():
              st,info=cfapi('GET',path)
              need(st==200 and info.get('success') is True,'CF_PAGES_CONFIG_READ_FAILED')
              return info['result']
          source=project.get('source') or {}
          sc=source.get('config') or {}
          config=project.get('build_config') or {}
          need(source.get('type')=='github' and sc.get('repo_name')=='hive-alveare' and sc.get('production_branch')=='main','CF_PAGES_SOURCE_IDENTITY_DRIFT')
          need(config.get('root_dir')=='cloudflare' and config.get('destination_dir')=='public','CF_PAGES_SOURCE_BUILD_ROOT_MISMATCH')
          original_command=config.get('build_command')
          need(original_command in ('',None),'CF_BUILD_COMMAND_NOT_AT_EXPECTED_BASELINE')
          production=((project.get('deployment_configs') or {}).get('production') or {})
          preview=((project.get('deployment_configs') or {}).get('preview') or {})
          need('HIVE_DATA_API_URL' not in (preview.get('env_vars') or {}),'CF_PREVIEW_BINDING_NOT_EMPTY')
          need('HIVE_DATA_API_URL' in (production.get('env_vars') or {}),'CF_PRODUCTION_NEON_BINDING_MISSING')
          original_prod=json.dumps(production,sort_keys=True)
          original_build=json.dumps(config,sort_keys=True)
          original_preview=json.dumps(preview,sort_keys=True)
          def patch(command,preview_binding=None):
              payload={}
              if command is not Ellipsis:payload['build_config']={'build_command':command}
              if preview_binding is not Ellipsis:payload['deployment_configs']={'preview':{'env_vars':{'HIVE_DATA_API_URL':preview_binding}}}
              st,doc=cfapi('PATCH',path,payload)
              need(st in (200,201,202) and doc.get('success') is True,'CF_PAGES_MUTATION_DENIED_'+str(st))
          def check(expected_command,expected_url,full=False):
              v=read()
              b=v.get('build_config') or {}
              need(b.get('build_command')==expected_command,'CF_GLOBAL_BUILD_COMMAND_READBACK_DRIFT')
              bb=dict(b);bb.pop('build_command',None)
              ob=dict(config);ob.pop('build_command',None)
              need(json.dumps(bb,sort_keys=True)==json.dumps(ob,sort_keys=True),'CF_OTHER_BUILD_CONFIG_FIELDS_CHANGED')
              d=v.get('deployment_configs') or {}
              need(json.dumps(d.get('production') or {},sort_keys=True)==original_prod,'CF_PROD_ENV_CHANGED')
              cur=d.get('preview') or {}
              pv=(cur.get('env_vars') or {}).get('HIVE_DATA_API_URL')
              if expected_url:need(isinstance(pv,dict) and pv.get('type')=='plain_text' and pv.get('value')==expected_url,'CF_PREVIEW_NEON_URL_NOT_BOUND')
              else:need(pv is None,'CF_PREVIEW_NEON_NOT_REMOVED')
              if full:
                  cb=dict(cur);cb.pop('env_vars',None)
                  bp=dict(preview);bp.pop('env_vars',None)
                  need(json.dumps(cb,sort_keys=True)==json.dumps(bp,sort_keys=True),'CF_PREVIEW_OTHER_CONFIG_FIELDS_DRIFT')
              return v
          def probe(origin,ep,authorized):
              with tempfile.TemporaryDirectory() as d:
                  cmd=['curl','-sS','--max-time','25','-o',d+'/body','-w','%{http_code}','-H','Accept: application/json']
                  if authorized:cmd+=['-H','Cf-Access-Client-Id: '+os.environ['CF_ACCESS_CLIENT_ID'],'-H','Cf-Access-Client-Secret: '+os.environ['CF_ACCESS_CLIENT_SECRET']]
                  cmd+=[origin+'/api/'+ep]
                  p=subprocess.run(cmd,text=True,capture_output=True,timeout=30)
                  if p.returncode:return 0,{}
                  try:code=int(p.stdout.strip())
                  except:return 0,{}
                  try:body=json.load(open(d+'/body'))
                  except:body={}
                  return code,body
          modified=False
          deployed=False
          sha=None
          try:
              # Mark rollback as needed before the first request; lost API response is not an excuse to leave configuration changed.
              modified=True
              patch(CMD,{'type':'plain_text','value':url})
              check(CMD,url,True)
              print('S9_OWNER_APPROVED_TEMP_GLOBAL_BUILD_APPLIED=PASS')
              print('S9_OWNER_APPROVED_DEDICATED_NEON_PREVIEW_ONLY=PASS')
              # Trigger the existing Git-connected pipeline via one new Markdown file on PR90 draft.
              file='/contents/ops/queen/s9/S9_GIT_PAGES_OWNER_BUILD_PROBE_20261112.md'
              content='# S9.2 temporary Git-connected Cloudflare build verification\n\nSource base: '+old+'\nPreview-only; zero production release; rollback required.\n'
              payload={'message':'S9-OWNER-ONCE: test legacy Pages build command with rollback; PR90 draft only',
                'content':base64.b64encode(content.encode()).decode(),'branch':branch}
              st,out=call(GH,file,os.environ['GH_TOKEN'],'PUT',payload)
              need(st==201 and isinstance(out,dict),'GITHUB_OWNER_PREVIEW_COMMIT_DENIED_'+str(st))
              sha=(out.get('commit') or {}).get('sha')
              need(isinstance(sha,str) and re.fullmatch('[a-f0-9]{40}',sha),'GITHUB_PREVIEW_SHA_INVALID')
              print('S9_OWNER_TEMP_PREVIEW_COMMIT_SHA='+sha)
              # Await exact source SHA, not an unrelated prior Pages deployment.
              deployment=None
              for attempt in range(40):
                  st,res=cfapi('GET',path+'/deployments?env=preview&per_page=25&page=1')
                  need(st==200 and res.get('success') is True,'CF_PAGES_DEPLOYMENTS_UNREADABLE')
                  matches=[]
                  for d in res.get('result') or []:
                      meta=((d.get('deployment_trigger') or {}).get('metadata') or {})
                      if(meta.get('commit_hash')==sha and meta.get('branch')==branch and
                         d.get('environment')=='preview' and (d.get('source') or {}).get('type')=='github'):
                          matches.append(d)
                  if matches:
                      need(len(matches)==1,'GIT_PREVIEW_DEPLOYMENT_AMBIGUOUS')
                      d=matches[0]
                      status=(d.get('latest_stage') or {}).get('status')
                      if status=='success':deployment=d;break
                      if status in ('failure','canceled'):
                          raise RuntimeError('CF_GIT_PAGES_EXACT_DEPLOYMENT_FAILED_'+str((d.get('latest_stage') or {}).get('name')))
                  time.sleep(6)
              need(deployment is not None,'GIT_CONNECTED_EXACT_SHA_TIMEOUT')
              deployed=True
              print('S9_OWNER_GIT_CONNECTED_PREVIEW_DEPLOYMENT_ID='+str(deployment.get('id')))
              host='https://'+str(deployment['id'])[:8]+'.hive-alveare.pages.dev'
              code,_=probe(host,'runtime-health',False)
              print('S9_OWNER_GIT_PREVIEW_ANONYMOUS_HTTP='+str(code))
              need(code in (301,302,403),'GIT_PREVIEW_ANONYMOUS_BYPASS')
              for ep in ('queen-s7-e2e','runtime-health','queen-state'):
                  passed=False
                  for n in range(5):
                      code,body=probe(host,ep,True)
                      if code==200 and isinstance(body,dict) and body.get('ok') is True:passed=True;break
                      time.sleep(6)
                  print('S9_OWNER_GIT_PREVIEW_'+ep.upper().replace('-','_')+'_HTTP='+str(code))
                  need(passed,'GIT_PREVIEW_AUTHENTICATED_'+ep+'_FAILED')
              code,body=probe('https://hive-alveare.pages.dev','runtime-health',True)
              print('S9_OWNER_PROD_RUNTIME_HEALTH_HTTP='+str(code))
              need(code==200 and body.get('ok') is True,'PRODUCTION_HEALTH_DRIFT')
              check(CMD,url,True)
              print('S9_2_OWNER_GIT_CONNECTED_PROTECTED_NEON_LIVE_PREVIEW=PASS')
          finally:
              if modified:
                  # Always restore both fields, even if the preceding PATCH request was received but its response was lost.
                  restore_errors=[]
                  try:
                      patch(original_command,None)
                  except Exception as e:
                      restore_errors.append('PATCH_'+type(e).__name__)
                  try:
                      check(original_command,None,True)
                      print('S9_OWNER_GLOBAL_BUILD_AND_PREVIEW_DB_BINDING_ROLLBACK=VERIFIED')
                  except Exception:
                      # Retry the idempotent rollback once if the first restore was delayed.
                      try:
                          patch(original_command,None)
                          check(original_command,None,True)
                          print('S9_OWNER_GLOBAL_BUILD_AND_PREVIEW_DB_BINDING_ROLLBACK=VERIFIED_RETRY')
                      except Exception as e:
                          raise RuntimeError('CRITICAL_CF_BUILD_OR_DB_ROLLBACK_FAILED') from e
              print('S9_OWNER_TEMP_GIT_PAGES_WORKFLOW_RESTORED_OR_NO_MUTATION=PASS')
          if deployed: print('S9_OWNER_TEMP_GIT_PAGES_PREVIEW_COMPLETE_NO_PROD_DEPLOY=PASS')
          PY
