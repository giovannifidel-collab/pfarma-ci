name: GIOCHEM Validation V3.1 AMPC Score Debias

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'giochem-v31-debias-ref.txt'
      - '.github/workflows/giochem-validation-v31-ampc-score-debias.yml'

permissions:
  contents: read
  actions: read

jobs:
  reanalyse:
    name: V3.1 label-blind score debias on development-only AMPC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pfarma-ci-trusted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve immutable private source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < giochem-v31-debias-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve private source token
        shell: bash
        env:
          GIOCHEM_TOKEN: ${{ secrets.GIOCHEM_SOURCE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          token="${GIOCHEM_TOKEN:-${FALLBACK_TOKEN:-}}"
          test -n "$token" || exit 1
          echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/giochem
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Download the exact 12 V3 AMPC development shards
        uses: actions/download-artifact@v4
        with:
          run-id: 31806440155
          github-token: ${{ github.token }}
          pattern: giochem-v3-ampc-dev-shard-*
          path: /tmp/v31-source-shards
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install metric stack only
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy scikit-learn

      - name: Verify protocol frozen before derived outcomes
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status == "FROZEN_BEFORE_V31_DEBIAS_OUTCOMES" and .dataset.sourceRun == 31806440155 and .phase1ExitGate.selectedCandidateRocAucMinimum == 0.58 and .phase1ExitGate.selectedCandidateEf5Minimum == 1.25 and (.candidateRankers | length) == 5' validation/v3/development_protocol_v31_score_debias.json

      - name: Evaluate frozen label-blind transformations
        id: evaluate
        working-directory: private-source
        shell: bash
        run: |
          set +e
          python scripts/validation_v31_ampc_score_debias.py \
            --input-dir /tmp/v31-source-shards \
            --output /tmp/giochem-v31-ampc-score-debias.json
          code=$?
          set -e
          test -s /tmp/giochem-v31-ampc-score-debias.json || exit 1
          echo "scientific_exit=$code" >> "$GITHUB_OUTPUT"
          # 0 = scientific phase PASS, 5 = valid scientific phase FAIL.
          test "$code" -eq 0 -o "$code" -eq 5

      - name: Enforce holdout has not been consumed
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.source.externalHoldoutConsumed == false and .source.newDockingPerformed == false and .scientificRole == "METHOD_DEVELOPMENT_ONLY_NOT_VALIDATION"' /tmp/giochem-v31-ampc-score-debias.json

      - name: Upload V3.1 development report
        uses: actions/upload-artifact@v4
        with:
          name: giochem-v31-ampc-score-debias-report
          path: /tmp/giochem-v31-ampc-score-debias.json
          if-no-files-found: error
          retention-days: 90

      - name: Scientific summary
        shell: bash
        run: |
          {
            echo '## GIOCHEM V3.1 — AMPC score-debias development'
            echo "- source SHA: ${{ steps.source.outputs.sha }}"
            echo '- new docking: NO'
            echo '- LIT-PCBA consumed: NO'
            echo "- selected: $(jq -r '.selection.selected' /tmp/giochem-v31-ampc-score-debias.json)"
            echo "- AUC: $(jq -r '.candidates[.selection.selected].rocAuc' /tmp/giochem-v31-ampc-score-debias.json)"
            echo "- EF5: $(jq -r '.candidates[.selection.selected].ef5.enrichmentFactor' /tmp/giochem-v31-ampc-score-debias.json)"
            echo "- phase1 gate: $(jq -r '.status' /tmp/giochem-v31-ampc-score-debias.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        run: rm -rf private-source /tmp/v31-source-shards
