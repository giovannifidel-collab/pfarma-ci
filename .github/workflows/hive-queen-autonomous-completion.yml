name: HIVE Queen V1 Autonomous Completion

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/hive-queen-autonomous-completion.yml'

permissions:
  contents: read

concurrency:
  group: hive-queen-v1-autonomous-completion
  cancel-in-progress: false

jobs:
  complete:
    name: Drive Queen V1 to fresh-live terminal proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: pfarma-ci-trusted
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
      PUBLIC_REPO: giovannifidel-collab/pfarma-ci
      PRIVATE_REPO: giovannifidel-collab/hive-alveare
      ADAPTER_BRANCH: hive-cloud-computer-v0
    steps:
      - name: Validate controller authorization
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'PFARMA_SOURCE_TOKEN missing'; exit 2; }
          gh api "repos/$PUBLIC_REPO" --jq '.full_name' >/dev/null
          gh api "repos/$PRIVATE_REPO" --jq '.full_name' >/dev/null
          echo 'AUTONOMOUS_CONTROLLER_AUTH=READY'

      - name: Inspect authoritative V1 completion state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          read_json(){
            local path="$1"
            gh api "repos/$PRIVATE_REPO/contents/$path?ref=main" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true
          }
          PROOF="$(read_json ops/queen/agents/PROOF_LOCK.json)"
          REGISTRY="$(read_json ops/queen/runtime/AGENT_REGISTRY.json)"
          RUNTIME="$(read_json ops/queen/runtime/RUNTIME_SYNC_LOCK.json)"
          POLICY="$(read_json ops/queen/agents/V1_RELEASE_POLICY.json)"

          full_ready=false
          if [[ -n "$PROOF" && -n "$REGISTRY" && -n "$RUNTIME" && -n "$POLICY" ]] &&              jq -e '.status=="HIVE_INTEGRATED_DEGRADED" and .managed_agent_count==8 and .slot_count==10 and .deferred_agent_count==2 and (.deferred_agent_ids|sort)==["kimi","meta"] and .strict_10_of_10_gate_preserved==true and .proof_level=="fresh-live" and .fresh_live_gate==true and .live_refresh_pending==false and .v1_release_target==8' <<<"$PROOF" >/dev/null 2>&1 &&              jq -e '(.agents|length)==10 and ([.agents[]|select(.enrollment=="managed" and .certified==true and .enabled==true)]|length)==8 and ([.agents[]|select(.enrollment=="deferred" and .enabled==false and .certified==false)|.id]|sort)==["kimi","meta"]' <<<"$REGISTRY" >/dev/null 2>&1 &&              jq -e '.status=="HIVE_RUNTIME_SYNCED_DEGRADED" and .managed_agent_count==8 and .slot_count==10 and .deferred_agent_count==2 and (.deferred_agent_ids|sort)==["kimi","meta"] and .strict_10_of_10_gate_preserved==true and .proof_level=="fresh-live" and .fresh_live_gate==true and .live_refresh_pending==false and .v1_release_target==8' <<<"$RUNTIME" >/dev/null 2>&1 &&              jq -e '.release=="HIVE_QUEEN_V1" and .release_target.managed_required==8 and .status=="CLOSED" and .fresh_live_proof=="8/8" and .runtime_sync=="PASS" and .queen_operational==true' <<<"$POLICY" >/dev/null 2>&1; then
            full_ready=true
          fi
          echo "full_ready=$full_ready" >> "$GITHUB_OUTPUT"
          echo "HIVE_QUEEN_V1_READY=$full_ready"

      - name: Terminal success already sealed
        if: steps.state.outputs.full_ready == 'true'
        run: |
          echo 'HIVE_QUEEN_V1=CLOSED'
          echo 'MANAGED_AGENTS=8/8_V1'
          echo 'DEFERRED_AGENTS=kimi,meta'
          echo 'FRESH_LIVE_PROOF=8/8'
          echo 'QUEEN_OPERATIONAL=true'
          echo 'AUTONOMOUS_COMPLETION=ALREADY_DONE'

      - name: Resolve exact source commits
        id: refs
        if: steps.state.outputs.full_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER_SHA="$(gh api "repos/$PUBLIC_REPO/branches/$ADAPTER_BRANCH" --jq '.commit.sha')"
          PRIVATE_SHA="$(gh api "repos/$PRIVATE_REPO/branches/main" --jq '.commit.sha')"
          [[ "$ADAPTER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "adapter_sha=$ADAPTER_SHA" >> "$GITHUB_OUTPUT"
          echo "private_sha=$PRIVATE_SHA" >> "$GITHUB_OUTPUT"
          echo "ADAPTER_SHA=$ADAPTER_SHA"
          echo "HIVE_PRIVATE_SHA=$PRIVATE_SHA"

      - name: Reuse any active Queen public runner
        id: active
        if: steps.state.outputs.full_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list -R "$PUBLIC_REPO" --workflow hive-queen-public-runner.yml --limit 20 --json databaseId,status --jq '[.[]|select(.status=="queued" or .status=="in_progress" or .status=="waiting")][0].databaseId // empty')"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [[ -n "$RUN_ID" ]]; then echo "ACTIVE_QUEEN_PUBLIC_RUNNER=$RUN_ID"; else echo 'ACTIVE_QUEEN_PUBLIC_RUNNER=NONE'; fi

      - name: Dispatch exactly one Queen public runner
        id: dispatch
        if: steps.state.outputs.full_ready != 'true' && steps.active.outputs.run_id == ''
        shell: bash
        run: |
          set -euo pipefail
          PREV="$(gh run list -R "$PUBLIC_REPO" --workflow hive-queen-public-runner.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run hive-queen-public-runner.yml -R "$PUBLIC_REPO" --ref main             -f "adapter_sha=${{ steps.refs.outputs.adapter_sha }}"             -f "hive_private_sha=${{ steps.refs.outputs.private_sha }}"             -f "bridge_url=https://desktop-4tapaao.tail46e861.ts.net"
          RUN_ID=''
          for _ in {1..30}; do
            CANDIDATE="$(gh run list -R "$PUBLIC_REPO" --workflow hive-queen-public-runner.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$CANDIDATE" != "$PREV" && "$CANDIDATE" != '0' ]]; then RUN_ID="$CANDIDATE"; break; fi
            sleep 2
          done
          [[ -n "$RUN_ID" ]] || { echo 'QUEEN_RUN_IDENTIFICATION_FAILED'; exit 5; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "QUEEN_PUBLIC_RUNNER_DISPATCHED=$RUN_ID"

      - name: Wait for Queen public runner terminal result
        if: steps.state.outputs.full_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.active.outputs.run_id }}"
          [[ -n "$RUN_ID" ]] || RUN_ID="${{ steps.dispatch.outputs.run_id }}"
          [[ -n "$RUN_ID" ]] || { echo 'QUEEN_RUN_ID_MISSING'; exit 6; }
          gh run watch "$RUN_ID" -R "$PUBLIC_REPO" --exit-status

      - name: Verify terminal fresh-live Queen proof
        if: steps.state.outputs.full_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          read_json(){
            local path="$1"
            gh api "repos/$PRIVATE_REPO/contents/$path?ref=main" --jq '.content' | tr -d '\n' | base64 -d
          }
          PROOF="$(read_json ops/queen/agents/PROOF_LOCK.json)"
          REGISTRY="$(read_json ops/queen/runtime/AGENT_REGISTRY.json)"
          RUNTIME="$(read_json ops/queen/runtime/RUNTIME_SYNC_LOCK.json)"
          POLICY="$(read_json ops/queen/agents/V1_RELEASE_POLICY.json)"

          jq -e '.status=="HIVE_INTEGRATED_DEGRADED" and .managed_agent_count==8 and .slot_count==10 and .deferred_agent_count==2 and (.deferred_agent_ids|sort)==["kimi","meta"] and .strict_10_of_10_gate_preserved==true and .proof_level=="fresh-live" and .fresh_live_gate==true and .live_refresh_pending==false and .v1_release_target==8' <<<"$PROOF" >/dev/null
          jq -e '(.agents|length)==10 and ([.agents[]|select(.enrollment=="managed" and .certified==true and .enabled==true)]|length)==8 and ([.agents[]|select(.enrollment=="deferred" and .enabled==false and .certified==false)|.id]|sort)==["kimi","meta"]' <<<"$REGISTRY" >/dev/null
          jq -e '.status=="HIVE_RUNTIME_SYNCED_DEGRADED" and .managed_agent_count==8 and .slot_count==10 and .deferred_agent_count==2 and (.deferred_agent_ids|sort)==["kimi","meta"] and .strict_10_of_10_gate_preserved==true and .proof_level=="fresh-live" and .fresh_live_gate==true and .live_refresh_pending==false and .v1_release_target==8' <<<"$RUNTIME" >/dev/null
          jq -e '.release=="HIVE_QUEEN_V1" and .release_target.managed_required==8 and .status=="CLOSED" and .fresh_live_proof=="8/8" and .runtime_sync=="PASS" and .queen_operational==true' <<<"$POLICY" >/dev/null

          echo 'HIVE_QUEEN_V1=CLOSED'
          echo 'MANAGED_AGENTS=8/8_V1'
          echo 'DEFERRED_AGENTS=kimi,meta'
          echo 'FRESH_LIVE_PROOF=8/8'
          echo 'RUNTIME_DATA_PLANE_SYNC=PASS'
          echo 'QUEEN_OPERATIONAL=true'
