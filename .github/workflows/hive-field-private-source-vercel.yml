name: HIVE FIELD Private Source Vercel Deploy

on:
  push:
    branches: [main]
    paths:
      - 'hive-field-source-ref.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hive-field-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: pfarma-ci-trusted
    steps:
      - name: Check out public CI transport
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact HIVE FIELD source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < hive-field-source-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid HIVE FIELD source SHA.' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require private-source token
        shell: bash
        env:
          TOKEN_A: ${{ secrets.HIVE_FIELD_SOURCE_TOKEN }}
          TOKEN_B: ${{ secrets.HIVE_SOURCE_TOKEN }}
          TOKEN_C: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          token="${TOKEN_A:-${TOKEN_B:-${TOKEN_C:-}}}"
          test -n "$token" || { echo 'HIVE_FIELD_SOURCE_TOKEN_MISSING' >&2; exit 78; }
          echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Check out exact private HIVE FIELD commit
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-field
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact private commit
        shell: bash
        run: test "$(git -C private-source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: HIVE FIELD source checks
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: HIVE FIELD canonical production build
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm test
          test -s dist/index.html
          test -s dist/health.json
          test -s dist/hf-runtime-v912.js
          cmp -s src/runtime-v9.12.base.js dist/hf-runtime-v912.js
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          node - <<'NODE'
          const h=require('./dist/health.json');
          const required=[
            'canonicalLocalSource','canonicalRuntimeSource','runtimeBundleConsolidated','oldPatchScriptTagsRemoved',
            'domObserverHub','homePresentNowDirectRouteFix','homeStatsClearStaleContactFilters',
            'contactsSearchDebounced','dueFilterPrecomputed','contactSortMemoized',
            'cloudSaveReturnsPromise','cloudSaveRetries','cloudPendingRecovery','cloudPendingSurvivesReload',
            'visitSaveAwaitsCloud','visitRetryIdempotent','visitLocalDuplicateGuard',
            'legacyLocalVisitRecovery','legacyLocalRecoveryNewerThanCloudOnly','legacyLocalRecoveryDeduplicatesById',
            'allVisitEntryPointsUnified','contactVisitUsesUnifiedEngine','statusSeenUsesUnifiedEngine',
            'historyVisitUsesUnifiedEngine','doctorInlineVisitUsesUnifiedEngine','doctorFormMobileLayoutFixed',
            'doctorScheduleRootCorrect','doctorInlineVisitUsable','visitStatsDrillDown','structuralPreflight'
          ];
          if(h.version!=='v9.12.0-20261008')process.exit(1);
          for(const k of required)if(h[k]!==true){console.error('Missing health flag',k,h[k]);process.exit(1)}
          if(h.productionFetchBuildDependency!==false)process.exit(1);
          if(Number(h.scriptTagCount)>4||Number(h.inlineScriptBytes)>70000)process.exit(1);
          NODE
          grep -q 'id="hf-runtime-v912"' dist/index.html
          ! grep -q 'id="hf-field-patch-v91119"' dist/index.html
          ! grep -q 'id="hf-field-patch-v91118"' dist/index.html
          ! grep -q 'hfFieldPatchV91121' dist/index.html

      - name: Verify live baseline is still v9.11.20
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://hive-field-v8.vercel.app/health.json?predeploy=${GITHUB_RUN_ID}" -o /tmp/pre-health.json
          node -e "const h=require('/tmp/pre-health.json'); if(h.version!=='v9.11.20-20261005'||!h.cloudPendingRecovery||!h.visitSaveAwaitsCloud) process.exit(1)"

      - name: Require Vercel deploy token
        shell: bash
        env:
          TOKEN_A: ${{ secrets.HIVE_FIELD_VERCEL_TOKEN }}
          TOKEN_B: ${{ secrets.VERCEL_TOKEN }}
          TOKEN_C: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          token="${TOKEN_A:-${TOKEN_B:-${TOKEN_C:-}}}"
          test -n "$token" || { echo 'HIVE_FIELD_VERCEL_TOKEN_MISSING' >&2; exit 78; }
          echo "VERCEL_DEPLOY_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Link exact Vercel project
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_5NxsW979cwrtjUVw3DBBlqhk","projectId":"prj_mMm949u81TrcbXwBRMoCPeQxID6v"}' > .vercel/project.json

      - name: Single production deployment
        id: vercel
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_DEPLOY_TOKEN")"
          printf 'deployment_url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf 'Deployment URL: %s\n' "$url"

      - name: Verify production alias and v9.12 health
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            if curl -fsSL "https://hive-field-v8.vercel.app/health.json?verify=${GITHUB_RUN_ID}-$i" -o /tmp/hive-field-health.json; then
              if node - <<'NODE'
              const h=require('/tmp/hive-field-health.json');
              const required=[
                'canonicalLocalSource','canonicalRuntimeSource','runtimeBundleConsolidated','oldPatchScriptTagsRemoved',
                'domObserverHub','homePresentNowDirectRouteFix','homeStatsClearStaleContactFilters',
                'contactsSearchDebounced','dueFilterPrecomputed','contactSortMemoized',
                'cloudSaveReturnsPromise','cloudSaveRetries','cloudPendingRecovery','cloudPendingSurvivesReload',
                'visitSaveAwaitsCloud','visitRetryIdempotent','visitLocalDuplicateGuard',
                'legacyLocalVisitRecovery','legacyLocalRecoveryNewerThanCloudOnly','legacyLocalRecoveryDeduplicatesById',
                'allVisitEntryPointsUnified','contactVisitUsesUnifiedEngine','statusSeenUsesUnifiedEngine',
                'historyVisitUsesUnifiedEngine','doctorInlineVisitUsesUnifiedEngine','doctorFormMobileLayoutFixed',
                'doctorScheduleRootCorrect','doctorInlineVisitUsable','visitStatsDrillDown','structuralPreflight'
              ];
              if(h.version!=='v9.12.0-20261008')process.exit(1);
              for(const k of required)if(h[k]!==true)process.exit(1);
              if(h.productionFetchBuildDependency!==false)process.exit(1);
              if(Number(h.scriptTagCount)>4||Number(h.inlineScriptBytes)>70000)process.exit(1);
              NODE
              then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = 1 || { echo 'Production alias did not reach verified v9.12.0.' >&2; exit 1; }

          asset_ok=0
          for i in $(seq 1 12); do
            if curl -fsSL "https://hive-field-v8.vercel.app/hf-runtime-v912.js?v=9.12.0&verify=${GITHUB_RUN_ID}-$i" -o /tmp/hf-runtime-v912.js; then
              if cmp -s src/runtime-v9.12.base.js /tmp/hf-runtime-v912.js; then
                asset_ok=1
                break
              fi
            fi
            sleep 2
          done
          test "$asset_ok" = 1 || { echo 'v9.12 runtime asset did not propagate byte-for-byte.' >&2; exit 1; }

          page_ok=0
          for i in $(seq 1 12); do
            if curl -fsSL "https://hive-field-v8.vercel.app/?verify-runtime=${GITHUB_RUN_ID}-$i" -o /tmp/hf-page.html; then
              if node - <<'NODE'
              const fs=require('fs'),s=fs.readFileSync('/tmp/hf-page.html','utf8');
              if((s.match(/<script\b/gi)||[]).length>4)process.exit(1);
              if((s.match(/id="hf-runtime-v912"/g)||[]).length!==1)process.exit(1);
              if(/id="hf-field-patch-v911(?:0|5|6|8|9|10|11|12|13|18|19)"/.test(s))process.exit(1);
              NODE
              then
                page_ok=1
                break
              fi
            fi
            sleep 2
          done
          test "$page_ok" = 1 || { echo 'Production page did not expose consolidated v9.12 runtime.' >&2; exit 1; }

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## HIVE FIELD v9.12.0 production'
            echo '- private source: giovannifidel-collab/hive-field'
            echo "- exact SHA: ${{ steps.source.outputs.sha }}"
            echo '- Vercel project: hive-field-v8'
            echo '- production alias verified: https://hive-field-v8.vercel.app'
            echo '- health verified: v9.12.0-20261008'
            echo '- canonical local build: verified'
            echo '- consolidated runtime: verified byte-for-byte'
            echo '- Presenti adesso stale-filter bug fixed in core routing'
            echo '- observer hub / search debounce / filter+sort optimization verified'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private source checkout
        if: always()
        shell: bash
        run: rm -rf private-source
