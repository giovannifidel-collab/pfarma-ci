name: PFarma Accounting Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pfarma-accounting-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: pfarma-ci-trusted
    steps:
      - name: Diagnose exact accounting candidate quietly
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          sha='69a929cc875dac890d9e4e7b6aa3df456efc2acd'
          test -n "$SOURCE_TOKEN"
          mkdir source && cd source
          git init -q
          git remote add origin https://github.com/giovannifidel-collab/pfarma-cloud.git
          auth="$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$sha"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$sha"
          set +e
          python tests/test_razzo_accounting_staging_regression.py > ../accounting.log 2>&1
          status=$?
          set -e
          echo '===== ACCOUNTING DIAGNOSTIC ====='
          cat ../accounting.log
          echo '===== END DIAGNOSTIC ====='
          exit "$status"
