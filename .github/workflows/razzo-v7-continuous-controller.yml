name: RAZZO V7 Continuous Controller

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/razzo-v7-continuous-controller.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: razzo-v7-continuous-controller
  cancel-in-progress: true

jobs:
  frozen:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm production freeze
        run: |
          echo "RAZZO_V7_AUTOMATIC_PRODUCTION_FROZEN"
          echo "Manual validation is required before any further execute-trial dispatch."
