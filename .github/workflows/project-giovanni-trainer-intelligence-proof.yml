name: Project Giovanni · Trainer Intelligence Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-giovanni-trainer-intelligence-proof.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: photo-ai-private
    steps:
      - name: Resolve private source token
        shell: bash
        env:
          GIO_TOKEN: ${{ secrets.PROJECT_GIOVANNI_SOURCE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          token="${GIO_TOKEN:-${FALLBACK_TOKEN:-}}"
          test -n "$token"
          echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Checkout current Project Giovanni
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: main
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project
        run: npm ci

      - name: TypeScript compile proof
        run: npx tsc --noEmit

      - name: Decision matrix proof
        shell: bash
        run: |
          cat > /tmp/trainer-proof.ts <<'TS'
          import assert from 'node:assert/strict';
          import { buildTrainerIntelligence } from './lib/trainerIntelligence.ts';
          import type { GeneratedWorkoutPlan } from './lib/workoutGenerator.ts';
          import type { WorkoutFeedback } from './lib/workoutHistory.ts';

          const reps = (sets:number,min:number,max:number) => ({ mode:'reps' as const, sets, repsMin:min, repsMax:max, reserveReps:2 });
          const plan: GeneratedWorkoutPlan = {
            summary:'fixture', rationale:['fixture'], safetyNote:'fixture',
            days:[{ day:1, title:'Upper', durationMinutes:30, emphasis:'Spinta', warmupMinutes:4, exercises:[
              { name:'Rematore con elastico sotto i piedi', prescription:'4 x 10-15', restSeconds:50, focus:'Tirata', target:reps(4,10,15), requires:['elastici_senza_fissaggio'] },
              { name:'Estensione tricipiti sopra la testa con elastico sotto i piedi', prescription:'2 x 10-15', restSeconds:35, focus:'Spinta', target:reps(2,10,15), requires:['elastici_senza_fissaggio'] },
              { name:'Alzate laterali con elastico sotto i piedi', prescription:'3 x 12-15', restSeconds:35, focus:'Spinta', target:reps(3,12,15), requires:['elastici_senza_fissaggio'] },
            ] }]
          };
          const make = (id:string, completedAt:string, values:{row:number[],tri:number[],lat:number[]}, rpe=7, recovery=4, pain=false): WorkoutFeedback => ({
            id, completedAt, sessionLabel:'Upper', plannedSets:9, completedSets:9, perceivedEffort:rpe, completed:true, painOrAbnormalSymptoms:pain, recoveryAfter:recovery,
            setRecords:[
              ...values.row.map((value,setIndex)=>({exerciseIndex:0,setIndex,exerciseName:'Rematore con elastico sotto i piedi',mode:'reps' as const,value,completedAt})),
              ...values.tri.map((value,setIndex)=>({exerciseIndex:1,setIndex,exerciseName:'Estensione tricipiti sopra la testa con elastico sotto i piedi',mode:'reps' as const,value,completedAt})),
              ...values.lat.map((value,setIndex)=>({exerciseIndex:2,setIndex,exerciseName:'Alzate laterali con elastico sotto i piedi',mode:'reps' as const,value,completedAt})),
            ],
            loadRecords:[
              ...values.row.map((_,setIndex)=>({sessionId:id,exerciseIndex:0,setIndex,exerciseName:'Rematore con elastico sotto i piedi',kind:'band' as const,bandLabel:'medio',rir:2,updatedAt:completedAt})),
              ...values.tri.map((_,setIndex)=>({sessionId:id,exerciseIndex:1,setIndex,exerciseName:'Estensione tricipiti sopra la testa con elastico sotto i piedi',kind:'band' as const,bandLabel:'medio',rir:2,updatedAt:completedAt})),
              ...values.lat.map((_,setIndex)=>({sessionId:id,exerciseIndex:2,setIndex,exerciseName:'Alzate laterali con elastico sotto i piedi',kind:'band' as const,bandLabel:'medio',rir:2,updatedAt:completedAt})),
            ]
          });
          const older = make('older','2026-08-08T10:00:00.000Z',{row:[17,17,16],tri:[15,15],lat:[15,15,16]},7,4);
          const latest = make('latest','2026-08-10T10:00:00.000Z',{row:[20,20,19],tri:[17,17],lat:[14,14,15]},6,4);
          const duplicate = { ...latest, id:'latest-duplicate' };
          const result = buildTrainerIntelligence(plan,[duplicate,latest,older],{goal:'ricomposizione',priorities:'spalle, dorsali, braccia'});
          const byName = Object.fromEntries(result.exercises.map(item => [item.exerciseName,item]));
          assert.equal(result.globalDecision,'targeted_progression');
          assert.equal(result.duplicatesRemoved,1);
          assert.equal(byName['Rematore con elastico sotto i piedi'].decision,'progress_load');
          assert.equal(byName['Estensione tricipiti sopra la testa con elastico sotto i piedi'].decision,'progress_load');
          assert.equal(byName['Alzate laterali con elastico sotto i piedi'].decision,'increase_rest');
          assert.equal(result.automaticPlanChange,false);

          const painful = make('pain','2026-08-11T10:00:00.000Z',{row:[18,18,18],tri:[15,15],lat:[14,14,14]},8,2,true);
          const safety = buildTrainerIntelligence(plan,[painful,latest,older]);
          assert.equal(safety.globalDecision,'recovery_first');
          assert.ok(safety.exercises.every(item => item.decision === 'review'));
          console.log('TRAINER_INTELLIGENCE_PROOF=PASS');
          console.log(`DECISIONS=${result.exercises.map(item=>`${item.exerciseName}:${item.decision}`).join(' | ')}`);
          console.log(`DEDUP_REMOVED=${result.duplicatesRemoved}`);
          console.log(`SAFETY=${safety.globalDecision}`);
          TS
          npx --yes tsx@4 /tmp/trainer-proof.ts
