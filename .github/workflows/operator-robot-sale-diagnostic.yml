name: PFarma Operator Robot Sale Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/operator-robot-sale-diagnostic.yml'
      - 'razzo/pfarma-ref.txt'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    strategy:
      fail-fast: false
      matrix:
        check: ['remove-http','remove-confirmation','remove-preserve','remove-absent','correction-label','correction-href','correction-http']
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < razzo/pfarma-ref.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/pfarma-cloud
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          path: pfarma-cloud
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check sale invariant
        working-directory: pfarma-cloud
        env:
          PFARMA_FEEDBACK_GITHUB_SYNC: '0'
          CHECK: ${{ matrix.check }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import os, re
          from tools.preview_pfarma_feedback import build_feedback_preview
          from tools.pfarma_operator_robot import PFarmaOperatorRobot
          app, _ = build_feedback_preview(); robot = PFarmaOperatorRobot(app)
          first = robot.request('/sales?product=Tachipirina'); robot.require_ok(first, 'first')
          session = robot._session_token(first.body)
          second = robot.request(f'/sales/workspace-preview?session={session}&product=Magnesio'); robot.require_ok(second, 'second')
          session = robot._session_token(second.body)
          third = robot.request(f'/sales/workspace-preview?session={session}&product=Voltaren'); robot.require_ok(third, 'third')
          remove_href = robot._remove_href(third.body, 'MAGNESIO-SUPREMO')
          removed = robot.request(remove_href)
          check = os.environ['CHECK']
          if check == 'remove-http': robot.require_ok(removed, 'remove')
          elif check == 'remove-confirmation': robot.require('Riga rimossa dalla sola sessione staging.' in removed.body, 'remove confirmation missing')
          elif check == 'remove-preserve': robot.require('Tachipirina 1000 mg' in removed.body and 'Voltaren Emulgel' in removed.body, 'other rows changed')
          elif check == 'remove-absent': robot.require('<strong>Magnesio Supremo</strong>' not in removed.body, 'Magnesio still rendered as cart row')
          elif check == 'correction-label': robot.require('Reso / correzione demo' in removed.body, 'correction label missing')
          else:
              match = re.search(r'href="([^"]*sales/correction-preview[^"]*)"', removed.body)
              if check == 'correction-href': robot.require(match is not None, 'correction href missing')
              elif check == 'correction-http':
                  robot.require(match is not None, 'correction href missing')
                  correction = robot.request(match.group(1).replace('&amp;', '&')); robot.require_ok(correction, 'correction')
          print('CHECK_OK', check)
          PY
