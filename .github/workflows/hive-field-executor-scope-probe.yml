name: HIVE Field Executor Scope Probe

on:
  workflow_dispatch:
  push:
    branches:
      - queen-universal-fabric-vnext
    paths:
      - .github/workflows/hive-field-executor-scope-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe private-repo token scope safely
        env:
          SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_TOKEN:-}" ]; then
            echo "PFARMA_SOURCE_TOKEN_PRESENT=false"
            exit 2
          fi
          echo "PFARMA_SOURCE_TOKEN_PRESENT=true"
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/giovannifidel-collab/hive-field)"
          echo "PRIVATE_REPO_HTTP=${code}"
          if [ "$code" != "200" ]; then
            exit 3
          fi
          python3 - "$body" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              d=json.load(f)
          p=d.get('permissions') or {}
          print('PRIVATE_REPO_PULL=' + str(bool(p.get('pull'))).lower())
          print('PRIVATE_REPO_PUSH=' + str(bool(p.get('push'))).lower())
          print('PRIVATE_REPO_ADMIN=' + str(bool(p.get('admin'))).lower())
          PY
