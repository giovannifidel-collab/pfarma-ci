name: Project Giovanni Preparatore · Outcome First Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-giovanni-outcome-first-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: photo-ai-private
    steps:
      - name: Resolve private source token
        shell: bash
        env:
          GIO_TOKEN: ${{ secrets.PROJECT_GIOVANNI_SOURCE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          token="${GIO_TOKEN:-${FALLBACK_TOKEN:-}}"
          test -n "$token"
          echo "PRIVATE_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: main
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove result-first behavior
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { optimizeOutcomeResult, auditOutcomeOptimization, progressionCapacity } from './scripts/preparatore-outcome-engine.mjs';
          import { normalizeSucceededResult, validateSucceededResult } from './scripts/preparatore-v2-result-contract.mjs';

          const reps=(sets,min,max,rir=2)=>({mode:'reps',sets,repsMin:min,repsMax:max,reserveReps:rir});
          const ex=(name,sets,focus,rest=35)=>({name,prescription:`${sets} x 10-15 · 2 RIR`,restSeconds:rest,focus,target:reps(sets,10,15,2),requires:['elastici']});
          const days=[
            {day:1,title:'Spinta',durationMinutes:30,emphasis:'Spinta',warmupMinutes:4,exercises:[ex('Push-up a terra',3,'Spinta',50),ex('Alzate laterali con elastico sotto i piedi',3,'Spinta'),ex('Estensione tricipiti sopra la testa con elastico sotto i piedi',2,'Spinta')],finisher:'Finisher 3 minuti: marcia veloce.'},
            {day:2,title:'Tirata',durationMinutes:30,emphasis:'Tirata',warmupMinutes:4,exercises:[ex('Rematore con elastico sotto i piedi',4,'Tirata',50),ex('Reverse fly con elastico senza ancoraggio',3,'Tirata'),ex('Curl con elastico sotto i piedi',2,'Tirata')],finisher:'Finisher 3 minuti: side step.'},
            {day:3,title:'Upper',durationMinutes:30,emphasis:'Spinta',warmupMinutes:4,exercises:[ex('Push-up inclinati',3,'Spinta',50),ex('Rematore con elastico sotto i piedi',3,'Tirata',50),ex('Curl con elastico sotto i piedi',2,'Tirata'),ex('Estensione tricipiti sopra la testa con elastico sotto i piedi',2,'Spinta')],finisher:'Finisher 3 minuti: marcia attiva.'},
            {day:4,title:'Cardio',durationMinutes:30,emphasis:'Cardio',warmupMinutes:4,exercises:[{name:'Marcia veloce sul posto',prescription:'3 x 60 s',restSeconds:30,focus:'Cardio',target:{mode:'time',sets:3,secondsMin:60,secondsMax:60},requires:[]},{name:'Glute bridge',prescription:'3 x 12-15 · 2 RIR',restSeconds:40,focus:'Gambe',target:reps(3,12,15,2),requires:[]},{name:'Hollow hold',prescription:'3 x 25 s',restSeconds:30,focus:'Core',target:{mode:'time',sets:3,secondsMin:25,secondsMax:25},requires:[]}],finisher:'Finisher 3 minuti: marcia moderata.'}
          ];
          const plan={summary:'baseline',rationale:['storico','foto','baseline'],safetyNote:'safe',days};
          const analysis={analysisConfidence:'medium',imageQuality:{front:'usable',side:'usable',back:'usable'},summary:'analisi',limitations:['foto non standardizzate'],visualFindings:[{category:'muscle_development',observation:'V-taper migliorabile',confidence:'medium',evidence:['dorsali migliorabili'],alternativeExplanations:['posa'],checkpointTrend:'not_available',trainingImplication:'priorità upper e braccia',actionStrength:'cautious_adjustment'}],bodyCompositionEstimate:{available:false,rangeMin:null,rangeMax:null,confidence:'low',basis:'non misurabile',uncertaintyFactors:['luce']},priorities:[{area:'Braccia',confidence:'high',observation:'Braccia prioritarie',trainingImplication:'Aumentare stimolo efficace'},{area:'V-taper',confidence:'medium',observation:'V-taper prioritario',trainingImplication:'Aumentare stimolo upper'},{area:'Larghezza spalle',confidence:'medium',observation:'Spalle prioritarie',trainingImplication:'Migliorare spalle'}]};
          const highTraining={aggregates:{completionRate:100,averageRpe:6.6,averageRecovery:3.8,painSessions:0,reducedOrInterruptedSessions:0,recoveryTrend:'improving',rpeTrend:'stable'},exerciseProgression:[{exerciseName:'Rematore con elastico sotto i piedi',direction:'improving',latestAverageValue:19.7,planTargetComparable:true}]};
          const raw={model:'Codex ChatGPT · GitHub Actions',persisted:false,automaticPlanChange:false,analysis,plan:structuredClone(plan)};
          const initial=normalizeSucceededResult(raw);
          const context={profile:{priorities:'V-taper spalle braccia ricomposizione'},trainingContext:highTraining,activePlanContext:{plan:normalizeSucceededResult(raw).plan}};
          assert.equal(progressionCapacity(highTraining).level,'high');
          const optimized=optimizeOutcomeResult(initial,context);
          const final=normalizeSucceededResult(optimized.result);
          const count=(rx)=>final.plan.days.flatMap(d=>d.exercises).filter(e=>rx.test(e.name.toLowerCase())).reduce((s,e)=>s+e.target.sets,0);
          assert.equal(count(/curl|bicip/),6);
          assert.equal(count(/tricip|estensione tricip/),6);
          assert.equal(final.plan.days.filter(d=>['Spinta','Tirata'].includes(d.emphasis) && d.finisher).length,0);
          assert.ok(final.plan.rationale.some(x=>/capacità di progressione alta/i.test(x)));
          assert.ok(final.plan.rationale.some(x=>/resistenza|tensione|difficoltà/i.test(x)));
          assert.equal(validateSucceededResult(final).length,0);
          const audit=auditOutcomeOptimization(context.activePlanContext.plan,final.plan,{profile:context.profile,trainingContext:highTraining,analysis:final.analysis});
          assert.equal(audit.passed,true);
          console.log('HIGH_CAPACITY_RESULT_FIRST=PASS');
          console.log(`BICEPS_SETS=${count(/curl|bicip/)}`);
          console.log(`TRICEPS_SETS=${count(/tricip|estensione tricip/)}`);
          console.log(`UPPER_FINISHERS=${audit.metrics.upperFinisherMinutes}`);

          const lowTraining={aggregates:{completionRate:82,averageRpe:8.7,averageRecovery:2.2,painSessions:1,reducedOrInterruptedSessions:2,recoveryTrend:'declining',rpeTrend:'rising'},exerciseProgression:[]};
          const lowContext={...context,trainingContext:lowTraining};
          const low=optimizeOutcomeResult(initial,lowContext);
          const lowFinal=normalizeSucceededResult(low.result);
          const lowCount=(rx)=>lowFinal.plan.days.flatMap(d=>d.exercises).filter(e=>rx.test(e.name.toLowerCase())).reduce((s,e)=>s+e.target.sets,0);
          assert.equal(progressionCapacity(lowTraining).level,'limited');
          assert.equal(lowCount(/curl|bicip/),4);
          assert.equal(lowCount(/tricip|estensione tricip/),4);
          console.log('SAFETY_CONSTRAINT_VETO=PASS');
          console.log('OUTCOME_FIRST_PROOF=PASS');
          NODE
