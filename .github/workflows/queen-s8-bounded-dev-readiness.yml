name: Queen S8 Bounded Development Readiness
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/queen-s8-bounded-dev-readiness.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/queen-s8-bounded-dev-readiness.yml']
  workflow_dispatch: {}
permissions: {contents: read}
concurrency:
  group: queen-s8-guarded-readiness
  cancel-in-progress: false
jobs:
  source-locked-negative-s8-and-s7-regression:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 10
    env:
      PRIVATE_SHA: 23aef9f2509315568e09d37cbf9554b72a7c0898
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: queen-source
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: S8 source policy, Cloudflare native adversarial suite, S6/S7 nonregression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C queen-source rev-parse HEAD)" = "$PRIVATE_SHA"
          node queen-source/ops/queen/autopilot/validate-s6-closeout.mjs
          node queen-source/ops/queen/compute/s7/validate-s7-readiness.mjs
          node queen-source/ops/queen/autopilot/s8/validate-s8-bootstrap.mjs
          node --test queen-source/ops/queen/autopilot/s8/tests/*.test.mjs
          echo 'QUEEN_S8_CLOUDFLARE_NATIVE_SOURCE_LOCKED_NEGATIVE_TESTS=PASS'
      - name: Scrub temporary private checkout
        if: always()
        shell: bash
        run: rm -rf queen-source
  ai-fabric-readonly-live-preflight:
    needs: source-locked-negative-s8-and-s7-regression
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 5
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Verify native Cloudflare Pages Workers AI source and hard cost gate, zero inference
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
          curl --fail --silent --show-error --max-time 25 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -o "$RUNNER_TEMP/s8-native-readiness.json" \
            'https://hive-alveare.pages.dev/api/queen-s8-workers-ai'
          jq -e '.ok==true and .route=="cloudflare-workers-ai" and
             .binding_present==true and .model_invoked==false and
             .free_plan_certified==false and .callable==false and
             .paid_fallback==false and .product_writes==false and
             .general_routing==false and .default_dispatch=="DENY"' \
             "$RUNNER_TEMP/s8-native-readiness.json" >/dev/null
          echo 'S8_NATIVE_WORKERS_AI_LIVE_BINDING_AND_ZERO_COST_DENY=PASS'
          echo 'S8_LEGACY_BROWSER_BRIDGE_NOT_REQUIRED=TRUE'
          echo 'S8_AUTONOMOUS_CODE_GENERATION_LIVE_CERTIFICATION=PENDING'
      - name: Erase temporary response
        if: always()
        run: rm -f "$RUNNER_TEMP/s8-native-readiness.json"
