name: Queen S8 Bounded Development Readiness
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/queen-s8-bounded-dev-readiness.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/queen-s8-bounded-dev-readiness.yml']
  workflow_dispatch: {}
permissions: {contents: read}
concurrency:
  group: queen-s8-guarded-readiness
  cancel-in-progress: false
jobs:
  source-locked-negative-s8-and-s7-regression:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 10
    env:
      PRIVATE_SHA: 2e99642416ac3bc99b85ac4a1d900bece3905b36
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: queen-source
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: S8 source policy, bounded autonomous dev adversarial canary, S0-S7 non-regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C queen-source rev-parse HEAD)" = "$PRIVATE_SHA"
          node queen-source/ops/queen/autopilot/validate-s6-closeout.mjs
          node queen-source/ops/queen/compute/s7/validate-s7-readiness.mjs
          node queen-source/ops/queen/autopilot/s8/validate-s8-bootstrap.mjs
          node --test queen-source/ops/queen/autopilot/s8/tests/*.test.mjs
          echo 'QUEEN_S8_SOURCE_LOCKED_GUARDS_S6_S7_REGRESSIONS_PASS'
      - name: Scrub temporary private checkout
        if: always()
        shell: bash
        run: rm -rf queen-source
  ai-fabric-readonly-live-preflight:
    needs: source-locked-negative-s8-and-s7-regression
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 5
    env:
      PRIVATE_SHA: 2e99642416ac3bc99b85ac4a1d900bece3905b36
      HIVE_AGENT_BRIDGE_URL: ${{ secrets.HIVE_AGENT_BRIDGE_URL }}
      HIVE_AGENT_BRIDGE_TOKEN: ${{ secrets.HIVE_AGENT_BRIDGE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/hive-alveare
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PFARMA_SOURCE_TOKEN }}
          persist-credentials: false
          path: queen-source
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Authenticate live managed AI bridge read-only, zero provider inference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C queen-source rev-parse HEAD)" = "$PRIVATE_SHA"
          node --input-type=module - <<'JS'
          import {bridgeConfigured, QueenAgentBridgeClient} from './queen-source/ops/queen/agents/bridge-client.mjs';
          if(!bridgeConfigured()){
            console.error('S8_CLOUD_AI_BRIDGE_CREDENTIALS_NOT_CONFIGURED=DENY');
            process.exitCode=78;
          }else{
            try{
              const client=new QueenAgentBridgeClient({attempts:1,timeoutMs:12000});
              const health=await client.health();
              const agents=await client.agents();
              if(health.ok!==true||!Array.isArray(agents)||agents.length===0){
                throw Error('READ_ONLY_BRIDGE_NOT_READY');
              }
              console.log('QUEEN_S8_CLOUD_AI_BRIDGE_HEALTH_AND_AGENT_DISCOVERY_PASS count='+agents.length);
            }catch{
              console.error('S8_CLOUD_AI_BRIDGE_UNAVAILABLE_OR_UNTRUSTED=DENY');
              process.exitCode=79;
            }
          }
          JS
      - name: Erase temporary private source
        if: always()
        run: rm -rf queen-source
