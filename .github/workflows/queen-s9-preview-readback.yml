name: Queen S9.2 Preview Protected Route Diagnostic - GET ONLY
on:
  push:
    branches:
      - audit/s9-pages-preview-owner-consent-20261108
    paths:
      - .github/workflows/queen-s9-preview-readback.yml
permissions: {contents: read}
concurrency:
  group: queen-s9-preview-readback-only
  cancel-in-progress: false
jobs:
  preview-and-production-readback:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 6
    env:
      CF_TOKEN_A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_B: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HIVE_RUNTIME_BEARER_TOKEN: ${{ secrets.HIVE_RUNTIME_BEARER_TOKEN }}
    steps:
      - name: Authenticate unique Pages source and inspect exact preview deployment metadata
        shell: bash
        run: |
          python - <<'PY'
          import os,json,re,urllib.request,urllib.error,urllib.parse
          NAME='hive-alveare'
          DEPLOY='377c0180-43f5-4976-a055-a439ac1bfbdb'
          SHA='8920b575defba8d806d8638de66794078d5c5403'
          BRANCH='convergence/s9-pages-legacy-build-compat-20261108'
          tokens=list(dict.fromkeys(x for x in (
            os.getenv('CF_TOKEN_A'),os.getenv('CF_TOKEN_B')) if x))
          def request(url,token=None,headers={},limit=2500):
            h={'Accept':'application/json'}
            if token:h['Authorization']='Bearer '+token
            h.update(headers)
            req=urllib.request.Request(url,headers=h,method='GET')
            try:
              with urllib.request.urlopen(req,timeout=25) as resp:
                return resp.status,resp.headers.get('content-type'),resp.read(limit)
            except urllib.error.HTTPError as exc:
              return exc.code,exc.headers.get('content-type'),exc.read(limit)
            except Exception:return 0,None,b''
          api='https://api.cloudflare.com/client/v4'
          account=None;token=None
          for t in tokens:
            st,ct,p=request(api+'/accounts?per_page=50',t,limit=500000)
            if st!=200:continue
            try:data=json.loads(p)
            except:continue
            hits=[]
            for a in data.get('result',[]):
              aid=a.get('id','')
              if not re.fullmatch('[a-f0-9]{32}',aid):continue
              status,_,buf=request(api+'/accounts/'+aid+'/pages/projects/'+NAME,t,limit=500000)
              try:project=json.loads(buf).get('result') if status==200 else None
              except:project=None
              if project and project.get('name')==NAME:hits.append(aid)
            if len(hits)==1:account=hits[0];token=t;break
          if not account:raise SystemExit('S9_READBACK=DENY_ACCOUNT_MISSING')
          url=api+'/accounts/'+account+'/pages/projects/'+NAME+'/deployments/'+DEPLOY
          st,_,raw=request(url,token,limit=500000)
          if st!=200:raise SystemExit('S9_READBACK=DENY_DEPLOYMENT_MISSING')
          dep=json.loads(raw).get('result') or {}
          meta=((dep.get('deployment_trigger') or {}).get('metadata') or {})
          if dep.get('environment')!='preview' or meta.get('commit_hash')!=SHA or meta.get('branch')!=BRANCH:
            raise SystemExit('S9_READBACK=DENY_PREVIEW_PROVENANCE_MISMATCH')
          stage=(dep.get('latest_stage') or {}).get('status')
          print('S9_PREVIEW_DEPLOY_STAGE='+str(stage))
          base=dep.get('url') or ''
          if not base.startswith('https://') or not base.endswith('.hive-alveare.pages.dev'):
            raise SystemExit('S9_READBACK=DENY_PREVIEW_URL_INVALID')
          print('S9_PREVIEW_CANONICAL_URL='+base)
          print('S9_PREVIEW_ALIASES_COUNT='+str(len(dep.get('aliases') or [])))
          def verify(prefix,hostname):
            for mode in ('service-token','service-plus-bearer','no-auth'):
              headers={}
              if mode in ('service-token','service-plus-bearer'):
                if os.getenv('CF_ACCESS_CLIENT_ID'):
                  headers['CF-Access-Client-Id']=os.environ['CF_ACCESS_CLIENT_ID']
                if os.getenv('CF_ACCESS_CLIENT_SECRET'):
                  headers['CF-Access-Client-Secret']=os.environ['CF_ACCESS_CLIENT_SECRET']
              if mode=='service-plus-bearer' and os.getenv('HIVE_RUNTIME_BEARER_TOKEN'):
                headers['Authorization']='Bearer '+os.environ['HIVE_RUNTIME_BEARER_TOKEN']
              for path in ('/api/runtime-health','/api/queen-s8-portfolio'):
                status,ct,body=request(hostname+path,headers=headers)
                kind='json' if ct and 'json' in ct else ('html' if ct and 'html' in ct else 'other')
                reason=''
                if kind=='json':
                  try:
                    o=json.loads(body)
                    reason=str(o.get('reason') or o.get('error') or '')[:90]
                  except Exception:pass
                info={'origin':prefix,'mode':mode,'route':path,'status':status,
                      'type':kind,'reason':re.sub('[^a-zA-Z0-9_ .:-]','_',reason)}
                print('S9_ENDPOINT_DIAGNOSTIC='+json.dumps(info,separators=(',',':')))
          verify('preview',base)
          verify('production','https://hive-alveare.pages.dev')
          print('S9_READBACK_NO_MUTATION=TRUE')
          PY

      - name: Crosscheck known trusted curl transport and Access response metadata only
        shell: bash
        run: |
          set -euo pipefail
          for base in 'https://377c0180.hive-alveare.pages.dev' 'https://hive-alveare.pages.dev'; do
            if [[ "$base" == *377c0180* ]]; then target='preview'; else target='production'; fi
            for path in api/runtime-health api/queen-s8-portfolio api/queen-s7-e2e; do
              args=(-sS --max-time 25 -o "$RUNNER_TEMP/s9-curl.json" -w '%{http_code}' -H 'Accept: application/json')
              if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
                args+=(-H "Cf-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "Cf-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
              fi
              code="$(curl "${args[@]}" "$base/$path")"
              echo "S9_CURL_${target}_${path//\//_}=$code"
              if [[ "$code" == "200" ]] && jq -e . "$RUNNER_TEMP/s9-curl.json" >/dev/null 2>&1; then
                jq -c '{ok,stage,component,default_dispatch,paid_fallback,reason,error}' "$RUNNER_TEMP/s9-curl.json" | sed 's/.{300}.*/& [TRUNCATED]/' | cut -c 1-300
              else
                if jq -e . "$RUNNER_TEMP/s9-curl.json" >/dev/null 2>&1; then
                  jq -c '{success,errors:(.errors|if type=="array" then map({code}) else null end),error:(.error|if type=="string" then .[0:80] else null end)}' "$RUNNER_TEMP/s9-curl.json" | cut -c 1-250
                fi
              fi
            done
          done

      - name: Identify preview redirect destination safely, without following authentication
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 25 -D "$RUNNER_TEMP/s9-location-headers.txt" -o /dev/null \
            -H "Cf-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "Cf-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://377c0180.hive-alveare.pages.dev/api/runtime-health'
          python - <<'PY'
          import os,urllib.parse
          p=os.environ['RUNNER_TEMP']+'/s9-location-headers.txt'
          raw=open(p,'r',encoding='utf8',errors='replace').read().splitlines()
          status=[line.strip() for line in raw if line.lower().startswith('http/')]
          locations=[line.split(':',1)[1].strip() for line in raw if line.lower().startswith('location:')]
          u=urllib.parse.urlsplit(locations[-1] if locations else '')
          kind='ACCESS_LOGIN_REDIRECT' if u.hostname and u.hostname.endswith('cloudflareaccess.com') else 'OTHER_REDIRECT'
          print('S9_PREVIEW_REDIRECT_HTTP='+str(status[-1].split(' ')[1] if status else 'unknown'))
          print('S9_PREVIEW_REDIRECT_KIND='+kind)
          print('S9_PREVIEW_REDIRECT_HOST='+str(u.hostname or 'none'))
          print('S9_PREVIEW_REDIRECT_HAS_QUERY='+str(bool(u.query)))
          print('S9_PREVIEW_REDIRECT_FOLLOWED=FALSE')
          PY

      - name: Inspect matching Cloudflare Access app and service-token policy metadata, GET only
        shell: bash
        env:
          CF_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_SECONDARY: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,json,urllib.request,urllib.error
          API='https://api.cloudflare.com/client/v4'
          tokens=list(dict.fromkeys(x for x in (os.getenv('CF_PRIMARY'),os.getenv('CF_SECONDARY')) if x))
          def get(token,path):
              req=urllib.request.Request(API+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:return e.code,{}
              except Exception:return 0,{}
          found=[]
          for token in tokens:
              st,accounts=get(token,'/accounts?per_page=50')
              if st!=200 or accounts.get('success') is not True:continue
              for row in accounts.get('result',[]):
                  aid=row.get('id','')
                  if not re.fullmatch('[a-f0-9]{32}',str(aid)):continue
                  x,p=get(token,'/accounts/'+aid+'/pages/projects/hive-alveare')
                  if x==200 and p.get('success') is True and (p.get('result') or {}).get('name')=='hive-alveare':
                      found.append((token,aid))
              if found:break
          if len(found)!=1:
              print('S9_ACCESS_AUDIT=DENY_PROJECT_NOT_UNIQUE')
              raise SystemExit(0)
          token,aid=found[0]
          st,apps=get(token,'/accounts/'+aid+'/access/apps?per_page=100')
          print('S9_ACCESS_APPS_HTTP='+str(st))
          if st!=200 or apps.get('success') is not True:
              print('S9_ACCESS_AUDIT=DENY_READ_SCOPE_MISSING')
              raise SystemExit(0)
          relevant=[]
          for app in apps.get('result',[]):
              if not isinstance(app,dict):continue
              domains=[app.get('domain','')]
              domains += [x.get('public_domain','') if isinstance(x,dict) else '' for x in (app.get('destinations') or [])]
              if any('hive-alveare.pages.dev' in str(s) for s in domains):
                  relevant.append(app)
          print('S9_ACCESS_TOTAL_APPS='+str(len(apps.get('result') or [])))
          print('S9_ACCESS_PAGINATION_TOTAL='+str((apps.get('result_info') or {}).get('total_count')))
          for app in apps.get('result',[]):
              if not isinstance(app,dict):continue
              domain=str(app.get('domain') or '')
              name=str(app.get('name') or '')
              destinations=app.get('destinations') or []
              if ('hive' in domain.lower() or 'pages.dev' in domain.lower() or
                  'queen' in name.lower() or 'hive' in name.lower() or
                  any('hive' in str(d).lower() for d in destinations)):
                  summary={'name':name[:80],'domain':domain[:130],'type':app.get('type'),
                           'destinations_count':len(destinations),'keys':sorted(x for x in app if x in ('domain','destinations','app_domain','type','name','policies'))}
                  print('S9_ACCESS_POTENTIAL_APP='+json.dumps(summary,separators=(',',':')))
          print('S9_ACCESS_MATCHING_APPS='+str(len(relevant)))
          for app in relevant:
              app_id=app.get('id','')
              st2,pol=get(token,'/accounts/'+aid+'/access/apps/'+str(app_id)+'/policies?per_page=100')
              policies=pol.get('result') or [] if st2==200 else []
              out={'name':str(app.get('name') or '')[:80],
                   'domain':str(app.get('domain') or '')[:130],
                   'type':app.get('type'),
                   'policies_http':st2,
                   'policy_count':len(policies),
                   'decision_types':[p.get('decision') for p in policies if isinstance(p,dict)],
                   'service_auth_policy_present':any(p.get('decision')=='non_identity' or p.get('decision')=='service_auth' for p in policies if isinstance(p,dict)),
                   'allow_policy_present':any(p.get('decision')=='allow' for p in policies if isinstance(p,dict))}
              print('S9_ACCESS_APP_SUMMARY='+json.dumps(out,separators=(',',':')))
          print('S9_ACCESS_APP_AUDIT=GET_ONLY')
          print('S9_ACCESS_POLICIES_MUTATED=FALSE')
          PY
