name: Queen S7 Kaggle Safe Secret-Presence Diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/queen-s7-kaggle-secret-presence-once.yml']
permissions: {contents: read}
jobs:
  check-only:
    runs-on: ubuntu-latest
    environment: pfarma-ci-trusted
    timeout-minutes: 5
    env:
      GPU01: ${{ secrets.KAGGLE_API_TOKEN_GPU01 || secrets.GiovPand }}
      GPU02: ${{ secrets.KAGGLE_API_TOKEN_GPU02 || secrets.PatrickPand }}
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
    steps:
      - name: Verify GPU01 and GPU02 secret presence without viewing secret values
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GPU01:-}" ]; then echo "S7_KAGGLE_GPU01_SECRET_PRESENT=YES"; else echo "S7_KAGGLE_GPU01_SECRET_PRESENT=NO"; fi
          if [ -n "${GPU02:-}" ]; then echo "S7_KAGGLE_GPU02_SECRET_PRESENT=YES"; else echo "S7_KAGGLE_GPU02_SECRET_PRESENT=NO"; fi
          repo=giovannifidel-collab/pfarma-ci
          for path in "repos/$repo/actions/secrets" "repos/$repo/environments/pfarma-ci-trusted/secrets"; do
            r="$(gh api "$path" 2>/dev/null || true)"
            if [ -z "$r" ]; then echo "S7_GITHUB_SECRET_METADATA_UNAVAILABLE";continue;fi
            for name in KAGGLE_API_TOKEN_GPU01 KAGGLE_API_TOKEN_GPU02 GIOVPAND PATRICKPAND; do
              exists="$(printf '%s' "$r" | jq -r --arg name "$name" 'any(.secrets[]?; .name==$name)')"
              echo "S7_SECRET_NAME_REGISTERED_${name}=$exists"
            done
          done
