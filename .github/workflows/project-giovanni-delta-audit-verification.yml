name: Project Giovanni · Delta Audit Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-giovanni-delta-audit-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: photo-ai-private
    env:
      TARGET_JOB_ID: 20fb3518-4741-448d-90dd-56adca22fe48
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SOURCE_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
    steps:
      - name: Checkout latest Project Giovanni source
        uses: actions/checkout@v4
        with:
          repository: giovannifidel-collab/project-giovanni
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify real rejected proposal is blocked
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { auditPlanDelta } from './scripts/preparatore-plan-delta-audit.mjs';
          const base = process.env.SUPABASE_URL?.replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const jobId = process.env.TARGET_JOB_ID;
          if (!base || !key || !jobId) throw new Error('missing config');
          const headers = { Authorization: `Bearer ${key}`, apikey: key };
          const jobRes = await fetch(`${base}/rest/v1/preparatore_v2_jobs?id=eq.${encodeURIComponent(jobId)}&select=user_id,status,request_payload,result_payload&limit=1`, { headers });
          if (!jobRes.ok) throw new Error(`job read ${jobRes.status}`);
          const job = (await jobRes.json())[0];
          if (!job || job.status !== 'succeeded' || !job.result_payload?.plan) throw new Error('target proposal unavailable');
          const statePath = ['app-state', job.user_id, 'plan-version-ledger:v1.json'].map(encodeURIComponent).join('/');
          const stateRes = await fetch(`${base}/storage/v1/object/preparatore-v2-worker-state/${statePath}`, { headers });
          if (!stateRes.ok) throw new Error(`active plan read ${stateRes.status}`);
          const ledger = await stateRes.json();
          const active = ledger?.versions?.find((v) => v.id === ledger.activeVersionId && v.status === 'active');
          if (!active?.plan) throw new Error('active plan unavailable');
          const audit = auditPlanDelta(active.plan, job.result_payload.plan, {
            profile: job.request_payload?.profile,
            trainingContext: job.request_payload?.trainingContext,
            analysis: job.result_payload?.analysis,
          });
          console.log('REAL_DELTA_RECOMMENDATION=' + audit.recommendation);
          console.log('REAL_DELTA_SCORE=' + audit.score);
          console.log('REAL_DELTA_REASONS=' + audit.reasons.length);
          for (const reason of audit.reasons) console.log('- ' + reason);
          if (audit.recommendation !== 'keep_current' || audit.passed !== false || audit.reasons.length < 1) {
            throw new Error('real low-value proposal was not rejected');
          }
          NODE

      - name: Verify targeted improvement can pass
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { auditPlanDelta } from './scripts/preparatore-plan-delta-audit.mjs';
          const ex=(name,focus,sets,repsMin,repsMax,rest=45)=>({name,focus,restSeconds:rest,prescription:`${sets} x ${repsMin}-${repsMax}`,target:{mode:'reps',sets,repsMin,repsMax,reserveReps:2}});
          const day=(n,title,exercises)=>({day:n,title,durationMinutes:30,emphasis:'Spinta',warmupMinutes:4,exercises});
          const active={summary:'baseline',rationale:['storico'],safetyNote:'ok',days:[
            day(1,'Upper A',[ex('Push-up a terra','Spinta',3,8,10),ex('Alzate laterali con elastico','Spinta',3,12,15),ex('Curl con elastico','Tirata',2,10,12)]),
            day(2,'Upper B',[ex('Rematore con elastico','Tirata',3,10,12),ex('Reverse fly','Tirata',3,12,15),ex('Estensione tricipiti','Spinta',2,10,12)]),
          ]};
          const candidate=structuredClone(active);
          candidate.rationale=['Storico reale: completamento e performance in crescita senza dolore.','Foto/analisi visiva: spalle e braccia restano priorità, quindi incremento prudente e mirato.'];
          candidate.days[0].exercises[1].target.repsMax=16;
          candidate.days[0].exercises[1].prescription='3 x 12-16';
          candidate.days[0].exercises[2].target.sets=3;
          candidate.days[0].exercises[2].prescription='3 x 10-12';
          const audit=auditPlanDelta(active,candidate,{
            profile:{priorities:'parte alta, spalle e braccia'},
            trainingContext:{aggregates:{painSessions:0}},
            analysis:{priorities:[{area:'Larghezza spalle',observation:'priorità visiva',trainingImplication:'progressione prudente'}],visualFindings:[{confidence:'medium',actionStrength:'cautious_adjustment',observation:'spalle migliorabili',trainingImplication:'piccolo aumento'}]},
          });
          console.log('TARGETED_DELTA_RECOMMENDATION=' + audit.recommendation);
          console.log('TARGETED_DELTA_SCORE=' + audit.score);
          if (audit.recommendation !== 'activate_candidate' || audit.passed !== true) {
            console.log(audit.reasons);
            throw new Error('targeted evidence-based improvement was incorrectly rejected');
          }
          NODE
