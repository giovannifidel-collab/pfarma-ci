name: Queen S9.5 canonical S1 non-mutation selftest after release
on:
  push:
    branches: [audit/s9-5-cloudflare-api-readonly-20261117]
    paths: [.github/workflows/queen-s9-5-s1-selftest-once.yml]
permissions: {contents: read}
jobs:
  trigger-one-safe-s1-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: pfarma-ci-trusted
    env:
      GH_TOKEN: ${{ secrets.PFARMA_SOURCE_TOKEN }}
    steps:
      - name: Verify exact canonical S1 main and trigger one safe workflow_dispatch without durable action
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "giovannifidel-collab"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/audit/s9-5-cloudflare-api-readonly-20261117"
          test -n "$GH_TOKEN"
          HIVE="$(gh api repos/giovannifidel-collab/hive-alveare/branches/main --jq .commit.sha)"
          test "$HIVE" = 493d83892f7a2e37ec297b9309b47a4c83ba2e6b
          PTR="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/hive-source-ref.txt --jq .content | tr -d '\n' | base64 -d | tr -d '\n')"
          test "$PTR" = "$HIVE"
          WORKFLOW="$(gh api repos/giovannifidel-collab/pfarma-ci/contents/.github/workflows/queen-s1-event-ingress.yml --jq .content | tr -d '\n' | base64 -d)"
          grep 'S9.5 pre-router receipt-only' <<< "$WORKFLOW" >/dev/null
          grep "github.event_name == 'repository_dispatch'" <<< "$WORKFLOW" >/dev/null
          echo 'S95_SINGLE_S1_RECEIPT_BRIDGE_AND_DURABLE_ROUTER_BOUNDARY=PASS'
          gh api -X POST repos/giovannifidel-collab/pfarma-ci/actions/workflows/queen-s1-event-ingress.yml/dispatches -f ref=main
          echo 'S95_CANONICAL_S1_MANUAL_NON_DURABLE_SELFTEST_DISPATCH=PASS'
          echo 'S95_NO_PROVIDER_NO_SCHOOL_NO_PROJECT_WRITE=TRUE'