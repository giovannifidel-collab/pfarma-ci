name: Wedding Maintenance Probe 20260909

on:
  push:
    branches:
      - wedding-external-stress-20260909
    paths:
      - '.github/workflows/wedding-maintenance-probe-20260909.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: pfarma-ci-trusted
    env:
      ACCOUNT_ID: 6f6de52331e398c395d3de97c83011cd
      CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_FALLBACK: ${{ secrets.PFARMA_CLOUDFLARE_API_TOKEN }}
      NAME: rr-wedding-maint-20260909-probe
      URL: https://rr-wedding-maint-20260909-probe.project-giovanni.workers.dev
    steps:
      - name: Build and deploy read-only D1 maintenance probe
        shell: bash
        run: |
          set -euo pipefail
          CF_TOKEN="${CF_TOKEN_PRIMARY:-${CF_TOKEN_FALLBACK:-}}"
          test -n "$CF_TOKEN"
          echo "CF_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
          token="$(openssl rand -hex 32)"
          echo "MAINT_TOKEN=$token" >> "$GITHUB_ENV"
          mkdir -p /tmp/rr-maint
          cat >/tmp/rr-maint/worker.js <<'JS'
          const H={'content-type':'application/json; charset=utf-8','cache-control':'no-store'};
          const j=(x,s=200)=>new Response(JSON.stringify(x),{status:s,headers:H});
          export default{async fetch(req,env){if(req.headers.get('authorization')!==`Bearer ${env.MAINT_TOKEN}`)return new Response('Not found',{status:404});try{const tr=(await env.DB.prepare("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name").all()).results||[],counts={};for(const x of tr){const t=String(x.name).replace(/"/g,'');const row=await env.DB.prepare(`SELECT COUNT(*) AS n FROM "${t}"`).first();counts[t]=Number(row?.n||0)}const settings=(await env.DB.prepare('SELECT key,value FROM settings ORDER BY key').all()).results||[];const media=(tr.some(x=>x.name==='media')?(await env.DB.prepare('SELECT object_key FROM media ORDER BY object_key').all()).results:[])||[];const memories=(tr.some(x=>x.name==='memory_gifts')?(await env.DB.prepare('SELECT object_key FROM memory_gifts ORDER BY object_key').all()).results:[])||[];return j({ok:true,tables:counts,settings,referencedObjects:{media:media.map(x=>x.object_key),memory:memories.map(x=>x.object_key)}})}catch(e){return j({ok:false,error:String(e?.stack||e)},500)}}};
          JS
          cat >/tmp/rr-maint/wrangler.jsonc <<EOF
          {
            "name":"$NAME",
            "main":"worker.js",
            "compatibility_date":"2026-09-03",
            "workers_dev":true,
            "vars":{"MAINT_TOKEN":"$token"},
            "d1_databases":[{"binding":"DB","database_name":"rocco-rosy-db","database_id":"104865ad-1ec1-4ecb-b534-9d68f02c6635"}]
          }
          EOF
          cd /tmp/rr-maint
          CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx --yes wrangler@4.123.0 deploy
      - name: Read live D1 inventory through isolated worker
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 12); do
            if curl -fsS -H "Authorization: Bearer $MAINT_TOKEN" "$URL/?v=$GITHUB_SHA" -o /tmp/inventory.json; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          jq -e '.ok==true' /tmp/inventory.json >/dev/null
          echo '=== WEDDING LIVE D1 INVENTORY ==='
          jq '{tables:.tables,settings:(.settings|from_entries),referencedObjectCounts:{media:(.referencedObjects.media|length),memory:(.referencedObjects.memory|length)}}' /tmp/inventory.json
          echo 'RR_MAINTENANCE_D1_BINDING_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wedding-maintenance-d1-inventory
          path: /tmp/inventory.json
          if-no-files-found: warn
      - name: Delete temporary maintenance worker
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/rr-maint/wrangler.jsonc ]; then cd /tmp/rr-maint; CLOUDFLARE_API_TOKEN="${CF_TOKEN:-${CF_TOKEN_PRIMARY:-}}" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx --yes wrangler@4.123.0 delete --force || true; fi
